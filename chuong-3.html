<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<title>Shaikh — Capitalism: Competition, Conflict, Crises — Chương 3</title>
<style>
:root{
  --bg:#f2ede0;
  --panel:#fffdf8;
  --panel-2:#eef1e8;
  --ink:#211d16;
  --ink-soft:#4c473b;
  --muted:#847b68;
  --line:#dcd0ac;
  --primary:#1f3b5c;
  --primary-dark:#152944;
  --primary-tint:#e1e8ef;
  --gold:#a67f2c;
  --gold-light:#d6b263;
  --green:#2f6b3f;
  --green-tint:#e3ede4;
  --red:#8a2f2f;
  --red-tint:#f0e2e2;
  --dark-bg:#141b22;
  --dark-panel:#1d2731;
  --dark-ink:#eef1e6;
  --dark-line:#324256;
  --shadow:0 6px 24px rgba(20,27,34,0.12);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1000px;margin:0 auto;padding:0 16px 80px;}

/* ===== Header ===== */
.hero{padding:32px 16px 20px;text-align:center;border-bottom:3px double var(--gold);margin-bottom:18px;background:radial-gradient(ellipse at top, rgba(166,127,44,0.08), transparent 60%);}
.hero .kicker{font-family:Georgia,serif;letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700;}
.hero h1{font-size:clamp(22px,4.6vw,34px);margin:8px 0 4px;color:var(--primary-dark);letter-spacing:.005em;line-height:1.25;}
.hero .subtitle{font-size:14.5px;color:var(--ink-soft);font-style:italic;}
.hero .meta{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hero .meta span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);}
.hero .meta a.meta-link{color:var(--primary);text-decoration:none;font-weight:600;}
.hero .meta a.meta-link:hover{background:var(--primary-tint);}


/* ===== Tabs ===== */
.tabbar-wrap{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:8px;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tabbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;}
.tabbar::-webkit-scrollbar{height:5px;}
.tabbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.tab-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
.tab-btn .n{color:var(--gold);font-weight:800;margin-right:5px;}
.tab-btn:hover{border-color:var(--gold);}
.tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow);}
.tab-btn.active .n{color:var(--gold-light);}

/* ===== Panels ===== */
.panel{display:none;animation:fadein .25s ease;}
.panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);}
.card h2{margin:0 0 4px;font-size:21px;color:var(--primary-dark);}
.card .eng-title{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:16px;letter-spacing:.02em;}
.card h3{font-size:15.5px;color:var(--primary);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px;}
.card p{margin:0 0 12px;color:var(--ink);}
.card p:last-child{margin-bottom:0;}
.lede{font-size:16px;color:var(--ink-soft);border-left:3px solid var(--gold);padding-left:14px;margin:6px 0 18px;}

.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0;}
.concept{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.concept .term{font-weight:700;color:var(--primary-dark);font-size:13px;display:block;margin-bottom:4px;}
.concept .term .en{color:var(--gold);font-weight:600;font-size:11px;font-style:italic;}
.concept p{font-size:13px;margin:0;color:var(--ink-soft);}

.figure-note{background:var(--primary-tint);border:1px dashed var(--primary);border-radius:10px;padding:12px 15px;font-size:12.5px;color:var(--primary-dark);margin:14px 0;}
.figure-note b{color:var(--primary-dark);}

.debate-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0;}
.debate-box .dh{background:var(--primary);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.03em;}
.debate-box .db{padding:13px 15px;font-size:13px;color:var(--ink-soft);}
.debate-box .names{color:var(--gold);font-weight:700;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0;}
.stat-box{background:var(--primary-dark);color:#fff;border-radius:10px;padding:13px 14px;text-align:center;}
.stat-box .val{font-size:20px;font-weight:800;color:var(--gold-light);}
.stat-box .lbl{font-size:10.5px;color:#dbe4ee;margin-top:3px;line-height:1.3;}

/* ===== dark diagram / chart panel ===== */
.dark-panel{background:var(--dark-bg);color:var(--dark-ink);border-radius:12px;padding:20px;margin:16px 0;border:1px solid var(--dark-line);}
.dark-panel h4{margin:0 0 12px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;}
.flow{display:flex;flex-direction:column;gap:0;}
.flow-step{background:var(--dark-panel);border:1px solid var(--dark-line);border-radius:8px;padding:10px 14px;font-size:12.5px;position:relative;}
.flow-step b{color:var(--gold-light);}
.flow-arrow{text-align:center;color:var(--gold);font-size:16px;padding:2px 0;}
.flow-branch{display:flex;gap:10px;margin:2px 0;flex-wrap:wrap;}
.flow-branch>div{flex:1;min-width:130px;}

.chart-panel{background:var(--dark-bg);border:1px solid var(--dark-line);border-radius:12px;padding:18px 18px 14px;margin:16px 0;}
.chart-panel h4{margin:0 0 2px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;}
.chart-panel .chart-sub{font-size:11px;color:#9fb0c2;margin-bottom:10px;font-style:italic;}
.chart-panel svg{width:100%;height:auto;display:block;}

/* ===== Real/reference chart (photo, not illustrative SVG) ===== */
.chart-real{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:10px 0 18px;}
.chart-real-badge{display:inline-block;font-family:Georgia,serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);border-radius:4px;padding:3px 9px;margin-bottom:9px;}
.chart-real img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);}
.chart-real figcaption{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.55;font-style:italic;}

.chart-note{font-size:10.5px;color:#8496a8;margin-top:6px;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dark-ink);}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:12px;height:3px;display:inline-block;border-radius:2px;}
.chart-grid2{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:680px){.chart-grid2{grid-template-columns:1fr 1fr;}}

/* ===== Glossary ===== */
.gloss-item{border-bottom:1px solid var(--line);padding:12px 0;}
.gloss-item:last-child{border-bottom:none;}
.gloss-term{font-weight:700;color:var(--primary-dark);font-size:14px;}
.gloss-term .en{color:var(--gold);font-weight:600;font-size:11.5px;font-style:italic;margin-left:6px;}
.gloss-def{font-size:13px;color:var(--ink-soft);margin-top:3px;}

.gloss-extra-row{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.gloss-extra-row .en{flex:1;color:var(--ink-soft);font-style:italic;}
.gloss-extra-row .vi{flex:1;color:var(--primary-dark);font-weight:600;}


/* ===== Flashcards ===== */
.fc-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.fc-progress{font-size:13px;color:var(--muted);}
.fc-stage{display:flex;justify-content:center;margin:10px 0 20px;perspective:1400px;}
.flashcard{width:100%;max-width:560px;height:270px;position:relative;cursor:pointer;}
.flashcard .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flashcard.flipped .fc-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);}
.fc-front{background:var(--panel);}
.fc-front .fc-tag{position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;font-weight:700;}
.fc-front .fc-q{font-size:17px;color:var(--ink);font-weight:600;}
.fc-back{background:var(--primary);color:#fff;transform:rotateY(180deg);}
.fc-back .fc-a{font-size:14px;}
.fc-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;}
.fc-nav{display:flex;justify-content:center;gap:10px;margin-top:16px;}
.btn{border:1px solid var(--primary);background:var(--panel);color:var(--primary-dark);font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--primary);color:#fff;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-dark);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ===== Quiz ===== */
.quiz-progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--primary));transition:width .3s;}
.q-block{margin-bottom:14px;}
.q-text{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;}
.q-opts{display:flex;flex-direction:column;gap:8px;}
.q-opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer;transition:all .15s;}
.q-opt:hover{border-color:var(--gold);}
.q-opt.selected{border-color:var(--primary);background:var(--primary-tint);}
.q-opt.correct{border-color:var(--green);background:var(--green-tint);color:#1c4a28;font-weight:700;}
.q-opt.incorrect{border-color:var(--primary);background:#f3e6e6;color:#7a2020;font-weight:700;}
.q-explain{margin-top:10px;font-size:12.5px;color:var(--ink-soft);background:var(--panel-2);border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 8px 8px 0;display:none;}
.q-explain.show{display:block;}
.quiz-score{text-align:center;padding:30px 20px;}
.quiz-score .num{font-size:46px;font-weight:800;color:var(--primary);}
.quiz-score .lbl{font-size:14px;color:var(--muted);margin-bottom:18px;}

/* ===== Notes panel ===== */
.notes-fab{position:fixed;right:22px;bottom:22px;z-index:50;background:var(--primary);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 8px 20px rgba(21,41,68,0.35);cursor:pointer;display:flex;align-items:center;gap:7px;}
.notes-backdrop{position:fixed;inset:0;background:rgba(15,18,22,0.45);z-index:60;display:none;}
.notes-backdrop.show{display:block;}
.notes-panel{position:fixed;top:0;right:0;height:100%;width:380px;max-width:88vw;background:var(--panel);z-index:70;box-shadow:-10px 0 30px rgba(0,0,0,0.2);transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;}
.notes-panel.open{transform:translateX(0);}
.notes-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.notes-head h4{margin:0;color:var(--primary-dark);font-size:14.5px;}
.notes-head .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.notes-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;}
.notes-toolbar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.notes-toolbar button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;width:30px;height:30px;cursor:pointer;font-family:Georgia,serif;font-size:14px;color:var(--ink);}
.notes-toolbar button:hover{border-color:var(--gold);}
.notes-body{flex:1;padding:16px 18px;overflow-y:auto;outline:none;font-size:14px;line-height:1.7;}
.notes-body:empty:before{content:"Ghi chú của bạn cho phần này... (tự động lưu)";color:var(--muted);font-style:italic;}
.notes-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);}

@media (max-width:640px){
  .hero{padding:22px 12px 14px;}
  .card{padding:16px 15px;}
  .flashcard{height:250px;}
  .notes-panel{width:100%;max-width:100%;}
}
@media print{
  .tabbar-wrap,.notes-fab,.notes-panel,.notes-backdrop,.fc-nav,.q-opts{display:none !important;}
  .panel{display:block !important;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
}
</style>
</head>
<body>
<div class="app">

  <div class="hero">
    <div class="kicker">Anwar Shaikh · Đọc sách có hệ thống</div>
    <h1>Capitalism: Competition, Conflict, Crises</h1>
    <div class="subtitle">Chương 3 — Micro Foundations and Macro Patterns (Oxford University Press, 2016)</div>
    <div class="meta">
      <span>6 phần (I-VI)</span>
      <span>~45 trang gốc</span>
      <span>Phương pháp luận vi mô-vĩ mô</span>
    <a class="meta-link" href="tomtat-3.html" target="_blank" rel="noopener">📄 Ghi chú gốc (docx)</a>
    </div>
  </div>

  <div class="tabbar-wrap">
    <div class="tabbar" id="tabbar"></div>
  </div>

  <div id="panels"></div>

</div>

<button class="notes-fab" id="notesFab">📝 Ghi chú</button>
<div class="notes-backdrop" id="notesBackdrop"></div>
<div class="notes-panel" id="notesPanel">
  <div class="notes-head">
    <div>
      <h4 id="notesTitle">Ghi chú</h4>
      <div class="sub" id="notesSub">Tự động lưu vào trình duyệt</div>
    </div>

  </div>
  <div class="notes-toolbar">
    <button data-cmd="bold" title="Đậm"><b>B</b></button>
    <button data-cmd="italic" title="Nghiêng"><i>I</i></button>
    <button data-cmd="underline" title="Gạch chân"><u>U</u></button>

    <button data-cmd="formatBlock:&lt;h4&gt;" title="Tiêu đề">H</button>

<script>
/* =========================================================
   MINI CHART HELPER — illustrative SVG line charts
   ========================================================= */
function sparkPath(values, w, h, pad){
  var n = values.length;
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  var range = (max - min) || 1;
  var pts = values.map(function(v, i){
    var x = pad + (i/(n-1)) * (w - 2*pad);
    var y = pad + (1 - (v - min)/range) * (h - 2*pad);
    return [x,y];
  });
  var d = 'M ' + pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L ');
  var area = d + ' L ' + pts[pts.length-1][0].toFixed(1) + ',' + (h-pad) + ' L ' + pts[0][0].toFixed(1) + ',' + (h-pad) + ' Z';
  return {line:d, area:area, pts:pts};
}
function renderLineChart(containerId, series, opts){
  opts = opts || {};
  var w = opts.w || 400, h = opts.h || 120, pad = opts.pad || 8;
  var svg = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  series.forEach(function(s){
    var r = sparkPath(s.values, w, h, pad);
    if(s.fill !== false){
      svg += '<path d="'+r.area+'" fill="'+(s.color||'#a67f2c')+'" opacity="0.12"></path>';
    }
    svg += '<path d="'+r.line+'" fill="none" stroke="'+(s.color||'#a67f2c')+'" stroke-width="'+(s.width||2)+'" vector-effect="non-scaling-stroke"></path>';
  });
  svg += '</svg>';
  var el = document.getElementById(containerId);
  if(el) el.innerHTML = svg;
}

/* =========================================================
   DATA — SECTIONS (tabs 0-6)
   ========================================================= */
var SECTIONS = [
  {
    id:"gioithieu", n:"0", label:"Hai câu hỏi lớn",
    title:"Hai câu hỏi phương pháp luận nền tảng", eng:"I. Introduction",
    body:`
      <p class="lede">Chương 2 đã chứng minh: các nền kinh tế tư bản chủ nghĩa thành công được đặc trưng bởi những khuôn mẫu dài hạn mạnh mẽ, trong đó trật tự và hỗn loạn song hành. Điều này lập tức đặt ra hai câu hỏi phương pháp luận nền tảng cho toàn bộ phần còn lại của cuốn sách.</p>
      <div class="concept-grid">
        <div class="concept"><span class="term">Câu hỏi 1 — Vi mô → Vĩ mô</span><p>CNTB là một hệ thống xã hội động, với văn hóa, thể chế, chính sách biến đổi liên tục. Vậy làm sao sự tương tác không ngừng của hàng triệu cá nhân qua nhiều thế hệ kế tiếp lại có thể tạo ra những khuôn mẫu ổn định, tái diễn?</p></div>
        <div class="concept"><span class="term">Câu hỏi 2 — Khái niệm cân bằng nào?</span><p>Nếu trả lời được câu hỏi 1, câu hỏi tiếp theo là: những khái niệm cân bằng, quá trình điều chỉnh, động lực học nào mới THỰC SỰ phù hợp với các khuôn mẫu hỗn loạn mà ta quan sát được trong thực tế?</p></div>
      </div>
      <p>Câu hỏi thứ nhất dẫn tới mối quan hệ giữa quá trình vi mô và khuôn mẫu vĩ mô (Phần II-IV). Kinh tế học vi mô quan trọng vì các tác nhân cá nhân có lựa chọn, và lựa chọn có hệ quả cá nhân lẫn xã hội — động cơ khuyến khích có ảnh hưởng thật. Nhưng KHÔNG suy ra từ đó rằng việc ra quyết định cá nhân phải tuân theo các quy tắc của "lựa chọn duy lý" hay "kỳ vọng duy lý" (tức hành vi siêu duy lý), cũng KHÔNG suy ra rằng có thể phân tích tổng thể qua "tác nhân đại diện". Bằng chứng lịch sử, thực nghiệm và phân tích chống lại hành vi siêu duy lý và tác nhân đại diện là áp đảo.</p>
      <p>Câu hỏi thứ hai dẫn tới sự phân biệt giữa khái niệm cân bằng THÔNG THƯỜNG (như một trạng thái đạt được) và khái niệm cân bằng CỔ ĐIỂN (như một quá trình hấp dẫn/gravitation) (Phần V). Ở khái niệm trước, thời gian và hỗn loạn biến mất khỏi bức tranh, trọng tâm chuyển sang các trạng thái cân bằng và đường đi ổn định. Ở khái niệm sau, cân bằng chính xác không bao giờ tồn tại như vậy, vì bản thân quá trình cân bằng hóa vốn dĩ mang tính chu kỳ và hỗn loạn.</p>
      <div class="figure-note"><b>Điều thú vị:</b> việc phân chia kinh tế học thành "vi mô" và "vĩ mô" thực ra khá mới. Lý thuyết cổ điển (Smith, Ricardo) thường bắt đầu từ lý thuyết giá cả, làm nền tảng cho phân tích tăng trưởng, việc làm, thương mại — không có sự tách biệt vi mô/vĩ mô như ngày nay. Chính Keynes là người đầu tiên đề xuất sự phân chia hiện đại này, còn Lucas sau đó lại đi theo hướng NGƯỢC LẠI hoàn toàn: giải thể vĩ mô vào trong vi mô.</div>

  {
    id:"pheohan", n:"1", label:"Phê phán Siêu duy lý",
    title:"Phê phán Hành vi Siêu duy lý và 'Homo Economicus'", eng:"II.1 — Representing Individual Human Behavior",
    body:`
      <p class="lede">"Trong khoa học xã hội, chúng ta đang mắc phải một chứng rối loạn tâm trí kỳ lạ... các học thuyết chính thống của kinh tế học, chính trị học và luật học đều dựa trên một giả định ngầm rằng hành vi con người bị chi phối bởi tính toán duy lý... [dù] đây là một giả định trái ngược với thực tế." <span style="font-size:11px;color:var(--muted);">(Wesley Mitchell, 1918)</span></p>
      <p>Có sự khác biệt lớn giữa NGHIÊN CỨU cách con người thực sự hành xử và ĐẶT RA cách họ NÊN hành xử. Bằng chứng từ tâm lý học hành vi, nhân học, xã hội học, khoa học thần kinh cho thấy: con người không sắp xếp sở thích nhất quán, phán đoán xác suất kém, không xử lý rủi ro một cách "duy lý", thường xuyên mắc lỗi suy luận, và chủ yếu hành động theo thói quen và quy tắc kinh nghiệm.</p>
      <h3>Hai lý do neoclassical vẫn bám vào siêu duy lý</h3>
      <div class="debate-box">
        <div class="dh">(1) SIÊU DUY LÝ NHƯ MÔ HÌNH MÔ TẢ HÀNH VI THỰC</div>
        <div class="db">Được bảo vệ bằng nhiều lý lẽ: "đây là điều các nhà kinh tế học (thực thụ) vẫn làm"; nó là "xấp xỉ tốt" cho hành vi thực (bất chấp núi bằng chứng ngược lại); nó cho kết quả "dễ xử lý về mặt phân tích" (Kirman ví von: giống người đánh rơi chìa khóa trong bóng tối lại đi tìm dưới cột đèn "vì ở đó dễ nhìn hơn"); và luận điểm F-twist của Friedman rằng miễn dự đoán thực nghiệm tốt thì giả định không quan trọng — nhưng bản thân giả định về hành vi CŨNG LÀ một dự đoán vi mô, không thể chỉ chọn giữ những gì khớp bằng chứng.</div>
      </div>
      <div class="debate-box">
        <div class="dh">(2) SIÊU DUY LÝ NHƯ LÝ TƯỞNG CHUẨN TẮC</div>
        <div class="db">Ngay cả khi thừa nhận con người không hành xử như vậy, vẫn có lập luận rằng họ NÊN hành xử như vậy. Nhưng hoàn toàn có thể đảo ngược: chính mô hình siêu duy lý mới là khiếm khuyết, vì lựa chọn xã hội thực sự phức tạp hơn nhiều so với khung phân tích hẹp này. Con người kiểu "homo economicus", nếu tồn tại, sẽ là một "kẻ ngốc xã hội" (social moron — Sen, 1977).</div>
      </div>
      <p>Shaikh chỉ ra động cơ sâu xa: siêu duy lý đóng vai trò CÔNG CỤ trong việc mô tả CNTB như một hệ thống xã hội hiệu quả và tối ưu — vì điều này đòi hỏi mọi cá nhân biết chính xác họ muốn gì và đạt được chính xác điều họ chọn.</p>
      <h3>Ba trường hợp minh họa cụ thể</h3>
      <div class="concept-grid">
        <div class="concept"><span class="term">Lý thuyết sở thích bộc lộ</span><p>Cố gán động cơ siêu duy lý cho hành vi thực gặp khó khăn nghiêm trọng: nếu một người chọn x hơn y, y hơn z, nhưng lại chọn z hơn x — hành vi này mâu thuẫn với siêu duy lý. Để "cứu" lý thuyết, người ta phải giả định "sở thích" thay đổi liên tục — vùng đất nguy hiểm cho một học thuyết coi ổn định sở thích là thuộc tính cốt lõi.</p></div>
        <div class="concept"><span class="term">Lý thuyết trò chơi (Game theory)</span><p>Dựa vào giả định "Kiến thức Chung về Duy lý" (CKR) và "Căn chỉnh Niềm tin Nhất quán" (CAB) — chuỗi niềm tin đúng vô hạn kiểu "Alice nghĩ rằng Bob nghĩ rằng Alice nghĩ...". Bị bằng chứng thực nghiệm mâu thuẫn ngay từ đầu, nhưng vẫn có ảnh hưởng lớn.</p></div>
        <div class="concept"><span class="term">Chủ nghĩa Marx Phân tích</span><p>Cố "cấy" phương pháp luận tân cổ điển (lựa chọn duy lý, lý thuyết trò chơi) vào các khái niệm mácxít — về bản chất phủ nhận khái niệm "thuộc tính nổi lên" ở cấp xã hội, cho rằng "hành vi cá nhân luôn là nơi diễn ra hành động, xét đến cùng" (Cohen).</p></div>
      </div>
      <div class="figure-note"><b>Câu hỏi thực sự không phải là</b> "động cơ kinh tế có quan trọng không" (chúng CÓ quan trọng) <b>mà là</b> "chúng quan trọng NHƯ THẾ NÀO" — cùng với các cơ hội kinh tế và vô số động cơ/giới hạn phi kinh tế khác.</div>
    `,

      ["Luận điểm F-twist","Friedman's F-twist","Lập luận của Friedman: chỉ dự đoán thực nghiệm mới quan trọng, giả định không cần đúng — bị phê phán vì giả định về hành vi CŨNG LÀ một dự đoán có thể kiểm chứng."],
      ["CKR & CAB","Common Knowledge of Rationality / Consistent Alignment of Beliefs","Hai giả định nền tảng của lý thuyết trò chơi về niềm tin duy lý lồng nhau vô hạn giữa những người chơi — bị bằng chứng thực nghiệm mâu thuẫn ngay từ đầu."],
      ["Chủ nghĩa Marx Phân tích","Analytical Marxism","Trường phái (Cohen, Roemer, Elster) cố xây dựng lại lý thuyết mácxít trên nền tảng phương pháp luận tân cổ điển — phủ nhận khái niệm thuộc tính nổi lên ở cấp xã hội."]

  {
    id:"noiLen", n:"2", label:"Thuộc tính Nổi lên",
    title:"Thuộc tính Nổi lên và Tranh luận về Vốn", eng:"II.2-3 — Aggregate Behavior, Emergent Properties, and Rigor",
    body:`
      <p class="lede">Ngay cả khi bỏ qua vấn đề siêu duy lý, còn một sai lầm lớn thứ hai của kinh tế học tân cổ điển: giả định hành vi TỔNG THỂ có thể coi như hành vi của một "tác nhân đại diện" siêu duy lý DUY NHẤT. Điều này đơn giản là SAI — hành vi của một tổng thể không thể được đặc trưng bởi hành vi của bất kỳ thành phần cấu thành nào, vì cái toàn thể lớn hơn tổng các bộ phận: các tổng thể có "thuộc tính nổi lên".</p>
      <div class="dark-panel">
        <h4>Phép loại suy: Định luật Khí Lý tưởng (PV = nRT)</h4>
        <div class="flow">
          <div class="flow-step">Hàng triệu phân tử khí chuyển động hỗn loạn, va chạm nhau và va chạm thành bình chứa</div>
          <div class="flow-arrow">↓ không thể mô tả từng đường đi cá thể — quá phức tạp</div>
          <div class="flow-step">Nhưng ở cấp độ THỐNG KÊ: số va chạm lên thành bình trong một khoảng thời gian là ĐỀU ĐẶN, tạo ra <b>áp suất</b> — một quy luật vĩ mô ổn định</div>
          <div class="flow-arrow">↓</div>
          <div class="flow-step">Định luật PV = nRT là một <b>thuộc tính nổi lên</b> của tập hợp — không thể suy ra hay quy giản về đường đi của MỘT phân tử "đại diện"</div>
        </div>
      </div>
      <p>Kirman và Koch (1986) chứng minh: ngay cả khi mọi cá nhân đều siêu duy lý và giống hệt nhau về sở thích, riêng sự khác biệt trong PHÂN PHỐI THU NHẬP đã đủ để tạo ra thuộc tính nổi lên khiến "tác nhân trung bình" khác hẳn "tác nhân đại diện". Kirman (1992) kết luận: việc suy luận "sở thích của xã hội" từ tác nhân đại diện để làm cơ sở chính sách công là "hoàn toàn không chính đáng".</p>
      <h3>Tranh luận Vốn Cambridge — hàm sản xuất tổng hợp là "chuyện cổ tích"</h3>
      <p>Lý thuyết sản xuất gặp đúng vấn đề tương tự khi đi từ ngành riêng lẻ sang hàm sản xuất TỔNG HỢP (APF). Joan Robinson (1953-54) lập luận: không thể xây dựng thước đo vốn tổng hợp nhất quán với một APF. Sraffa (1960) cho thấy: trong thế giới hàng hóa dị biệt với nhiều phương pháp sản xuất khả dĩ, tỷ lệ vốn/lao động tối ưu có thể THẤP HƠN tại tỷ suất lợi nhuận THẤP HƠN — mâu thuẫn trực tiếp với logic tân cổ điển (đòi hỏi tỷ lệ vốn/lao động cao hơn phải đi cùng tỷ suất lợi nhuận thấp hơn).</p>
      <div class="debate-box">
        <div class="dh">"CÂU CHUYỆN CỔ TÍCH KHÔNG THUYẾT PHỤC"</div>
        <div class="db">Pasinetti (1969) và Garegnani (1970) chứng minh dứt điểm: "câu chuyện ngụ ngôn" về hàm sản xuất tổng hợp KHÔNG đứng vững trong điều kiện tổng quát — chỉ đúng trong trường hợp đặc biệt (tỷ lệ vốn/lao động BẰNG NHAU ở mọi ngành, một sự trớ trêu lịch sử vì điều này ngụ ý giá cả cạnh tranh của Samuelson phải tuân theo đúng lý thuyết giá trị lao động ĐƠN GIẢN!). Về sau, chính nhà kinh tế học tân cổ điển Franklin Fisher kết luận: điều kiện để có thể tổng hợp hàm sản xuất "chặt đến mức khiến sự tồn tại của hàm sản xuất tổng hợp... trở thành chuyện không tưởng". Fisher gọi đó là "một chuyện cổ tích tràn lan nhưng không thuyết phục".</div>
      </div>
      <h3>Tính chặt chẽ (rigor) không đòi hỏi vi mô nền tảng</h3>
      <p>Một khẳng định phổ biến (cả chính thống lẫn dị giáo): quan hệ tổng hợp không "chặt chẽ" trừ khi được suy ra từ vi mô nền tảng nào đó. Shaikh bác bỏ bằng ba lập luận, minh họa qua vật lý học:</p>
      <div class="concept-grid">
        <div class="concept"><span class="term">1. Nhiều định luật vật lý chưa từng có vi mô nền tảng</span><p>Thủy động lực học, kết tinh, từ học... được dùng rộng rãi dù chưa bao giờ suy ra từ nền tảng vi mô. Ngay cả Thuyết Tương đối Rộng của Einstein và Cơ học Lượng tử — cả hai được xác nhận cực tốt bằng thực nghiệm — vẫn CHƯA được thống nhất sau hơn một thế kỷ.</p></div>
        <div class="concept"><span class="term">2. Có thể chính chiều ngược lại mới đúng</span><p>Nếu hai lý thuyết chưa hòa hợp, biết đâu chính Cơ học Lượng tử mới "thiếu chặt chẽ" vì thiếu nền tảng VĨ MÔ — đây chính là quan điểm của Einstein. Tương tự, kinh tế học có thể cần một nền tảng VĨ MÔ cho vi mô, thay vì ngược lại (Hahn).</p></div>
        <div class="concept"><span class="term">3. Vi mô sai vẫn có thể cho ra vĩ mô đúng</span><p>Định luật Khí Lý tưởng truyền thống được suy từ va chạm kiểu "bi-a" giữa các nguyên tử — nhưng nguyên tử thực ra là thực thể lượng tử không hề giống bi-a! Đây là "phương trình sai [vẫn] cho đáp số đúng" (Laughlin) — vì thuộc tính nổi lên vốn "vô cảm mạnh mẽ" với chi tiết vi mô.</p></div>
      </div>
    `,
    concepts:[
      ["Thuộc tính nổi lên","Emergent property","Đặc điểm của một tổng thể sinh ra từ tương tác của các thành phần, không thể quy giản về hay suy ra trực tiếp từ hành vi của một thành phần điển hình."],
      ["Định luật Khí Lý tưởng","Ideal Gas Law (PV=nRT)","Phép loại suy trung tâm của chương: quy luật vĩ mô ổn định nổi lên từ va chạm hỗn loạn của hàng triệu phân tử, không cần và không thể suy từ MỘT phân tử 'đại diện'."],
      ["Tranh luận Vốn Cambridge","Cambridge Capital Controversy","Cuộc tranh luận Robinson-Sraffa-Samuelson-Garegnani-Pasinetti về tính bất khả thi của việc xây dựng một hàm sản xuất tổng hợp (APF) nhất quán về mặt lý thuyết."],
      ["'Chuyện cổ tích không thuyết phục'","'Unpersuasive fairytale' (Fisher)","Cách nhà kinh tế học tân cổ điển Franklin Fisher tự mô tả hàm sản xuất tổng hợp sau khi nghiên cứu kỹ điều kiện tổng hợp — một thừa nhận đáng chú ý từ chính nội bộ trường phái."],
      ["'Phương trình sai vẫn cho đáp số đúng'","'Wrong equations, right answer' (Laughlin)","Nhận định của nhà vật lý đoạt Nobel Robert Laughlin về Định luật Khí Lý tưởng — minh chứng rằng vi mô nền tảng sai vẫn có thể sinh ra quy luật vĩ mô đúng và hữu ích."]
    ]
  },
  {
    id:"cautruc", n:"3", label:"Cấu trúc Định hình",
    title:"Cấu trúc Định hình: Suy ra các Quy luật Tiêu dùng", eng:"III. Shaping Structures and Aggregate Emergent Properties",
    body:`
      <p class="lede">Nếu không cần siêu duy lý hay tác nhân đại diện, điều gì THỰC SỰ tạo ra các khuôn mẫu vĩ mô ổn định? Câu trả lời của Shaikh: <b>"cấu trúc định hình"</b> (shaping structures) — những giới hạn và građient (gradient) định hình hành vi tổng thể, bất kể chi tiết hành vi cá nhân bên dưới ra sao.</p>
      <p>Với lý thuyết tiêu dùng, chỉ cần HAI cấu trúc định hình: (1) một RÀNG BUỘC NGÂN SÁCH xác định bởi thu nhập, và (2) một MỨC TIÊU DÙNG TỐI THIỂU cho hàng hóa thiết yếu (tạo ra tính phi tuyến quan trọng). Từ hai điều này — với giả định dân số đạt tới một tỷ lệ tiêu dùng tùy nghi trung bình (c) ổn định — Shaikh suy ra được TOÀN BỘ ba quy luật thực nghiệm nổi tiếng nhất của lý thuyết tiêu dùng, mà KHÔNG cần bất kỳ giả định nào về việc cá nhân "tối đa hóa lợi ích".</p>
      <div class="stat-row">
        <div class="stat-box"><div class="val">↓</div><div class="lbl">Đường cầu dốc xuống (mọi hàng hóa)</div></div>
        <div class="stat-box"><div class="val">Engel</div><div class="lbl">Độ co giãn thu nhập &lt;1 (thiết yếu), &gt;1 (xa xỉ)</div></div>
        <div class="stat-box"><div class="val">C=f(Y)</div><div class="lbl">Hàm tiêu dùng tổng kiểu Keynesian, tuyến tính ngắn hạn</div></div>
      </div>
      <h3>Bốn mô hình hành vi hoàn toàn khác nhau — cùng một kết quả</h3>
      <p>Để chứng minh các quy luật trên "vô cảm mạnh mẽ" (robustly insensitive) với giả định hành vi cá nhân, Shaikh mô phỏng BỐN mô hình vi mô cực kỳ khác biệt bằng NetLogo, tất cả cùng đặt trong hai cấu trúc định hình nói trên:</p>
      <div class="dark-panel">
        <h4>Bốn mô hình → Cùng một kết quả vĩ mô (Hình 3.15)</h4>
        <div class="flow">
          <div class="flow-branch">
            <div class="flow-step"><b>1. Tân cổ điển đồng nhất</b><br>Mọi tác nhân giống hệt, siêu duy lý, tối đa hóa hàm Cobb-Douglas — có tác nhân đại diện thực thụ</div>
            <div class="flow-step"><b>2. Tân cổ điển dị biệt</b><br>Vẫn siêu duy lý, nhưng mỗi tác nhân có hệ số tiêu dùng (c) riêng rút ngẫu nhiên — KHÔNG có tác nhân đại diện</div>
          </div>
          <div class="flow-branch">
            <div class="flow-step"><b>3. Tác nhân "tùy hứng"</b><br>Mô hình Becker (1962): mỗi kỳ chọn ngẫu nhiên một tỷ lệ tiêu dùng hoàn toàn khác — hành vi "phi lý" thuần túy</div>
            <div class="flow-step"><b>4. Bắt chước & Đổi mới</b><br>Mô hình Dosi và cộng sự: 80% "bắt chước" hàng xóm xã hội, 20% "đổi mới" ngẫu nhiên mỗi kỳ — mang tính tiến hóa/xã hội</div>
          </div>
          <div class="flow-arrow">↓ ↓ ↓ ↓</div>
          <div class="flow-step" style="text-align:center;border-color:var(--gold);"><b>KẾT QUẢ VĨ MÔ GIỐNG HỆT NHAU</b><br>Cùng đường cầu dốc xuống, cùng độ co giãn Engel, cùng hàm tiêu dùng tổng tuyến tính</div>
        </div>
      </div>
      <div class="figure-note"><b>Số liệu mô phỏng thực tế (Bảng 3.1):</b> độ co giãn giá cầu của hàng thiết yếu ở cả 4 mô hình đều xấp xỉ <b>-0.93 đến -0.97</b>; độ co giãn thu nhập đều xấp xỉ <b>0.94 đến 0.97</b> — gần như không phân biệt được giữa mô hình "siêu duy lý hoàn hảo" và mô hình "hoàn toàn ngẫu nhiên tùy hứng"!</div>
      <p>Bài học kép rút ra: (1) TÍNH DỊ BIỆT (heterogeneity) phá vỡ khái niệm tác nhân đại diện, nhưng bản thân nó KHÔNG phải là nguồn gốc của khuôn mẫu ổn định — chính các cấu trúc định hình mới là yếu tố quyết định; (2) dù DẠNG HÀM có thể thay đổi hoàn toàn khi đi từ vi mô lên vĩ mô, các BIẾN SỐ liên quan (thu nhập, giá cả, mức tối thiểu) vẫn "sống sót" qua quá trình tổng hợp.</p>
      <div class="figure-note"><b>Mở rộng sang tiền lương (chương 14):</b> cùng phương pháp này — thay "ràng buộc ngân sách" bằng đồng nhất thức giá trị gia tăng = lương + lợi nhuận trên mỗi công nhân — Shaikh xây dựng lý thuyết về lương thực tế bình quân mà không cần bất kỳ mô hình cụ thể nào về đấu tranh vốn-lao động ở cấp vi mô.</div>

  {
    id:"phuongphap", n:"4", label:"Phương pháp luận",
    title:"Phương pháp luận cho Phân tích Kinh tế", eng:"IV. Methodology for Economic Analysis",
    body:`
      <p class="lede">Từ những phát hiện trên, Shaikh rút ra năm đặc điểm của một phân tích tổng hợp (aggregate analysis) THỰC SỰ chặt chẽ — trái ngược hẳn với yêu cầu "vi mô nền tảng siêu duy lý" của tân cổ điển.</p>
      <div class="concept-grid">
        <div class="concept"><span class="term">1. Bắt rễ ở vi mô</span><p>Phải dựa trên một lý thuyết nào đó về các yếu tố liên quan ở cấp vi mô — nhưng KHÔNG nhất thiết là lý thuyết siêu duy lý.</p></div>
        <div class="concept"><span class="term">2. Chỉ vài biến "sống sót"</span><p>Phải thừa nhận rằng chỉ MỘT SỐ ÍT yếu tố vi mô thực sự có liên quan ở cấp vĩ mô — phần lớn chi tiết bị "lọc" qua quá trình tổng hợp.</p></div>
        <div class="concept"><span class="term">3. Dạng hàm vĩ mô khác vi mô</span><p>Phải nhận ra dạng hàm tổng hợp thường KHÁC HẲN dạng hàm vi mô tương ứng — hệ quả trực tiếp là không hề có "tác nhân đại diện".</p></div>
        <div class="concept"><span class="term">4. Không bác bỏ vì "sai dạng hàm"</span><p>Không được bác bỏ một hàm tổng hợp phù hợp thực nghiệm chỉ vì nó không khớp dạng hàm giả định (hay đã xác lập) ở cấp vi mô.</p></div>
        <div class="concept"><span class="term">5. Cân bằng là một giả thuyết</span><p>Phải luôn coi việc "cân bằng hóa" là MỘT GIẢ THUYẾT cần kiểm chứng rõ ràng về sự tồn tại, tính ổn định, tốc độ và cách vận hành — không phải điều mặc định.</p></div>
      </div>
      <h3>Ba nhà kinh tế học đã làm đúng — trước khi tân cổ điển "chuyển hướng"</h3>
      <p>Điều thú vị: kinh tế học vĩ mô "kiểu cũ" (trước cuộc cách mạng vi mô nền tảng tân cổ điển) thực ra đã thỏa mãn hầu hết các tiêu chí trên một cách tự nhiên.</p>
      <div class="debate-box">
        <div class="dh">BA TẤM GƯƠNG: KEYNES · KALECKI · FRIEDMAN</div>
        <div class="db">
        <b>Keynes</b> xây dựng hàm tiêu dùng tổng trên nền tảng nhiều yếu tố chủ quan/khách quan ở cấp cá nhân (mong muốn dự phòng, kỳ vọng, lãi suất...) — nhưng ở cấp tổng, chỉ giữ lại MỘT biến số sống sót: thu nhập thực, với xu hướng tiêu dùng biên &lt;1.<br><br>
        <b>Kalecki</b> đi từ giá của hãng thứ i (phụ thuộc quy mô hãng, sức mạnh độc quyền...) tới mức giá NGÀNH — chỉ còn phụ thuộc chi phí đơn vị bình quân và "mức độ độc quyền" tổng hợp (một biến số nén nhiều yếu tố vi mô lại).<br><br>
        <b>Friedman</b> đi từ cầu tiền cá nhân (phụ thuộc sở thích, của cải dị biệt) tới một quan hệ ỔN ĐỊNH ở cấp tổng giữa cầu tiền, số dư thực và lãi suất thực.
        </div>
      </div>
      <p>Cả ba đều thỏa mãn 3 tiêu chí đầu: bắt rễ ở hành vi cá nhân; nhận ra chỉ vài biến số "sống sót" lên cấp vĩ mô; và đặt ra dạng hàm KHÁC ở cấp vĩ mô so với cấp vi mô. Kết luận của Shaikh: <b>kinh tế học vĩ mô đã từng chặt chẽ trước khi bị chuyển hướng vào ngõ cụt lý thuyết của "tác nhân đại diện siêu duy lý".</b></p>
      <div class="figure-note">Chính Lucas cũng thừa nhận: các mô hình dự báo vĩ mô ngắn hạn vận hành hoàn toàn tốt mà KHÔNG cần nền tảng lựa chọn-duy lý. Ông chỉ cho rằng nền tảng đó cần thiết khi muốn dự đoán phản ứng trước THAY ĐỔI CHÍNH SÁCH — nhưng câu hỏi ngược lại là: vì sao lại khăng khăng suy luận hàm ý chính sách từ những nền tảng biết chắc là bóp méo hành vi cá nhân thực tế?</div>
    `,
    concepts:[
      ["5 tiêu chí phân tích tổng hợp chặt chẽ","Five criteria for rigorous aggregate analysis","Bắt rễ vi mô (không cần siêu duy lý); chỉ vài biến sống sót; dạng hàm vĩ mô khác vi mô; không bác bỏ vì sai dạng hàm; cân bằng là giả thuyết cần kiểm chứng."],
      ["Mức độ độc quyền (Kalecki)","Degree of monopoly power","Biến số tổng hợp trong lý thuyết giá của Kalecki, nén nhiều yếu tố vi mô (quy mô hãng, quảng cáo, sức mạnh công đoàn) thành một tham số duy nhất ở cấp ngành."],
      ["Câu hỏi của Lucas","Lucas's policy critique caveat","Ngay cả Lucas cũng thừa nhận dự báo ngắn hạn không cần nền tảng lựa chọn-duy lý; ông chỉ đòi hỏi điều này cho phân tích PHẢN ỨNG trước thay đổi chính sách."]
    ]

    body:`
      <p class="lede">"Tôi rất tiếc phải nói rằng tôi gần như không có kinh nghiệm trực tiếp nào về cân bằng kinh tế. Thực ra, theo tôi biết, hoàn toàn không có... Cân bằng dường như luôn nằm ở phía trước một cách chắc chắn." <span style="font-size:11px;color:var(--muted);">(Sir Gordon Richardson, Thống đốc Ngân hàng Anh, 1979)</span></p>
      <p>Câu hỏi phương pháp luận thứ hai của chương (từ phần I): khái niệm cân bằng nào phù hợp với các khuôn mẫu hỗn loạn quan sát được? Shaikh phân biệt dứt khoát hai quan niệm.</p>

        <figcaption>Ba quan niệm về cân bằng: đạt được -- hỗn loạn -- tăng trưởng hỗn loạn (mô phỏng minh họa).</figcaption>

      <p>Quan niệm THÔNG THƯỜNG (thống trị cả chính thống lẫn dị giáo) giả định một biến số bằng cách nào đó ĐẠT ĐẾN và Ở LẠI một điểm cân bằng — thời gian và hỗn loạn biến mất khỏi bức tranh. Quan niệm CỔ ĐIỂN hoàn toàn khác: cân bằng trung bình chỉ đạt được thông qua các mất cân bằng tái diễn và bù trừ nhau. Cân bằng chính xác là một hiện tượng NHẤT THỜI, vì bất kỳ biến số nào cũng liên tục vượt và hụt qua trung tâm hấp dẫn của nó. Trong ngôn ngữ hiện đại: một điểm cân bằng ổn định là một "điểm hút" (attractor), nhưng KHÔNG phải một trạng thái nghỉ.</p>
      <h3>Từ tĩnh học sang tăng trưởng: trung tâm hấp dẫn cũng có thể di chuyển</h3>
      <p>Bước chuyển quan trọng: biến số đang dao động không nhất thiết phải là một mức tuyệt đối — nó có thể là TỶ LỆ giữa hai biến khác, hoặc là TỐC ĐỘ TĂNG TRƯỞNG. Ví dụ, trong công thức số nhân Keynes ngắn hạn đơn giản, nếu ta diễn giải biến số là tỷ trọng đầu tư trong sản lượng thực tế so với tỷ trọng đầu tư trong sản lượng cân bằng, thì ngay cả một đường đi ỔN ĐỊNH của tỷ trọng đầu tư cũng có thể tương ứng với các ĐƯỜNG TĂNG TRƯỞNG của sản lượng thực tế và sản lượng cân bằng — nghĩa là bản thân "trung tâm hấp dẫn" hoàn toàn có thể là một ĐƯỜNG TĂNG TRƯỞNG, không nhất thiết một mức cố định.</p>
      <h3>Ba nhịp độ thời gian — bằng chứng thực nghiệm cụ thể</h3>
      <div class="stat-row">
        <div class="stat-box"><div class="val">4-5 năm</div><div class="lbl">Chu kỳ bình quân hóa tỷ suất lợi nhuận gia tăng, 9 ngành chế tạo Mỹ 1960-1989 (dao động 2-7 năm mỗi ngành)</div></div>
        <div class="stat-box"><div class="val">3-5 năm</div><div class="lbl">Chu kỳ tồn kho — cân bằng cung-cầu hàng hóa = "ngắn hạn" kiểu Keynes</div></div>
        <div class="stat-box"><div class="val">7-11 năm</div><div class="lbl">Chu kỳ thiết bị cố định — cân bằng công suất sử dụng = "dài hạn" kiểu Harrod</div></div>
        <div class="stat-box"><div class="val">45-60 năm</div><div class="lbl">Sóng dài (Kondratieff) — nhịp độ chậm nhất</div></div>
      </div>
      <p>Phát hiện đáng chú ý: dù thời điểm khác nhau giữa các ngành, ĐỘ DÀI chu kỳ bình quân hóa tỷ suất lợi nhuận gia tăng lại rất giống nhau — hầu hết nằm trong khoảng hẹp 4-5 năm — dù bình quân hóa tỷ suất lợi nhuận thường bị coi là hiện tượng "dài hạn" trong tài liệu kinh điển.</p>
      <div class="figure-note"><b>Hàm ý thực tiễn quan trọng:</b> nếu "ngắn hạn" thực ra kéo dài 12-15 quý (3-5 năm chu kỳ tồn kho) thay vì chỉ một quý như phần lớn phân tích thực nghiệm vĩ mô ngầm giả định (khi coi dữ liệu quý là đại diện cho giá trị cân bằng), thì các mô hình và thủ tục thực nghiệm chuẩn cần được xem xét lại đáng kể.</div>
      <h3>Bảng phân loại nhịp độ điều chỉnh đề xuất</h3>
      <div class="stat-row">
        <div class="stat-box"><div class="val">Ngắn hạn</div><div class="lbl">3-5 năm: thị trường hàng hóa, chu kỳ tồn kho, bình quân hóa tỷ suất lợi nhuận</div></div>
        <div class="stat-box"><div class="val">Dài hạn</div><div class="lbl">7-11 năm: sử dụng công suất, chu kỳ thiết bị, thị trường lao động</div></div>
      </div>
      <p>Thị trường tài chính có thể điều chỉnh nhanh (tài sản tài chính dễ tạo ra, giá linh hoạt) nhưng cũng dễ sinh bong bóng nên không chắc "cân bằng nhanh hơn". Thị trường lao động đặc biệt phức tạp: sức lao động vừa "ở trong" vừa "không hoàn toàn thuộc về" thị trường (chương 14) — cung lao động hiệu quả co giãn trong giới hạn rộng (huy động lao động dự bị, di cư, tăng ca) nhưng giá cả (lương thực) chỉ phản ứng MỘT PHẦN với điều kiện thị trường, do còn chịu quy định xã hội/lịch sử — khiến thị trường lao động có khả năng là thị trường điều chỉnh CHẬM NHẤT trong mọi thị trường tổng hợp.</p>

/* =========================================================
   FLASHCARDS RENDER
   ========================================================= */
var fcOrder = FLASHCARDS.map(function(_,i){return i;});
var fcIndex = 0;
document.getElementById('fcProgress').textContent = 'Thẻ 1 / ' + FLASHCARDS.length;
var flashcardEl = document.getElementById('flashcard');

function renderFlashcard(){
  var card = FLASHCARDS[fcOrder[fcIndex]];
  document.getElementById('fcTag').textContent = card.sec;
  document.getElementById('fcQ').textContent = card.q;
  document.getElementById('fcA').textContent = card.a;
  document.getElementById('fcProgress').textContent = 'Thẻ ' + (fcIndex+1) + ' / ' + FLASHCARDS.length;
  flashcardEl.classList.remove('flipped');
}
function flipFC(){ flashcardEl.classList.toggle('flipped'); }
document.getElementById('fcFlip').addEventListener('click', flipFC);
flashcardEl.addEventListener('click', flipFC);
document.getElementById('fcNext').addEventListener('click', function(){
  fcIndex = (fcIndex+1) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcPrev').addEventListener('click', function(){
  fcIndex = (fcIndex-1+FLASHCARDS.length) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcShuffle').addEventListener('click', function(){
  for(var i=fcOrder.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = fcOrder[i]; fcOrder[i]=fcOrder[j]; fcOrder[j]=tmp;
  }
  fcIndex = 0;
  renderFlashcard();
});
renderFlashcard();

/* =========================================================
   QUIZ RENDER
   ========================================================= */
var quizArea = document.getElementById('quizArea');
var quizAnswers = {};

function renderQuiz(){
  var html = QUIZ.map(function(item, qi){
    var opts = item.opts.map(function(opt, vi){
      return '<div class="q-opt" data-qi="'+qi+'" data-qv="'+vi+'">'+opt+'</div>';
    }).join('');
    return '<div class="q-block" id="qblock-'+qi+'">'+
      '<div class="q-text">'+(qi+1)+'. '+item.q+'</div>'+
      '<div class="q-opts">'+opts+'</div>'+
      '<div class="q-explain" id="qexplain-'+qi+'">'+item.explain+'</div>'+
      '</div>';
  }).join('');
  html += '<div style="text-align:center;margin-top:20px;"><button class="btn primary" id="quizFinish">Xem kết quả</button> <button class="btn" id="quizReset">Làm lại</button></div>';
  html += '<div id="quizResult"></div>';
  quizArea.innerHTML = html;

  quizArea.addEventListener('click', quizClickHandler);
  document.getElementById('quizFinish').addEventListener('click', showQuizScore);
  document.getElementById('quizReset').addEventListener('click', function(){
    quizAnswers = {};
    renderQuiz();
  });
}

function quizClickHandler(e){
  var opt = e.target.closest('.q-opt');
  if(!opt) return;
  var qi = parseInt(opt.dataset.qi, 10);
  var qv = parseInt(opt.dataset.qv, 10);
  quizAnswers[qi] = qv;
  var block = document.getElementById('qblock-'+qi);
  block.querySelectorAll('.q-opt').forEach(function(o){
    o.classList.remove('selected','correct','incorrect');
  });
  var correctIdx = QUIZ[qi].correct;
  block.querySelectorAll('.q-opt').forEach(function(o){
    var v = parseInt(o.dataset.qv,10);
    if(v === correctIdx) o.classList.add('correct');
    else if(v === qv) o.classList.add('incorrect');
  });
  document.getElementById('qexplain-'+qi).classList.add('show');
  updateQuizProgress();
}

function updateQuizProgress(){
  var answered = Object.keys(quizAnswers).length;
  var pct = Math.round(100*answered/QUIZ.length);
  document.getElementById('quizProgressFill').style.width = pct+'%';
}

function showQuizScore(){
  var correct = 0;
  QUIZ.forEach(function(item, qi){
    if(quizAnswers[qi] === item.correct) correct++;
  });
  var pct = Math.round(100*correct/QUIZ.length);
  document.getElementById('quizResult').innerHTML =
    '<div class="quiz-score"><div class="num">'+correct+'/'+QUIZ.length+'</div>'+
    '<div class="lbl">('+pct+'%) — '+ (pct>=80?'Nắm rất vững nội dung!':pct>=50?'Khá tốt, xem lại vài phần.':'Nên đọc lại các phần liên quan.') +'</div></div>';
}
renderQuiz();

/* =========================================================
   NOTES PANEL
   ========================================================= */
var notesFab = document.getElementById('notesFab');
var notesPanel = document.getElementById('notesPanel');
var notesBackdrop = document.getElementById('notesBackdrop');
var notesBody = document.getElementById('notesBody');
var notesTitle = document.getElementById('notesTitle');
var notesFoot = document.getElementById('notesFoot');
var currentNoteTab = 'gioithieu';
var LS_PREFIX = 'shaikh_ch3_note_';

function isMobile(){ return window.matchMedia('(max-width:640px)').matches; }

function noteLabelFor(id){
  var s = SECTIONS.filter(function(x){return x.id===id;})[0];
  if(s) return s.n + '. ' + s.label;
  if(id === 'gloss') return 'Thuật ngữ';
  if(id === 'flashcards') return 'Thẻ ghi nhớ';
  if(id === 'quiz') return 'Quiz';
  return id;
}

function openNotesFor(id){
  currentNoteTab = id;
  notesTitle.textContent = 'Ghi chú — ' + noteLabelFor(id);
  var saved = localStorage.getItem(LS_PREFIX + id) || '';
  notesBody.innerHTML = saved;
  updateNotesFoot();
}
function updateNotesFoot(){
  var len = notesBody.innerText.trim().length;
  notesFoot.textContent = len + ' ký tự · lưu tự động';
}
function saveCurrentNote(){
  localStorage.setItem(LS_PREFIX + currentNoteTab, notesBody.innerHTML);
  updateNotesFoot();
}
function openNotesPanel(){
  notesPanel.classList.add('open');
  if(isMobile()){ notesBackdrop.classList.add('show'); }
}
function closeNotesPanel(){
  notesPanel.classList.remove('open');
  notesBackdrop.classList.remove('show');
}
notesFab.addEventListener('click', function(){
  if(notesPanel.classList.contains('open')){
    closeNotesPanel();
  } else {
    openNotesFor(currentNoteTab);
    openNotesPanel();
  }
});
document.getElementById('notesClose').addEventListener('click', closeNotesPanel);
notesBackdrop.addEventListener('click', closeNotesPanel);
notesBody.addEventListener('input', saveCurrentNote);
document.querySelectorAll('.notes-toolbar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    var cmd = btn.dataset.cmd;
    notesBody.focus();
    if(cmd.indexOf(':')>-1){
      var parts = cmd.split(':');
      document.execCommand(parts[0], false, parts[1]);
    } else {
      document.execCommand(cmd, false, null);
    }
    saveCurrentNote();
  });
});

activateTab(ALL_TAB_IDS[0]);
</script>
