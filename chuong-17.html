<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<title>Shaikh — Capitalism: Competition, Conflict, Crises — Chương 17</title>
<style>
:root{
  --bg:#f2ede0;
  --panel:#fffdf8;
  --panel-2:#eef1e8;
  --ink:#211d16;
  --ink-soft:#4c473b;
  --muted:#847b68;
  --line:#dcd0ac;
  --primary:#1f3b5c;
  --primary-dark:#152944;
  --primary-tint:#e1e8ef;
  --gold:#a67f2c;
  --gold-light:#d6b263;
  --green:#2f6b3f;
  --green-tint:#e3ede4;
  --red:#8a2f2f;
  --red-tint:#f0e2e2;
  --dark-bg:#141b22;
  --dark-panel:#1d2731;
  --dark-ink:#eef1e6;
  --dark-line:#324256;
  --shadow:0 6px 24px rgba(20,27,34,0.12);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1000px;margin:0 auto;padding:0 16px 80px;}

.hero{padding:32px 16px 20px;text-align:center;border-bottom:3px double var(--gold);margin-bottom:18px;background:radial-gradient(ellipse at top, rgba(166,127,44,0.08), transparent 60%);}
.hero .kicker{font-family:Georgia,serif;letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700;}
.hero h1{font-size:clamp(22px,4.6vw,34px);margin:8px 0 4px;color:var(--primary-dark);letter-spacing:.005em;line-height:1.25;}
.hero .subtitle{font-size:14.5px;color:var(--ink-soft);font-style:italic;}
.hero .meta{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hero .meta span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);}
.hero .meta a.meta-link{color:var(--primary);text-decoration:none;font-weight:600;}
.hero .meta a.meta-link:hover{background:var(--primary-tint);}


.tabbar-wrap{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:8px;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tabbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;}
.tabbar::-webkit-scrollbar{height:5px;}
.tabbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.tab-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
.tab-btn .n{color:var(--gold);font-weight:800;margin-right:5px;}
.tab-btn:hover{border-color:var(--gold);}
.tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow);}
.tab-btn.active .n{color:var(--gold-light);}

.panel{display:none;animation:fadein .25s ease;}
.panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);}
.card h2{margin:0 0 4px;font-size:21px;color:var(--primary-dark);}
.card .eng-title{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:16px;letter-spacing:.02em;}
.card h3{font-size:15.5px;color:var(--primary);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px;}
.card p{margin:0 0 12px;color:var(--ink);}
.card p:last-child{margin-bottom:0;}
.lede{font-size:16px;color:var(--ink-soft);border-left:3px solid var(--gold);padding-left:14px;margin:6px 0 18px;}

.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0;}
.concept{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.concept .term{font-weight:700;color:var(--primary-dark);font-size:13px;display:block;margin-bottom:4px;}
.concept .term .en{color:var(--gold);font-weight:600;font-size:11px;font-style:italic;}
.concept p{font-size:13px;margin:0;color:var(--ink-soft);}

.figure-note{background:var(--primary-tint);border:1px dashed var(--primary);border-radius:10px;padding:12px 15px;font-size:12.5px;color:var(--primary-dark);margin:14px 0;}
.figure-note b{color:var(--primary-dark);}

.debate-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0;}
.debate-box .dh{background:var(--primary);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.03em;}
.debate-box .db{padding:13px 15px;font-size:13px;color:var(--ink-soft);}
.debate-box .names{color:var(--gold);font-weight:700;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0;}
.stat-box{background:var(--primary-dark);color:#fff;border-radius:10px;padding:13px 14px;text-align:center;}
.stat-box .val{font-size:20px;font-weight:800;color:var(--gold-light);}
.stat-box .lbl{font-size:10.5px;color:#dbe4ee;margin-top:3px;line-height:1.3;}

.dark-panel{background:var(--dark-bg);color:var(--dark-ink);border-radius:12px;padding:20px;margin:16px 0;border:1px solid var(--dark-line);}
.dark-panel h4{margin:0 0 12px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;}
.flow{display:flex;flex-direction:column;gap:0;}
.flow-step{background:var(--dark-panel);border:1px solid var(--dark-line);border-radius:8px;padding:10px 14px;font-size:12.5px;position:relative;}
.flow-step b{color:var(--gold-light);}
.flow-arrow{text-align:center;color:var(--gold);font-size:16px;padding:2px 0;}
.flow-branch{display:flex;gap:10px;margin:2px 0;flex-wrap:wrap;}
.flow-branch>div{flex:1;min-width:150px;}

.chart-panel{background:var(--dark-bg);border:1px solid var(--dark-line);border-radius:12px;padding:18px 18px 14px;margin:16px 0;}
.chart-panel h4{margin:0 0 2px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;}
.chart-panel .chart-sub{font-size:11px;color:#9fb0c2;margin-bottom:10px;font-style:italic;}
.chart-panel svg{width:100%;height:auto;display:block;}
.chart-note{font-size:10.5px;color:#8496a8;margin-top:6px;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dark-ink);}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:12px;height:3px;display:inline-block;border-radius:2px;}
.chart-legend i.dot{border-radius:50%;height:9px;width:9px;}

.bar-chart{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-label{width:170px;font-size:11.5px;color:var(--dark-ink);flex-shrink:0;}
.bar-track{flex:1;background:#2a3644;border-radius:6px;overflow:hidden;height:22px;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;color:#241d10;font-weight:700;}

.gloss-item{border-bottom:1px solid var(--line);padding:12px 0;}
.gloss-item:last-child{border-bottom:none;}
.gloss-term{font-weight:700;color:var(--primary-dark);font-size:14px;}
.gloss-term .en{color:var(--gold);font-weight:600;font-size:11.5px;font-style:italic;margin-left:6px;}
.gloss-def{font-size:13px;color:var(--ink-soft);margin-top:3px;}

.gloss-extra-row{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.gloss-extra-row .en{flex:1;color:var(--ink-soft);font-style:italic;}
.gloss-extra-row .vi{flex:1;color:var(--primary-dark);font-weight:600;}


/* ===== Real/reference chart (photo, not illustrative SVG) ===== */
.chart-real{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:10px 0 18px;}
.chart-real-badge{display:inline-block;font-family:Georgia,serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);border-radius:4px;padding:3px 9px;margin-bottom:9px;}
.chart-real img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);}
.chart-real figcaption{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.55;font-style:italic;}


.fc-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.fc-progress{font-size:13px;color:var(--muted);}
.fc-stage{display:flex;justify-content:center;margin:10px 0 20px;perspective:1400px;}
.flashcard{width:100%;max-width:560px;height:270px;position:relative;cursor:pointer;}
.flashcard .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flashcard.flipped .fc-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);}
.fc-front{background:var(--panel);}
.fc-front .fc-tag{position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;font-weight:700;}
.fc-front .fc-q{font-size:17px;color:var(--ink);font-weight:600;}
.fc-back{background:var(--primary);color:#fff;transform:rotateY(180deg);}
.fc-back .fc-a{font-size:14px;}
.fc-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;}
.fc-nav{display:flex;justify-content:center;gap:10px;margin-top:16px;}
.btn{border:1px solid var(--primary);background:var(--panel);color:var(--primary-dark);font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--primary);color:#fff;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-dark);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.quiz-progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--primary));transition:width .3s;}
.q-block{margin-bottom:14px;}
.q-text{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;}
.q-opts{display:flex;flex-direction:column;gap:8px;}
.q-opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer;transition:all .15s;}
.q-opt:hover{border-color:var(--gold);}
.q-opt.selected{border-color:var(--primary);background:var(--primary-tint);}
.q-opt.correct{border-color:var(--green);background:var(--green-tint);color:#1c4a28;font-weight:700;}
.q-opt.incorrect{border-color:var(--primary);background:#f3e6e6;color:#7a2020;font-weight:700;}
.q-explain{margin-top:10px;font-size:12.5px;color:var(--ink-soft);background:var(--panel-2);border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 8px 8px 0;display:none;}
.q-explain.show{display:block;}
.quiz-score{text-align:center;padding:30px 20px;}
.quiz-score .num{font-size:46px;font-weight:800;color:var(--primary);}
.quiz-score .lbl{font-size:14px;color:var(--muted);margin-bottom:18px;}

.notes-fab{position:fixed;right:22px;bottom:22px;z-index:50;background:var(--primary);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 8px 20px rgba(21,41,68,0.35);cursor:pointer;display:flex;align-items:center;gap:7px;}
.notes-backdrop{position:fixed;inset:0;background:rgba(15,18,22,0.45);z-index:60;display:none;}
.notes-backdrop.show{display:block;}
.notes-panel{position:fixed;top:0;right:0;height:100%;width:380px;max-width:88vw;background:var(--panel);z-index:70;box-shadow:-10px 0 30px rgba(0,0,0,0.2);transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;}
.notes-panel.open{transform:translateX(0);}
.notes-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.notes-head h4{margin:0;color:var(--primary-dark);font-size:14.5px;}
.notes-head .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.notes-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;}
.notes-toolbar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.notes-toolbar button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;width:30px;height:30px;cursor:pointer;font-family:Georgia,serif;font-size:14px;color:var(--ink);}
.notes-toolbar button:hover{border-color:var(--gold);}
.notes-body{flex:1;padding:16px 18px;overflow-y:auto;outline:none;font-size:14px;line-height:1.7;}
.notes-body:empty:before{content:"Ghi chú của bạn cho phần này... (tự động lưu)";color:var(--muted);font-style:italic;}
.notes-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);}

@media (max-width:640px){
  .hero{padding:22px 12px 14px;}
  .card{padding:16px 15px;}
  .flashcard{height:250px;}
  .notes-panel{width:100%;max-width:100%;}
}
@media print{
  .tabbar-wrap,.notes-fab,.notes-panel,.notes-backdrop,.fc-nav,.q-opts{display:none !important;}
  .panel{display:block !important;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
}
</style>
</head>

<script>
/* =========================================================
   MINI CHART HELPER
   ========================================================= */
function sparkPath(values, w, h, pad, minmax){
  var n = values.length;
  var min, max;
  if(minmax){ min = minmax[0]; max = minmax[1]; }
  else { min = Math.min.apply(null, values); max = Math.max.apply(null, values); }
  var range = (max - min) || 1;
  var pts = values.map(function(v, i){
    var x = pad + (i/(n-1)) * (w - 2*pad);
    var y = pad + (1 - (v - min)/range) * (h - 2*pad);
    return [x,y];
  });
  var d = 'M ' + pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L ');
  var area = d + ' L ' + pts[pts.length-1][0].toFixed(1) + ',' + (h-pad) + ' L ' + pts[0][0].toFixed(1) + ',' + (h-pad) + ' Z';
  return {line:d, area:area, pts:pts};
}
function renderLineChart(containerId, series, opts){
  opts = opts || {};
  var w = opts.w || 400, h = opts.h || 120, pad = opts.pad || 8;
  var minmax = null;
  if(opts.shared){
    var allVals = [];
    series.forEach(function(s){ allVals = allVals.concat(s.values); });
    minmax = [Math.min.apply(null, allVals), Math.max.apply(null, allVals)];
  }
  var svg = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  if(opts.zeroLine){
    var zy = pad + (1 - (0 - minmax[0])/((minmax[1]-minmax[0])||1)) * (h - 2*pad);
    svg += '<line x1="'+pad+'" y1="'+zy.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+zy.toFixed(1)+'" stroke="#4a5a6c" stroke-width="1" stroke-dasharray="2,3"/>';
  }
  series.forEach(function(s){
    var r = sparkPath(s.values, w, h, pad, minmax);
    if(s.fill !== false){
      svg += '<path d="'+r.area+'" fill="'+(s.color||'#a67f2c')+'" opacity="0.12"></path>';
    }
    svg += '<path d="'+r.line+'" fill="none" stroke="'+(s.color||'#a67f2c')+'" stroke-width="'+(s.width||2)+'" vector-effect="non-scaling-stroke" '+(s.dash?'stroke-dasharray="'+s.dash+'"':'')+'></path>';
  });
  svg += '</svg>';
  var el = document.getElementById(containerId);
  if(el) el.innerHTML = svg;
}
function renderScatter(containerId, points, opts){
  opts = opts || {};
  var w = opts.w || 400, h = opts.h || 220, pad = 26;
  var xs = points.map(function(p){return p[0];}), ys = points.map(function(p){return p[1];});
  var xmin=Math.min.apply(null,xs), xmax=Math.max.apply(null,xs);
  var ymin=Math.min.apply(null,ys), ymax=Math.max.apply(null,ys);
  var sx = function(x){ return pad + (x-xmin)/(xmax-xmin||1)*(w-2*pad); };
  var sy = function(y){ return h-pad - (y-ymin)/(ymax-ymin||1)*(h-2*pad); };
  var svg = '<svg viewBox="0 0 '+w+' '+h+'">';
  svg += '<line x1="'+pad+'" y1="'+sy(0).toFixed(1)+'" x2="'+(w-pad)+'" y2="'+sy(0).toFixed(1)+'" stroke="#5a6a7c" stroke-width="1" stroke-dasharray="3,3"/>';
  points.forEach(function(p){
    var c = p[2] || opts.color || '#d6b263';
    svg += '<circle cx="'+sx(p[0]).toFixed(1)+'" cy="'+sy(p[1]).toFixed(1)+'" r="3.4" fill="'+c+'" opacity="0.85"/>';
  });
  svg += '</svg>';
  var el = document.getElementById(containerId);
  if(el) el.innerHTML = svg;
}

/* =========================================================
   DATA — SECTIONS (tabs 0-6)
   ========================================================= */
var SECTIONS = [
  {
    id:"nhapmontongket17", n:"0", label:"Mục đích Cuốn sách",
    title:"Nhập môn: Mục đích Cuốn sách và Vì sao Ít Chú ý tới Phê phán Nội tại", eng:"I. Introduction",
    body:`
      <p class="lede">Mục đích đơn giản của cuốn sách này là chứng minh rằng nhiều mệnh đề trung tâm của phân tích kinh tế có thể được suy ra mà KHÔNG cần viện tới siêu duy lý, tối ưu hóa, cạnh tranh hoàn hảo, thông tin hoàn hảo, tác nhân đại diện, hay cái gọi là kỳ vọng duy lý.</p>
      <h3>Danh mục thành tựu: từ giá cả tới khủng hoảng</h3>
      <p>Những mệnh đề đó bao gồm: quy luật cung-cầu, xác định tỷ suất lương và lợi nhuận, thay đổi công nghệ, giá tương đối, lãi suất, giá trái phiếu và cổ phiếu, tỷ giá hối đoái, cán cân và tỷ giá thương mại, tăng trưởng, thất nghiệp, lạm phát, và các cơn bùng nổ dài kết thúc bằng khủng hoảng tổng quát tái diễn. Trong MỌI trường hợp, lý thuyết phát triển trong sách được áp dụng vào các hình mẫu thực nghiệm hiện đại, và đối chiếu với các cách tiếp cận tân cổ điển, Keynesian, và hậu-Keynesian đối với cùng vấn đề. Đối tượng phân tích là kinh tế học CỦA chủ nghĩa tư bản, và tư duy kinh tế về chủ đề này được xem xét dưới ánh sáng đó — Shaikh tin đây chính là cách các nhà kinh tế học cổ điển, cũng như Keynes và Kalecki, đã tiếp cận vấn đề.</p>
      <h3>Vì sao Keynes và Kalecki lại bác bỏ cạnh tranh không hoàn hảo?</h3>
      <p>Keynes tìm cách tạo một nền tảng MỚI cho phân tích kinh tế vĩ mô vì thế giới ông quan sát quá KHÁC BIỆT với chính thống kinh tế thời ông — nhưng ông nổi tiếng BÁC BỎ lý thuyết cạnh tranh không hoàn hảo làm nền tảng cho lý thuyết cầu hiệu quả của mình. Kalecki ban đầu phát triển cách tiếp cận riêng về tổng cầu dưới giả định cạnh tranh "thuần túy" (chương 12), nhưng sau đó chuyển sang một lý thuyết định giá KHÁC dựa trên quan sát các quá trình thực tế (chương 8, mục I.9). Trong cuốn sách này, Shaikh khẳng định: lý thuyết cầu hiệu quả và ngay cả lý thuyết định giá của Kalecki được đặt định TỐT HƠN dưới cái ông gọi là cạnh tranh THỰC — động lực đằng sau nhiều hình mẫu đã nhận diện và kiểm định xuyên suốt cuốn sách.</p>
      <div class="debate-box">

      </div>
      <h3>Hoàn hảo và không hoàn hảo — bài học từ kinh tế học hành vi</h3>
      <p>Điều tương tự có thể nói về tính siêu duy lý — vốn kỳ quặc như một mô tả hành vi kinh tế và mang tính XÚC PHẠM như một lý tưởng văn hóa. Hộ gia đình và doanh nghiệp chắc chắn đưa ra lựa chọn, và lựa chọn có ý nghĩa. Nhưng nền tảng của chúng đa dạng và biến đổi, bị ảnh hưởng bởi một mạng lưới phức tạp các lực lượng bắt nguồn từ — nhưng không bị QUYẾT ĐỊNH bởi — giới tính, chủng tộc, quốc tịch, cộng đồng, tôn giáo, và lịch sử cá nhân (chương 3). Kinh tế học hành vi đã trở thành một "ngành công nghiệp lớn" chuyên phát hiện hành vi cá nhân KHÔNG khớp với các quy định của tính siêu duy lý — hệt như thời trước, lý thuyết cạnh tranh không hoàn hảo liên tục phát hiện hành vi doanh nghiệp không khớp với quy định của cạnh tranh hoàn hảo (chương 8).</p>

      <h3>Vì sao Shaikh ít chú ý tới phê phán nội tại</h3>
      <p>Vì những lý do trên, Shaikh đã dành tương đối ÍT sự chú ý tới các phê phán NỘI TẠI thuần túy đối với lý thuyết chuẩn — như phê phán tái chuyển đổi kỹ thuật (re-switching) trong lý thuyết tư bản, hay hiệu ứng của lợi thế kinh tế theo quy mô lên cạnh tranh hoàn hảo. Dù những nỗ lực đó có thể quan trọng, một phê phán NỘI TẠI đòi hỏi ta phải CHẤP NHẬN phần lớn một lý thuyết để tập trung tấn công MẮT XÍCH YẾU NHẤT của nó. Ngay cả khi THÀNH CÔNG (và được chính giới chính thống thừa nhận — một chuyện HOÀN TOÀN khác), điều đó cũng KHÔNG cho ta biết cách xây dựng một GIẢI PHÁP THAY THẾ từ những mảnh vỡ. Chiến lược đó quá thường xuyên TRÓI BUỘC ta vào chính khung lý thuyết đang bị phê phán — mắc kẹt trong những mệnh đề ban đầu chỉ được chấp nhận vì lý do CHIẾN THUẬT.</p>

    body:`
      <p class="lede">Lý thuyết cổ điển đặt ra tiền đề: cạnh tranh bình quân hóa hỗn loạn giá cả cho các loại sản phẩm tương đương, mức lương cho các loại lao động tương đương, và tỷ suất lợi nhuận cho các rủi ro tương đương. Nhưng bình quân hóa không có nghĩa là san bằng thành một điểm duy nhất — nó tạo ra một PHÂN PHỐI.</p>
      <h3>Giá cả: từ một điểm chung tới một phổ giá</h3>
      <p>Ở mức trừu tượng cao nhất, lựa chọn công nghệ dẫn tới một phương pháp sản xuất chung trong bất kỳ ngành nào, và cạnh tranh giữa các nhà sản xuất dẫn tới một mức giá tương đối chung. Hai điều đáng chú ý: THỨ NHẤT, ngay cả dưới các điều kiện đơn giản nhất này, việc san bằng giá vẫn liên quan tới những dao động VĨNH VIỄN khi giá liên tục vượt quá và hụt dưới mục tiêu. THỨ HAI, điều này KHÔNG xác định mức cụ thể của giá chung — cho điều đó, ta phải chuyển sang cạnh tranh GIỮA các ngành, nơi tính di động của tư bản tạo ra một giá cả cụ thể trong mỗi ngành (giá sản xuất) đảm bảo tỷ suất lợi nhuận NGANG NHAU giữa các ngành.</p>
      <p>Một khi ta nhận ra thay đổi công nghệ diễn ra LIÊN TỤC, việc loại bỏ dần công nghệ cũ và giới thiệu liên tục công nghệ mới sẽ tạo ra một PHÂN PHỐI công nghệ giữa các doanh nghiệp. Doanh nghiệp với công nghệ mới hơn ở vị thế CẮT GIẢM giá để giành thị phần; doanh nghiệp đương nhiệm buộc phải phản ứng: nếu khớp hoàn toàn mức giảm giá, họ giữ được thị phần nhưng GIẢM biên lợi nhuận; nếu không đổi giá, họ giữ biên lợi nhuận nhưng MẤT thị phần. Kết quả: một PHỔ giá bán, trong đó giá thấp hơn tương quan với chi phí thấp hơn — và do đó cũng một phổ biên lợi nhuận VÀ tỷ suất lợi nhuận. Tư bản mới gia nhập ngành sẽ tập trung vào phương pháp chi phí THẤP NHẤT sẵn có, và tính di động của tư bản giữa các ngành sẽ bình quân hóa hỗn loạn tỷ suất lợi nhuận của các tư bản ĐIỀU TIẾT (thực hành tốt nhất) này.</p>
      <h3>Lương: cùng logic, nhưng với một điểm khác biệt căn bản</h3>
      <p>Phân tích mức lương theo LOGIC TƯƠNG TỰ. Nếu lương thực cao hơn ở một số doanh nghiệp và thấp hơn ở số khác, nguồn cung lao động tìm việc TĂNG ở nhóm đầu và GIẢM ở nhóm sau — mức lương sẽ được bình quân hóa hỗn loạn giữa các doanh nghiệp và do đó giữa các ngành. Như trường hợp giá bán hàng hóa, điều này cho ta biết sẽ có một mức lương CHUNG nhưng KHÔNG cho biết MỨC ĐỘ của nó. Đây chính là nơi khác biệt giữa hàng hóa thông thường và NĂNG LỰC LAO ĐỘNG trở nên then chốt: với một hàng hóa thông thường (vừa được SẢN XUẤT vừa được SỬ DỤNG bởi tư bản), có một mức giá cụ thể đảm bảo tỷ suất lợi nhuận thông thường trên việc sản xuất nó. Nhưng dù năng lực lao động được tư bản SỬ DỤNG, nó KHÔNG được tư bản SẢN XUẤT — hơn nữa, năng lực này là thuộc tính của một CHỦ THỂ CHỦ ĐỘNG, người lao động. Vậy nên nhà tuyển dụng tư bản luôn phải VƯƠN RA ngoài phạm vi sản xuất tư bản chủ nghĩa để có được nó, và luôn phải đối mặt với phản ứng — đôi khi là sự kháng cự công khai — của người lao động đối với việc sử dụng nó (chương 4).</p>
      <h3>Botwinick: bất bình đẳng lương dai dẳng dưới cạnh tranh thực</h3>
      <p>Trong cuốn sách đột phá "Persistent Inequalities: Wage Disparity under Capitalist Competition", Botwinick (1993) chứng minh: các giới hạn CỤ THỂ đối với mặc cả lương dưới cạnh tranh thực có thể tạo ra CHÊNH LỆCH LƯƠNG DAI DẲNG. Ông chỉ ra: vì tỷ suất lợi nhuận của các tư bản điều tiết (người dẫn dắt giá) được san bằng giữa các ngành, tư bản điều tiết trong ngành có tỷ số tư bản-lao động CAO HƠN buộc phải có biên lợi nhuận CAO HƠN.</p>
      <div class="dark-panel">
        <h4>Logic của Botwinick về Chênh lệch Lương Dai dẳng</h4>
        <div class="flow">
          <div class="flow-step"><b>Ngành thâm dụng tư bản</b> có tỷ suất lợi nhuận điều tiết = mọi ngành khác (bình quân hóa), NÊN phải có biên lợi nhuận CAO hơn</div>
          <div class="flow-arrow">⇒</div>
          <div class="flow-step">Biên lợi nhuận cao khiến họ DỄ HẤP THỤ tăng lương hơn trong khoảng thời gian lực lượng cạnh tranh phản ứng và điều chỉnh giá tương đối</div>
          <div class="flow-arrow">+</div>
          <div class="flow-step">Chi phí cố định CAO khiến họ dễ bị tổn thương hơn trước đình công/suy thoái — NHƯNG chi phí lao động chiếm tỷ trọng NHỎ hơn tổng chi phí, nên dễ CHỊU ĐỰNG tăng lương hơn</div>
          <div class="flow-arrow">⇒</div>
          <div class="flow-step" style="border-color:var(--gold);">Tư bản điều tiết thâm dụng vốn có xu hướng trả LƯƠNG CAO HƠN với cùng mức độ tổ chức của lao động — trong khi tư bản KHÔNG điều tiết (giá bị quyết định bởi giá sản xuất của tư bản điều tiết) dễ tổn thương hơn trước chi phí lao động tăng, nên lương THẤP hơn</div>
        </div>
      </div>
      <p>Những cân nhắc này dẫn ta tới câu hỏi về HÌNH DẠNG của phân phối lương — một câu hỏi quen thuộc trong sinh học và vật lý học, và thực ra đã là một phần của kinh tế học kể từ các nghiên cứu năm 1897 của Pareto về phân phối của cải và thu nhập.</p>

    body:`
      <p class="lede">Đây là một trong những phần mới mẻ và táo bạo nhất của toàn cuốn sách: Shaikh kết nối lý thuyết cạnh tranh thực với một dòng nghiên cứu "vật lý kinh tế" (econophysics) hiện đại về phân phối thu nhập — cho ra một trong những kết quả thực nghiệm gọn gàng và mạnh mẽ nhất toàn cuốn sách.</p>
      <h3>Lý thuyết "Hai Giai cấp" của Kinh tế Vật lý (EPTC)</h3>
      <p>Nghiên cứu phân phối thu nhập trong các xã hội tư bản chủ nghĩa có thể truy ngược tới phát hiện năm 1897 của Pareto: thu nhập DỰA TRÊN TÀI SẢN có vẻ tuân theo quy luật lũy thừa mà nay ta gọi là phân phối Pareto. Bằng chứng hiện đại xác nhận quy luật này áp dụng cho ĐUÔI TRÊN của phân phối thu nhập nhưng KHÔNG cho phần đông ở dưới. Nhà vật lý Yakovenko và cộng sự gần đây đã khai phá lĩnh vực này với lý thuyết "hai giai cấp" (EPTC — econophysics two-class theory): họ lập luận trên cơ sở lý thuyết rằng thu nhập LAO ĐỘNG xấp xỉ tuân theo phân phối MŨ (nhiệt), trong khi thu nhập TÀI SẢN tuân theo phân phối Pareto (siêu nhiệt).</p>

      <h3>Từ va chạm hạt tới cạnh tranh lao động: hai cách giải thích</h3>
      <p>Yakovenko và cộng sự đề xuất một PHÉP TƯƠNG TỰ với va chạm hạt dưới định luật bảo toàn năng lượng: việc chuyển tiền giữa những người tham gia mua-bán hàng hóa/dịch vụ dẫn tới phân phối mũ của lượng tiền nắm giữ. Dù cách tiếp cận này có thể hữu ích cho việc xử lý DỰ TRỮ tiền trong tái sản xuất xã hội, nó không thực sự giải quyết vấn đề phân phối DÒNG CHẢY thu nhập lao động. Shaikh đề xuất một khung khác: kết hợp hiệu ứng của cạnh tranh THỰC lên điều kiện sản xuất của doanh nghiệp VỚI hiệu ứng lên lương và điều kiện làm việc của người lao động.</p>

        </div>
      </div>
      <p>Điểm quan trọng: những kết cục này có thể được suy ra như các MỆNH ĐỀ CẤU TRÚC TỔNG QUÁT trong chính truyền thống cổ điển — không cần viện tới bất kỳ giả định về hành vi TỐI ƯU HÓA duy lý nào của cá nhân người lao động hay doanh nghiệp.</p>
      <div class="figure-note"><b>Xác nhận thực nghiệm đáng chú ý (Shaikh, Papanikolaou, và Weiner 2014):</b> khi kiểm định giả thuyết EPTC cho các NHÓM PHỤ dân số Mỹ theo giới tính và chủng tộc (1996-2008) — dù Nam giới có thu nhập bình quân cao hơn Nữ giới, và người Da trắng cao hơn người Mỹ gốc Phi (và ta biết chính sách xã hội có thể ảnh hưởng những khoảng cách này) — phân phối thu nhập TRƯỚC THUẾ TRONG MỖI NHÓM riêng lẻ vẫn khá gần với phân phối mũ ở mọi năm. Đây là một phát hiện đáng ngạc nhiên đặt ra câu hỏi thú vị về CƠ CHẾ đằng sau tính bền vững đáng kinh ngạc của hình dạng phân phối này.</div>

    body:`
      <p class="lede">Từ lý thuyết phân phối mũ/Pareto, Shaikh rút ra một công thức GỌN GÀNG cho bất bình đẳng tổng thể — rồi chuyển sang một phát hiện thực nghiệm gây NGẠC NHIÊN về vai trò thực sự của nhà nước phúc lợi.</p>

      </div>
      <p>Bất chấp các tuyên bố chính trị phổ biến về "khả năng di chuyển đi lên", xác suất một cá nhân TIẾP TỤC nằm trong nhóm 1% thu nhập cao nhất từ năm này sang năm khác đã "duy trì ổn định đáng kể kể từ thập niên 1970" (Saez 2013). Thu nhập cao bao gồm lợi nhuận, cổ tức, lãi suất, tiền thuê, và lãi vốn — "một phần đáng kể của sự bùng nổ các khoản thu nhập này kể từ 1970 là do sự BÙNG NỔ của lương và tiền thưởng CAO NHẤT... của nhân viên được trả lương cao hoặc doanh nhân mới". Tiền thưởng và quyền chọn cổ phiếu có thể được xem như CỔ PHẦN trong lợi nhuận doanh nghiệp mà những cá nhân này sở hữu hoặc làm việc — nên sự gia tăng ngoạn mục tỷ lệ lợi nhuận/lương từ thập niên 1980 (chương 14, 16) tạo nền tảng VẬT CHẤT cho sự gia tăng mạnh bất bình đẳng thu nhập tổng thể.</p>

      <p>Bất bình đẳng thu nhập tổng thể CUỐI CÙNG phụ thuộc HOÀN TOÀN vào tỷ số thu nhập tài sản/thu nhập lao động — tức phụ thuộc phân chia CƠ BẢN giá trị gia tăng. Đây là một kết quả MANG TÍNH CỔ ĐIỂN NỀN TẢNG.</p>
      <h3>Nhà nước can thiệp vào cán cân quyền lực — và một phát hiện gây ngạc nhiên</h3>
      <p>Nhà nước có thể can thiệp TRỰC TIẾP vào cán cân quyền lực lao động-tư bản — như đã làm một cách quyết liệt trong kỷ nguyên tân tự do khởi xướng bởi Reagan và Thatcher, hạ tỷ trọng lương và nâng tỷ trọng lợi nhuận (chương 14). Lạm phát cũng có thể xói mòn lương thực, càng mạnh hơn nếu lao động đã suy yếu (chương 15). Chính sách tài khóa có thể bơm sản lượng-việc làm, còn chính sách thắt lưng buộc bụng có thể làm xì hơi chúng (chương 16).</p>
      <p>Nhưng còn một hiệu ứng ÍT được nhắc tới lên mức sống người lao động: người lao động mặc cả lương DANH NGHĨA nhắm tới một MỤC TIÊU mức sống nhất định. Thuế TRỰC TIẾP làm giảm thu nhập khả dụng, nhưng chi tiêu xã hội bù đắp những tổn thất đó nếu chúng cung cấp hàng hóa/dịch vụ mong muốn. Khoảng chênh lệch giữa chi tiêu xã hội (y tế, giáo dục, phúc lợi, nhà ở, giao thông, công viên, chuyển giao) và thuế trực tiếp mà người lao động phải trả được gọi là <b>lương xã hội ròng</b> (net social wage).</p>

    concepts:[

    id:"doithoaipiketty17", n:"5", label:"Đối thoại với Piketty",
    title:"Đối thoại với Piketty: \u201cCapital in the Twenty-First Century\u201d", eng:"IV. Piketty",
    body:`
      <p class="lede">Shaikh dành trọn một mục để đối thoại trực tiếp với cuốn sách bán chạy toàn cầu của Thomas Piketty — vừa ca ngợi đóng góp thực nghiệm to lớn của ông, vừa đưa ra một phê phán kỹ thuật sắc bén về cách đo lường tỷ suất lợi nhuận.</p>
      <h3>Ba phần logic của cuốn sách Piketty</h3>
      <div class="stat-row">
        <div class="stat-box"><div class="val">Phần 1: Thực nghiệm</div><div class="lbl">Chủ nghĩa tư bản có xu hướng bất bình đẳng gia tăng, chỉ bị gián đoạn bởi các cú sốc lớn (chiến tranh, cách mạng, khủng hoảng) — cơ chế then chốt: r &gt; g</div></div>
        <div class="stat-box"><div class="val">Phần 2: Lý thuyết</div><div class="lbl">Dựa vào hàm sản xuất tổng hợp tân cổ điển: tỷ suất lợi nhuận = sản phẩm biên của tư bản, giảm khi kho tư bản tăng — nhưng tỷ trọng lợi nhuận có thể được cứu bởi tỷ số tư bản/thu nhập tăng</div></div>
        <div class="stat-box"><div class="val">Phần 3: Chính sách</div><div class="lbl">Đề xuất một loại thuế TOÀN CẦU LŨY TIẾN đánh vào tư bản, kèm minh bạch cao, để "dân chủ" giành lại quyền kiểm soát chủ nghĩa tư bản tài chính toàn cầu hóa</div></div>
      </div>
      <p>Shaikh ghi nhận: Piketty bác bỏ sự sùng bái thị trường ("hệ thống giá không biết tới giới hạn hay đạo đức"), và lên án "niềm đam mê trẻ con với toán học và suy đoán thuần túy lý thuyết, thường mang tính ý thức hệ cao, gây thiệt hại cho nghiên cứu lịch sử" — điều khiến giới học thuật "chỉ biết tạo ra các kết quả thuần túy lý thuyết mà thậm chí không biết SỰ THẬT nào cần được giải thích". Shaikh bổ sung: vấn đề không nằm ở việc SỬ DỤNG toán học, mà ở TẦM NHÌN mà nó phục vụ.</p>
      <h3>Phê phán kỹ thuật cốt lõi: tỷ suất lợi nhuận của Piketty bị đo sai</h3>
      <div class="debate-box">
        <div class="dh">MỘT NGHỊCH LÝ TRONG DỮ LIỆU CỦA CHÍNH PIKETTY</div>
        <div class="db">Piketty đặt nặng vào việc r &gt; g (tỷ suất lợi nhuận vượt tốc độ tăng trưởng) là "lực lượng nền tảng cho sự PHÂN KỲ". Nhưng điều này KỲ LẠ ở hai cấp độ: (1) Từ góc nhìn CỔ ĐIỂN, tỷ suất lợi nhuận THÔNG THƯỜNG LUÔN LỚN HƠN tốc độ tăng trưởng thông thường — vì tỷ suất lợi nhuận là tỷ số THẶNG DƯ/tư bản, còn tốc độ tăng trưởng là tỷ số phần TÁI ĐẦU TƯ của thặng dư (đầu tư)/tư bản (chương 15). Nếu logic Piketty đúng, chủ nghĩa tư bản LUÔN LUÔN phải tạo ra bất bình đẳng gia tăng KHÔNG NGỪNG — điều KHÔNG khớp lịch sử. (2) Dữ liệu CHÍNH Piketty đưa ra cho thấy tỷ suất lợi nhuận Anh-Pháp KHÔNG có xu hướng dài hạn thế kỷ 19, TĂNG GẤP ĐÔI đầu thế kỷ 20, tăng MẠNH trong Đại Khủng hoảng, rồi GIẢM MẠNH trong các cơn bùng nổ hậu 1950 — hoàn toàn NGƯỢC với những gì lý thuyết chuẩn dự đoán (tỷ suất lợi nhuận phải TĂNG trong bùng nổ, GIẢM trong khủng hoảng)!</div>
      </div>
      <p>Câu đố được giải quyết một khi ta nhận ra thước đo tỷ suất lợi nhuận của Piketty KHÔNG NHẤT QUÁN về mặt logic. Ông định nghĩa lợi nhuận là phần vượt của giá trị gia tăng trên lương (thặng dư hoạt động ròng) — LOẠI TRỪ lãi vốn trên đất đai/tài sản tài chính, CŨNG NHƯ các khoản thanh toán lãi và tiền thuê thực tế (những khoản NIPA coi là "đầu vào trung gian"). Nhưng thước đo KHO TƯ BẢN của ông lại BAO GỒM nhà xưởng-thiết bị, VÀ đất đai, bất động sản dân cư, tài sản tài chính ròng bao gồm giá trị hiện tại của cổ phần. Việc KHÔNG tính đủ mọi khoản thu nhập trên các tài sản này tạo ra một mức tỷ suất lợi nhuận THẤP HƠN NHIỀU — và khiến nó RẤT NHẠY CẢM với biến động GIÁ TRỊ THỊ TRƯỜNG của các tài sản đó: trong một cơn suy sụp, các tài sản này MẤT GIÁ nhanh hơn tư bản cố định, ĐẨY tỷ suất lợi nhuận BIỂU KIẾN lên — và ngược lại trong bùng nổ. Đây chính xác là lý do tỷ suất lợi nhuận của Piketty TĂNG trong Đại Khủng hoảng và GIẢM trong các cơn bùng nổ hậu bán thế kỷ 20.</p>
      <div class="figure-note"><b>Piketty đã gần chạm tới sự thật:</b> ông thể hiện một phần nhận thức về vấn đề khi nói lẽ ra ông nên giới hạn thước đo kho tư bản chỉ trong thiết bị-hạ tầng NẾU có thể tách riêng các yếu tố đó ra — nhưng ông KHÔNG bàn tới hệ quả NGHIÊM TRỌNG của việc không làm vậy.</p>
      <h3>Phê phán chính trị: bắt đầu phân tích chính sách từ đâu?</h3>
      <p>Về mặt chính trị, Piketty đề xuất theo dõi và đánh thuế dòng vốn quốc tế để tư bản toàn cầu bị đưa trở lại dưới sự kiểm soát của "dân chủ". Đáng chú ý: ông chỉ tập trung vào thu nhập SAU thuế. Ta biết rằng trong THỰC TẾ, bất bình đẳng thu nhập TRƯỚC thuế đã GIẢM trong nửa đầu thời kỳ hậu chiến (khi tỷ trọng lương tăng) và TĂNG trong kỷ nguyên tân tự do (khi lao động mất đất, phương trình 17.6) — từ góc nhìn này, bất bình đẳng thu nhập TRƯỚC thuế rõ ràng PHẢN ỨNG với các quá trình XÃ HỘI, và do đó chính là nơi ĐÚNG ĐẮN để bắt đầu phân tích chính sách. Điểm nổi bật thứ hai: Piketty bày tỏ hy vọng về "các thể chế chính trị có thể điều tiết chủ nghĩa tư bản gia trưởng toàn cầu hiện nay một cách CÔNG BẰNG lẫn HIỆU QUẢ". Người ta hoàn toàn có thể lập luận ngược lại: chính sự bất bình đẳng và thiếu dân chủ ở quy mô toàn cầu lại được HỖ TRỢ VÀ TIẾP TAY bởi chính các thể chế chính trị và lợi ích của "các nền dân chủ" trong chủ nghĩa tư bản gia trưởng đó.</p>

      ["Phê phán chính trị: nơi bắt đầu phân tích chính sách","The political critique: where to start policy analysis","Bất bình đẳng thu nhập TRƯỚC thuế phản ứng trực tiếp với các quá trình xã hội (tỷ trọng lương-lợi nhuận) — đây mới là điểm khởi đầu đúng đắn, thay vì chỉ tập trung thu nhập sau thuế như Piketty."]

  {
    id:"phattrienkemphattrien17", n:"6", label:"Phát triển Toàn cầu",
    title:"Phát triển và Kém Phát triển: Tổng kết Toàn cầu", eng:"V. Development and Underdevelopment",
    body:`
      <p class="lede">Chương — và cuốn sách — khép lại bằng việc mở rộng toàn bộ khung phân tích ra bối cảnh phát triển toàn cầu, nơi mọi yếu tố cụ thể càng trở nên nổi bật hơn.</p>
      <h3>Toàn cầu hóa: bối cảnh lịch sử không thể tách rời</h3>
      <p>Chi phí vận chuyển, thuế, và thuế quan có ảnh hưởng lớn hơn tới tính di động của hàng hóa và tư bản, trong khi lịch sử, văn hóa, và các hạn chế quốc gia đóng vai trò lớn hơn nhiều trong việc định hình tính di động của LAO ĐỘNG. Bối cảnh TỰ THÂN cực kỳ quan trọng: toàn cầu hóa gắn liền với thực dân hóa, vũ lực, cướp bóc, chế độ nô lệ, tàn sát các dân tộc bản địa, sự hủy diệt có chủ đích các đối thủ cạnh tranh tiềm năng, và một sự chuyển giao của cải khổng lồ vào các nước giàu.</p>
      <div class="debate-box">
        <div class="dh">CHÍNH THỐNG vs DỊ GIÁO VỀ TOÀN CẦU HÓA — CẢ HAI ĐỀU SAI LẦM NHƯ NHAU</div>
        <div class="db">Kinh tế học chính thống và các đồng minh trong các thể chế quốc tế đưa ra tầm nhìn về cạnh tranh hoàn hảo và kết cục vĩ mô lý tưởng để biện minh cho sự phụ thuộc nhiều hơn vào thị trường, "linh hoạt hóa" thị trường lao động (cắt giảm công đoàn, tăng quyền lực chủ lao động), tư nhân hóa doanh nghiệp nhà nước, và mở cửa thị trường nội địa cho tư bản/hàng hóa nước ngoài. Ngược lại, truyền thống dị giáo thường lập luận cạnh tranh tự do KHÔNG còn tồn tại nữa, nên lý thuyết mậu dịch tự do làm nền tảng cho tân tự do KHÔNG còn phù hợp. Shaikh đã lập luận DÀI (ch.7-8, 11): phản ứng dị giáo này mắc SAI LẦM khi nghĩ rằng cạnh tranh hoàn hảo và lợi thế so sánh TỪNG BAO GIỜ áp dụng được. Việc chỉnh sửa cạnh tranh hoàn hảo bằng cách thêm các "khiếm khuyết" khác nhau chỉ TRÓI BUỘC lý thuyết dị giáo vào chính khung mà nó tìm cách lật đổ. KHÔNG có khiếm khuyết nào mà không có hoàn hảo, và KHÔNG hề có sự hoàn hảo nào cả (chương 7-8, 11).</div>
      </div>
      <h3>Phát triển thành công: bàn tay hữu hình của nhà nước, không phải "phép màu thị trường"</h3>
      <div class="stat-row">
        <div class="stat-box"><div class="val">14,4% → 34,1%</div><div class="lbl">Tỷ trọng xuất khẩu các nước đang phát triển (DC) trong thương mại thế giới, 1965 → 2006</div></div>
        <div class="stat-box"><div class="val">Gấp 3 lần</div><div class="lbl">Tỷ trọng sản xuất công nghiệp toàn cầu của DC, 1970 → 2005</div></div>
      </div>
      <p>Nhưng đây KHÔNG phải "phép màu thị trường" — mà "phần lớn nhờ các chiến lược phát triển và chính sách kinh tế thời hậu thuộc địa đã tạo điều kiện ban đầu và đặt nền móng thiết yếu ở các nước công nghiệp hóa muộn. Các chiến lược công nghiệp hóa THAY THẾ NHẬP KHẨU thường bị chỉ trích đã đóng góp then chốt trong quá trình đuổi kịp này... vai trò của nhà nước là quyết định. Công nghiệp hóa không phải chuyện 'làm đúng giá cả' mà là chuyện 'làm đúng can thiệp nhà nước'. Ngay cả ở các nước Đông Á nhỏ, thường được viện dẫn như câu chuyện thành công, BÀN TAY HỮU HÌNH của nhà nước hiện diện rõ ràng hơn nhiều so với bàn tay vô hình của thị trường" (Nayyar 2009).</p>
      <h3>Lợi thế chi phí tuyệt đối: nền tảng cho cả phát triển lẫn di động tư bản</h3>
      <p>Điểm quan trọng: bảo hộ và can thiệp nhà nước chỉ dẫn tới thành công trên thị trường thế giới nếu chúng CUỐI CÙNG tạo ra được các nhà sản xuất CẠNH TRANH QUỐC TẾ. Và để điều đó vận hành, cần hiểu: cạnh tranh quốc tế vận hành theo CÙNG cách như cạnh tranh nội địa — lợi thế chi phí TUYỆT ĐỐI chi phối vì cạnh tranh quốc tế ưu ái nhà sản xuất chi phí THẤP (chương 11). Quan hệ nghịch giữa lương và lợi nhuận (chương 14) là nền tảng cho tính di động của tư bản đi tìm lương thấp hơn và tài nguyên rẻ hơn — và cho việc nó liên tục viện tới chính quyền địa phương, mạng lưới thân tộc/tôn giáo, và thậm chí cả nhà nước-dân tộc để thúc đẩy lợi ích của mình. Không điều nào trong số này cần thiết nếu KHÔNG có áp lực cạnh tranh phát ra từ trường hấp dẫn của cạnh tranh toàn cầu.</p>
      <h3>Phát triển: hai chia rẽ lớn — thương mại và vĩ mô</h3>
      <p>Chia rẽ lớn THỨ HAI trong tài liệu phát triển là giữa lý thuyết vĩ mô chính thống và dị giáo. Đối mặt sự phi lý của các mô hình toàn dụng lao động-kỳ vọng duy lý, có vẻ hợp lý khi chuyển sang các mô hình độc quyền-markup về thất nghiệp do thiếu cầu (Baghirathan, Rada, và Taylor 2004). Trong lý thuyết hậu-Keynesian, doanh nghiệp được cách ly khỏi cạnh tranh và áp lực cầu cá nhân có thể tạo ra lợi nhuận mong muốn qua markup phù hợp — hệ quả tổng hợp: chính sách tài khóa-tiền tệ phù hợp CÓ THỂ đưa nhà nước tới gần toàn dụng lao động. Nhưng ta đã thấy các chính sách như vậy THẤT BẠI ngay cả ở các nước phát triển (chương 12). Lập luận cổ điển: cạnh tranh TẠO RA và DUY TRÌ một bể lao động thất nghiệp "bình thường", nên nỗ lực bơm cầu nhằm xóa bỏ thất nghiệp sẽ KHÔNG thành công TRỪ PHI đi kèm chính sách nâng năng suất NHANH HƠN lương thực đủ để bù đắp bất kỳ hiệu ứng tiêu cực nào lên khả năng sinh lời — tức TRỪ PHI ngăn chi phí lao động đơn vị thực tăng (chương 14). Tiêu chí cạnh tranh QUỐC TẾ cũng tương tự, chỉ khác: chi phí lao động đơn vị nói chung phải giảm ĐỦ NHANH để vượt lên trước đối thủ cạnh tranh quốc tế — chính xác như những câu chuyện phát triển thành công quá khứ VÀ hiện tại đã chứng minh.</p>
      <h3>Hai hiệu ứng của hiện đại hóa, và số phận các nước lớn</h3>
      <p>Hiện đại hóa nhắm tới tăng năng suất và hạ chi phí có HAI hiệu ứng tiềm năng: MỞ RỘNG thị trường qua sản phẩm rẻ hơn, và THAY THẾ lao động qua cơ giới hóa. Để hiệu ứng việc làm tổng thể là DƯƠNG, hiệu ứng trước phải LẤN ÁT hiệu ứng sau. Các nước NHỎ so với thị trường thế giới (như Nhật Bản rồi Hàn Quốc) có thể hưởng lợi nhiều tới mức duy trì thị trường lao động thắt chặt khá lâu bất chấp năng suất tăng nhanh. Nhưng ở các nước LỚN như Trung Quốc và Ấn Độ, tăng trưởng THỊ TRƯỜNG NỘI ĐỊA cuối cùng phải đóng vai trò chính — dưới chế độ tiền pháp định hiện đại, điều này có thể được TĂNG CƯỜNG mạnh mẽ qua việc tạo sức mua mới dựa trên nợ trong/ngoài nước (công/tư), trong đó dòng vốn quốc tế đóng vai trò lớn. Thật vậy, tài chính RẺ như một phương tiện tăng trưởng chính là "dấu ấn đặc trưng" của kỷ nguyên tân tự do (chương 14-15) — nhưng khủng hoảng đã chấm dứt phần lớn điều đó, không chỉ ở thế giới đang phát triển mà ngay cả ở trung tâm (chương 16). Ấn Độ nay vật lộn với lạm phát, tăng trưởng chậm lại, lãi suất cao, thị trường việc làm suy yếu; Trung Quốc với giá cả tăng, tín dụng quá mức, bong bóng nhà ở đang xẹp; ngay cả Nhật Bản — hình mẫu công nghiệp hóa hiện đại — vẫn mắc kẹt trong trì trệ từ thập niên 1990.</p>

  {sec:"Quy luật Hình mẫu & Sóng Dài",q:"Theo J. Doyne Farmer, khác biệt phương pháp luận cơ bản giữa kinh tế học lý thuyết và vật lý học là gì?",a:"Kinh tế học lý thuyết dùng phương pháp TỪ TRÊN XUỐNG (giả thuyết và chặt chẽ toán học trước, xác nhận thực nghiệm sau); vật lý học dùng phương pháp Newton TỪ DƯỚI LÊN (giả thuyết suy ra từ hiện tượng, rồi tổng quát hóa qua quy nạp)."},
  {sec:"Quy luật Hình mẫu & Sóng Dài",q:"Shaikh dự đoán điều gì từ năm 2003 dựa trên phân tích sóng dài, và kết quả ra sao?",a:"Ông dự đoán cuộc khủng hoảng tiếp theo sẽ bắt đầu 2008-2009 và kéo dài tới 2018, dựa trên độ dài sóng trung bình khớp với đỉnh dữ liệu 2000 — một dự đoán thô sơ nhưng \u201cđáng chú ý hiệu quả\u201d."},
  {sec:"Bình quân hóa & Phân phối",q:"Vì sao lương thực không đơn giản như giá hàng hóa thông thường trong lý thuyết cổ điển?",a:"Năng lực lao động được tư bản SỬ DỤNG nhưng KHÔNG sản xuất, và thuộc về một chủ thể chủ động (người lao động) — nhà tuyển dụng phải vươn ra ngoài phạm vi sản xuất tư bản và đối mặt phản ứng/kháng cự của người lao động."},
  {sec:"Bình quân hóa & Phân phối",q:"Theo Botwinick, vì sao tư bản điều tiết trong ngành thâm dụng vốn có xu hướng trả lương cao hơn?",a:"Vì tỷ suất lợi nhuận của các tư bản điều tiết được san bằng giữa các ngành, nên ngành thâm dụng vốn phải có biên lợi nhuận cao hơn — giúp họ dễ hấp thụ và chịu đựng tăng lương hơn (chi phí lao động chiếm tỷ trọng nhỏ hơn tổng chi phí)."},
  {sec:"Vật lý Kinh tế: Phân phối",q:"Lý thuyết \u201cHai Giai cấp\u201d của Kinh tế Vật lý (EPTC) của Yakovenko phát biểu điều gì về phân phối thu nhập?",a:"Thu nhập LAO ĐỘNG xấp xỉ tuân theo phân phối MŨ (nhiệt); thu nhập TÀI SẢN tuân theo phân phối PARETO (siêu nhiệt) — được xác nhận mạnh mẽ qua nhiều năm dữ liệu IRS Mỹ và nhiều nước khác."},

  {sec:"Vật lý Kinh tế: Phân phối",q:"Shaikh, Papanikolaou, và Weiner (2014) phát hiện điều gì đáng ngạc nhiên khi kiểm định EPTC theo nhóm giới tính-chủng tộc?",a:"Dù các nhóm (Nam/Nữ, Da trắng/Mỹ gốc Phi) có thu nhập BÌNH QUÂN khác nhau đáng kể, phân phối thu nhập TRƯỚC THUẾ trong MỖI nhóm riêng lẻ vẫn khá gần phân phối mũ ở mọi năm 1996-2008."},
  {sec:"Bất bình đẳng & Lương XH",q:"Tỷ trọng thu nhập của Top 1% dân số Mỹ thay đổi thế nào từ 1982 tới 2012, và tốc độ tăng thu nhập của họ so với 99% còn lại ra sao?",a:"Tăng từ 10% lên 23% (tăng 130%); thu nhập bình quân của họ tăng nhanh gấp 13 LẦN so với 99% còn lại giai đoạn 1993-2012."},
  {sec:"Bất bình đẳng & Lương XH",q:"Công thức Gini tổng thể của Shaikh (phương trình 17.6) nói gì?",a:"Γ = 0,50 × (1 + tỷ trọng thu nhập tài sản trên tổng thu nhập) — bất bình đẳng tổng thể phụ thuộc HOÀN TOÀN vào tỷ số thu nhập tài sản/lao động, một kết quả cổ điển nền tảng."},
  {sec:"Bất bình đẳng & Lương XH",q:"Phát hiện gây ngạc nhiên nhất về \u201clương xã hội ròng\u201d ở các nước OECD là gì?",a:"Ngay cả ở nhà nước phúc lợi mạnh nhất (Thụy Điển, chỉ 1,2% GDP), chi tiêu xã hội và thuế chủ yếu PHÂN PHỐI LẠI mức sống lao động (giữa nhóm, qua thời gian) hơn là NÂNG mức sống trung bình — về cơ bản, lao động tự trả cho phúc lợi của chính mình."},
  {sec:"Đối thoại với Piketty",q:"Vì sao Shaikh cho rằng luận điểm r &gt; g của Piketty là \u201ckỳ lạ\u201d từ góc nhìn cổ điển?",a:"Vì tỷ suất lợi nhuận thông thường LUÔN LỚN hơn tốc độ tăng trưởng thông thường (tỷ suất lợi nhuận = thặng dư/tư bản; tăng trưởng = phần tái đầu tư của thặng dư/tư bản) — nếu logic Piketty đúng, bất bình đẳng phải tăng KHÔNG NGỪNG, mâu thuẫn lịch sử thực tế."},
  {sec:"Đối thoại với Piketty",q:"Vấn đề kỹ thuật cốt lõi trong cách Piketty đo tỷ suất lợi nhuận là gì?",a:"Ông loại trừ lãi vốn, lãi vay, tiền thuê khỏi định nghĩa LỢI NHUẬN nhưng lại tính chúng vào TƯ BẢN — khiến tỷ suất lợi nhuận cực kỳ nhạy cảm với biến động giá tài sản, giải thích vì sao nó TĂNG trong suy thoái và GIẢM trong các cơn bùng nổ."},
  {sec:"Phát triển Toàn cầu",q:"Theo Nayyar (2009) được Shaikh trích dẫn, điều gì thực sự thúc đẩy tăng trưởng công nghiệp của các nước đang phát triển, chứ không phải \u201cphép màu thị trường\u201d?",a:"Các chiến lược phát triển và chính sách công nghiệp hậu thuộc địa có chọn lọc (bao gồm công nghiệp hóa thay thế nhập khẩu) — \u201cbàn tay hữu hình của nhà nước\u201d hiện diện rõ ràng hơn nhiều so với \u201cbàn tay vô hình của thị trường\u201d, ngay cả ở các câu chuyện thành công Đông Á."},
  {sec:"Phát triển Toàn cầu",q:"Câu hỏi cuối cùng khép lại toàn bộ cuốn sách của Shaikh là gì?",a:"Với gần 200 triệu người thất nghiệp và gần 900 triệu lao động nghèo cùng cực trên toàn thế giới, liệu tăng trưởng tư bản chủ nghĩa có thể vượt qua bước tiến không ngừng của cơ giới hóa và hấp thụ dân số lao động mới — dù mang hình thức nào, nó vẫn bị ràng buộc bởi các quy luật của cạnh tranh THỰC mà nó dựa vào."}

/* =========================================================
   RENDER — FLASHCARDS
   ========================================================= */
var fcOrder = FLASHCARDS.map(function(_, i){ return i; });
var fcIndex = 0;
var fcFlipped = false;

function renderFlashcard(){
  var card = FLASHCARDS[fcOrder[fcIndex]];
  document.getElementById('fcTag').textContent = card.sec;
  document.getElementById('fcQ').textContent = card.q;
  document.getElementById('fcA').textContent = card.a;
  document.getElementById('fcProgress').textContent = 'Thẻ ' + (fcIndex+1) + ' / ' + FLASHCARDS.length;
  fcFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
}
document.getElementById('flashcard').addEventListener('click', function(){
  fcFlipped = !fcFlipped;
  this.classList.toggle('flipped', fcFlipped);
});
document.getElementById('fcFlip').addEventListener('click', function(){
  fcFlipped = !fcFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', fcFlipped);
});
document.getElementById('fcPrev').addEventListener('click', function(){
  fcIndex = (fcIndex - 1 + fcOrder.length) % fcOrder.length;
  renderFlashcard();
});
document.getElementById('fcNext').addEventListener('click', function(){
  fcIndex = (fcIndex + 1) % fcOrder.length;
  renderFlashcard();
});
document.getElementById('fcShuffle').addEventListener('click', function(){
  for(var i = fcOrder.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i+1));
    var tmp = fcOrder[i]; fcOrder[i] = fcOrder[j]; fcOrder[j] = tmp;
  }
  fcIndex = 0;
  renderFlashcard();
});
renderFlashcard();

/* =========================================================
   RENDER — QUIZ
   ========================================================= */
var quizAnswers = {};
var quizArea = document.getElementById('quizArea');

function renderQuiz(){
  var html = QUIZ.map(function(item, qi){
    var opts = item.opts.map(function(opt, vi){
      return '<div class="q-opt" data-qi="'+qi+'" data-qv="'+vi+'">'+opt+'</div>';
    }).join('');
    return '<div class="q-block" id="qblock-'+qi+'">'+
      '<div class="q-text">'+(qi+1)+'. '+item.q+'</div>'+
      '<div class="q-opts">'+opts+'</div>'+
      '<div class="q-explain" id="qexplain-'+qi+'">'+item.explain+'</div>'+
      '</div>';
  }).join('');
  html += '<div style="text-align:center;margin-top:20px;"><button class="btn primary" id="quizFinish">Xem kết quả</button> <button class="btn" id="quizReset">Làm lại</button></div>';
  html += '<div id="quizResult"></div>';
  quizArea.innerHTML = html;

  quizArea.addEventListener('click', quizClickHandler);
  document.getElementById('quizFinish').addEventListener('click', showQuizScore);
  document.getElementById('quizReset').addEventListener('click', function(){
    quizAnswers = {};
    renderQuiz();
  });
}

function quizClickHandler(e){
  var opt = e.target.closest('.q-opt');
  if(!opt) return;
  var qi = parseInt(opt.dataset.qi, 10);
  var qv = parseInt(opt.dataset.qv, 10);
  quizAnswers[qi] = qv;
  var block = document.getElementById('qblock-'+qi);
  block.querySelectorAll('.q-opt').forEach(function(o){
    o.classList.remove('selected','correct','incorrect');
  });
  var correctIdx = QUIZ[qi].correct;
  block.querySelectorAll('.q-opt').forEach(function(o){
    var v = parseInt(o.dataset.qv,10);
    if(v === correctIdx) o.classList.add('correct');
    else if(v === qv) o.classList.add('incorrect');
  });
  document.getElementById('qexplain-'+qi).classList.add('show');
  updateQuizProgress();
}

function updateQuizProgress(){
  var answered = Object.keys(quizAnswers).length;
  var pct = Math.round(100*answered/QUIZ.length);
  document.getElementById('quizProgressFill').style.width = pct+'%';
}

function showQuizScore(){
  var correct = 0;
  QUIZ.forEach(function(item, qi){
    if(quizAnswers[qi] === item.correct) correct++;
  });
  var pct = Math.round(100*correct/QUIZ.length);
  document.getElementById('quizResult').innerHTML =
    '<div class="quiz-score"><div class="num">'+correct+'/'+QUIZ.length+'</div>'+
    '<div class="lbl">('+pct+'%) — '+ (pct>=80?'Nắm rất vững nội dung!':pct>=50?'Khá tốt, xem lại vài phần.':'Nên đọc lại các phần liên quan.') +'</div></div>';
}
renderQuiz();

/* =========================================================
   NOTES PANEL
   ========================================================= */
var notesFab = document.getElementById('notesFab');
var notesPanel = document.getElementById('notesPanel');
var notesBackdrop = document.getElementById('notesBackdrop');
var notesBody = document.getElementById('notesBody');
var notesTitle = document.getElementById('notesTitle');
var notesFoot = document.getElementById('notesFoot');
var currentNoteTab = 'nhapmontongket17';
var LS_PREFIX = 'shaikh_ch17_note_';

function isMobile(){ return window.matchMedia('(max-width:640px)').matches; }

function noteLabelFor(id){
  var s = SECTIONS.filter(function(x){return x.id===id;})[0];
  if(s) return s.n + '. ' + s.label;
  if(id === 'gloss') return 'Thuật ngữ';
  if(id === 'flashcards') return 'Thẻ ghi nhớ';
  if(id === 'quiz') return 'Quiz';
  return id;
}

function openNotesFor(id){
  currentNoteTab = id;
  notesTitle.textContent = 'Ghi chú — ' + noteLabelFor(id);
  var saved = localStorage.getItem(LS_PREFIX + id) || '';
  notesBody.innerHTML = saved;
  updateNotesFoot();
}
function updateNotesFoot(){
  var len = notesBody.innerText.trim().length;
  notesFoot.textContent = len + ' ký tự · lưu tự động';
}
function saveCurrentNote(){
  localStorage.setItem(LS_PREFIX + currentNoteTab, notesBody.innerHTML);
  updateNotesFoot();
}
function openNotesPanel(){
  notesPanel.classList.add('open');
  if(isMobile()){ notesBackdrop.classList.add('show'); }
}
function closeNotesPanel(){
  notesPanel.classList.remove('open');
  notesBackdrop.classList.remove('show');
}
notesFab.addEventListener('click', function(){
  if(notesPanel.classList.contains('open')){
    closeNotesPanel();
  } else {
    openNotesFor(currentNoteTab);
    openNotesPanel();
  }
});
document.getElementById('notesClose').addEventListener('click', closeNotesPanel);
notesBackdrop.addEventListener('click', closeNotesPanel);
notesBody.addEventListener('input', saveCurrentNote);
document.querySelectorAll('.notes-toolbar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    var cmd = btn.dataset.cmd;
    notesBody.focus();
    if(cmd.indexOf(':')>-1){
      var parts = cmd.split(':');
      document.execCommand(parts[0], false, parts[1]);
    } else {
      document.execCommand(cmd, false, null);
    }
    saveCurrentNote();
  });
});

activateTab(ALL_TAB_IDS[0]);
</script>
