<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<title>Shaikh — Capitalism: Competition, Conflict, Crises — Chương 4</title>
<style>
:root{
  --bg:#f2ede0;
  --panel:#fffdf8;
  --panel-2:#eef1e8;
  --ink:#211d16;
  --ink-soft:#4c473b;
  --muted:#847b68;
  --line:#dcd0ac;
  --primary:#1f3b5c;
  --primary-dark:#152944;
  --primary-tint:#e1e8ef;
  --gold:#a67f2c;
  --gold-light:#d6b263;
  --green:#2f6b3f;
  --green-tint:#e3ede4;
  --red:#8a2f2f;
  --red-tint:#f0e2e2;
  --dark-bg:#141b22;
  --dark-panel:#1d2731;
  --dark-ink:#eef1e6;
  --dark-line:#324256;
  --shadow:0 6px 24px rgba(20,27,34,0.12);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1000px;margin:0 auto;padding:0 16px 80px;}

.hero{padding:32px 16px 20px;text-align:center;border-bottom:3px double var(--gold);margin-bottom:18px;background:radial-gradient(ellipse at top, rgba(166,127,44,0.08), transparent 60%);}
.hero .kicker{font-family:Georgia,serif;letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700;}
.hero h1{font-size:clamp(22px,4.6vw,34px);margin:8px 0 4px;color:var(--primary-dark);letter-spacing:.005em;line-height:1.25;}
.hero .subtitle{font-size:14.5px;color:var(--ink-soft);font-style:italic;}
.hero .meta{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hero .meta span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);}
.hero .meta a.meta-link{color:var(--primary);text-decoration:none;font-weight:600;}
.hero .meta a.meta-link:hover{background:var(--primary-tint);}


.tabbar-wrap{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:8px;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tabbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;}
.tabbar::-webkit-scrollbar{height:5px;}
.tabbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.tab-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
.tab-btn .n{color:var(--gold);font-weight:800;margin-right:5px;}
.tab-btn:hover{border-color:var(--gold);}
.tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow);}
.tab-btn.active .n{color:var(--gold-light);}

.panel{display:none;animation:fadein .25s ease;}
.panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);}
.card h2{margin:0 0 4px;font-size:21px;color:var(--primary-dark);}
.card .eng-title{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:16px;letter-spacing:.02em;}
.card h3{font-size:15.5px;color:var(--primary);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px;}
.card p{margin:0 0 12px;color:var(--ink);}
.card p:last-child{margin-bottom:0;}
.lede{font-size:16px;color:var(--ink-soft);border-left:3px solid var(--gold);padding-left:14px;margin:6px 0 18px;}

.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0;}
.concept{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.concept .term{font-weight:700;color:var(--primary-dark);font-size:13px;display:block;margin-bottom:4px;}
.concept .term .en{color:var(--gold);font-weight:600;font-size:11px;font-style:italic;}
.concept p{font-size:13px;margin:0;color:var(--ink-soft);}

.figure-note{background:var(--primary-tint);border:1px dashed var(--primary);border-radius:10px;padding:12px 15px;font-size:12.5px;color:var(--primary-dark);margin:14px 0;}
.figure-note b{color:var(--primary-dark);}

.debate-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0;}
.debate-box .dh{background:var(--primary);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.03em;}
.debate-box .db{padding:13px 15px;font-size:13px;color:var(--ink-soft);}
.debate-box .names{color:var(--gold);font-weight:700;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0;}
.stat-box{background:var(--primary-dark);color:#fff;border-radius:10px;padding:13px 14px;text-align:center;}
.stat-box .val{font-size:20px;font-weight:800;color:var(--gold-light);}
.stat-box .lbl{font-size:10.5px;color:#dbe4ee;margin-top:3px;line-height:1.3;}

.dark-panel{background:var(--dark-bg);color:var(--dark-ink);border-radius:12px;padding:20px;margin:16px 0;border:1px solid var(--dark-line);}
.dark-panel h4{margin:0 0 12px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;}
.flow{display:flex;flex-direction:column;gap:0;}
.flow-step{background:var(--dark-panel);border:1px solid var(--dark-line);border-radius:8px;padding:10px 14px;font-size:12.5px;position:relative;}
.flow-step b{color:var(--gold-light);}
.flow-arrow{text-align:center;color:var(--gold);font-size:16px;padding:2px 0;}
.flow-branch{display:flex;gap:10px;margin:2px 0;flex-wrap:wrap;}
.flow-branch>div{flex:1;min-width:130px;}

.chart-panel{background:var(--dark-bg);border:1px solid var(--dark-line);border-radius:12px;padding:18px 18px 14px;margin:16px 0;}
.chart-panel h4{margin:0 0 2px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;}
.chart-panel .chart-sub{font-size:11px;color:#9fb0c2;margin-bottom:10px;font-style:italic;}
.chart-panel svg{width:100%;height:auto;display:block;}

/* ===== Real/reference chart (photo, not illustrative SVG) ===== */
.chart-real{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:10px 0 18px;}
.chart-real-badge{display:inline-block;font-family:Georgia,serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);border-radius:4px;padding:3px 9px;margin-bottom:9px;}
.chart-real img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);}
.chart-real figcaption{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.55;font-style:italic;}

.chart-note{font-size:10.5px;color:#8496a8;margin-top:6px;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dark-ink);}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:12px;height:3px;display:inline-block;border-radius:2px;}
.chart-grid2{display:grid;grid-template-columns:1fr;gap:14px;}
.chart-grid3{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:680px){.chart-grid2{grid-template-columns:1fr 1fr;}.chart-grid3{grid-template-columns:1fr 1fr 1fr;}}

.bar-chart{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-label{width:170px;font-size:11.5px;color:var(--dark-ink);flex-shrink:0;}
.bar-track{flex:1;background:#2a3644;border-radius:6px;overflow:hidden;height:22px;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;color:#241d10;font-weight:700;}

.gloss-item{border-bottom:1px solid var(--line);padding:12px 0;}
.gloss-item:last-child{border-bottom:none;}
.gloss-term{font-weight:700;color:var(--primary-dark);font-size:14px;}
.gloss-term .en{color:var(--gold);font-weight:600;font-size:11.5px;font-style:italic;margin-left:6px;}
.gloss-def{font-size:13px;color:var(--ink-soft);margin-top:3px;}

.gloss-extra-row{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.gloss-extra-row .en{flex:1;color:var(--ink-soft);font-style:italic;}
.gloss-extra-row .vi{flex:1;color:var(--primary-dark);font-weight:600;}


.fc-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.fc-progress{font-size:13px;color:var(--muted);}
.fc-stage{display:flex;justify-content:center;margin:10px 0 20px;perspective:1400px;}
.flashcard{width:100%;max-width:560px;height:270px;position:relative;cursor:pointer;}
.flashcard .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flashcard.flipped .fc-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);}
.fc-front{background:var(--panel);}
.fc-front .fc-tag{position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;font-weight:700;}
.fc-front .fc-q{font-size:17px;color:var(--ink);font-weight:600;}
.fc-back{background:var(--primary);color:#fff;transform:rotateY(180deg);}
.fc-back .fc-a{font-size:14px;}
.fc-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;}
.fc-nav{display:flex;justify-content:center;gap:10px;margin-top:16px;}
.btn{border:1px solid var(--primary);background:var(--panel);color:var(--primary-dark);font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--primary);color:#fff;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-dark);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.quiz-progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--primary));transition:width .3s;}
.q-block{margin-bottom:14px;}
.q-text{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;}
.q-opts{display:flex;flex-direction:column;gap:8px;}
.q-opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer;transition:all .15s;}
.q-opt:hover{border-color:var(--gold);}
.q-opt.selected{border-color:var(--primary);background:var(--primary-tint);}
.q-opt.correct{border-color:var(--green);background:var(--green-tint);color:#1c4a28;font-weight:700;}
.q-opt.incorrect{border-color:var(--primary);background:#f3e6e6;color:#7a2020;font-weight:700;}
.q-explain{margin-top:10px;font-size:12.5px;color:var(--ink-soft);background:var(--panel-2);border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 8px 8px 0;display:none;}
.q-explain.show{display:block;}
.quiz-score{text-align:center;padding:30px 20px;}
.quiz-score .num{font-size:46px;font-weight:800;color:var(--primary);}
.quiz-score .lbl{font-size:14px;color:var(--muted);margin-bottom:18px;}

.notes-fab{position:fixed;right:22px;bottom:22px;z-index:50;background:var(--primary);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 8px 20px rgba(21,41,68,0.35);cursor:pointer;display:flex;align-items:center;gap:7px;}
.notes-backdrop{position:fixed;inset:0;background:rgba(15,18,22,0.45);z-index:60;display:none;}
.notes-backdrop.show{display:block;}
.notes-panel{position:fixed;top:0;right:0;height:100%;width:380px;max-width:88vw;background:var(--panel);z-index:70;box-shadow:-10px 0 30px rgba(0,0,0,0.2);transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;}
.notes-panel.open{transform:translateX(0);}
.notes-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.notes-head h4{margin:0;color:var(--primary-dark);font-size:14.5px;}
.notes-head .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.notes-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;}
.notes-toolbar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.notes-toolbar button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;width:30px;height:30px;cursor:pointer;font-family:Georgia,serif;font-size:14px;color:var(--ink);}
.notes-toolbar button:hover{border-color:var(--gold);}
.notes-body{flex:1;padding:16px 18px;overflow-y:auto;outline:none;font-size:14px;line-height:1.7;}
.notes-body:empty:before{content:"Ghi chú của bạn cho phần này... (tự động lưu)";color:var(--muted);font-style:italic;}
.notes-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);}

@media (max-width:640px){
  .hero{padding:22px 12px 14px;}
  .card{padding:16px 15px;}
  .flashcard{height:250px;}
  .notes-panel{width:100%;max-width:100%;}
}
@media print{
  .tabbar-wrap,.notes-fab,.notes-panel,.notes-backdrop,.fc-nav,.q-opts{display:none !important;}
  .panel{display:block !important;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
}
</style>
</head>
<body>

<script>
/* =========================================================
   MINI CHART HELPER
   ========================================================= */
function sparkPath(values, w, h, pad){
  var n = values.length;
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  var range = (max - min) || 1;
  var pts = values.map(function(v, i){
    var x = pad + (i/(n-1)) * (w - 2*pad);
    var y = pad + (1 - (v - min)/range) * (h - 2*pad);
    return [x,y];
  });
  var d = 'M ' + pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L ');
  var area = d + ' L ' + pts[pts.length-1][0].toFixed(1) + ',' + (h-pad) + ' L ' + pts[0][0].toFixed(1) + ',' + (h-pad) + ' Z';
  return {line:d, area:area, pts:pts};
}
function renderLineChart(containerId, series, opts){
  opts = opts || {};
  var w = opts.w || 400, h = opts.h || 120, pad = opts.pad || 8;
  var svg = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  series.forEach(function(s){
    var r = sparkPath(s.values, w, h, pad);
    if(s.fill !== false){
      svg += '<path d="'+r.area+'" fill="'+(s.color||'#a67f2c')+'" opacity="0.12"></path>';
    }
    svg += '<path d="'+r.line+'" fill="none" stroke="'+(s.color||'#a67f2c')+'" stroke-width="'+(s.width||2)+'" vector-effect="non-scaling-stroke"></path>';
  });
  svg += '</svg>';
  var el = document.getElementById(containerId);
  if(el) el.innerHTML = svg;
}

/* =========================================================
   DATA — SECTIONS (tabs 0-6)
   ========================================================= */
var SECTIONS = [
  {
    id:"gioithieu", n:"0", label:"Lao động & Đầu tư",
    title:"Lao động Chủ động và Hai loại Đầu tư", eng:"I-II.1 — Introduction; Circulating versus Fixed Investment",
    body:`
      <p class="lede">Thoạt nhìn, CNTB có vẻ là một hệ thống trao đổi tổng quát — kinh tế học tân cổ điển trình bày trao đổi như nguyên lý tổ chức trung tâm của xã hội tư bản, coi sản xuất chỉ là phương tiện "trao đổi gián tiếp" giữa hiện tại và tương lai. Nhưng cách nhìn cổ điển hoàn toàn khác: dưới lớp vỏ lấp lánh của trao đổi là những "đường hầm ngầm" nơi diễn ra cuộc đấu tranh vĩnh cửu bên trong sản xuất — quyết định lao động có thể bị bắt làm việc bao lâu và cực nhọc đến đâu.</p>
      <p>Sản xuất CẦN THỜI GIAN, nên phải đi trước việc phân phối sản phẩm xã hội. Đặc trưng cổ điển: lao động là TÁC NHÂN CHỦ ĐỘNG vận hành lên nguyên vật liệu bằng công cụ để tạo ra sản phẩm ở một thời điểm sau đó — khác hẳn phương pháp luận "đầu vào-thành-đầu ra" thụ động, phi thời gian của hầu hết các trường phái khác (tân cổ điển: lao động và tư bản là "đầu vào" đồng đẳng cho ra sản lượng tức thời; input-output: lao động/thời gian sản xuất biến mất khỏi tầm nhìn; Kaleckian/Keynesian: sản xuất là "hiện tượng phụ" phản ứng tức thời trước cầu).</p>
      <h3>Đầu tư lưu động và đầu tư cố định — hai vai trò hoàn toàn khác nhau</h3>
      <div class="concept-grid">
        <div class="concept"><span class="term">Đầu tư lưu động<span class="en">Circulating investment</span></span><p>Chi tiêu bổ sung cho nguyên vật liệu và lao động — MỤC ĐÍCH là tăng SẢN LƯỢNG. Điều chỉnh cung theo cầu thay đổi → không thể coi là "ngoại sinh" trong ngắn hạn.</p></div>
        <div class="concept"><span class="term">Đầu tư cố định<span class="en">Fixed investment</span></span><p>Mua sắm nhà xưởng, máy móc bổ sung — MỤC ĐÍCH là tăng NĂNG LỰC SẢN XUẤT (capacity). Điều chỉnh năng lực theo cầu → không thể coi là "ngoại sinh" trong dài hạn.</p></div>
      </div>
      <div class="figure-note"><b>Phê phán trực diện Keynes/Kalecki:</b> quan điểm chuẩn coi TOÀN BỘ đầu tư là biến ngoại sinh là "không thể đứng vững" — vì bản thân đầu tư lưu động và đầu tư cố định đã là những phản ứng nội sinh trước biến động cầu, chỉ khác nhau về việc chúng nhắm vào sản lượng hay năng lực. Hàm ý cho động lực học vĩ mô được bàn kỹ ở chương 13.</div>
      <p>Việc "thời gian sản xuất" biến mất khỏi hầu hết lý thuyết là vì chúng ngầm giả định một tình huống DỪNG (stationary) nơi mọi cân bằng lặp lại ở cùng mức — khiến thời gian dường như "không có hệ quả gì". Nhưng ảo giác này tan biến ngay khi xét đến mất cân bằng hoặc gián đoạn trong tái sản xuất — lúc đó thời gian sản xuất và các bộ đệm như tồn kho, tiền mặt trở nên then chốt cho động lực học thực tế.</p>

    body:`
      <p class="lede">Vì sản xuất cần thời gian, sản phẩm HOÀN THÀNH trong một năm khác với sản phẩm KHỞI TẠO trong năm đó — một phần nỗ lực năm nay sẽ thành tồn kho bán thành phẩm, trong khi một phần sản phẩm hoàn thành năm nay lại bắt nguồn từ sản xuất khởi tạo từ những năm trước. Đây là gốc rễ của sự khác biệt giữa hạch toán CỔ ĐIỂN (tập trung vào sản phẩm HOÀN THÀNH — vì đây mới là phương tiện hiện thực hóa lợi nhuận) và hạch toán QUY ƯỚC/NIPA (tập trung vào TỔNG SẢN XUẤT bao gồm cả thay đổi tồn kho).</p>

      <h3>Lao động sản xuất và phi sản xuất — ranh giới không phải hàng hóa/dịch vụ</h3>
      <p>Mọi hoạt động lao động đều có kết quả, nhưng không phải mọi kết quả lao động đều là SẢN PHẨM. Lao động sản xuất tạo ra sản phẩm MỚI; lao động phi sản xuất tạo ra các kết quả xã hội cần thiết khác — phân phối, quản trị, bảo vệ (cảnh sát, quân đội, bảo vệ tư nhân). Ranh giới này KHÔNG trùng với ranh giới hàng hóa/dịch vụ: một buổi hòa nhạc có cả nhạc công (lao động sản xuất — tạo ra buổi diễn) lẫn nhân viên soát vé/bảo vệ (lao động phi sản xuất — dù cũng là dịch vụ).</p>
      <div class="debate-box">
        <div class="dh">"LAO ĐỘNG BẢO VỆ" (GUARD LABOR) — MỘT CHỦ ĐỀ VẪN CÒN NÓNG</div>
        <div class="db">Dù khái niệm lao động phi sản xuất đã bị kinh tế học chính thống "xóa sổ" khỏi từ điển lý thuyết (mọi hoạt động có thể bán được đều được coi là "sản xuất"), nó vẫn tồn tại dai dẳng trong diễn ngôn thực tế. <span class="names">Thurow</span> nhận xét: "lính bảo vệ bảo vệ hàng hóa CŨ, [họ] không sản xuất hàng hóa mới vì không thêm gì vào sản lượng." Báo <i>New York Times</i> trích lời nhà kinh tế Harvard Richard Freeman: đi tới một cửa hàng giày ở Boston sẽ thấy ba bảo vệ tư nhân — "chúng ta đang thuê rất nhiều người về cơ bản không sản xuất ra gì cả."</div>

      <h3>Bằng chứng thực nghiệm: khoảng cách giữa hai cách đo</h3>
      <div class="stat-row">
        <div class="stat-box"><div class="val">95% → 84%</div><div class="lbl">Tỷ lệ Tổng sản phẩm cổ điển/GNP quy ước, Mỹ 1948→1989</div></div>
        <div class="stat-box"><div class="val">44% → 35%</div><div class="lbl">Tỷ lệ Thặng dư hoạt động ròng quy ước / Sản phẩm thặng dư cổ điển, 1948→1989</div></div>
      </div>
      <p>Vì hoạt động phi sản xuất không tạo thêm sản phẩm thặng dư, chi phí của chúng (cùng thuế lợi nhuận/thuế gián thu) phải được trích từ chính sản phẩm thặng dư đó. Khoảng cách giữa thước đo lợi nhuận "quy ước" (những gì còn lại sau khi trừ mọi hoạt động phi sản xuất) và thước đo "cổ điển" (tổng thặng dư thực tế) không những lớn mà còn NGÀY CÀNG DOÃNG RA theo thời gian — phản ánh sự phình to liên tục của khu vực tài chính, quản trị, quân sự, bảo vệ trong nền kinh tế Mỹ hiện đại.</p>

    body:`
      <p class="lede">Sản xuất có nhiều chiều kích cấu trúc và thời gian: sử dụng MỞ RỘNG (bao nhiêu máy vận hành, extensive utilization) khác sử dụng THÂM CANH (vận hành nhanh đến đâu, intensive utilization); và cả hai khác với việc SẮP XẾP CA KÍP (một ca 20 giờ, hay hai ca 10 giờ...). Độ dài và cường độ ngày làm việc luôn là chủ đề TRANH CHẤP gay gắt giữa chủ và thợ — nhưng lại thường biến mất khỏi các mô tả sản xuất chuẩn (hàm sản xuất biến đổi hoặc hệ số cố định).</p>
      <div class="debate-box">
        <div class="dh">"TÔI COI NHÂN VIÊN NHƯ MỘT CÁI MÁY"</div>
        <div class="db">Một nhà sản xuất Massachusetts, nghị sĩ, tuyên bố: "Tôi coi nhân viên của mình như một cái máy, dùng để phục vụ lợi ích của tôi, và khi họ già và không còn dùng được nữa, tôi vứt họ ra đường." Một quản đốc xưởng giày Massachusetts nói thẳng: "Tôi có thể lấy một thanh niên khỏe mạnh 18 tuổi, không tì vết, đặt vào một trong hai cái máy đó, và khiến anh ta bạc tóc năm 22 tuổi."</div>
      </div>
      <h3>Ba thế kỷ đấu tranh về ngày làm việc</h3>
      <div class="concept-grid">
        <div class="concept"><span class="term">Anh, TK18→19</span><p>Ngày làm 14-18 giờ phổ biến thập niên 1830-40s — nửa thế kỷ trước đó, ngày làm như vậy bị coi là "cực kỳ dài". Cường độ lao động cũng tăng cùng độ dài, tai nạn nhà máy/hầm mỏ tăng theo.</p></div>
        <div class="concept"><span class="term">Lao động trẻ em</span><p>Thủ tướng Anh William Pitt từng đề xuất trẻ em có thể bắt đầu làm việc từ 5 tuổi. Tới 1844, luật mới giới hạn trẻ em ở 6,5 giờ/ngày, phụ nữ/thanh niên 12 giờ/ngày, 69 giờ/tuần.</p></div>
        <div class="concept"><span class="term">Mỹ, cuối TK19</span><p>Ngày làm 10-15 giờ, nhiều nơi 7 ngày/tuần. Nô lệ ở các thuộc địa mía đường Pháp-Caribbe làm việc "chỉ" 9-10 giờ/ngày — ít hơn nhiều công nhân "tự do" thời đó.</p></div>
        <div class="concept"><span class="term">Nửa sau TK19 → nay</span><p>Tuần làm việc giảm dần từ 50-63 giờ (1850-80) xuống 8 giờ/ngày phổ biến ở các nước phát triển ngày nay — đạt được qua đấu tranh công đoàn, KHÔNG phải tự động từ tiến bộ kỹ thuật.</p></div>
      </div>
      <h3>Vẫn tiếp diễn đến hôm nay</h3>
      <p>Chuẩn 8 giờ/ngày ở cường độ được xã hội quy định là phổ biến tại các nước phát triển — nhưng bị vi phạm rộng rãi với người nhập cư/không giấy tờ. Bộ Lao động Mỹ từng truy tố các hãng may như Neiman-Marcus, Sears vì mua hàng từ một xưởng may "nô lệ hóa" công nhân Thái Lan ở El Monte, California: khoảng 60 công nhân làm việc tới 22 giờ/ngày, bị đe dọa cưỡng hiếp/giết nếu làm chậm, một số làm việc suốt 7 năm với 1.60 USD/giờ để "trả nợ" chi phí sang Mỹ.</p>
      <div class="stat-row">
        <div class="stat-box"><div class="val">$0.13–0.44</div><div class="lbl">Lương/giờ công nhân dệt may nhiều nước châu Á (khảo sát Powell-Skarbek)</div></div>
        <div class="stat-box"><div class="val">17 xu</div><div class="lbl">Trả cho công nhân TQ sản xuất một búp bê Bratz — bán tại Mỹ với giá $15.89</div></div>
        <div class="stat-box"><div class="val">13+ giờ</div><div class="lbl">Ca làm việc, 7 ngày/tuần, không bảo hiểm — phạt 3 ngày lương nếu nghỉ ốm</div></div>
      </div>
      <p>Bằng chứng thực nghiệm khẳng định: năng suất lao động thường TĂNG theo độ dài và cường độ ngày làm việc — nhưng đến một điểm nào đó, mệt mỏi khiến năng suất CHỮNG LẠI rồi GIẢM (minh họa hài hước kinh điển: cảnh dây chuyền lắp ráp trong <i>Modern Times</i> của Chaplin). Đây chính xác là khuôn mẫu thực nghiệm mà Shaikh dùng làm nền tảng cho toàn bộ phân tích sản xuất ở phần tiếp theo — KHÔNG phải "năng suất biên giảm dần" ngay từ đầu như giáo trình tân cổ điển giả định.</p>

    concepts:[
      ["Sử dụng mở rộng vs thâm canh","Extensive vs intensive utilization","Mở rộng: bao nhiêu máy đang vận hành. Thâm canh: mỗi máy vận hành nhanh/lâu đến đâu — hai chiều kích độc lập của việc sử dụng năng lực sản xuất."],
      ["Ngày làm việc là kết quả đấu tranh","Working day as a site of struggle","Độ dài/cường độ ngày làm việc không do kỹ thuật quyết định mà là kết quả tranh chấp lịch sử-xã hội liên tục giữa chủ và thợ — minh chứng bằng 3 thế kỷ dữ liệu lịch sử cụ thể."],
      ["Năng suất tăng rồi giảm theo giờ làm","Productivity rises then falls with hours","Khuôn mẫu thực nghiệm nền tảng: năng suất lao động tăng theo độ dài/cường độ ngày làm việc, đạt đỉnh, rồi giảm khi mệt mỏi vượt ngưỡng — khác hẳn giả định 'năng suất biên giảm dần ngay từ đầu' của tân cổ điển."]

  {
    id:"taichuyendoi", n:"3", label:"Tái chuyển đổi",
    title:"Tái chuyển đổi: Phá vỡ Hàm Sản xuất Tân cổ điển", eng:"III.3 / IV.1 — Re-switching Along the Production Possibilities Frontier",
    body:`
      <p class="lede">Với một máy có thể vận hành an toàn tối đa 20 giờ/ngày, câu hỏi đặt ra: đầu ra sẽ ra sao dọc theo MỘT ca làm việc duy nhất? Dựa trên bằng chứng thực nghiệm (năng suất tăng, đạt đỉnh, rồi giảm khi mệt mỏi), đường tổng sản lượng theo giờ làm việc sẽ tăng dần rồi CHỮNG LẠI, thậm chí ĐI XUỐNG sau giờ thứ 17 (ở cường độ tối đa) — nghĩa là đường này KHÔNG đơn điệu, nên không thể làm "hàm sản xuất" tân cổ điển chuẩn (vốn đòi hỏi tăng đơn điệu, lồi).</p>
      <h3>Ví dụ cụ thể: vì sao "tái chuyển đổi" phá vỡ mọi thứ</h3>
      <div class="dark-panel">
        <h4>Thí nghiệm tư duy: chia 20 giờ máy chạy thành các ca</h4>
        <div class="flow">
          <div class="flow-step">Một ca 20 giờ duy nhất → đầu ra ĐI XUỐNG sau giờ 17 → không đơn điệu, vi phạm yêu cầu của hàm sản xuất</div>
          <div class="flow-arrow">↓ khắc phục bằng cách cắt ca</div>
          <div class="flow-step">Ca <b>17 giờ + 3 giờ</b> (17:3) → đầu ra cao hơn, đường cong đơn điệu hơn — có vẻ là "đường giới hạn khả năng sản xuất" tốt hơn</div>
          <div class="flow-arrow">↓ nhưng xét ca ngược lại</div>
          <div class="flow-step">Ca <b>3 giờ + 17 giờ</b> (3:17) → PHẢI cho tổng sản lượng CÙNG một con số như 17:3 (vì sản lượng mỗi ca không phụ thuộc "giờ nào trong ngày") — nhưng đường đi của nó phải "vượt lên" đường 17:3 ở đâu đó để đạt cùng tổng</div>
          <div class="flow-arrow">↓</div>
          <div class="flow-step" style="border-color:var(--gold);"><b>TÁI CHUYỂN ĐỔI (re-switching):</b> hai đường 17:3 và 3:17 phải "đổi chỗ thứ tự" cho nhau — điều này phá hủy khả năng coi BẤT KỲ đường nào trong số chúng là "đường giới hạn khả năng sản xuất" duy nhất, đúng đắn</div>
        </div>
      </div>
      <p>Hiện tượng tương tự xảy ra giữa mọi cặp tổ hợp ca đối xứng (12:8 và 8:12, v.v...). Ngoại lệ duy nhất: ca 10:10 (đối xứng hoàn hảo) — và đây hóa ra chính là tổ hợp cho TỔNG SẢN LƯỢNG NGÀY CAO NHẤT trong mọi cách chia 20 giờ.</p>
      <div class="figure-note"><b>Liên hệ trực tiếp tới chương 3:</b> đây chính là hiện tượng "tái chuyển đổi" (re-switching) từng xuất hiện trong Tranh luận Vốn Cambridge (Sraffa/Robinson/Pasinetti/Garegnani) — nhưng lần này xảy ra ngay ở cấp độ MỘT máy đơn lẻ, không cần nhiều hàng hóa hay nhiều tỷ suất lợi nhuận. Trớ trêu thay, điều này ngụ ý: một hàm sản xuất tổng hợp "giả" (pseudo production function) chỉ có thể tồn tại nếu giá cả tuân theo đúng lý thuyết giá trị lao động đơn giản!</div>
      <h3>Ngay cả tổ hợp tối ưu (10:10) cũng không "ngoan ngoãn"</h3>
      <p>Có thể thử "cứu" khái niệm hàm sản xuất bằng cách định nghĩa lại nó là đường ứng với tổ hợp ca cho sản lượng cao nhất (10:10 trong ví dụ này). Nhưng đường 10:10 lại KHÔNG nằm trên "đường giới hạn", KHÔNG đơn điệu, và KHÔNG có hình dạng lồi chuẩn mực cần thiết cho một hàm sản xuất "ngoan ngoãn" (well-behaved). Sản phẩm biên và sản phẩm bình quân của lao động tính từ tổ hợp 10:10 trông hoàn toàn khác các đường cong giáo trình — bác bỏ trực tiếp "quy luật năng suất biên giảm dần" vốn được coi là "đặc trưng chung của hầu hết quá trình sản xuất".</p>
      <div class="figure-note"><b>Hệ quả sâu xa:</b> nếu hàm sản xuất thực ra là một QUAN HỆ XÃ HỘI (phụ thuộc vào cách các ca được sắp xếp mang tính xã hội-lịch sử) chứ không phải một quan hệ KỸ THUẬT thuần túy, thì "sản phẩm biên" của lao động và tư bản cũng mang tính xã hội y hệt như tiền lương thực và tỷ suất lợi nhuận — mọi "đẳng thức" giữa chúng chỉ phản ánh các quyết định xã hội nằm bên dưới, không phải một quy luật kỹ thuật khách quan.</div>

  {
    id:"cakip", n:"4", label:"Sản xuất theo Ca kíp",
    title:"Sản xuất dưới Điều kiện Ca kíp được Quy định Xã hội", eng:"IV.2 — Output and Coefficients under Socially Determined Work Conditions",
    body:`
      <p class="lede">Điều gì thực sự xảy ra khi các hãng vận hành theo điều kiện lao động được QUY ĐỊNH XÃ HỘI (không phải kỹ thuật thuần túy)? Xét ví dụ hai-ca-rưỡi 8 giờ ở cường độ bình thường (8:8:4, tổng 20 giờ = năng lực máy). Sản lượng ngày tăng trong ca đầu, chậm lại đôi chút khi ca hai bắt đầu (vì năng suất luôn thấp hơn ở đầu mỗi ca), rồi chậm lại lần nữa khi ca ba bắt đầu.</p>
      <h3>Shaikh thử MỌI cách định nghĩa "vốn" và "lao động" — không cách nào cứu được lý thuyết tân cổ điển</h3>
      <div class="concept-grid">
        <div class="concept"><span class="term">Định nghĩa 1: Lao động = số công nhân</span><p>Sản lượng so với số lao động tăng theo bậc thang (N, 2N, 3N khi mỗi ca mới bắt đầu) — hoàn toàn khác đường cong lồi trơn tru giáo trình yêu cầu.</p></div>
        <div class="concept"><span class="term">Định nghĩa 2: Lao động = giờ-công</span><p>Đường sản lượng theo giờ-công có hình dáng gần giống giáo trình hơn — nhưng THIẾU đặc tính LỒI bắt buộc của hàm sản xuất tân cổ điển.</p></div>
        <div class="concept"><span class="term">Định nghĩa 3: Vốn & lao động = 'dịch vụ'</span><p>So sánh sản lượng/giờ-công với tỷ lệ máy/giờ-công — kết quả "thảm hại" (disastrously) khác hẳn hình dạng tân cổ điển kỳ vọng.</p></div>
      </div>
      <div class="figure-note"><b>Kết luận không thể tránh khỏi:</b> dù định nghĩa "vốn" và "lao động" theo cách nào, KHÔNG THỂ suy ra các khuôn mẫu lồi trơn tru mà một hàm sản xuất tân cổ điển vi mô đòi hỏi. Lối thoát duy nhất còn lại của lý thuyết tân cổ điển là giả định — trái với logic và bằng chứng — rằng một máy có thể "chứa" một dải VÔ HẠN số lượng công nhân theo đúng công thức cần thiết. Paul Samuelson, chính ông, gọi đây là <b>"câu chuyện cổ tích tân cổ điển"</b> (neoclassical fairy tale).</div>
      <h3>Vi mô không "leo thẳng" lên vĩ mô</h3>
      <p>Ở cấp độ một nhà máy, những thay đổi phụ trội ca (shift premia) có thể gây ra thay đổi RỜI RẠC, ĐỘT NGỘT trong tỷ lệ sử dụng công suất chuẩn (ví dụ nhảy từ 100% xuống 40%). Nhưng ở cấp độ TỔNG HỢP, vì các hãng khác nhau chuyển ca vào những thời điểm khác nhau, tỷ lệ sử dụng công suất BÌNH QUÂN toàn ngành có thể thay đổi khá TRƠN TRU — quan hệ hàm số tổng hợp giữa phụ trội ca và sử dụng công suất có thể hoàn toàn khác quan hệ ở cấp vi mô. Đây chính là bài học "thuộc tính nổi lên" từ chương 3 tái xuất hiện: tác nhân trung bình thống kê không đại diện cho bất kỳ hãng đơn lẻ nào.</p>
    `,
    concepts:[
      ["Ca 8:8:4","8:8:4 shift pattern","Ví dụ trung tâm: hai-ca-rưỡi 8 giờ ở cường độ bình thường, tổng 20 giờ = năng lực máy — dùng để minh họa sản lượng/hệ số sản xuất dưới điều kiện xã hội thực tế."],
      ["'Câu chuyện cổ tích tân cổ điển'","'Neoclassical fairy tale' (Samuelson)","Chính Paul Samuelson gọi giả định một máy có thể 'chứa' vô hạn công nhân theo đúng công thức cần thiết cho hàm sản xuất trơn tru là một câu chuyện cổ tích — một thừa nhận đáng chú ý từ nội bộ trường phái."],

      <p>Tân cổ điển thêm "lợi nhuận thông thường" vào chi phí cố định, biến đường chi phí bình quân thành một đường "giá cả sản xuất" trá hình — bất kỳ giá nào cao hơn mức này bị coi là "lợi nhuận vượt trội" và bằng chứng của cạnh tranh không hoàn hảo. Hậu-Keynesian giả định chi phí chính (prime cost) không đổi theo sản lượng, giá = chi phí chính + markup phản ánh quyền lực độc quyền — nhưng Shaikh chỉ ra: chính GIÁ CẠNH TRANH cũng chứa một markup nhất định trên chi phí chính, nên không thể coi TOÀN BỘ markup quan sát được là dấu hiệu độc quyền.</p>

        <figcaption>Đường chi phí bình quân và chi phí biên qua nhiều ca làm việc (mô phỏng minh họa).</figcaption>
      </figure>
      <p>Từ những phát hiện ở phần III-IV: chi phí nguyên liệu bình quân ổn định trong một ca; chi phí cố định bình quân (khấu hao) giảm liên tục theo sản lượng; nhưng CHI PHÍ LAO ĐỘNG ĐƠN VỊ giảm dần trong một ca (năng suất tăng dần) rồi NHẢY VỌT ngay khi ca mới bắt đầu (quỹ lương tăng đột ngột trong khi năng suất giờ đầu luôn thấp hơn). Kết quả: đường chi phí biến đổi bình quân (avc) tổng thể GIẢM DẦN theo kiểu "gai nhọn" — không hề là đường chữ U trơn tru.</p>
      <div class="debate-box">
        <div class="dh">HỆ QUẢ CHẾT NGƯỜI CHO QUY TẮC P = MC</div>
        <div class="db">Vì đường chi phí biên (mc) có nhiều "gai nhọn" gián đoạn, một mức GIÁ cho trước có thể CẮT đường mc tại NHIỀU điểm sản lượng khác nhau — khiến quy tắc "giá = chi phí biên" (p=mc) kinh điển trở nên HOÀN TOÀN VÔ DỤNG trong việc xác định điểm sản xuất tối đa hóa lợi nhuận. Muốn tìm điểm đó, phải tính trực tiếp đường lợi nhuận, không thể dùng quy tắc tắt p=mc.</div>
      </div>
      <h3>Hai điểm hệ quả thêm</h3>
      <div class="concept-grid">
        <div class="concept"><span class="term">'Công suất dư thừa' cần định nghĩa rõ</span><p>Chỉ có ý nghĩa khi biết 'công suất chuẩn' là gì. Nếu điểm chi phí tối thiểu nằm ở cuối ca 1 hoặc 2, công suất kinh tế thấp hơn đáng kể công suất kỹ thuật — phần chênh lệch là 'công suất DỰ TRỮ' mong muốn (đáp ứng biến động cầu ngắn hạn), khác hẳn 'công suất DƯ THỪA' thực sự (dấu hiệu cắt giảm đầu tư).</p></div>
        <div class="concept"><span class="term">Vi mô-vĩ mô lại xuất hiện</span><p>Ở một thời điểm, một số nhà máy chạy 1 ca, số khác 2 ca, số khác 2,5 ca — ứng với tỷ lệ sử dụng công suất chuẩn 40%/80%/100%. Thay đổi phụ trội ca có thể gây nhảy vọt RỜI RẠC ở cấp nhà máy nhưng biến thiên TRƠN TRU ở cấp tổng hợp toàn ngành.</p></div>
      </div>

      <h3>Nghiên cứu Inman (1995) — một nhà máy ô tô cụ thể</h3>
      <p>Robert Inman ước tính chi tiết chi phí một nhà máy ô tô Mỹ dựa trên hoạt động thực tế, mô phỏng Monte-Carlo để tính đến yếu tố ngẫu nhiên.</p>

      <h3>Khảo sát Eiteman-Guthrie (1952) — hỏi thẳng doanh nhân</h3>
      <p>Thay vì suy luận lý thuyết, Eiteman và Guthrie đưa cho các nhà quản lý doanh nghiệp thực tế xem 8 dạng đường chi phí khác nhau và hỏi họ dạng nào khớp với chi phí thực tế của công ty mình.</p>

      <p>Khảo sát này không tính đến khả năng nhiều ca — nhưng điều đó không quan trọng, vì đường chi phí trong PHẠM VI MỘT ca (giảm dần rồi phẳng ở cuối ca) đã trùng khớp với những gì 94% doanh nhân mô tả. Bằng chứng cũng phù hợp với đường chi phí biên "đáy phẳng" — dẫn nhiều tác giả đề xuất thay hẳn đường chữ U giáo trình bằng một đường avc=mc phẳng đơn giản (dù cách này lại xóa mất sự phân biệt quan trọng giữa các ca).</p>

/* =========================================================
   FLASHCARDS RENDER
   ========================================================= */
var fcOrder = FLASHCARDS.map(function(_,i){return i;});
var fcIndex = 0;
document.getElementById('fcProgress').textContent = 'Thẻ 1 / ' + FLASHCARDS.length;
var flashcardEl = document.getElementById('flashcard');

function renderFlashcard(){
  var card = FLASHCARDS[fcOrder[fcIndex]];
  document.getElementById('fcTag').textContent = card.sec;
  document.getElementById('fcQ').textContent = card.q;
  document.getElementById('fcA').textContent = card.a;
  document.getElementById('fcProgress').textContent = 'Thẻ ' + (fcIndex+1) + ' / ' + FLASHCARDS.length;
  flashcardEl.classList.remove('flipped');
}
function flipFC(){ flashcardEl.classList.toggle('flipped'); }
document.getElementById('fcFlip').addEventListener('click', flipFC);
flashcardEl.addEventListener('click', flipFC);
document.getElementById('fcNext').addEventListener('click', function(){
  fcIndex = (fcIndex+1) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcPrev').addEventListener('click', function(){
  fcIndex = (fcIndex-1+FLASHCARDS.length) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcShuffle').addEventListener('click', function(){
  for(var i=fcOrder.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = fcOrder[i]; fcOrder[i]=fcOrder[j]; fcOrder[j]=tmp;
  }
  fcIndex = 0;
  renderFlashcard();
});
renderFlashcard();

/* =========================================================
   QUIZ RENDER
   ========================================================= */
var quizArea = document.getElementById('quizArea');
var quizAnswers = {};

function renderQuiz(){
  var html = QUIZ.map(function(item, qi){
    var opts = item.opts.map(function(opt, vi){
      return '<div class="q-opt" data-qi="'+qi+'" data-qv="'+vi+'">'+opt+'</div>';
    }).join('');
    return '<div class="q-block" id="qblock-'+qi+'">'+
      '<div class="q-text">'+(qi+1)+'. '+item.q+'</div>'+
      '<div class="q-opts">'+opts+'</div>'+
      '<div class="q-explain" id="qexplain-'+qi+'">'+item.explain+'</div>'+
      '</div>';
  }).join('');
  html += '<div style="text-align:center;margin-top:20px;"><button class="btn primary" id="quizFinish">Xem kết quả</button> <button class="btn" id="quizReset">Làm lại</button></div>';
  html += '<div id="quizResult"></div>';
  quizArea.innerHTML = html;

  quizArea.addEventListener('click', quizClickHandler);
  document.getElementById('quizFinish').addEventListener('click', showQuizScore);
  document.getElementById('quizReset').addEventListener('click', function(){
    quizAnswers = {};
    renderQuiz();
  });
}

function quizClickHandler(e){
  var opt = e.target.closest('.q-opt');
  if(!opt) return;
  var qi = parseInt(opt.dataset.qi, 10);
  var qv = parseInt(opt.dataset.qv, 10);
  quizAnswers[qi] = qv;
  var block = document.getElementById('qblock-'+qi);
  block.querySelectorAll('.q-opt').forEach(function(o){
    o.classList.remove('selected','correct','incorrect');
  });
  var correctIdx = QUIZ[qi].correct;
  block.querySelectorAll('.q-opt').forEach(function(o){
    var v = parseInt(o.dataset.qv,10);
    if(v === correctIdx) o.classList.add('correct');
    else if(v === qv) o.classList.add('incorrect');
  });
  document.getElementById('qexplain-'+qi).classList.add('show');
  updateQuizProgress();
}

function updateQuizProgress(){
  var answered = Object.keys(quizAnswers).length;
  var pct = Math.round(100*answered/QUIZ.length);
  document.getElementById('quizProgressFill').style.width = pct+'%';
}

function showQuizScore(){
  var correct = 0;
  QUIZ.forEach(function(item, qi){
    if(quizAnswers[qi] === item.correct) correct++;
  });
  var pct = Math.round(100*correct/QUIZ.length);
  document.getElementById('quizResult').innerHTML =
    '<div class="quiz-score"><div class="num">'+correct+'/'+QUIZ.length+'</div>'+
    '<div class="lbl">('+pct+'%) — '+ (pct>=80?'Nắm rất vững nội dung!':pct>=50?'Khá tốt, xem lại vài phần.':'Nên đọc lại các phần liên quan.') +'</div></div>';
}
renderQuiz();

/* =========================================================
   NOTES PANEL
   ========================================================= */
var notesFab = document.getElementById('notesFab');
var notesPanel = document.getElementById('notesPanel');
var notesBackdrop = document.getElementById('notesBackdrop');
var notesBody = document.getElementById('notesBody');
var notesTitle = document.getElementById('notesTitle');
var notesFoot = document.getElementById('notesFoot');
var currentNoteTab = 'gioithieu';
var LS_PREFIX = 'shaikh_ch4_note_';

function isMobile(){ return window.matchMedia('(max-width:640px)').matches; }

function noteLabelFor(id){
  var s = SECTIONS.filter(function(x){return x.id===id;})[0];
  if(s) return s.n + '. ' + s.label;
  if(id === 'gloss') return 'Thuật ngữ';
  if(id === 'flashcards') return 'Thẻ ghi nhớ';
  if(id === 'quiz') return 'Quiz';
  return id;
}

function openNotesFor(id){
  currentNoteTab = id;
  notesTitle.textContent = 'Ghi chú — ' + noteLabelFor(id);
  var saved = localStorage.getItem(LS_PREFIX + id) || '';
  notesBody.innerHTML = saved;
  updateNotesFoot();
}
function updateNotesFoot(){
  var len = notesBody.innerText.trim().length;
  notesFoot.textContent = len + ' ký tự · lưu tự động';
}
function saveCurrentNote(){
  localStorage.setItem(LS_PREFIX + currentNoteTab, notesBody.innerHTML);
  updateNotesFoot();
}
function openNotesPanel(){
  notesPanel.classList.add('open');
  if(isMobile()){ notesBackdrop.classList.add('show'); }
}
function closeNotesPanel(){
  notesPanel.classList.remove('open');
  notesBackdrop.classList.remove('show');
}
notesFab.addEventListener('click', function(){
  if(notesPanel.classList.contains('open')){
    closeNotesPanel();
  } else {
    openNotesFor(currentNoteTab);
    openNotesPanel();
  }
});
document.getElementById('notesClose').addEventListener('click', closeNotesPanel);
notesBackdrop.addEventListener('click', closeNotesPanel);
notesBody.addEventListener('input', saveCurrentNote);
document.querySelectorAll('.notes-toolbar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    var cmd = btn.dataset.cmd;
    notesBody.focus();
    if(cmd.indexOf(':')>-1){
      var parts = cmd.split(':');
      document.execCommand(parts[0], false, parts[1]);
    } else {
      document.execCommand(cmd, false, null);
    }
    saveCurrentNote();
  });
});

activateTab(ALL_TAB_IDS[0]);
</script>
