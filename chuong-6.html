<!DOCTYPE html>

<head>

<title>Shaikh — Capitalism: Competition, Conflict, Crises — Chương 6</title>
<style>
:root{
  --bg:#f2ede0;
  --panel:#fffdf8;
  --panel-2:#eef1e8;
  --ink:#211d16;
  --ink-soft:#4c473b;
  --muted:#847b68;
  --line:#dcd0ac;
  --primary:#1f3b5c;
  --primary-dark:#152944;
  --primary-tint:#e1e8ef;
  --gold:#a67f2c;
  --gold-light:#d6b263;
  --green:#2f6b3f;
  --green-tint:#e3ede4;
  --red:#8a2f2f;
  --red-tint:#f0e2e2;
  --dark-bg:#141b22;
  --dark-panel:#1d2731;
  --dark-ink:#eef1e6;
  --dark-line:#324256;
  --shadow:0 6px 24px rgba(20,27,34,0.12);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1000px;margin:0 auto;padding:0 16px 80px;}

.hero{padding:32px 16px 20px;text-align:center;border-bottom:3px double var(--gold);margin-bottom:18px;background:radial-gradient(ellipse at top, rgba(166,127,44,0.08), transparent 60%);}
.hero .kicker{font-family:Georgia,serif;letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700;}
.hero h1{font-size:clamp(22px,4.6vw,34px);margin:8px 0 4px;color:var(--primary-dark);letter-spacing:.005em;line-height:1.25;}
.hero .subtitle{font-size:14.5px;color:var(--ink-soft);font-style:italic;}
.hero .meta{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hero .meta span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);}
.hero .meta a.meta-link{color:var(--primary);text-decoration:none;font-weight:600;}
.hero .meta a.meta-link:hover{background:var(--primary-tint);}


.tabbar-wrap{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:8px;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tabbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;}
.tabbar::-webkit-scrollbar{height:5px;}
.tabbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.tab-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
.tab-btn .n{color:var(--gold);font-weight:800;margin-right:5px;}
.tab-btn:hover{border-color:var(--gold);}
.tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow);}
.tab-btn.active .n{color:var(--gold-light);}

.panel{display:none;animation:fadein .25s ease;}
.panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);}
.card h2{margin:0 0 4px;font-size:21px;color:var(--primary-dark);}
.card .eng-title{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:16px;letter-spacing:.02em;}
.card h3{font-size:15.5px;color:var(--primary);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px;}
.card p{margin:0 0 12px;color:var(--ink);}
.card p:last-child{margin-bottom:0;}
.lede{font-size:16px;color:var(--ink-soft);border-left:3px solid var(--gold);padding-left:14px;margin:6px 0 18px;}

.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0;}
.concept{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.concept .term{font-weight:700;color:var(--primary-dark);font-size:13px;display:block;margin-bottom:4px;}
.concept .term .en{color:var(--gold);font-weight:600;font-size:11px;font-style:italic;}
.concept p{font-size:13px;margin:0;color:var(--ink-soft);}

.figure-note{background:var(--primary-tint);border:1px dashed var(--primary);border-radius:10px;padding:12px 15px;font-size:12.5px;color:var(--primary-dark);margin:14px 0;}
.figure-note b{color:var(--primary-dark);}

.debate-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0;}
.debate-box .dh{background:var(--primary);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.03em;}
.debate-box .db{padding:13px 15px;font-size:13px;color:var(--ink-soft);}
.debate-box .names{color:var(--gold);font-weight:700;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0;}
.stat-box{background:var(--primary-dark);color:#fff;border-radius:10px;padding:13px 14px;text-align:center;}
.stat-box .val{font-size:20px;font-weight:800;color:var(--gold-light);}
.stat-box .lbl{font-size:10.5px;color:#dbe4ee;margin-top:3px;line-height:1.3;}

.dark-panel{background:var(--dark-bg);color:var(--dark-ink);border-radius:12px;padding:20px;margin:16px 0;border:1px solid var(--dark-line);}
.dark-panel h4{margin:0 0 12px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;}
.flow{display:flex;flex-direction:column;gap:0;}
.flow-step{background:var(--dark-panel);border:1px solid var(--dark-line);border-radius:8px;padding:10px 14px;font-size:12.5px;position:relative;}
.flow-step b{color:var(--gold-light);}
.flow-arrow{text-align:center;color:var(--gold);font-size:16px;padding:2px 0;}
.flow-branch{display:flex;gap:10px;margin:2px 0;flex-wrap:wrap;}
.flow-branch>div{flex:1;min-width:130px;}

.chart-panel{background:var(--dark-bg);border:1px solid var(--dark-line);border-radius:12px;padding:18px 18px 14px;margin:16px 0;}
.chart-panel h4{margin:0 0 2px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;}
.chart-panel .chart-sub{font-size:11px;color:#9fb0c2;margin-bottom:10px;font-style:italic;}
.chart-panel svg{width:100%;height:auto;display:block;}

/* ===== Real/reference chart (photo, not illustrative SVG) ===== */
.chart-real{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:10px 0 18px;}
.chart-real-badge{display:inline-block;font-family:Georgia,serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);border-radius:4px;padding:3px 9px;margin-bottom:9px;}
.chart-real img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);}
.chart-real figcaption{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.55;font-style:italic;}

.chart-note{font-size:10.5px;color:#8496a8;margin-top:6px;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dark-ink);}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:12px;height:3px;display:inline-block;border-radius:2px;}

.txn-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px;}
.txn-table th,.txn-table td{border:1px solid var(--line);padding:7px 10px;text-align:right;}
.txn-table th{background:var(--primary);color:#fff;font-weight:700;font-size:11.5px;text-align:center;}
.txn-table td:first-child,.txn-table th:first-child{text-align:left;}
.txn-table tr:nth-child(even) td{background:var(--panel-2);}

.gloss-item{border-bottom:1px solid var(--line);padding:12px 0;}
.gloss-item:last-child{border-bottom:none;}
.gloss-term{font-weight:700;color:var(--primary-dark);font-size:14px;}
.gloss-term .en{color:var(--gold);font-weight:600;font-size:11.5px;font-style:italic;margin-left:6px;}
.gloss-def{font-size:13px;color:var(--ink-soft);margin-top:3px;}

.gloss-extra-row{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.gloss-extra-row .en{flex:1;color:var(--ink-soft);font-style:italic;}
.gloss-extra-row .vi{flex:1;color:var(--primary-dark);font-weight:600;}


.fc-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.fc-progress{font-size:13px;color:var(--muted);}
.fc-stage{display:flex;justify-content:center;margin:10px 0 20px;perspective:1400px;}
.flashcard{width:100%;max-width:560px;height:270px;position:relative;cursor:pointer;}
.flashcard .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flashcard.flipped .fc-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);}
.fc-front{background:var(--panel);}
.fc-front .fc-tag{position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;font-weight:700;}
.fc-front .fc-q{font-size:17px;color:var(--ink);font-weight:600;}
.fc-back{background:var(--primary);color:#fff;transform:rotateY(180deg);}
.fc-back .fc-a{font-size:14px;}
.fc-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;}
.fc-nav{display:flex;justify-content:center;gap:10px;margin-top:16px;}
.btn{border:1px solid var(--primary);background:var(--panel);color:var(--primary-dark);font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--primary);color:#fff;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-dark);}

.quiz-progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--primary));transition:width .3s;}
.q-block{margin-bottom:14px;}
.q-text{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;}
.q-opts{display:flex;flex-direction:column;gap:8px;}
.q-opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer;transition:all .15s;}
.q-opt:hover{border-color:var(--gold);}
.q-opt.selected{border-color:var(--primary);background:var(--primary-tint);}
.q-opt.correct{border-color:var(--green);background:var(--green-tint);color:#1c4a28;font-weight:700;}
.q-opt.incorrect{border-color:var(--primary);background:#f3e6e6;color:#7a2020;font-weight:700;}
.q-explain{margin-top:10px;font-size:12.5px;color:var(--ink-soft);background:var(--panel-2);border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 8px 8px 0;display:none;}
.q-explain.show{display:block;}
.quiz-score{text-align:center;padding:30px 20px;}
.quiz-score .num{font-size:46px;font-weight:800;color:var(--primary);}
.quiz-score .lbl{font-size:14px;color:var(--muted);margin-bottom:18px;}

.notes-fab{position:fixed;right:22px;bottom:22px;z-index:50;background:var(--primary);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 8px 20px rgba(21,41,68,0.35);cursor:pointer;display:flex;align-items:center;gap:7px;}
.notes-backdrop{position:fixed;inset:0;background:rgba(15,18,22,0.45);z-index:60;display:none;}
.notes-backdrop.show{display:block;}
.notes-panel{position:fixed;top:0;right:0;height:100%;width:380px;max-width:88vw;background:var(--panel);z-index:70;box-shadow:-10px 0 30px rgba(0,0,0,0.2);transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;}
.notes-panel.open{transform:translateX(0);}
.notes-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.notes-head h4{margin:0;color:var(--primary-dark);font-size:14.5px;}
.notes-head .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.notes-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;}
.notes-toolbar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.notes-toolbar button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;width:30px;height:30px;cursor:pointer;font-family:Georgia,serif;font-size:14px;color:var(--ink);}
.notes-toolbar button:hover{border-color:var(--gold);}
.notes-body{flex:1;padding:16px 18px;overflow-y:auto;outline:none;font-size:14px;line-height:1.7;}
.notes-body:empty:before{content:"Ghi chú của bạn cho phần này... (tự động lưu)";color:var(--muted);font-style:italic;}
.notes-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);}

@media (max-width:640px){
  .hero{padding:22px 12px 14px;}
  .card{padding:16px 15px;}
  .flashcard{height:250px;}
  .notes-panel{width:100%;max-width:100%;}
  .txn-table{font-size:11px;}
  .txn-table th,.txn-table td{padding:5px 6px;}
}
@media print{
  .tabbar-wrap,.notes-fab,.notes-panel,.notes-backdrop,.fc-nav,.q-opts{display:none !important;}
  .panel{display:block !important;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
}
</style>

<script>
/* =========================================================
   MINI CHART HELPER
   ========================================================= */
function sparkPath(values, w, h, pad){
  var n = values.length;
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  var range = (max - min) || 1;
  var pts = values.map(function(v, i){
    var x = pad + (i/(n-1)) * (w - 2*pad);
    var y = pad + (1 - (v - min)/range) * (h - 2*pad);
    return [x,y];
  });
  var d = 'M ' + pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L ');
  var area = d + ' L ' + pts[pts.length-1][0].toFixed(1) + ',' + (h-pad) + ' L ' + pts[0][0].toFixed(1) + ',' + (h-pad) + ' Z';
  return {line:d, area:area, pts:pts};
}
function renderLineChart(containerId, series, opts){
  opts = opts || {};
  var w = opts.w || 400, h = opts.h || 120, pad = opts.pad || 8;
  var svg = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  series.forEach(function(s){
    var r = sparkPath(s.values, w, h, pad);
    if(s.fill !== false){
      svg += '<path d="'+r.area+'" fill="'+(s.color||'#a67f2c')+'" opacity="0.12"></path>';
    }
    svg += '<path d="'+r.line+'" fill="none" stroke="'+(s.color||'#a67f2c')+'" stroke-width="'+(s.width||2)+'" vector-effect="non-scaling-stroke"></path>';
  });
  svg += '</svg>';
  var el = document.getElementById(containerId);
  if(el) el.innerHTML = svg;
}

/* =========================================================
   DATA — SECTIONS (tabs 0-6)
   ========================================================= */
var SECTIONS = [
  {
    id:"tubanlagì", n:"0", label:"Tư bản là gì?",
    title:"Tư bản là gì? — Một Quá trình, không phải một Vật", eng:"I. Introduction",
    body:`
      <p class="lede">"Lợi nhuận điều khiển CNTB. Nếu lợi nhuận thất bại, doanh nghiệp rơi vào sốc và tư bản của nó bắt đầu teo tóp." Lý thuyết kinh tế và cảm quan kinh doanh hoàn toàn nhất trí về điểm này. Vậy tư bản là gì?</p>
      <p>Tư bản là MỘT VẬT được sử dụng trong quá trình tạo lợi nhuận — nhưng chính QUÁ TRÌNH, không phải thuộc tính của vật, mới biến nó thành tư bản. Marx dùng chu kỳ <b>M–C–M′</b> (tiền → hàng hóa → nhiều tiền hơn) để nhận diện tư bản, đối lập với chu kỳ <b>C–M–C</b> (hàng hóa → tiền → hàng hóa) của thu nhập người lao động: người làm công bán sức lao động (C) lấy lương (M) rồi dùng mua hàng tiêu dùng (C) — tiền RỜI XA người tiêu dùng; còn với nhà tư bản, tiền ứng ra phải QUAY VỀ dưới dạng nhiều tiền hơn.</p>
      <div class="debate-box">
        <div class="dh">PHÉP LOẠI SUY CON DAO</div>
        <div class="db">Một con dao trong bếp là dụng cụ nấu ăn. Cùng con dao đó, trong cơn thịnh nộ giết người, là vũ khí chết người. Chính Ý ĐỊNH mới định nghĩa chức năng của nó. Tương tự, tiền chi cho tiêu dùng cá nhân khác hẳn tiền đầu tư làm tư bản — dù mua CÙNG một vật: mua trái cây để ăn khác mua trái cây để bán kiếm lời. Với tiêu dùng, hương vị trái cây là điều quan trọng nhất; với tư bản, khả năng sinh lời mới là trung tâm, hương vị chỉ là phương tiện.</div>
      </div>
      <h3>Phân biệt tư bản lưu động và cố định: chức năng, không phải thời hạn</h3>
      <p>Một khuôn đất sét là tư bản LƯU ĐỘNG nếu bị dùng hết ngay trong một chu kỳ sản xuất; khuôn nhựa hay thép là tư bản CỐ ĐỊNH nếu dùng được nhiều chu kỳ. Nhưng khuôn nhựa có thể chỉ bền 6 tháng sản xuất, còn khuôn thép bền nhiều năm — nếu lấy THÁNG làm mốc, cả hai đều là "bền"; lấy NĂM làm mốc, chỉ khuôn thép là "bền"; lấy THẬP KỶ làm mốc, cả ba khuôn đều "hao mòn nhanh". Dù vậy, khuôn đất sét MÃI MÃI vẫn là tư bản lưu động, khuôn nhựa/thép MÃI MÃI là tư bản cố định — <b>sự phân biệt mang tính CHỨC NĂNG, không phải THỜI GIAN.</b></p>
      <div class="figure-note"><b>Phê phán tân cổ điển:</b> kinh tế học tân cổ điển đơn giản định nghĩa "tư bản" là bất kỳ của cải nào tồn tại hơn một năm — gộp chung tư bản kinh doanh với của cải cá nhân/công cộng, thậm chí cả "vốn con người" (kiến thức, kỹ năng). Điểm chung duy nhất được viện dẫn là TÍNH BỀN — trong khi cổ điển nhấn mạnh chính QUÁ TRÌNH (mục đích sinh lời) mới định nghĩa tư bản, không phải thuộc tính vật lý của nó.</div>
      <h3>Không phải mọi lao động/tư liệu sản xuất đều là tư bản</h3>
      <p>Một thợ sửa xe tự làm chủ dùng dụng cụ để kiếm sống, dùng thu nhập mua nhà, học đại học nâng cao kỹ năng — dụng cụ và nhà là CỦA CẢI của cô, học vấn là NĂNG LỰC của cô, không phải tư bản. Nhưng nếu cô làm thuê trong một tiệm sửa xe, cô lao động để tạo lợi nhuận cho ông chủ — khi đó lương của cô và máy móc cô dùng đều là TƯ BẢN của ông chủ.</p>

    body:`
      <p class="lede">Không tư bản cá thể nào được đảm bảo lợi nhuận — luôn có nhiều thương vong trong cuộc chiến cạnh tranh không ngừng. Vậy điều gì quyết định TỔNG lợi nhuận khi cung và cầu tổng cân bằng? Ngài James Steuart (1767) đưa ra một tuyên bố hấp dẫn: có <b>HAI</b> nguồn gốc của lợi nhuận tổng.</p>
      <div class="debate-box">
        <div class="dh">LỜI TRÍCH GỐC CỦA STEUART</div>
        <div class="db">"<b>Lợi nhuận tích cực</b>, không ngụ ý mất mát cho bất kỳ ai; nó là kết quả của việc gia tăng lao động, công nghiệp hay sự khéo léo, và có tác dụng làm tăng của cải công cộng... <b>Lợi nhuận tương đối</b>, ngụ ý mất mát cho ai đó; nó đánh dấu một sự 'rung lắc' trong cán cân của cải giữa các bên, nhưng không hề bổ sung vào kho của cải chung..."</div>
      </div>
      <p>Marx tiếp nhận và đổi tên: "lợi nhuận tích cực" thành <b>lợi nhuận từ sản xuất giá trị thặng dư</b> (nguồn gốc của lợi nhuận công nghiệp — trọng tâm phân tích của ông), và "lợi nhuận tương đối" thành <b>lợi nhuận từ chuyển nhượng</b> (profit on alienation — nền tảng của tư bản thương nghiệp cổ xưa: "mua rẻ bán đắt").</p>
      <h3>Ví dụ minh họa: chiếc TV bị đánh cắp</h3>
      <p>Bạn về nhà phát hiện chiếc TV màn hình lớn trị giá $500 đã bị trộm. Của cải hộ gia đình bạn giảm $500. Tên trộm bán TV cho một chủ tiệm với giá $200; chủ tiệm bán lại cho người mua cuối cùng với $500, thu lãi ròng $300.</p>
      <div class="dark-panel">
        <h4>Vì sao 'lợi nhuận tổng' tăng $300 dù không hề có sản xuất mới?</h4>
        <div class="flow">
          <div class="flow-step">Của cải hộ gia đình bạn: <b>−$500</b> (mất TV)</div>
          <div class="flow-step">Của cải tên trộm: <b>+$200</b> (tiền bán TV cho chủ tiệm)</div>
          <div class="flow-step">Lợi nhuận chủ tiệm (trong "chu kỳ tư bản"): <b>+$300</b></div>
          <div class="flow-arrow">↓</div>
          <div class="flow-step" style="border-color:var(--gold);">Tổng của cải hộ gia đình giảm ĐÚNG $300 (−$500+$200) — <b>khớp CHÍNH XÁC</b> với mức tăng lợi nhuận tổng $300, vì khoản lỗ nằm trong "chu kỳ thu nhập" còn khoản lãi nằm trong "chu kỳ tư bản" — hai sổ sách TÁCH BIỆT</div>
        </div>
      </div>
      <p>Đây chính là "lợi nhuận tương đối" — một sự "RUNG LẮC" (vibration) thuần túy của của cải hiện có, KHÔNG hề tạo thêm giá trị mới, nhưng vẫn làm TĂNG lợi nhuận tổng đo được vì nó chuyển của cải từ "chu kỳ thu nhập" (hộ gia đình) sang "chu kỳ tư bản" (doanh nghiệp) — hai sổ sách này không tự động triệt tiêu lẫn nhau.</p>
      <div class="figure-note"><b>Nhưng nếu TV bị trộm từ VĂN PHÒNG một doanh nghiệp khác</b> (đã nằm trong chu kỳ tư bản) rồi bán lại, lợi nhuận TỔNG không đổi — công ty mất TV ghi nhận −$500 (khấu hao), công ty bán lại ghi nhận +$500 — cả hai đều trong chu kỳ tư bản nên triệt tiêu nhau. Bài học: chuyển giao TRONG cùng một chu kỳ không tạo lợi nhuận mới; chỉ chuyển giao GIỮA hai chu kỳ khác nhau mới làm thay đổi lợi nhuận tổng đo được.</div>
      <p>Marx nhấn mạnh: mục tiêu của ông là chứng minh lợi nhuận CÔNG NGHIỆP tích cực tồn tại NGAY CẢ KHI mọi hàng hóa được bán đúng giá trị (trao đổi ngang giá, không có chuyển nhượng bất bình đẳng nào). Lợi nhuận từ chuyển nhượng vẫn quan trọng — nhưng ở lĩnh vực khác: phân phối giá trị thặng dư giữa các giai cấp/hạng mục (lợi nhuận, lãi suất, địa tô), và ở các "hình thái tiền hồng thủy" như tư bản thương nghiệp và cho vay nặng lãi tồn tại trước cả CNTB công nghiệp.</p>

    body:`
      <p class="lede">Kết quả trung tâm của phần này: <b>không thể có lợi nhuận tích cực nếu không có lao động thặng dư.</b> Nhưng — điều gây bất ngờ — lợi nhuận tổng VẪN có thể thay đổi khi giá tương đối thay đổi, ngay cả khi sản phẩm thặng dư vật lý không đổi. Đây chính là hạt giống của "vấn đề chuyển hóa" (bàn ở phần IV) — và Shaikh chứng minh nó tồn tại trong MỌI trường phái lý thuyết giá: tân cổ điển, Sraffa, VÀ Marx.</p>
      <h3>Thời gian lao động tất yếu và thặng dư — ví dụ đơn giản hóa</h3>
      <p>Dùng ví dụ hai-khu-vực của Sraffa (ngô và sắt): ở một ngày làm việc 4 giờ, toàn bộ sản phẩm ròng vừa đủ trang trải lương thực công nhân — KHÔNG có sản phẩm thặng dư, và do đó KHÔNG có lợi nhuận tổng dù giá cả được đặt ở bất kỳ mức nào (lợi nhuận sector này bù trừ đúng lỗ sector kia). Đây là <b>thời gian lao động tất yếu</b> — thời gian công nhân phải làm để tái sản xuất đúng mức sinh hoạt của chính họ.</p>
      <div class="figure-note"><b>Bằng chứng sống động:</b> mối liên hệ này lộ rõ mỗi khi công nhân đình công hoặc làm việc cầm chừng (work slowdown) — chính là lúc thời gian lao động thặng dư biến mất, kéo theo lợi nhuận biến mất.</div>
      <p>Khi kéo dài ngày làm việc lên 8 giờ (không đổi số công nhân hay lương ngày), sản phẩm ròng tăng lên, vượt xa mức cần cho lương — SẢN PHẨM THẶNG DƯ dương xuất hiện, và với nó, LỢI NHUẬN TỔNG dương. Điều này đúng bất kể mức giá cụ thể nào, miễn giá được áp dụng NHẤT QUÁN cho cả đầu vào lẫn đầu ra.</p>
      <h3>Quy tắc đo lường lợi nhuận kinh tế thực</h3>
      <div class="debate-box">
        <div class="dh">HẠCH TOÁN CHI PHÍ HIỆN HÀNH (CURRENT-COST ACCOUNTING)</div>
        <div class="db">Để đo lợi nhuận KINH TẾ thực (không phải lợi nhuận danh nghĩa gây nhầm lẫn), phải áp dụng CÙNG một bộ giá cho cả đầu vào lẫn đầu ra — nguyên tắc đã được đưa vào đại số giá cả cạnh tranh từ thời Bortkiewicz. Quy tắc này KHÔNG đòi hỏi giá cả phải cố định hay ở trạng thái cân bằng — chỉ đòi hỏi tính NHẤT QUÁN giữa đầu vào/đầu ra khi đo lường.</div>
      </div>
      <h3>Câu đố: vì sao giá tương đối lại ảnh hưởng lợi nhuận tổng?</h3>
      <p>Nếu giữ nguyên MỨC giá tổng thể nhưng thay đổi TỶ LỆ giá tương đối giữa ngô và sắt (theo ba bộ giá khác nhau: giá trực tiếp D, giá cạnh tranh C, giá thị trường M), lợi nhuận tổng đo được LẠI KHÁC NHAU ở mỗi bộ giá — dù sản phẩm thặng dư vật lý hoàn toàn giống nhau! Đây chính là "câu đố" trung tâm mà phần IV sẽ giải quyết triệt để.</p>
      <div class="stat-row">
        <div class="stat-box"><div class="val">Giá D</div><div class="lbl">Lợi nhuận tổng minh họa: $107.39</div></div>
        <div class="stat-box"><div class="val">Giá C</div><div class="lbl">Lợi nhuận tổng minh họa: $106.12</div></div>
        <div class="stat-box"><div class="val">Giá M</div><div class="lbl">Lợi nhuận tổng minh họa: thấp hơn nữa</div></div>

    concepts:[
      ["Thời gian lao động tất yếu vs thặng dư","Necessary vs surplus labor time","Tất yếu: thời gian công nhân phải làm để tái sản xuất mức sinh hoạt của chính họ (không sản phẩm thặng dư). Thặng dư: thời gian làm việc VƯỢT mức đó — nguồn gốc duy nhất của sản phẩm thặng dư và lợi nhuận tích cực."],

  {
    id:"chuyenhoa", n:"3", label:"Giải pháp Chuyển hóa",
    title:"Giải pháp Tổng quát cho 'Vấn đề Chuyển hóa'", eng:"IV. Aggregate Profits and Transfers of Value",
    body:`
      <p class="lede">Shaikh đưa ra lời giải TỔNG QUÁT, áp dụng cho MỌI cặp bộ giá (giá trực tiếp Marx vs giá sản xuất Bortkiewicz-Sraffa; giá Sraffa vs giá độc quyền; bất kỳ giá lý thuyết nào vs vô số giá thị trường thực tế): toàn bộ "vấn đề chuyển hóa" — ở BẤT KỲ trường phái nào — đều được giải thích trọn vẹn bằng khái niệm CHUYỂN GIAO GIÁ TRỊ đã giới thiệu ở phần II.</p>

      <div class="figure-note"><b>Quy luật rút ra:</b> chuyển giao TRONG cùng một chu kỳ (tư bản-tư bản) không tạo lợi nhuận mới. Chuyển giao GIỮA chu kỳ thu nhập và chu kỳ tư bản LUÔN làm thay đổi lợi nhuận tổng đo được — tăng nếu của cải chảy VÀO chu kỳ tư bản, giảm nếu chảy RA.</div>
      <h3>Kết quả trung tâm: Lợi nhuận = Giá của Sản phẩm Thặng dư</h3>
      <p>Lợi nhuận sản xuất tổng LUÔN LUÔN chính là <b>giá tiền tệ của sản phẩm thặng dư</b> — bất kể bộ giá nào được dùng để định giá nó. Khi so sánh các bộ giá khác nhau (giá trực tiếp, giá sản xuất, giá thị trường...), câu hỏi "bộ giá nào là 'giá trị nền tảng'?" chỉ đơn thuần xác định ĐIỂM QUY CHIẾU để so sánh — với Marx là giá trực tiếp, với Sraffa là giá sản xuất.</p>
      <div class="dark-panel">
        <h4>Hai kênh DUY NHẤT giải thích mọi thay đổi lợi nhuận do giá tương đối</h4>
        <div class="flow">
          <div class="flow-branch">
            <div class="flow-step"><b>Kênh 1 — Chuyển giao KHÔNG GIAN</b><br>Giữa chu kỳ thu nhập (hộ gia đình) và chu kỳ tư bản (doanh nghiệp) — ví dụ: giá hàng tiêu dùng tư bản gia tăng chuyển của cải TỪ túi nhà tư bản-người-tiêu-dùng VÀO lợi nhuận doanh nghiệp</div>
            <div class="flow-step"><b>Kênh 2 — Chuyển giao THỜI GIAN</b><br>Trong nội bộ chu kỳ tư bản, giữa chi phí HIỆN TẠI và chi phí TƯƠNG LAI — ví dụ: giá tư liệu đầu tư giảm hạ chi phí sản xuất tương lai (qua khấu hao thấp hơn), "vay mượn" lợi nhuận từ tương lai về hiện tại</div>
          </div>
        </div>
      </div>
      <p>Đây chính xác là những gì đã tiềm ẩn sẵn trong các trước tác của Marx: sự tiếp nhận phân biệt của Steuart (lợi nhuận chuyển nhượng/sản xuất), phân biệt riêng của ông về chu kỳ thu nhập/tư bản, và phân tích chi tiết về tương tác giữa hai chu kỳ trong "Sơ đồ Tái sản xuất" — chỉ là các mảnh ghép chưa từng được ông tự tay ráp lại hoàn chỉnh (ông qua đời trước khi hoàn thành).</p>
      <h3>Khi nào giá tương đối KHÔNG ảnh hưởng lợi nhuận tổng?</h3>
      <p>Nếu sản phẩm thặng dư có ĐÚNG cùng tỷ lệ thành phần với tổng sản phẩm, lợi nhuận tổng sẽ HOÀN TOÀN MIỄN NHIỄM với thay đổi giá tương đối. Đây chính xác là trường hợp giới hạn của "tích lũy cân bằng" ở Marx: khi TOÀN BỘ giá trị thặng dư được tái đầu tư (không có tiêu dùng nhà tư bản), tốc độ tăng trưởng bằng đúng tỷ suất lợi nhuận.</p>

    concepts:[
      ["Lợi nhuận = Giá của Sản phẩm Thặng dư","Aggregate profit is the price of the surplus product","Kết quả trung tâm áp dụng cho MỌI bộ giá: lợi nhuận sản xuất tổng luôn chính là giá trị tiền tệ của sản phẩm thặng dư vật lý, dù được định giá theo bộ giá lý thuyết nào."],
      ["Hai kênh chuyển giao giá trị","Two channels of value transfer","Chuyển giao KHÔNG GIAN (giữa chu kỳ thu nhập và tư bản) và chuyển giao THỜI GIAN (giữa chi phí hiện tại và tương lai trong nội bộ chu kỳ tư bản) — hai kênh DUY NHẤT giải thích mọi biến động lợi nhuận tổng do giá tương đối thay đổi."],
      ["Miễn nhiễm khi tỷ lệ thành phần trùng khớp","Immunity when surplus matches total-product proportions","Nếu sản phẩm thặng dư có đúng tỷ lệ thành phần như tổng sản phẩm, lợi nhuận tổng hoàn toàn không bị ảnh hưởng bởi thay đổi giá tương đối — trường hợp giới hạn của tích lũy cân bằng ở Marx."]

  {
    id:"taichinh", n:"4", label:"Lợi nhuận Tài chính",
    title:"Lợi nhuận Tài chính, Lãi vốn và 'Kim tự tháp Ngược'", eng:"V. Financial Profits and Profit-on-Transfer",
    body:`
      <p class="lede">Lãi vốn (capital gains) bổ sung một chiều kích nữa cho lợi nhuận tài chính. Khi giá một tài sản (nhà, cổ phiếu, trái phiếu) tăng, người sở hữu ghi nhận lãi vốn KẾ TOÁN — không có tiền nào đổi chủ, nhưng tổng giá trị tài sản danh nghĩa trong nền kinh tế đã tăng lên. Nếu chủ sở hữu BÁN tài sản, khoản lãi TIỀM ẨN (latent) trở thành thu nhập THỰC HIỆN (realized) — còn với người mua, khoản lãi vẫn ở dạng tiềm ẩn, một "ảo ảnh" có thể tan biến nếu giá tài sản sau đó giảm.</p>
      <h3>'Lợi nhuận người sáng lập' — ví dụ điển hình</h3>
      <p>Một công ty khởi nghiệp thuyết phục thị trường rằng nó sẽ có lãi trong tương lai. Khi nhà sáng lập IPO (phát hành cổ phiếu ra công chúng), họ "hiện thực hóa" khoản lãi vốn tiềm ẩn trong cổ phần nắm giữ — đây là "lợi nhuận người sáng lập" (founder's profit), điển hình của lợi nhuận từ chuyển nhượng thuần túy chứ không phải từ sản xuất mới.</p>

        <div class="stat-box"><div class="val">25% / 50% / 70%</div><div class="lbl">Tỷ lệ doanh nghiệp mới thất bại sau 1 / 4 / 10 năm — ngay cả trong thời kỳ tốt</div></div>
      </div>
      <h3>'Đạo hàm bậc nhất, bậc hai' của tư bản thực</h3>
      <p>Giá hầu hết tài sản tài chính bắt nguồn từ khoản LỢI có thể thu được trong tương lai từ chúng: giá đất dựa trên địa tô có thể thu được (mà theo Ricardo, chính địa tô lại dựa trên lợi nhuận có thể tạo ra từ việc sử dụng đất); giá cổ phiếu gắn với lợi nhuận tương lai của công ty phát hành.</p>

    title:"Lý thuyết Lợi nhuận qua Các Trường phái", eng:"VI-VII. Theories of Aggregate Profit; Critical Review",
    body:`
      <p class="lede">Sau khi Steuart (1767) nêu ra hai nguồn lợi nhuận, chỉ 9 năm sau Adam Smith's <i>Wealth of Nations</i> xuất bản đã "chôn vùi" gần như hoàn toàn cái nhìn sâu sắc này — trọng tâm chuyển gần như tuyệt đối sang lợi nhuận từ sản xuất. Marx hồi sinh nó bốn thập kỷ sau, nhưng sau đó lại biến mất khỏi từ điển mácxít vì Engels không chọn đưa nội dung này vào Quyển 2-3 <i>Tư bản</i>.</p>
      <h3>Smith, Ricardo, Marx: lý thuyết sản phẩm thặng dư</h3>
      <p>Smith phân biệt việc SẢN XUẤT sản phẩm ròng ("toàn bộ sản phẩm của lao động") với việc PHÂN CHIA nó — công nhân phải chia sẻ với "chủ sở hữu tư bản" và địa chủ (những người "thích gặt hái nơi họ chưa từng gieo trồng"). Ricardo nhấn mạnh: tỷ lệ trả cho lương "cực kỳ quan trọng" với lợi nhuận — lợi nhuận cao/thấp CHÍNH XÁC tỷ lệ nghịch với lương cao/thấp. Đóng góp riêng của Marx: đưa ĐỘ DÀI VÀ CƯỜNG ĐỘ ngày làm việc vào ngang hàng với mức lương thực trong việc xác định sản phẩm thặng dư.</p>
      <h3>Tân cổ điển: hai lý thuyết lợi nhuận khác nhau</h3>
      <div class="debate-box">
        <div class="dh">CÂU CHUYỆN TRẠI TỊ NẠN CUBA-HUNGARY (ALCHIAN & ALLEN, 1964)</div>
        <div class="db">Trong một trại tị nạn, mỗi người nhận đúng 20 điếu thuốc + 20 thanh sô-cô-la mỗi tuần. Một người tị nạn MỚI đến — "khôn ngoan và am hiểu bản chất con người" — nhận ra: người Hungary "liều lĩnh" thích thuốc lá hơn, người Cuba "vui vẻ" thích sô-cô-la hơn. Anh ta đổi thêm thuốc lá cho người Hungary (lấy sô-cô-la), đổi thêm sô-cô-la cho người Cuba (lấy thuốc lá) — cả hai bên đều hài lòng hơn, còn "người môi giới tài ba" bỏ túi 2 điếu thuốc mỗi giao dịch. Đây là "câu chuyện" tân cổ điển giải thích lợi nhuận thuần túy từ TRAO ĐỔI — không hề đề cập ai đã SẢN XUẤT ra thuốc lá/sô-cô-la đó, hay việc người môi giới ấy có lẽ chính là một GIÁN ĐIỆP am hiểu chiến thuật, không phải một "nhà kinh doanh" trung lập.</div>
      </div>
      <p>Lý thuyết tân cổ điển "quen thuộc" hơn lại dựa vào <b>hàm sản xuất tổng hợp</b> (chương 3 đã gọi đây là "chuyện cổ tích không thuyết phục"): năng suất biên lao động = lương thực, năng suất biên tư bản = tỷ suất lợi nhuận — cả hai đều dương ĐÒI HỎI lương thực PHẢI thấp hơn năng suất bình quân lao động, tức đòi hỏi NGẦM sự tồn tại của lao động thặng dư, dù tân cổ điển không bao giờ gọi tên nó như vậy.</p>
      <h3>Keynes, Kalecki, và hậu-Keynesian</h3>
      <div class="figure-note"><b>Điều gây bất ngờ:</b> dù Keynes coi lợi nhuận là "Cỗ máy điều khiển Doanh nghiệp", tiểu sử gia lỗi lạc Lord Skidelsky ghi nhận: Keynes thậm chí KHÔNG HỀ có một "lý thuyết về điều gì quyết định... tỷ suất sinh lời trên tư bản vật chất" — dù chính lý thuyết đầu tư của ông lại phụ thuộc trực tiếp vào đại lượng này!</div>
      <p>Kalecki làm tốt hơn: mỗi hãng đặt giá bằng markup trên chi phí chính (nguyên liệu+lương), độ lớn markup do "mức độ độc quyền" quyết định — điều này ngầm giả định tỷ trọng lương DƯƠNG và nhỏ hơn 1, tức ngầm giả định có lao động thặng dư dù không nói ra. Nhà kinh tế hậu-Keynesian Palley phê bình: cách tiếp cận của Kalecki "dù đưa giai cấp vào, lại không hề nhắc tới đấu tranh giai cấp dưới hình thức đấu tranh lao động."</p>
      <div class="figure-note"><b>Điểm yếu chung của lý thuyết markup:</b> nếu mức độ độc quyền tiến về 0 (cạnh tranh hoàn hảo), markup tiến về 0, và theo logic Kalecki, lợi nhuận tổng cũng tiến về 0 — ngụ ý phi lý rằng CNTB cạnh tranh không thể sinh lợi nhuận! Markup thực chất chỉ PHÂN PHỐI LẠI lợi nhuận đã tồn tại, không TẠO RA nó.</div>
      <h3>Sraffa và cuộc chiến 'vấn đề chuyển hóa'</h3>
      <p>Sraffa chứng minh (trong khuôn khổ cổ điển): khi xã hội "chỉ sản xuất đủ để tự duy trì" (không thặng dư), không thể có lợi nhuận nào — đúng với KẾT QUẢ ở phần III, nhưng lại trình bày sự xuất hiện thặng dư như một vấn đề THUẦN KỸ THUẬT (tăng sản lượng, không đổi đầu vào), trong khi với Marx đó luôn là vấn đề XÃ HỘI (kéo dài ngày làm việc vượt thời gian tất yếu).</p>
      <div class="debate-box">
        <div class="dh">SỰ CHÂM BIẾM CỦA LỊCH SỬ: SAMUELSON</div>
        <div class="db">Samuelson từng gọi Marx là "một nhà hậu-Ricardo hạng xoàng" (a minor post-Ricardian) — nhưng chính nỗ lực sau đó của ông nhằm biện minh cho hàm sản xuất tổng hợp tân cổ điển lại đòi hỏi một lý thuyết giá trị lao động ĐƠN GIẢN đến mức chính Ricardo (chứ đừng nói Marx) cũng sẽ bác bỏ ngay lập tức! Khi Garegnani chỉ ra điều này, Samuelson đành từ bỏ hẳn công trình đó.</div>
      </div>
      <p>Ba phản ứng trước "vấn đề chuyển hóa" của Marx: <b>(1) Hoàn thiện</b> (Bortkiewicz, Morishima, Shaikh — giải bằng phương pháp lặp hội tụ); <b>(2) Bác bỏ</b> (Samuelson từ cánh hữu; Steedman từ cánh tả dùng khung Sraffa để bác lý thuyết giá trị Marx); <b>(3) Sửa lại định nghĩa</b> ("Diễn giải Mới" — New Interpretation — sau này được chứng minh chỉ là một PHÉP ĐỒNG NHẤT toán học tautological, không thực sự "giải" được gì).</p>
      <div class="figure-note"><b>Tương phản khép lại:</b> Smith, Ricardo, Marx — dù chấp nhận "quyền" của nhà tư bản/địa chủ hưởng lợi nhuận/địa tô — vẫn PHÊ PHÁN gay gắt giai cấp thống trị (Marx: "Tư bản là lao động chết, như ma cà rồng, chỉ sống nhờ hút lao động sống — và sống càng mạnh khi hút được càng nhiều lao động"). Ngược lại, tân cổ điển thường CHÔN VÙI phần giải thích dưới lớp biện minh — hình ảnh "người môi giới lương thiện" của Alchian-Allen là ví dụ điển hình.</div>

  {
    id:"dolương", n:"6", label:"Đo lường Thực nghiệm",
    title:"Đo lường Lợi nhuận và Tư bản: Bằng chứng Thực nghiệm", eng:"VIII. Measurement of Profit and Capital",
    body:`
      <p class="lede">Đo lường thực nghiệm lợi nhuận/tư bản phức tạp không kém lý thuyết — nhưng vì những lý do khác. Nguyên tắc cốt lõi (từ phần III): lợi nhuận kinh tế thực = chênh lệch giữa giá trị tiền tệ tổng sản phẩm và CHI PHÍ HIỆN HÀNH (không phải chi phí lịch sử) của nguyên liệu, khấu hao, lao động. Hệ quả: tư bản cũng phải đo theo CHI PHÍ HIỆN HÀNH, không phải chi phí lịch sử.</p>
      <h3>Những cạm bẫy trong số liệu thống kê chính thức</h3>
      <div class="concept-grid">
        <div class="concept"><span class="term">Điều chỉnh 'chất lượng' bóp méo dữ liệu</span><p>Mục đích chính thức của điều chỉnh chất lượng là làm cho "tư bản thực" tỷ lệ với "lợi nhuận thực" — nhưng trong thực hành, giá trị gia tăng thực thường thay chỗ lợi nhuận thực, khiến tỷ lệ sản lượng/tư bản gần như trở nên KHÔNG ĐỔI một cách nhân tạo — hoàn toàn không phản ánh xu hướng thay đổi công nghệ thực sự.</p></div>
        <div class="concept"><span class="term">Chỉ số chuỗi (chain-weighted) phá vỡ quy tắc cộng dồn</span><p>Phương pháp Kiểm kê Vĩnh viễn (PIM) cũ cho phép cộng dồn tư bản từng loại lên thành tổng dễ dàng; chỉ số chuỗi hiện đại phá vỡ quy tắc này ở cấp tổng hợp — Shaikh phải tự suy ra một bộ quy tắc PIM tổng quát hóa mới để khắc phục.</p></div>
        <div class="concept"><span class="term">Lãi suất 'quy gán' (imputed interest) trong NIPA</span><p>NIPA coi ngân hàng là 'nhà sản xuất dịch vụ ngân hàng', đưa vào các khoản lãi suất quy gán phức tạp — loại bỏ chúng làm tăng ~10% mức đo thặng dư hoạt động ròng năm 2009, dù ảnh hưởng tới giá trị gia tăng chỉ ~1-2%.</p></div>
      </div>

  {sec:"Hai Nguồn gốc LN",q:"Trong ví dụ chiếc TV bị trộm từ hộ gia đình rồi bán lại, vì sao lợi nhuận TỔNG tăng $300?",a:"Vì khoản lỗ ($500) nằm trong 'chu kỳ thu nhập' (hộ gia đình) còn khoản lãi ($300 của chủ tiệm) nằm trong 'chu kỳ tư bản' — hai sổ sách tách biệt, không tự động triệt tiêu nhau khi của cải chuyển từ chu kỳ này sang chu kỳ kia."},
  {sec:"Lao động Thặng dư",q:"Kết quả trung tâm của phần III về mối quan hệ giữa lợi nhuận và lao động thặng dư là gì?",a:"Không thể có lợi nhuận tích cực nếu không có lao động thặng dư — nhưng lợi nhuận tổng vẫn có thể thay đổi khi giá tương đối thay đổi dù sản phẩm thặng dư vật lý không đổi."},
  {sec:"Lao động Thặng dư",q:"'Hạch toán chi phí hiện hành' (current-cost accounting) là gì và dùng để làm gì?",a:"Áp dụng cùng một bộ giá cho cả đầu vào lẫn đầu ra để đo lợi nhuận KINH TẾ thực (phân biệt với lợi nhuận danh nghĩa) — không đòi hỏi giá phải cố định hay cân bằng."},
  {sec:"Giải pháp Chuyển hóa",q:"Kết quả trung tâm của phần IV về mối quan hệ giữa lợi nhuận tổng và sản phẩm thặng dư là gì?",a:"Lợi nhuận sản xuất tổng LUÔN LUÔN là giá tiền tệ của sản phẩm thặng dư — bất kể bộ giá nào (trực tiếp, sản xuất, thị trường) được dùng để định giá nó."},
  {sec:"Giải pháp Chuyển hóa",q:"Hai kênh DUY NHẤT giải thích mọi thay đổi lợi nhuận tổng do giá tương đối là gì?",a:"(1) Chuyển giao KHÔNG GIAN — giữa chu kỳ thu nhập và chu kỳ tư bản; (2) Chuyển giao THỜI GIAN — giữa chi phí hiện tại và tương lai trong nội bộ chu kỳ tư bản."},
  {sec:"Giải pháp Chuyển hóa",q:"Khi nào lợi nhuận tổng HOÀN TOÀN MIỄN NHIỄM với thay đổi giá tương đối?",a:"Khi sản phẩm thặng dư có ĐÚNG cùng tỷ lệ thành phần với tổng sản phẩm — trường hợp giới hạn của tích lũy cân bằng khi toàn bộ giá trị thặng dư được tái đầu tư."},
  {sec:"Lợi nhuận Tài chính",q:"'Lợi nhuận người sáng lập' (founder's profit) là gì?",a:"Khoản lãi vốn hiện thực hóa khi nhà sáng lập công ty khởi nghiệp IPO hoặc bán công ty — ví dụ điển hình của lợi nhuận từ chuyển nhượng thuần túy."},
  {sec:"Lợi nhuận Tài chính",q:"Giá trị phái sinh tài chính toàn cầu 3 năm sau khủng hoảng 2007 lớn gấp bao nhiêu lần GDP thế giới?",a:"23 lần — ước tính $1,4 triệu tỷ (1,4 quadrillion USD) phái sinh tài chính, minh chứng cho hình ảnh 'kim tự tháp ngược' của tư bản tài chính hiện đại."},
  {sec:"Lợi nhuận Tài chính",q:"'Đạo hàm bậc 1' và 'bậc 2' của tư bản thực là gì?",a:"Đạo hàm bậc 1: đất đai/cổ phiếu (giá trị dựa trên lợi nhuận/địa tô tương lai). Đạo hàm bậc 2: phái sinh tài chính (giá trị dựa trên giá tương lai của một tài sản khác)."},
  {sec:"Các Trường phái",q:"Câu chuyện trại tị nạn Cuba-Hungary của Alchian-Allen minh họa lý thuyết lợi nhuận nào?",a:"Lý thuyết tân cổ điển về lợi nhuận thuần túy từ TRAO ĐỔI — người môi giới hưởng lợi nhờ khai thác khác biệt sở thích, không đề cập nguồn gốc sản xuất của hàng hóa."},
  {sec:"Các Trường phái",q:"Theo tiểu sử gia Skidelsky, điều bất ngờ nào về lý thuyết lợi nhuận của Keynes?",a:"Keynes thậm chí KHÔNG có một lý thuyết rõ ràng về điều gì quyết định tỷ suất sinh lời trên tư bản vật chất — dù chính lý thuyết đầu tư của ông lại phụ thuộc trực tiếp vào đại lượng này."},
  {sec:"Các Trường phái",q:"Post-Keynesian Palley phê bình lý thuyết markup của Kalecki như thế nào?",a:"Dù đưa giai cấp vào phân tích, lý thuyết của Kalecki 'không hề nhắc tới đấu tranh giai cấp dưới hình thức đấu tranh lao động'."},
  {sec:"Các Trường phái",q:"Sự châm biếm Samuelson-Garegnani là gì?",a:"Samuelson gọi Marx là 'hậu-Ricardo hạng xoàng', nhưng nỗ lực biện minh hàm sản xuất tổng hợp của chính ông lại cần một lý thuyết giá trị lao động đơn giản đến mức cả Ricardo cũng bác bỏ — Garegnani chỉ ra điều này, buộc Samuelson từ bỏ công trình."},
  {sec:"Các Trường phái",q:"Ba phản ứng chính với 'vấn đề chuyển hóa' của Marx là gì?",a:"Hoàn thiện (Bortkiewicz/Morishima/Shaikh — giải lặp hội tụ), Bác bỏ (Samuelson cánh hữu, Steedman cánh tả), và Sửa định nghĩa (New Interpretation — sau này lộ ra chỉ là phép đồng nhất toán học tautological)."},
  {sec:"Đo lường Thực nghiệm",q:"Vì sao tư bản phải được đo theo chi phí HIỆN HÀNH thay vì chi phí lịch sử?",a:"Hệ quả trực tiếp từ nguyên tắc đo lợi nhuận kinh tế thực (áp dụng cùng giá cho đầu vào/đầu ra) — tư bản phải định giá theo chi phí thay thế hiện tại để tỷ suất lợi nhuận phản ánh đúng khả năng sinh lời thực."},
  {sec:"Đo lường Thực nghiệm",q:"Số liệu 'đã hiệu chỉnh' cho thấy tỷ trọng lợi nhuận Mỹ biến động ra sao qua Thời đại vàng và thời Tân tự do, so với số liệu NIPA thô?",a:"Số liệu hiệu chỉnh ổn định hơn nhiều: giảm NHẸ tới đầu 1980s rồi phục hồi HOÀN TOÀN thời tân tự do. Số liệu NIPA thô sụt gần MỘT NỬA rồi phục hồi kịch tính hơn — phần lớn do biến động lãi suất (3%→14%→~0%), không phải do sản xuất thay đổi tương ứng."}

/* =========================================================
   FLASHCARDS RENDER
   ========================================================= */
var fcOrder = FLASHCARDS.map(function(_,i){return i;});
var fcIndex = 0;
document.getElementById('fcProgress').textContent = 'Thẻ 1 / ' + FLASHCARDS.length;
var flashcardEl = document.getElementById('flashcard');

function renderFlashcard(){
  var card = FLASHCARDS[fcOrder[fcIndex]];
  document.getElementById('fcTag').textContent = card.sec;
  document.getElementById('fcQ').textContent = card.q;
  document.getElementById('fcA').textContent = card.a;
  document.getElementById('fcProgress').textContent = 'Thẻ ' + (fcIndex+1) + ' / ' + FLASHCARDS.length;
  flashcardEl.classList.remove('flipped');
}
function flipFC(){ flashcardEl.classList.toggle('flipped'); }
document.getElementById('fcFlip').addEventListener('click', flipFC);
flashcardEl.addEventListener('click', flipFC);
document.getElementById('fcNext').addEventListener('click', function(){
  fcIndex = (fcIndex+1) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcPrev').addEventListener('click', function(){
  fcIndex = (fcIndex-1+FLASHCARDS.length) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcShuffle').addEventListener('click', function(){
  for(var i=fcOrder.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = fcOrder[i]; fcOrder[i]=fcOrder[j]; fcOrder[j]=tmp;
  }
  fcIndex = 0;
  renderFlashcard();
});
renderFlashcard();

/* =========================================================
   QUIZ RENDER
   ========================================================= */
var quizArea = document.getElementById('quizArea');
var quizAnswers = {};

function renderQuiz(){
  var html = QUIZ.map(function(item, qi){
    var opts = item.opts.map(function(opt, vi){
      return '<div class="q-opt" data-qi="'+qi+'" data-qv="'+vi+'">'+opt+'</div>';
    }).join('');
    return '<div class="q-block" id="qblock-'+qi+'">'+
      '<div class="q-text">'+(qi+1)+'. '+item.q+'</div>'+
      '<div class="q-opts">'+opts+'</div>'+
      '<div class="q-explain" id="qexplain-'+qi+'">'+item.explain+'</div>'+
      '</div>';
  }).join('');
  html += '<div style="text-align:center;margin-top:20px;"><button class="btn primary" id="quizFinish">Xem kết quả</button> <button class="btn" id="quizReset">Làm lại</button></div>';
  html += '<div id="quizResult"></div>';
  quizArea.innerHTML = html;

  quizArea.addEventListener('click', quizClickHandler);
  document.getElementById('quizFinish').addEventListener('click', showQuizScore);
  document.getElementById('quizReset').addEventListener('click', function(){
    quizAnswers = {};
    renderQuiz();
  });
}

function quizClickHandler(e){
  var opt = e.target.closest('.q-opt');
  if(!opt) return;
  var qi = parseInt(opt.dataset.qi, 10);
  var qv = parseInt(opt.dataset.qv, 10);
  quizAnswers[qi] = qv;
  var block = document.getElementById('qblock-'+qi);
  block.querySelectorAll('.q-opt').forEach(function(o){
    o.classList.remove('selected','correct','incorrect');
  });
  var correctIdx = QUIZ[qi].correct;
  block.querySelectorAll('.q-opt').forEach(function(o){
    var v = parseInt(o.dataset.qv,10);
    if(v === correctIdx) o.classList.add('correct');
    else if(v === qv) o.classList.add('incorrect');
  });
  document.getElementById('qexplain-'+qi).classList.add('show');
  updateQuizProgress();
}

function updateQuizProgress(){
  var answered = Object.keys(quizAnswers).length;
  var pct = Math.round(100*answered/QUIZ.length);
  document.getElementById('quizProgressFill').style.width = pct+'%';
}

function showQuizScore(){
  var correct = 0;
  QUIZ.forEach(function(item, qi){
    if(quizAnswers[qi] === item.correct) correct++;
  });
  var pct = Math.round(100*correct/QUIZ.length);
  document.getElementById('quizResult').innerHTML =
    '<div class="quiz-score"><div class="num">'+correct+'/'+QUIZ.length+'</div>'+
    '<div class="lbl">('+pct+'%) — '+ (pct>=80?'Nắm rất vững nội dung!':pct>=50?'Khá tốt, xem lại vài phần.':'Nên đọc lại các phần liên quan.') +'</div></div>';
}
renderQuiz();

/* =========================================================
   NOTES PANEL
   ========================================================= */
var notesFab = document.getElementById('notesFab');
var notesPanel = document.getElementById('notesPanel');
var notesBackdrop = document.getElementById('notesBackdrop');
var notesBody = document.getElementById('notesBody');
var notesTitle = document.getElementById('notesTitle');
var notesFoot = document.getElementById('notesFoot');
var currentNoteTab = 'tubanlagì';
var LS_PREFIX = 'shaikh_ch6_note_';

function isMobile(){ return window.matchMedia('(max-width:640px)').matches; }

function noteLabelFor(id){
  var s = SECTIONS.filter(function(x){return x.id===id;})[0];
  if(s) return s.n + '. ' + s.label;
  if(id === 'gloss') return 'Thuật ngữ';
  if(id === 'flashcards') return 'Thẻ ghi nhớ';
  if(id === 'quiz') return 'Quiz';
  return id;
}

function openNotesFor(id){
  currentNoteTab = id;
  notesTitle.textContent = 'Ghi chú — ' + noteLabelFor(id);
  var saved = localStorage.getItem(LS_PREFIX + id) || '';
  notesBody.innerHTML = saved;
  updateNotesFoot();
}
function updateNotesFoot(){
  var len = notesBody.innerText.trim().length;
  notesFoot.textContent = len + ' ký tự · lưu tự động';
}
function saveCurrentNote(){
  localStorage.setItem(LS_PREFIX + currentNoteTab, notesBody.innerHTML);
  updateNotesFoot();
}
function openNotesPanel(){
  notesPanel.classList.add('open');
  if(isMobile()){ notesBackdrop.classList.add('show'); }
}
function closeNotesPanel(){
  notesPanel.classList.remove('open');
  notesBackdrop.classList.remove('show');
}
notesFab.addEventListener('click', function(){
  if(notesPanel.classList.contains('open')){
    closeNotesPanel();
  } else {
    openNotesFor(currentNoteTab);
    openNotesPanel();
  }
});
document.getElementById('notesClose').addEventListener('click', closeNotesPanel);
notesBackdrop.addEventListener('click', closeNotesPanel);
notesBody.addEventListener('input', saveCurrentNote);
document.querySelectorAll('.notes-toolbar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    var cmd = btn.dataset.cmd;
    notesBody.focus();
    if(cmd.indexOf(':')>-1){
      var parts = cmd.split(':');
      document.execCommand(parts[0], false, parts[1]);
    } else {
      document.execCommand(cmd, false, null);
    }
    saveCurrentNote();
  });
});

activateTab(ALL_TAB_IDS[0]);
</script>
