<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Shaikh — Capitalism: Competition, Conflict, Crises — Chương 13</title>
<style>
:root{
  --bg:#f2ede0;
  --panel:#fffdf8;
  --panel-2:#eef1e8;
  --ink:#211d16;
  --ink-soft:#4c473b;
  --muted:#847b68;
  --line:#dcd0ac;
  --primary:#1f3b5c;
  --primary-dark:#152944;
  --primary-tint:#e1e8ef;
  --gold:#a67f2c;
  --gold-light:#d6b263;
  --green:#2f6b3f;
  --green-tint:#e3ede4;
  --red:#8a2f2f;
  --red-tint:#f0e2e2;
  --dark-bg:#141b22;
  --dark-panel:#1d2731;
  --dark-ink:#eef1e6;
  --dark-line:#324256;
  --shadow:0 6px 24px rgba(20,27,34,0.12);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1000px;margin:0 auto;padding:0 16px 80px;}

.hero{padding:32px 16px 20px;text-align:center;border-bottom:3px double var(--gold);margin-bottom:18px;background:radial-gradient(ellipse at top, rgba(166,127,44,0.08), transparent 60%);}
.hero .kicker{font-family:Georgia,serif;letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700;}
.hero h1{font-size:clamp(22px,4.6vw,34px);margin:8px 0 4px;color:var(--primary-dark);letter-spacing:.005em;line-height:1.25;}
.hero .subtitle{font-size:14.5px;color:var(--ink-soft);font-style:italic;}
.hero .meta{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hero .meta span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);}
.hero .meta a.meta-link{color:var(--primary);text-decoration:none;font-weight:600;}
.hero .meta a.meta-link:hover{background:var(--primary-tint);}


.tabbar-wrap{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:8px;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tabbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;}
.tabbar::-webkit-scrollbar{height:5px;}
.tabbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.tab-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
.tab-btn .n{color:var(--gold);font-weight:800;margin-right:5px;}
.tab-btn:hover{border-color:var(--gold);}
.tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow);}
.tab-btn.active .n{color:var(--gold-light);}

.panel{display:none;animation:fadein .25s ease;}
.panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);}
.card h2{margin:0 0 4px;font-size:21px;color:var(--primary-dark);}
.card .eng-title{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:16px;letter-spacing:.02em;}
.card h3{font-size:15.5px;color:var(--primary);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px;}
.card p{margin:0 0 12px;color:var(--ink);}
.card p:last-child{margin-bottom:0;}
.lede{font-size:16px;color:var(--ink-soft);border-left:3px solid var(--gold);padding-left:14px;margin:6px 0 18px;}

.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0;}
.concept{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.concept .term{font-weight:700;color:var(--primary-dark);font-size:13px;display:block;margin-bottom:4px;}
.concept .term .en{color:var(--gold);font-weight:600;font-size:11px;font-style:italic;}
.concept p{font-size:13px;margin:0;color:var(--ink-soft);}

.figure-note{background:var(--primary-tint);border:1px dashed var(--primary);border-radius:10px;padding:12px 15px;font-size:12.5px;color:var(--primary-dark);margin:14px 0;}
.figure-note b{color:var(--primary-dark);}

.debate-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0;}
.debate-box .dh{background:var(--primary);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.03em;}
.debate-box .db{padding:13px 15px;font-size:13px;color:var(--ink-soft);}
.debate-box .names{color:var(--gold);font-weight:700;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0;}
.stat-box{background:var(--primary-dark);color:#fff;border-radius:10px;padding:13px 14px;text-align:center;}
.stat-box .val{font-size:20px;font-weight:800;color:var(--gold-light);}
.stat-box .lbl{font-size:10.5px;color:#dbe4ee;margin-top:3px;line-height:1.3;}

.dark-panel{background:var(--dark-bg);color:var(--dark-ink);border-radius:12px;padding:20px;margin:16px 0;border:1px solid var(--dark-line);}
.dark-panel h4{margin:0 0 12px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;}
.flow{display:flex;flex-direction:column;gap:0;}
.flow-step{background:var(--dark-panel);border:1px solid var(--dark-line);border-radius:8px;padding:10px 14px;font-size:12.5px;position:relative;}
.flow-step b{color:var(--gold-light);}
.flow-arrow{text-align:center;color:var(--gold);font-size:16px;padding:2px 0;}
.flow-branch{display:flex;gap:10px;margin:2px 0;flex-wrap:wrap;}
.flow-branch>div{flex:1;min-width:150px;}

.chart-panel{background:var(--dark-bg);border:1px solid var(--dark-line);border-radius:12px;padding:18px 18px 14px;margin:16px 0;}
.chart-panel h4{margin:0 0 2px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;}
.chart-panel .chart-sub{font-size:11px;color:#9fb0c2;margin-bottom:10px;font-style:italic;}
.chart-panel svg{width:100%;height:auto;display:block;}

/* ===== Real/reference chart (photo, not illustrative SVG) ===== */
.chart-real{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:10px 0 18px;}
.chart-real-badge{display:inline-block;font-family:Georgia,serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);border-radius:4px;padding:3px 9px;margin-bottom:9px;}
.chart-real img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);}
.chart-real figcaption{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.55;font-style:italic;}

.chart-note{font-size:10.5px;color:#8496a8;margin-top:6px;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dark-ink);}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:12px;height:3px;display:inline-block;border-radius:2px;}

.bar-chart{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-label{width:170px;font-size:11.5px;color:var(--dark-ink);flex-shrink:0;}
.bar-track{flex:1;background:#2a3644;border-radius:6px;overflow:hidden;height:22px;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;color:#241d10;font-weight:700;}

.gloss-item{border-bottom:1px solid var(--line);padding:12px 0;}
.gloss-item:last-child{border-bottom:none;}
.gloss-term{font-weight:700;color:var(--primary-dark);font-size:14px;}
.gloss-term .en{color:var(--gold);font-weight:600;font-size:11.5px;font-style:italic;margin-left:6px;}
.gloss-def{font-size:13px;color:var(--ink-soft);margin-top:3px;}

.gloss-extra-row{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.gloss-extra-row .en{flex:1;color:var(--ink-soft);font-style:italic;}
.gloss-extra-row .vi{flex:1;color:var(--primary-dark);font-weight:600;}


.fc-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.fc-progress{font-size:13px;color:var(--muted);}
.fc-stage{display:flex;justify-content:center;margin:10px 0 20px;perspective:1400px;}
.flashcard{width:100%;max-width:560px;height:270px;position:relative;cursor:pointer;}
.flashcard .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flashcard.flipped .fc-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);}
.fc-front{background:var(--panel);}
.fc-front .fc-tag{position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;font-weight:700;}
.fc-front .fc-q{font-size:17px;color:var(--ink);font-weight:600;}
.fc-back{background:var(--primary);color:#fff;transform:rotateY(180deg);}
.fc-back .fc-a{font-size:14px;}
.fc-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;}
.fc-nav{display:flex;justify-content:center;gap:10px;margin-top:16px;}
.btn{border:1px solid var(--primary);background:var(--panel);color:var(--primary-dark);font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--primary);color:#fff;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-dark);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.quiz-progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--primary));transition:width .3s;}
.q-block{margin-bottom:14px;}
.q-text{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;}
.q-opts{display:flex;flex-direction:column;gap:8px;}
.q-opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer;transition:all .15s;}
.q-opt:hover{border-color:var(--gold);}
.q-opt.selected{border-color:var(--primary);background:var(--primary-tint);}
.q-opt.correct{border-color:var(--green);background:var(--green-tint);color:#1c4a28;font-weight:700;}
.q-opt.incorrect{border-color:var(--primary);background:#f3e6e6;color:#7a2020;font-weight:700;}
.q-explain{margin-top:10px;font-size:12.5px;color:var(--ink-soft);background:var(--panel-2);border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 8px 8px 0;display:none;}
.q-explain.show{display:block;}
.quiz-score{text-align:center;padding:30px 20px;}
.quiz-score .num{font-size:46px;font-weight:800;color:var(--primary);}
.quiz-score .lbl{font-size:14px;color:var(--muted);margin-bottom:18px;}

.notes-fab{position:fixed;right:22px;bottom:22px;z-index:50;background:var(--primary);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 8px 20px rgba(21,41,68,0.35);cursor:pointer;display:flex;align-items:center;gap:7px;}
.notes-backdrop{position:fixed;inset:0;background:rgba(15,18,22,0.45);z-index:60;display:none;}
.notes-backdrop.show{display:block;}
.notes-panel{position:fixed;top:0;right:0;height:100%;width:380px;max-width:88vw;background:var(--panel);z-index:70;box-shadow:-10px 0 30px rgba(0,0,0,0.2);transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;}
.notes-panel.open{transform:translateX(0);}
.notes-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.notes-head h4{margin:0;color:var(--primary-dark);font-size:14.5px;}
.notes-head .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.notes-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;}
.notes-toolbar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.notes-toolbar button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;width:30px;height:30px;cursor:pointer;font-family:Georgia,serif;font-size:14px;color:var(--ink);}
.notes-toolbar button:hover{border-color:var(--gold);}
.notes-body{flex:1;padding:16px 18px;overflow-y:auto;outline:none;font-size:14px;line-height:1.7;}
.notes-body:empty:before{content:"Ghi chú của bạn cho phần này... (tự động lưu)";color:var(--muted);font-style:italic;}
.notes-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);}

@media (max-width:640px){
  .hero{padding:22px 12px 14px;}
  .card{padding:16px 15px;}
  .flashcard{height:250px;}
  .notes-panel{width:100%;max-width:100%;}
}
@media print{
  .tabbar-wrap,.notes-fab,.notes-panel,.notes-backdrop,.fc-nav,.q-opts{display:none !important;}
  .panel{display:block !important;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
}
</style>
</head>

<script>
/* =========================================================
   MINI CHART HELPER
   ========================================================= */
function sparkPath(values, w, h, pad, minmax){
  var n = values.length;
  var min, max;
  if(minmax){ min = minmax[0]; max = minmax[1]; }
  else { min = Math.min.apply(null, values); max = Math.max.apply(null, values); }
  var range = (max - min) || 1;
  var pts = values.map(function(v, i){
    var x = pad + (i/(n-1)) * (w - 2*pad);
    var y = pad + (1 - (v - min)/range) * (h - 2*pad);
    return [x,y];
  });
  var d = 'M ' + pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L ');
  var area = d + ' L ' + pts[pts.length-1][0].toFixed(1) + ',' + (h-pad) + ' L ' + pts[0][0].toFixed(1) + ',' + (h-pad) + ' Z';
  return {line:d, area:area, pts:pts};
}
function renderLineChart(containerId, series, opts){
  opts = opts || {};
  var w = opts.w || 400, h = opts.h || 120, pad = opts.pad || 8;
  var minmax = null;
  if(opts.shared){
    var allVals = [];
    series.forEach(function(s){ allVals = allVals.concat(s.values); });
    minmax = [Math.min.apply(null, allVals), Math.max.apply(null, allVals)];
  }
  var svg = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  if(opts.zeroLine){
    var zy = pad + (1 - (0 - minmax[0])/((minmax[1]-minmax[0])||1)) * (h - 2*pad);
    svg += '<line x1="'+pad+'" y1="'+zy.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+zy.toFixed(1)+'" stroke="#4a5a6c" stroke-width="1" stroke-dasharray="2,3"/>';
  }
  series.forEach(function(s){
    var r = sparkPath(s.values, w, h, pad, minmax);
    if(s.fill !== false){
      svg += '<path d="'+r.area+'" fill="'+(s.color||'#a67f2c')+'" opacity="0.12"></path>';
    }
    svg += '<path d="'+r.line+'" fill="none" stroke="'+(s.color||'#a67f2c')+'" stroke-width="'+(s.width||2)+'" vector-effect="non-scaling-stroke" '+(s.dash?'stroke-dasharray="'+s.dash+'"':'')+'></path>';
  });
  svg += '</svg>';
  var el = document.getElementById(containerId);
  if(el) el.innerHTML = svg;
}
function renderScatter(containerId, points, opts){
  opts = opts || {};
  var w = opts.w || 400, h = opts.h || 220, pad = 26;
  var xs = points.map(function(p){return p[0];}), ys = points.map(function(p){return p[1];});
  var xmin=Math.min.apply(null,xs), xmax=Math.max.apply(null,xs);
  var ymin=Math.min.apply(null,ys), ymax=Math.max.apply(null,ys);
  var sx = function(x){ return pad + (x-xmin)/(xmax-xmin||1)*(w-2*pad); };
  var sy = function(y){ return h-pad - (y-ymin)/(ymax-ymin||1)*(h-2*pad); };
  var svg = '<svg viewBox="0 0 '+w+' '+h+'">';
  svg += '<line x1="'+pad+'" y1="'+pad+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#5a6a7c" stroke-width="1" stroke-dasharray="3,3"/>';
  points.forEach(function(p){
    var c = p[2] || opts.color || '#d6b263';
    svg += '<circle cx="'+sx(p[0]).toFixed(1)+'" cy="'+sy(p[1]).toFixed(1)+'" r="3.4" fill="'+c+'" opacity="0.85"/>';
  });
  svg += '</svg>';
  var el = document.getElementById(containerId);
  if(el) el.innerHTML = svg;
}

/* =========================================================
   DATA — SECTIONS (tabs 0-6)
   ========================================================= */
var SECTIONS = [
  {
    id:"nhapmon13", n:"0", label:"Nhập môn & Mâu thuẫn Keynes",
    title:"Nhập môn: Xem lại Lý thuyết Cầu Hiệu quả", eng:"I, II.1. Introduction; A Reconsideration of the Theory of Effective Demand",
    body:`
      <p class="lede">Chương 12 mở Phần III bằng phân tích và phê phán kinh tế học vĩ mô chính thống. Chương này xây dựng khung phân tích riêng của Shaikh cho động lực học vĩ mô cổ điển — nền móng cho các chương về việc làm-thất nghiệp (14), lạm phát (15), và khủng hoảng (16).</p>
      <h3>Khái niệm trung tâm: tăng trưởng do tỷ suất lợi nhuận ròng KỲ VỌNG dẫn dắt</h3>
      <p>Tốc độ tăng trưởng tư bản được dẫn dắt bởi tỷ suất lợi nhuận ròng KỲ VỌNG — chênh lệch giữa tỷ suất lợi nhuận kỳ vọng và lãi suất. Chính mệnh đề này là trung tâm của CẢ lý thuyết cầu hiệu quả của Keynes (ch.12) LẪN của Kalecki (1937). Nhưng có một khác biệt quyết định: trong truyền thống cổ điển, tỷ suất lợi nhuận KỲ VỌNG được liên kết với tỷ suất lợi nhuận THỰC TẾ theo cách tương tự lý thuyết phản thân của Soros — trong khi ở Keynes, tỷ suất lợi nhuận kỳ vọng bị bỏ "lơ lửng trên không" (hanging in the air) vĩnh viễn, nằm ngoài phạm vi "ngắn hạn" mà ông tập trung phân tích.</p>
      <h3>Mâu thuẫn nội tại nổi tiếng trong "Lý thuyết Tổng quát" của Keynes</h3>
      <p>Do hoàn cảnh kinh tế thập niên 1930, Keynes đã vội vã hoàn thành "Lý thuyết Tổng quát" (GT) để kịp xuất bản — không ngạc nhiên khi văn bản chứa những mâu thuẫn nội tại. Ở phía CUNG, Keynes áp dụng "định đề thứ nhất" tân cổ điển: doanh nghiệp cạnh tranh hoàn hảo coi giá thị trường kỳ vọng là CHO TRƯỚC, chọn sản lượng tối đa hóa lợi nhuận — nghĩa là doanh nghiệp KHÔNG tính tới cầu thị trường vì tin có thể bán hết sản lượng ở bất kỳ giá nào. Nhưng khi chuyển sang hàm CẦU tổng hợp, Keynes lại giả định các doanh nghiệp cá nhân CÓ tính tới cầu cho sản phẩm riêng của mình — như Asimakopulos nhận xét, "đây là một quan hệ không đúng với doanh nghiệp cạnh tranh hoàn hảo". Nói cách khác: phía cung của Keynes giả định đường cầu NẰM NGANG (cạnh tranh hoàn hảo); phía cầu lại ngầm giả định đường cầu DỐC XUỐNG — hai giả định hoàn toàn MÂU THUẪN nhau trong cùng một lý thuyết.</p>
      <div class="figure-note"><b>Bằng chứng rõ ràng nhất từ chính lời Keynes:</b> trong hai bài báo viết sau GT, Keynes làm rõ hơn nghịch lý này khi nói doanh nghiệp phải "cố gắng dự báo cầu... bằng phương pháp thử-và-sai. Thu hẹp sản xuất khi thấy mình đang bán vượt quá thị trường, mở rộng khi ngược lại. Điều này tương ứng chính xác với việc mặc cả trên thị trường mà qua đó người mua và người bán cố gắng khám phá vị trí cân bằng thực sự của cung và cầu." Đây RÕ RÀNG là khái niệm CỔ ĐIỂN về cân bằng hỗn loạn, cân bằng đạt được QUA những sai số — không phải khái niệm tân cổ điển về cân bằng như một trạng thái nghỉ.</p>
      <h3>Vì sao Keynes không chuyển sang cạnh tranh không hoàn hảo?</h3>
      <p>Snowdon và Vane tự hỏi tại sao Keynes không dựa vào lý thuyết cạnh tranh không hoàn hảo mà các học trò như Kahn và Robinson đang phát triển — nếu làm vậy, họ cho rằng GT có thể đã rất khác, gần với Kalecki và truyền thống hậu-Keynesian hơn. Canterbery còn kết luận nếu Keynes còn sống ngày nay, ông "nhiều khả năng sẽ là một nhà Hậu-Keynesian".</p>
      <div class="debate-box">
        <div class="dh">CÁCH ĐỌC KHÁC CỦA SHAIKH: KEYNES ĐANG VẬT LỘN VỚI CẠNH TRANH THỰC</div>
        <div class="db">Shaikh lập luận ngược lại: Keynes bác bỏ cạnh tranh KHÔNG hoàn hảo vì ông đang cố gắng diễn đạt một khái niệm GẦN với cạnh tranh THỰC cổ điển hơn. Keynes xây dựng lập luận GT trên sự tồn tại của "cạnh tranh nguyên tử" (atomistic competition) chính vì ông khẳng định CHÍNH cạnh tranh (không cần bất kỳ khiếm khuyết nào) có thể tạo ra thất nghiệp DAI DẲNG. Thật vậy, Keynes "kiên quyết phản đối các lý thuyết" quy thất nghiệp cho lương cứng nhắc, độc quyền, công đoàn, luật lương tối thiểu hay các ràng buộc thể chế khác lên hành vi tối đa hóa thỏa dụng của cá nhân (Leijonhufvud 1967). Davidson đúng đắn khẳng định lý thuyết cầu hiệu quả của Keynes KHÔNG cần tới "khiếm khuyết" thị trường. Ngay cả Kalecki cũng ban đầu xây dựng lý thuyết cầu hiệu quả trên giả định "cạnh tranh tự do" thuần túy. Vậy mà cả những người phê phán Keynes LẪN những người kế thừa ông (Kalecki) đều khăng khăng đặt nền lý thuyết cầu hiệu quả trên các "khiếm khuyết" cạnh tranh khác nhau — đơn giản vì khái niệm cạnh tranh DUY NHẤT họ biết tới là cạnh tranh hoàn hảo.</div>
      </div>
      <p>Shaikh đã chứng minh (chương 7-8) lý thuyết cạnh tranh hoàn hảo tự mâu thuẫn nội tại vì đòi hỏi doanh nghiệp vừa biết mọi thứ vừa không biết rằng khi họ hành động để tăng sản lượng, những "người anh em sinh đôi" giống hệt họ cũng sẽ làm điều tương tự và kéo giá thị trường xuống. Ngược lại, trong cạnh tranh THỰC, doanh nghiệp cá nhân đặt giá với nhận thức THỰC TIỄN rằng mỗi doanh nghiệp đối mặt một đường cầu dốc xuống — nên Keynes HOÀN TOÀN ĐÚNG khi nói doanh nghiệp cá nhân phải "ý thức về cầu". Andrews, Brunner, và Harrod (ch.7, mục VI) cũng đi tới đúng kết luận này. Kalecki, ngược lại, hoàn toàn né tránh vấn đề cầu ở cấp doanh nghiệp, chỉ tập trung vào định giá markup.</p>

    body:`
      <p class="lede">Số nhân Keynesian-Kaleckian thường được trình bày như một quan hệ cân bằng tức thời — nhưng thực chất đó là một CHUỖI theo thời gian, với những hệ quả bị bỏ qua rất quan trọng.</p>
      <h3>Số nhân như một chuỗi theo thời gian</h3>
      <p>Khi đầu tư tăng thêm ΔI, khoảng cách tài trợ (đầu tư vượt tiết kiệm) được lấp đầy bởi TÍN DỤNG NGÂN HÀNG mới (cả Keynes lẫn Kalecki đều ngầm giả định điều này). Injection sức mua mới tạo ra cầu vượt trội, thúc đẩy sản lượng/thu nhập tăng — thu nhập tăng lại kéo tiêu dùng tăng theo xu hướng tiêu dùng biên, tạo vòng lặp tiếp theo... Tổng cộng qua vô số vòng, ta có công thức số nhân chuẩn. Nhưng đây là một QUÁ TRÌNH diễn ra qua thời gian — với tốc độ phản ứng từng kỳ hữu hạn — Hình 13.1-13.2 minh họa: ngay cả với tham số phản ứng cao (0,8), phải mất khoảng 24 "kỳ" để hệ thống điều chỉnh về mức cân bằng mới. Bản thân Keynes ý thức được chiều thời gian này nhưng "chuyển đổi qua lại" giữa các khung thời gian quan sát khác nhau một cách không nhất quán — điều mà Asimakopulos gọi là "nguồn sai lầm tiềm tàng" ngay trong tư duy của chính Keynes.</p>
      <h3>Tín dụng là nhiên liệu, nợ là hệ quả — và ẩn ý "tài trợ Ponzi"</h3>
      <p>Câu hỏi hóc búa: nếu đầu tư CÓ THỂ lớn hơn tiết kiệm, tiền thừa đó đến từ đâu? Cả Keynes lẫn Kalecki, sau khi xuất bản các tác phẩm chính, mới thừa nhận họ đã ngầm giả định khoảng cách tài trợ được lấp đầy bởi tín dụng ngân hàng "sẵn có tự do" theo lãi suất hiện hành. Nền tảng THỰC SỰ của số nhân — và do đó của Nghịch lý Tiết kiệm — hóa ra là một khoản BƠM sức mua được tạo ra bởi việc MỞ RỘNG TÍN DỤNG NGÂN HÀNG tự động. Cùng nguyên tắc áp dụng cho thâm hụt ngân sách nhà nước và thặng dư xuất khẩu.</p>
      <div class="figure-note"><b>Phát hiện ít được chú ý: mỗi vòng số nhân = mỗi khoản NỢ MỚI của doanh nghiệp.</b> Vì thay đổi sản lượng mỗi kỳ chính là thay đổi NỢ NGÂN HÀNG của doanh nghiệp trong kỳ đó, toàn bộ câu chuyện số nhân ngụ ý rằng tổng mức TĂNG nợ doanh nghiệp CHÍNH XÁC bằng tổng mức TĂNG sản lượng. Nhưng tín dụng ngân hàng đi kèm nghĩa vụ trả LÃI và GỐC — nên nếu một phần lợi nhuận giữ lại của doanh nghiệp phải dành cho trả nợ, khoảng cách tài trợ (và tín dụng mới cần thiết) sẽ LỚN HƠN; ngược lại nếu toàn bộ tiết kiệm doanh nghiệp dùng cho đầu tư, tín dụng mới phải bù đắp cả nghĩa vụ trả nợ. Trong CẢ hai trường hợp, câu chuyện số nhân chuẩn ngầm đòi hỏi một hình thức "tài trợ Ponzi" (Ponzi finance) cho MỌI thay đổi đầu tư — một hệ quả logic ít khi được chỉ ra rõ ràng trong các sách giáo khoa.</div>
      <h3>Ý nghĩa của tỷ lệ tiết kiệm CỐ ĐỊNH trong lý thuyết Keynesian</h3>
      <p>Toàn bộ quá trình số nhân phụ thuộc quyết định vào giả định tỷ lệ tiết kiệm ĐỘC LẬP với khoảng cách tài trợ đầu tư-tiết kiệm. Xét trường hợp NGƯỢC LẠI: nếu khoảng cách đầu tư-tiết kiệm khiến tỷ lệ tiết kiệm TỰ ĐỘNG tăng đủ để lấp đầy khoảng cách đó — số nhân sẽ bằng KHÔNG! Đây chính là TRƯỜNG HỢP CỔ ĐIỂN.</p>

    title:"Mức Sử dụng Năng lực, Con đường Harrod, và \u201cSố nhân Siêu việt\u201d", eng:"II.5, 8. Actual vs Normal Capacity Utilization; the Sraffian Supermultiplier Debate",
    body:`
      <p class="lede">Lập luận Keynesian tĩnh tại chuẩn hàm chứa một mâu thuẫn tồn kho-dòng chảy nghiêm trọng — và cách giải quyết nó dẫn thẳng tới một trong những tranh luận lý thuyết sâu sắc nhất của kinh tế học hậu-Keynesian hiện đại.</p>
      <h3>Mâu thuẫn tồn kho-dòng chảy trong lập luận Keynesian tĩnh</h3>
      <p>Một tỷ suất lợi nhuận ròng kỳ vọng cho trước ngụ ý một MỨC đầu tư cho trước, và do đó một MỨC sản lượng cân bằng cho trước. Vấn đề: đầu tư cũng mở rộng KHO TƯ BẢN, do đó mở rộng NĂNG LỰC sản xuất. Với sản lượng cân bằng cố định nhưng năng lực liên tục tăng, tỷ lệ sử dụng năng lực PHẢI liên tục giảm — lập luận tĩnh này KHÔNG nhất quán về mặt tồn kho-dòng chảy.</p>
      <h3>Cách sửa của Robinson: "animal spirits" quyết định TỐC ĐỘ TĂNG TRƯỞNG, không phải MỨC</h3>
      <p>Robinson (1962) sửa lỗi này bằng cách để TỐC ĐỘ TÍCH LŨY (không phải MỨC đầu tư) trở thành hàm của tỷ suất lợi nhuận ròng kỳ vọng — đây chính XÁC là lập luận cổ điển. Khi đó, một mức lợi nhuận kỳ vọng nhất định ("animal spirits") ngụ ý một tốc độ tăng trưởng tư bản nhất định, từ đó ngụ ý một tỷ lệ sử dụng năng lực ỔN ĐỊNH — giải quyết được vấn đề tỷ lệ sử dụng giảm liên tục.</p>
      <h3>Thế bế tắc Harrod: lợi nhuận-dẫn-dắt vs năng-lực-bình-thường</h3>
      <p>Nhưng KHÔNG có lý do gì mức sản lượng do "animal spirits" tạo ra lại trùng khớp với sản lượng năng lực THÔNG THƯỜNG. Harrod (1939) — chỉ ba năm sau GT — đã chỉ ra: CHỈ MỘT tốc độ tích lũy duy nhất (gọi là tốc độ "được đảm bảo" — warranted) mới nhất quán với mức sử dụng năng lực THÔNG THƯỜNG, và tốc độ đó hoàn toàn do TỶ LỆ TIẾT KIỆM và điều kiện sản xuất quyết định — KHÔNG liên quan gì tới lợi nhuận kỳ vọng.</p>
      <div class="debate-box">
        <div class="dh">THẾ BẾ TẮC: HAI LẬP LUẬN KHÔNG TƯƠNG THÍCH</div>
        <div class="db">Nếu lợi nhuận kỳ vọng dẫn dắt tích lũy (như cổ điển và Keynes), tỷ lệ sử dụng năng lực NÓI CHUNG sẽ khác mức thông thường. Ngược lại, nếu tích lũy phải duy trì mức sử dụng năng lực thông thường (như cổ điển và Harrod), tốc độ tích lũy lại do tỷ lệ tiết kiệm và điều kiện sản xuất quyết định — KHÔNG liên quan lợi nhuận kỳ vọng. Đây chính là chỗ mà TÍNH NỘI SINH của tỷ lệ tiết kiệm (tab trước) mở ra một chiều thứ hai: nó cho phép tích lũy được dẫn dắt bởi lợi nhuận kỳ vọng MÀ VẪN giữ tỷ lệ sử dụng năng lực bình thường trong DÀI HẠN (Shaikh 2009).</div>
      </div>
      <h3>Cầu ngoại sinh trong hệ thống Harrod và cuộc tranh luận "Số nhân Siêu việt Sraffa"</h3>
      <p>Trong câu chuyện Keynesian truyền thống, đầu tư ngoại sinh, tỷ lệ tiết kiệm cho trước → tăng trưởng sản lượng đến từ tăng trưởng CẦU ngoại sinh. Harrod lật đổ tuyên bố này: dù đầu tư có vẻ ngoại sinh trong ngắn hạn, nó thực chất NỘI SINH trong dài hạn vì thích ứng để xóa bỏ chênh lệch giữa mức sử dụng năng lực thực tế và thông thường — tăng trưởng tư bản chủ nghĩa được dẫn dắt từ BÊN TRONG, không phải bên ngoài. Điểm đáng chú ý: hiệu ứng NGẮN HẠN của việc giảm tỷ lệ tiết kiệm là NÂNG mức sản lượng (qua số nhân), nhưng hiệu ứng DÀI HẠN lại là HẠ tốc độ tăng trưởng "được đảm bảo" nội sinh!</p>
      <p>Khi thêm cầu chính phủ/xuất khẩu ngoại sinh tăng trưởng vào hệ thống Harrod, kết quả phụ thuộc vào việc tốc độ tăng trưởng của cầu ngoại sinh đó so với tốc độ "được đảm bảo" sẵn có ra sao: nếu THẤP hơn, nó sẽ NÂNG tăng trưởng sản lượng dài hạn; nếu CAO hơn, nó sẽ HẠ tăng trưởng dài hạn — điều "đạt được trong ngắn hạn sẽ MẤT ĐI trong dài hạn". Chỉ khi tốc độ tăng trưởng cầu ngoại sinh BẰNG tốc độ được đảm bảo sẵn có, tỷ trọng của nó mới ổn định (đây tương ứng "giả thuyết Cambridge Mới" của Godley: thâm hụt ngân sách = thâm hụt thương mại — "song sinh thâm hụt").</p>
      <div class="figure-note"><b>Phán quyết của Shaikh về "Số nhân Siêu việt": tăng trưởng không bao giờ do CẦU dẫn dắt, chỉ SỬA ĐỔI bởi cầu.</b> Serrano (1995) — người đặt tên "Số nhân Siêu việt Sraffa" (dù thừa nhận bản thân Sraffa không hề đề xuất ý tưởng này — Shaikh mỉa mai lẽ ra nên gọi là "số nhân siêu việt Ricardo" mới đúng) — lập luận rằng khi có một mức cầu tự chủ dương và mức sử dụng năng lực giữ ở mức thông thường, toàn bộ nền kinh tế có thể coi là "do cầu dẫn dắt". Shaikh phản bác: hệ thống Harrod THUẦN TÚY KHÔNG do cầu dẫn dắt chính vì đầu tư là NỘI SINH — cầu ngoại sinh chỉ SỬA ĐỔI tốc độ tăng trưởng được đảm bảo hoặc để nó KHÔNG ĐỔI, theo chiều NGƯỢC với xung lực tăng trưởng của chính cầu ngoại sinh đó. Vì vậy: tăng trưởng sản lượng KHÔNG BAO GIỜ do cầu dẫn dắt — cùng lắm chỉ là do cầu SỬA ĐỔI (demand-modified).</div>
      <p>Một số tác giả hậu-Keynesian lập luận tốc độ tăng trưởng cầu ngoại sinh khác tốc độ "thuần túy" đòi hỏi mức sử dụng năng lực phải khác mức thông thường — kết luận hậu-Keynesian tiêu chuẩn (đã gặp ở ch.12). Shaikh chỉ ra điều này KHÔNG đúng trong trường hợp hiện tại, vì tốc độ được đảm bảo TỔNG QUÁT (không phải "thuần túy") vẫn có thể biến đổi theo tốc độ tăng trưởng cầu ngoại sinh dù tốc độ "thuần túy" không đổi. Nhưng khác biệt SÂU HƠN với khung Harrod/hậu-Keynesian: ở Shaikh, tích lũy được dẫn dắt bởi LỢI NHUẬN RÒNG KỲ VỌNG và tỷ lệ tiết kiệm là NỘI SINH — hai đặc điểm không có trong cả hai truyền thống kia.</p>

    body:`
      <p class="lede">Đây là một trong những kết quả lý thuyết sâu sắc và ít được nhận ra nhất của toàn chương: sự khác biệt giữa cách Keynes và cách cổ điển mô hình hóa phản ứng của đầu tư trước lợi nhuận kỳ vọng dẫn tới hai bức tranh HOÀN TOÀN khác nhau về việc các cú sốc kinh tế ảnh hưởng nền kinh tế ra sao — MÃI MÃI, hay chỉ TẠM THỜI.</p>
      <h3>Quan hệ phản thân giữa kỳ vọng và thực tế</h3>
      <p>Ở Keynes và Kalecki, đầu tư phụ thuộc quyết định vào khoảng cách giữa tỷ suất lợi nhuận kỳ vọng và lãi suất. Kalecki không phát triển liên kết giữa tỷ suất kỳ vọng và thực tế; Keynes có bàn nhưng nổi tiếng không rõ ràng. Lý thuyết phản thân của Soros giả định kỳ vọng có thể ảnh hưởng thực tế, và ngược lại, khiến hai biến số dao động hỗn loạn quanh một "trung tâm hấp dẫn được xây dựng chung" — đây rõ ràng là quan niệm chung của cả Marx LẪN Keynes.</p>
      <h3>Nguyên lý ổn định tồn kho-dòng chảy của Hicks</h3>
      <p>Khi cầu là một MỤC TIÊU DI ĐỘNG (không cố định), quá trình số nhân cần biểu diễn qua tỷ lệ và tốc độ tăng trưởng: doanh nghiệp mở rộng sản lượng dựa trên tăng trưởng CẦU KỲ VỌNG, có điều chỉnh theo mức cầu vượt trội hiện tại; kỳ vọng đại khái đúng theo nghĩa hỗn loạn (có sai số). Shaikh chứng minh về mặt toán học rằng quá trình điều chỉnh ngắn hạn này HOÀN TOÀN ỔN ĐỊNH — đây là hình thức hóa nguyên lý điều chỉnh tồn kho-dòng chảy của Hicks (1985). Cùng nguyên lý này cũng chứng minh được tính ổn định của điều chỉnh Harrod (sản lượng hướng theo năng lực) — KHÔNG có "lưỡi dao cân bằng" (knife-edge) nào trong con đường được đảm bảo của Harrod như một số cách hiểu sai lầm phổ biến vẫn cho rằng.</p>
      <h3>KHÁC BIỆT CỐT LÕI: Keynesian (mức tĩnh tại) vs Cổ điển (tốc độ tăng trưởng phản ứng)</h3>
      <div class="debate-box">
        <div class="dh">MỘT SỰ KHÁC BIỆT LÝ THUYẾT CÓ HỆ QUẢ SÂU RỘNG</div>
        <div class="db">Trong khung Keynesian, MỨC đầu tư (không phải tốc độ tăng trưởng của nó) là hàm của lợi nhuận ròng kỳ vọng. Nếu lợi nhuận ròng kỳ vọng là DỪNG (stationary — dao động quanh một giá trị không đổi), thì đầu tư, sản lượng, và việc làm CŨNG PHẢI dừng — output đi theo một XU HƯỚNG TẤT ĐỊNH (deterministic trend), một cú sốc TẠM THỜI trong lợi nhuận kỳ vọng chỉ có hiệu ứng TẠM THỜI lên mức sản lượng (đúng như Hình 13.1-13.2 minh họa). Ngược lại, trong khung CỔ ĐIỂN (Shaikh, Robinson, Harrod): chính TỐC ĐỘ TĂNG TRƯỞNG của tư bản (không phải mức đầu tư) là hàm của lợi nhuận kỳ vọng. Ngay cả khi tốc độ tăng trưởng này DỪNG quanh một hằng số, kết quả (theo đại số logarit đơn giản) là log của kho tư bản đi theo một XU HƯỚNG NGẪU NHIÊN (stochastic trend) — một "quá trình nghiệm đơn vị" (unit root process, Nelson-Plosser 1982). Hệ quả kịch tính: MỘT CÚ SỐC TẠM THỜI trong lợi nhuận kỳ vọng sẽ THAY ĐỔI VĨNH VIỄN mức sản lượng và việc làm — thông qua một thay đổi TẠM THỜI trong tốc độ tăng trưởng của chúng!</div>
      </div>
      <div class="chart-panel">
        <h4>Minh họa: Hai Bức tranh về Hiệu ứng của một Cú sốc Lợi nhuận Tạm thời</h4>
        <div class="chart-sub">Dựa trên logic Hình 13.1, 13.2, và 13.9 (dữ liệu minh họa cho ý tưởng, không phải số liệu chính xác)</div>
        <div id="chart-hysteresis"></div>
        <div class="chart-legend"><span><i style="background:#c96a6a"></i>Keynesian: mức sản lượng quay về xu hướng cũ</span><span><i style="background:#d6b263"></i>Cổ điển: mức sản lượng CHUYỂN VĨNH VIỄN lên mức mới</span></div>
        <div class="chart-note">Cùng một cú sốc lợi nhuận TẠM THỜI — nhưng vì khung cổ điển để TỐC ĐỘ TĂNG TRƯỞNG (không phải MỨC) phản ứng, hiệu ứng lên mức sản lượng trở thành VĨNH VIỄN (hiện tượng "trễ" — hysteresis) — một khác biệt lý thuyết với hệ quả thực nghiệm to lớn.</div>
      </div>
      <p>Đây là một kết quả có ý nghĩa thực nghiệm sâu rộng: từ Nelson và Plosser (1982), tài liệu kinh tế lượng đã xác lập rằng nhiều chuỗi số liệu kinh tế phù hợp hơn với đặc tả "quá trình nghiệm đơn vị" — một phát hiện mà lý thuyết cổ điển của Shaikh giải thích TỰ NHIÊN từ chính cấu trúc mô hình, trong khi các trường phái Keynesian, Monetarist, Tân Cổ điển Mới trước đó đều có xu hướng coi sản lượng đi theo một xu hướng tất định TRƠN TRU độc lập với các biến động quanh nó.</p>
      <h3>Tính nội sinh của cung tiền và hàm ý cho lý thuyết lãi suất</h3>
      <p>Trong GT, Keynes giả định cung tiền do nhà chức trách tiền tệ ấn định — nhưng ông đã ngầm thừa nhận (như đã thấy) rằng khoảng cách đầu tư-tiết kiệm được lấp đầy bởi tín dụng ngân hàng tại BẤT KỲ lãi suất cho trước nào — nghĩa là cung tiền biến đổi TRỰC TIẾP theo cầu tín dụng, tức là NỘI SINH. Điều này MÂU THUẪN với chính nền tảng của cấu trúc LM: một khi cung tiền nội sinh, sở thích thanh khoản KHÔNG ĐỦ để xác định lãi suất — cần một cơ chế khác. Trường phái hậu-Keynesian đề xuất: ngân hàng trung ương ấn định lãi suất CƠ SỞ, ngân hàng tư nhân cộng thêm markup độc quyền — nhưng điều này không trả lời câu hỏi gốc của Keynes: THỊ TRƯỜNG CẠNH TRANH xác định lãi suất ra sao?</p>
      <div class="figure-note"><b>Lời giải của Shaikh, quay lại chương 10:</b> thị trường cạnh tranh xác định MỌI lãi suất, kể cả lãi suất cơ sở, thông qua bình quân hóa tỷ suất lợi nhuận của các tư bản điều tiết trong khu vực tài chính (chương 10, mục II). Đây có thể coi là một lời giải THAY THẾ cho một trong những mối bận tâm chính của Keynes: chứng minh lãi suất cạnh tranh KHÔNG tự do điều chỉnh để làm tổng cầu bằng cung ở mức toàn dụng lao động.</div>
      <h3>Tổng cầu và mức giá: một hướng khác cho lý thuyết lạm phát</h3>
      <p>Ở Keynes, khi còn thất nghiệp không tự nguyện, tăng tổng cầu chủ yếu làm tăng sản lượng/việc làm — giá chỉ chịu áp lực gần mức toàn dụng. Điều này đối lập trực diện với Lý thuyết Số lượng cổ điển. Đường cong Phillips từng cho phép giải thích tại sao giá bắt đầu tăng TRƯỚC điểm toàn dụng — nhưng đã sụp đổ trong Đại Lạm phát-đình trệ (ch.12). Điều đáng chú ý: cả Keynesian LẪN mọi biến thể phản cách mạng đều CHIA SẺ một điểm chung: giá chỉ bắt đầu tăng khi tổng cầu VƯỢT cung ở mức toàn dụng. Shaikh hé lộ một hướng khác: từ góc nhìn tăng trưởng cổ điển, tỷ lệ tích lũy/tỷ suất lợi nhuận (σ' = g/r = tỷ trọng đầu tư trong lợi nhuận) có thể xem là chỉ số mức độ SỬ DỤNG TIỀM NĂNG TĂNG TRƯỞNG của nền kinh tế — biến số này sẽ là nền tảng cho lý thuyết lạm phát cổ điển ở chương 15, có khả năng giải thích cả Đại Lạm phát-đình trệ LẪN các hình mẫu lạm phát đa dạng ở nhiều quốc gia.</p>

    title:"Lợi nhuận là Trung tâm của Cả Cung lẫn Cầu", eng:"II.12, III.1-2. Underutilized Resources as Normal; Modern Classical Economics — the Centrality of Profit",
    body:`
      <p class="lede">Chương khép phần phê phán Keynes bằng một nhận định về tham vọng — và một trớ trêu lịch sử lặp lại từ chương 12 — trước khi chuyển sang xây dựng lý thuyết cổ điển hiện đại của chính Shaikh, với LỢI NHUẬN ở vị trí trung tâm.</p>
      <h3>Nguồn lực dưới mức sử dụng như một hiện tượng bình thường — và trớ trêu lịch sử của chính Keynes</h3>
      <p>Keynes đánh giá cao tư bản chủ nghĩa và tôn trọng nền tảng lý thuyết chính thống thời ông — nhưng kinh nghiệm thực tế thuyết phục ông rằng tư bản chủ nghĩa luôn có khả năng mở rộng ngay cả trong ngắn hạn, và thất nghiệp không tự nguyện là trạng thái BÌNH THƯỜNG của một nền kinh tế tư bản không được điều tiết. Ông còn nói: một khi "khiếm khuyết lớn này được khắc phục và toàn dụng lao động được khôi phục", lý thuyết tân cổ điển sẽ hoàn toàn có thể áp dụng trở lại — "không có gì để phản đối phân tích [tân] cổ điển về cách tự lợi cá nhân quyết định những gì được sản xuất, theo tỷ lệ nào các yếu tố sản xuất được kết hợp, và giá trị sản phẩm cuối cùng được phân phối ra sao giữa chúng". Ông trình bày lý thuyết CỦA MÌNH là lý thuyết TỔNG QUÁT và tân cổ điển chỉ là trường hợp ĐẶC BIỆT áp dụng khi toàn dụng lao động — mục tiêu của ông (một cách khiêm tốn có chừng mực!) là CỨU cả lý thuyết tân cổ điển LẪN chính bản thân chủ nghĩa tư bản.</p>
      <div class="figure-note"><b>Trớ trêu lịch sử lặp lại:</b> đáng buồn thay, các chính sách kinh tế nhân danh Keynes chỉ tồn tại vỏn vẹn hai thập kỷ sau khi ông qua đời (1946) trước khi "hết hơi". Chính "cánh cửa" mà ông tự mở ra cho lý thuyết tân cổ điển đã bị quay ngược lại chống chính ông một cách cay nghiệt khi Friedman, Phelps, và Lucas đưa thất nghiệp DAI DẲNG vào lý thuyết chính thống và quy nó cho hành động của công đoàn và nhà nước. Thế giới hoàn hảo của lý thuyết tân cổ điển sau đó được xem là trường hợp TỔNG QUÁT, còn kết cục kiểu Keynesian bị hạ xuống thành trường hợp ĐẶC BIỆT phát sinh từ "cứng nhắc" giá và lương (chương 12, mục IV).</div>
      <p>Shaikh tuyên bố hướng đi ngược lại ở chương 14: tư bản chủ nghĩa duy trì một mức độ thất nghiệp không tự nguyện "bình thường" nhất định thông qua chính sự vận hành của một hệ thống CẠNH TRANH — trong đó tiền lương thực hoàn toàn LINH HOẠT. Nhiệm vụ ở đó sẽ là chỉ ra thất nghiệp "bình thường" khác thất nghiệp "tự nhiên" và NAIRU ra sao.</p>
      <h3>Lợi nhuận điều tiết CẢ cung lẫn cầu — luận điểm "profit-side"</h3>
      <p>Lợi nhuận là trung tâm của kinh tế vĩ mô. Không có lợi nhuận, không có sản xuất, không có thu nhập lao động/tài sản, do đó không có cơ sở cho cầu tiêu dùng hay cầu đầu tư. Vì sản xuất mất thời gian, tư bản phải cam kết TRƯỚC vào chi tiêu nguyên vật liệu và lao động — sản xuất LUÔN được khởi động dựa trên lợi nhuận TRIỂN VỌNG, mà lợi nhuận triển vọng lại được điều tiết bởi lợi nhuận THỰC TẾ. Ở cấp vĩ mô, CẢ cung LẪN cầu hiệu quả đều được điều tiết — qua các kênh KHÁC NHAU — bởi lợi nhuận kỳ vọng. Và vì các kênh khác nhau, KHÔNG có lý do gì hai phía sẽ tự động cân bằng.</p>

        <div class="stat-box"><div class="val">Tân cổ điển</div><div class="lbl">"Supply-side": sản lượng ngắn hạn do sử dụng tối đa hóa lợi nhuận của tư bản VÀ toàn dụng lao động quyết định</div></div>
        <div class="stat-box"><div class="val">Keynesian</div><div class="lbl">"Demand-side": sản lượng ngắn hạn do thành phần TỰ CHỦ của tổng cầu quyết định</div></div>
        <div class="stat-box"><div class="val">Cổ điển (Shaikh)</div><div class="lbl">"Profit-side": lợi nhuận vận hành trên CẢ cung lẫn cầu, trên CẢ mức lẫn đường tăng trưởng của chúng</div></div>
      </div>
      <h3>Tính nội sinh của tỷ lệ tiết kiệm doanh nghiệp: sơ đồ tái sản xuất của Marx</h3>
      <p>Sơ đồ tái sản xuất đột phá của Marx (Tập 2 Bộ Tư bản) chứng minh: tăng CUNG tổng hợp CÓ THỂ tạo ra CẦU tương ứng trong cả nền kinh tế tĩnh lẫn tăng trưởng — vấn đề KHÔNG nằm ở tỷ lệ giữa các ngành (biến mất nếu ta chỉ xét cấp tổng hợp thuần túy như Keynesian/tân cổ điển vẫn làm). Điểm mấu chốt trong lập luận của Marx: tỷ lệ tiết kiệm KHÔNG ĐỘC LẬP với đầu tư vì tiết kiệm doanh nghiệp và đầu tư doanh nghiệp được thực hiện bởi CÙNG một thực thể. Ví dụ số minh họa: nếu doanh nghiệp tăng thuê 100 (60 lao động + 40 nguyên vật liệu), tài trợ HOÀN TOÀN nội bộ bằng cách giữ lại 100 lợi nhuận — thu nhập hộ gia đình từ chủ sở hữu GIẢM 100, thu nhập công nhân mới tăng 60 → thu nhập hộ gia đình RÒNG giảm 40 → cầu tiêu dùng giảm đúng 40, CÂN BẰNG chính xác với cầu nguyên vật liệu tăng thêm 40. TỔNG CẦU KHÔNG ĐỔI — số nhân trong trường hợp giới hạn này BẰNG KHÔNG.</p>

      <h3>Godley-Cripps và Ruggles-Ruggles: hai con đường tới cùng kết luận</h3>
      <p>Ở Anh, quan sát số dư khu vực tư nhân thường NHỎ và ỔN ĐỊNH dẫn Godley và cộng sự tới giả thuyết Cambridge Mới: thâm hụt thương mại sẽ PHẢN CHIẾU thâm hụt ngân sách nhà nước ("song sinh thâm hụt"). Godley và Cripps (1983) đưa ra nền tảng lý thuyết: số dư khu vực tư nhân được dẫn dắt bởi một CHUẨN ổn định giữa tài sản tài chính ròng và thu nhập khả dụng. Ở Mỹ, Ruggles và Ruggles theo một hướng bằng chứng khác nhưng tới kết luận tương tự: phân rã cẩn thận dữ liệu hộ gia đình/doanh nghiệp hậu chiến, họ phát hiện phần dư thu nhập khả dụng hộ gia đình trên tiêu dùng KHÔNG lâu bền gần như bằng đúng chi tiêu hộ gia đình cho hàng TIÊU DÙNG LÂU BỀN; tương tự, tiết kiệm doanh nghiệp (lợi nhuận giữ lại) gần bằng chi tiêu doanh nghiệp cho nhà xưởng-thiết bị mới. Cả hai trường phái đều đi tới ý tưởng: tỷ lệ tiết kiệm THÍCH ỨNG theo nhu cầu đầu tư.</p>

    concepts:[
      ["Lý thuyết \u201cprofit-side\u201d","Profit-side macroeconomics","Luận điểm trung tâm của Shaikh: kinh tế vĩ mô cổ điển không phải supply-side (tân cổ điển) hay demand-side (Keynesian) mà là profit-side — lợi nhuận điều tiết cả cung lẫn cầu qua các kênh khác nhau."],
      ["Sơ đồ tái sản xuất của Marx","Marx's schemes of reproduction","Chứng minh tăng cung có thể tự tạo cầu tương ứng KHÔNG PHẢI vì \u201ccung tạo cầu\u201d kiểu Say, mà vì tiết kiệm và đầu tư doanh nghiệp được thực hiện bởi CÙNG một thực thể — minh họa số cho thấy số nhân có thể bằng không."],
      ["Bằng chứng thực nghiệm: tỷ lệ tiết kiệm/đầu tư doanh nghiệp Mỹ","Empirical evidence: the US corporate savings/investment ratio","Từ 100,5% (2007) vọt lên 567% khi đầu tư sụp đổ trong khủng hoảng — bằng chứng mạnh cho thấy tiết kiệm doanh nghiệp bám sát nhu cầu đầu tư, không phải biến số ngoại sinh cố định."],
      ["Giả thuyết Cambridge Mới và song sinh thâm hụt","The New Cambridge hypothesis and twin deficits","Godley-Cripps: số dư khu vực tư nhân ổn định dẫn tới thâm hụt thương mại phản chiếu thâm hụt ngân sách — nền tảng lý thuyết: chuẩn ổn định giữa tài sản tài chính ròng và thu nhập khả dụng."],
      ["Phát hiện Ruggles-Ruggles","The Ruggles-Ruggles finding","Bằng chứng Mỹ hậu chiến: tiết kiệm hộ gia đình ≈ chi tiêu hàng lâu bền; tiết kiệm doanh nghiệp ≈ đầu tư nhà xưởng-thiết bị — cả hai khu vực tiết kiệm với mục đích chung là \u201chình thành tư bản\u201d."]
    ]

    title:"Xây dựng Mô hình Cổ điển: Từ Tài trợ Nội bộ tới Tín dụng Ngân hàng", eng:"III.3.i-xi. Profit, Investment Finance, and Growth — Building the Model Step by Step",
    body:`
      <p class="lede">Shaikh xây dựng mô hình động lực học cổ điển của mình từng lớp một — bắt đầu từ nền kinh tế tư nhân đóng, không tín dụng ngân hàng, không thị trường cổ phần — rồi dần thêm các yếu tố hiện thực.</p>
      <h3>Bước 1: Tài trợ nội bộ thuần túy — trường hợp Tái sản xuất Giản đơn của Marx</h3>
      <p>Nếu doanh nghiệp không cho nhau vay, toàn bộ tài trợ đầu tư phải là NỘI BỘ — chưa có thị trường tài trợ đầu tư, nên chưa có lãi suất liên quan. Đầu tư thực tế của mỗi doanh nghiệp bị RÀNG BUỘC bởi tiết kiệm doanh nghiệp tối đa của chính nó. Trong giới hạn này, tỷ lệ tiết kiệm doanh nghiệp phản ứng với khoảng cách giữa tỷ trọng đầu tư MONG MUỐN trên lợi nhuận và tỷ lệ tiết kiệm HIỆN TẠI. Nếu tỷ suất lợi nhuận kỳ vọng đủ THẤP để tốc độ tích lũy bằng không, toàn bộ lợi nhuận sẽ được chi trả dưới dạng thu nhập tài sản — không cần bổ sung số dư tiền — hệ thống TĨNH TẠI, giống hệt Tái sản xuất Giản đơn của Marx.</p>
      <h3>Bước 2: Tài trợ nội bộ tổng hợp — thị trường quỹ cho vay xuất hiện</h3>
      <p>Cho phép chuyển tiền GIỮA các doanh nghiệp: doanh nghiệp có tỷ trọng đầu tư mong muốn VƯỢT quỹ tự do có thể vay từ doanh nghiệp ở tình huống ngược lại — xuất hiện thị trường quỹ cho vay và lãi suất tương ứng. Cầu quỹ cho vay vượt cung sẽ ĐẨY lãi suất ngắn hạn lên — điều này có xu hướng chuyển hướng quỹ ra khỏi số dư tiền nhàn rỗi của doanh nghiệp VÀ (có thể) làm tăng tỷ lệ tiết kiệm doanh nghiệp. Cả lãi suất LẪN tỷ lệ tiết kiệm cùng phản ứng để đóng khoảng cách tài trợ.</p>
      <h3>Bước 3: Ổn định của quá trình — Marx và Keynes hòa hợp về chu kỳ kinh doanh</h3>
      <p>Từ điểm cân bằng, lợi nhuận kỳ vọng tăng → tốc độ tích lũy tăng → tỷ trọng đầu tư vượt tỷ lệ tiết kiệm → điều này trực tiếp NÂNG tỷ lệ tiết kiệm (qua áp lực tài trợ) VÀ nâng lãi suất (qua áp lực quỹ cho vay), lãi suất tăng lại HẠ tốc độ tích lũy — khoảng cách tài trợ ban đầu được đóng lại từ CẢ hai phía. Trong cơn bùng nổ chu kỳ kinh doanh: cầu quỹ tăng so với cung → lãi suất tăng, thị trường lao động thắt chặt → tỷ suất lợi nhuận THỰC TẾ giảm — nhưng tỷ suất lợi nhuận KỲ VỌNG có thể vẫn tiếp tục tăng một thời gian, khiến tỷ suất lợi nhuận ròng kỳ vọng vẫn tăng ngay cả khi tỷ suất thực tế giảm. Tới một điểm nào đó, ảnh hưởng của thực tế lên kỳ vọng sẽ khẳng định chính nó và cơn bùng nổ nhường chỗ cho suy thoái, lãi suất đảo chiều.</p>
      <div class="figure-note"><b>Marx và Keynes nói cùng một điều, theo hai giọng khác nhau:</b> Marx (1967c): "nếu ta quan sát các chu kỳ mà công nghiệp hiện đại vận động — trạng thái trì trệ, phục hồi dần dần, thịnh vượng, sản xuất thừa, khủng hoảng, đình trệ, trạng thái trì trệ, v.v... ta sẽ thấy lãi suất THẤP thường tương ứng các giai đoạn thịnh vượng hoặc lợi nhuận đặc biệt cao, lãi suất TĂNG tách biệt thịnh vượng khỏi mặt trái của nó, và lãi suất TỐI ĐA, tới mức cho vay nặng lãi cực đoan, tương ứng giai đoạn khủng hoảng." Lý thuyết chu kỳ kinh doanh của Keynes nói gần như y hệt: hiệu suất biên tư bản tăng châm ngòi bùng nổ, cuối cùng dẫn tới lãi suất tăng và chi phí tăng — tới một điểm nào đó, "một chất xúc tác nào đó, thường tự thân nhỏ bé, khiến tâm lý thị trường chuyển hướng, và châm ngòi một đợt suy giảm... [với] sự sụt giảm mạnh của hiệu suất biên tư bản."</div>
      <h3>Bước 4: Lãi suất KHÔNG phải biến điều chỉnh then chốt — quay lại chương 10</h3>
      <p>Nếu chỉ tỷ lệ đầu tư và tiết kiệm phản ứng với lãi suất, đó sẽ là câu chuyện "quỹ cho vay" tiền-Keynes chuẩn (ch.12, mục II.3). Nhưng nếu lãi suất được quyết định bởi thứ gì đó KHÁC ngoài cung-cầu quỹ cho vay, không thể dùng lãi suất để cân bằng tiết kiệm-đầu tư — đây chính xác là động lực khiến Keynes CHUYỂN lý thuyết lãi suất ra khỏi thị trường quỹ cho vay (sang LM) VÀ giả định tỷ lệ tiết kiệm cố định. Shaikh đi theo hướng KHÁC: giả sử lãi suất cho trước (theo chương 10) — một tỷ suất lợi nhuận kỳ vọng nhất định vẫn sẽ tạo ra tỷ trọng đầu tư và khoảng cách tài trợ tương ứng, và TỶ LỆ TIẾT KIỆM (không phải lãi suất) sẽ điều chỉnh để đóng khoảng cách đó.</p>
      <div class="figure-note"><b>Lãi suất ròng tăng theo lãi suất chung (Hình 13.5):</b> chương 10 đã chứng minh lãi suất là hàm TUYẾN TÍNH của tỷ suất lợi nhuận cho một cấu trúc chi phí thực và mức giá cho trước — với hệ số chặn dương (chi phí hoạt động ngân hàng) và hệ số góc dương nhưng NHỎ HƠN 1. Hệ quả: tỷ suất lợi nhuận RÒNG (r-i) luôn TĂNG theo tỷ suất lợi nhuận CHUNG, nhưng chỉ DƯƠNG khi tỷ suất lợi nhuận chung vượt một ngưỡng tối thiểu nào đó. Một mức giá cao hơn KHÔNG ảnh hưởng tỷ suất lợi nhuận chung (vì doanh thu, chi phí, vốn đều tăng theo tỷ lệ) — nhưng LÀM TĂNG cả hệ số chặn LẪN hệ số góc của đường lãi suất, do đó LÀM GIẢM tỷ suất lợi nhuận ròng ở bất kỳ mức tỷ suất lợi nhuận chung nào — một cầu nối trực tiếp tới lý thuyết lạm phát ở chương 15.</div>
      <h3>Bước 5-9: Tiết kiệm hộ gia đình, tín dụng ngân hàng, và Luật Hoàn lưu</h3>
      <p>Cho phép tiết kiệm hộ gia đình KHÔNG thay đổi động lực căn bản: dù tiết kiệm hộ gia đình nhạy cảm hay không với lãi suất, tỷ lệ tiết kiệm DOANH NGHIỆP vẫn điều chỉnh khi đầu tư khác tổng tài trợ sẵn có — chính phản ứng này giúp hai phía cân bằng.</p>
      <p>Kể từ khi ngân hàng dự trữ một phần (fractional-deposit banking) ra đời, tín dụng ngân hàng tư nhân có thể tạo sức mua MỚI, cho phép đầu tư tăng nhanh hơn tiết kiệm. Ví dụ lịch sử sinh động: dòng vàng mới từ các mỏ California thập niên 1840 nâng sức mua toàn cầu và sản lượng khi lan từ Tân Thế giới sang Cựu Thế giới; và việc phát minh máy in tiền của những người thực dân Mỹ đầy tham vọng thế kỷ 17, sau đó được ứng dụng nhiệt tình trong Cách mạng Mỹ VÀ Pháp, đã mở rộng thương mại đáng kể — dù cũng đẩy giá cả tăng với tốc độ chóng mặt.</p>
      <div class="figure-note"><b>Luật Hoàn lưu Tín dụng (law of bank credit reflux):</b> tín dụng phải được trả LẠI kèm lãi. Một khoản vay 100 tạo cầu mới 100 phải trả dần: nếu trả 20/kỳ trong 5 kỳ (tổng 100) cộng lãi 5/kỳ (tổng 25), mô hình bơm/rút sức mua qua các kỳ sẽ là: 100, -20, -20, -20, -20, -20 — nếu MỌI khoản nợ được trả hết, tổng cộng bằng KHÔNG. Chỉ những khoản vay MỚI RÒNG mới có thể ngăn "quy luật hoàn lưu" này kéo sức mua trở lại điểm xuất phát. Việc hệ quả nợ có trở nên nặng nề với hệ thống hay không phụ thuộc vào ẢNH HƯỞNG của các khoản bơm này lên sản lượng, việc làm, và giá cả.</div>
      <h3>Tín dụng ngân hàng là nền tảng của chu kỳ kinh doanh</h3>
      <p>Tín dụng ngân hàng đặt ra ba câu hỏi lớn: nó ảnh hưởng chu kỳ, quy mô, và xu hướng sản xuất ra sao? Qua chu kỳ, nó KHUẾCH ĐẠI bùng nổ VÀ làm SÂU SẮC suy thoái — là nền tảng thực sự của chu kỳ kinh doanh công nghiệp. Một "cơn bùng nổ tinh thần vật chất" (animal spirits) từ cả doanh nghiệp LẪN ngân hàng (vốn cũng cần được thuyết phục rằng khoản vay sẽ SINH LỜI đủ) có thể tạo bùng nổ khi tín dụng ngân hàng cho phép cầu vượt cung hiện tại. Điều quan trọng: khi bụi lắng xuống, KHÔNG có gì đảm bảo lương thực HAY công nghệ sẽ quay về trạng thái BAN ĐẦU — nên tỷ suất lợi nhuận thông thường có thể tự nó bị THAY ĐỔI, mang tính LỆ THUỘC ĐƯỜNG ĐI (path-dependent) — quy mô sản xuất có thể khác ở cuối một chu kỳ dù không có xu hướng chung, và bản thân xu hướng cũng có thể thay đổi nếu các yếu tố nền tảng không quay lại giá trị gốc. Đây lại là quan điểm của Soros, quen thuộc trong lịch sử chu kỳ kinh doanh nhưng thường bị bỏ quên trong lý thuyết kinh tế.</p>
      <h3>Thâm hụt chính phủ và cầu nước ngoài</h3>
      <p>Logic tương tự áp dụng cho thâm hụt chính phủ (bán trái phiếu cho khu vực tư — chuyển sức mua giữa các khu vực; hoặc "in tiền qua cửa sau" nếu ngân hàng trung ương mua trái phiếu chính phủ) và tín dụng nước ngoài — cả hai đều bơm sức mua MỚI, nâng sản lượng trên đường đi thông thường. Giới hạn của quá trình này bộc lộ qua ảnh hưởng lên việc làm, tỷ giá, lạm phát (chương 14-15), và qua sự sẵn lòng của chủ nợ trong/ngoài nước tiếp tục tham gia vòng xoáy.</p>

    concepts:[
      ["Tài trợ nội bộ thuần túy (Tái sản xuất Giản đơn)","Pure internal finance (Simple Reproduction)","Bước đầu tiên xây dựng mô hình: không tín dụng liên doanh nghiệp, đầu tư bị ràng buộc bởi tiết kiệm nội bộ tối đa — trường hợp giới hạn tương ứng hệ thống tĩnh tại của Marx."],

    body:`
      <p class="lede">Với mọi yếu tố đã lắp ráp, Shaikh thu gọn toàn bộ hệ thống thành một tập hợp quan hệ phản thân — rồi rút ra hệ quả sâu xa nhất của toàn chương cho lý thuyết tăng trưởng.</p>
      <h3>Tổng kết động lực cổ điển: lợi nhuận là chốt chặn của toàn hệ thống</h3>
      <p>Với mức giá và khả năng sinh lời (tỷ suất và tỷ trọng) cho trước, hệ thống cổ điển gồm một tập hợp quan hệ PHẢN THÂN giữa tỷ suất lợi nhuận kỳ vọng và thực tế, cung và cầu, sản lượng và năng lực, lãi suất thực tế và thông thường. TỶ SUẤT LỢI NHUẬN là chốt chặn (linchpin) của toàn hệ thống. Trong một hệ thống tăng trưởng: khi cầu vượt cung, tốc độ tăng trưởng sản lượng danh nghĩa TĂNG TỐC; khi sản lượng vượt năng lực, kho tư bản TĂNG TỐC; khi lãi suất thực tế vượt lãi suất thông thường, tư bản chảy nhanh hơn vào khu vực tài chính. Cung-cầu được bình quân hóa hỗn loạn qua một quá trình NGẮN hạn; sản lượng-năng lực và lãi suất thực tế-thông thường được bình quân hóa qua các quá trình DÀI hơn. Trong dài hạn, tỷ suất lợi nhuận và tỷ trọng THỰC TẾ tương ứng mức năng lực THÔNG THƯỜNG; và tỷ suất lợi nhuận KỲ VỌNG tương ứng tỷ suất lợi nhuận THÔNG THƯỜNG qua một quá trình phản thân nào đó.</p>
      <div class="figure-note"><b>Bốn truyền thống hội tụ trong một hệ thống duy nhất:</b> hệ thống của Shaikh đồng thời gói ghém — quan hệ Keynesian (tích lũy do lợi nhuận ròng kỳ vọng dẫn dắt); quan hệ cổ điển (lợi nhuận kỳ vọng được điều tiết bởi lợi nhuận thông thường); ý niệm Keynesian (cầu có thể tương đối tự chủ nhờ các khoản bơm sức mua mới); và ý niệm Harrodian (tỷ lệ sử dụng năng lực thực tế được điều tiết bởi tỷ lệ thông thường) — bốn mảnh ghép lý thuyết tưởng như xung khắc, nay được hợp nhất trong một khung phân tích duy nhất.</div>
      <h3>Bảng tổng hợp hiệu ứng (Bảng 13.1) và Sơ đồ Tích lũy Cổ điển (Hình 13.6)</h3>
      <p>Một mức giá cao hơn nâng lãi suất danh nghĩa và HẠ tốc độ tích lũy, tiết kiệm, và tăng trưởng sản lượng (phân tích đầy đủ dành cho chương 15). Một sự giảm chi phí ngân hàng thực có hiệu ứng ngược lại. Một mức lãi suất cao hơn hạ tỷ trọng đầu tư, tỷ lệ tiết kiệm, và tốc độ tăng trưởng thông thường. Một tỷ số năng lực-tư bản cao hơn dịch chuyển đường tỷ trọng đầu tư xuống, tương tự hiệu ứng lãi suất tăng. Một tỷ suất lợi nhuận thông thường THẤP hơn cũng dịch chuyển đường đầu tư xuống — nhưng vì nó cũng làm GIẢM lãi suất (với mức độ nhỏ hơn mức giảm tỷ suất lợi nhuận, theo Hình 13.5), tỷ trọng đầu tư, tỷ lệ tiết kiệm, và tốc độ tăng trưởng thông thường đều giảm.</p>
      <div class="figure-note"><b>Đường cong đầu tư không phải đường tĩnh:</b> Shaikh nhấn mạnh đường tỷ trọng đầu tư trong Hình 13.6 phản ứng với thay đổi ngắn/dài hạn trong biến nhiễu (animal spirits, sức mua tổng hợp, chênh lệch lãi suất thị trường-thông thường) — nên trong NGẮN hạn nó nhảy lên xuống liên tục, đúng như Keynes từng nhấn mạnh khi phản hồi công thức hóa IS-LM của Hicks. Chỉ khi biến nhiễu này dao động quanh không trong DÀI hạn, đường cong mới đại diện một GIÁ TRỊ TRUNG BÌNH dài hạn của một tập hợp các đường ngắn hạn dao động.</div>
      <p>Shaikh nhấn mạnh: các con đường cân bằng KHÔNG đại diện kết cục THỰC TẾ, mà là các TRUNG TÂM HẤP DẪN mà biến số quan sát được dao động hỗn loạn xung quanh. "Ngắn hạn" cổ điển — chu kỳ TỒN KHO — nằm trong khoảng BA-NĂM NĂM; "dài hạn" cổ điển — chu kỳ SẢN LƯỢNG-NĂNG LỰC, tương ứng "chu kỳ kinh doanh" cổ điển trước đây — nằm trong khoảng MƯỜI-MƯỜI HAI NĂM.</p>
      <h3>Xu hướng tất định và ngẫu nhiên: hệ quả sâu xa nhất</h3>
      <p>Log sản lượng thực đi theo một xu hướng ĐỘNG (tổng của xu hướng tất định VÀ thành phần ngẫu nhiên) — Hình 13.7 minh họa: mỗi mức khởi điểm khác nhau tạo ra một con đường song song khác, và câu hỏi thực sự không phải đại số mà là LỰC LƯỢNG KINH TẾ nào quyết định con đường cân bằng cụ thể mà sản lượng thực tế dao động quanh nó.</p>

      <h3>Kết luận chương: cầu nối tới khủng hoảng 2008</h3>
      <p>Lập luận của Shaikh khái quát hóa điểm mấu chốt của Keynes: các khoản bơm sức mua mới — TƯ NHÂN, NHÀ NƯỚC, hay NƯỚC NGOÀI — có thể đẩy hệ thống lên những đỉnh cao mới, cho tới khi các hệ quả như NỢ tăng và khả năng tăng LƯƠNG/GIÁ bắt đầu phát huy ảnh hưởng, kéo hệ thống xoáy trở lại. Chính sách tài khóa CHẮC CHẮN có thể kích thích hệ thống — MIỄN LÀ các chính sách đó KHÔNG tạo ra một áp lực bù trừ lên lợi nhuận doanh nghiệp. Nhà nước cũng có thể hỗ trợ nỗ lực của doanh nghiệp nhằm hạ lương thực TƯƠNG ĐỐI với năng suất, và trực tiếp hạ lãi suất. Kết hợp với một gói kích thích dựa trên tín dụng tổng quát, điều này CÓ THỂ giữ một cơn bùng nổ kéo dài — nhưng khi tỷ suất lợi nhuận giảm bị hoãn lại và lãi suất đã giảm tới giới hạn, gánh nặng nợ tư nhân LẪN nợ chủ quyền trở thành nhân tố QUYẾT ĐỊNH. Khi những giới hạn đó bị chạm tới, toàn bộ hệ thống rung chuyển và các mảnh vỡ rơi ra. <b>Khủng hoảng toàn cầu 2007 chỉ là ví dụ MỚI NHẤT của vấn đề tái diễn này</b> — chủ đề trung tâm của chương 16.</p>

/* =========================================================
   RENDER — FLASHCARDS
   ========================================================= */
var fcOrder = FLASHCARDS.map(function(_, i){ return i; });
var fcIndex = 0;
var fcFlipped = false;

function renderFlashcard(){
  var card = FLASHCARDS[fcOrder[fcIndex]];
  document.getElementById('fcTag').textContent = card.sec;
  document.getElementById('fcQ').textContent = card.q;
  document.getElementById('fcA').textContent = card.a;
  document.getElementById('fcProgress').textContent = 'Thẻ ' + (fcIndex+1) + ' / ' + FLASHCARDS.length;
  fcFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
}
document.getElementById('flashcard').addEventListener('click', function(){
  fcFlipped = !fcFlipped;
  this.classList.toggle('flipped', fcFlipped);
});
document.getElementById('fcFlip').addEventListener('click', function(){
  fcFlipped = !fcFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', fcFlipped);
});
document.getElementById('fcPrev').addEventListener('click', function(){
  fcIndex = (fcIndex - 1 + fcOrder.length) % fcOrder.length;
  renderFlashcard();
});
document.getElementById('fcNext').addEventListener('click', function(){
  fcIndex = (fcIndex + 1) % fcOrder.length;
  renderFlashcard();
});
document.getElementById('fcShuffle').addEventListener('click', function(){
  for(var i = fcOrder.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i+1));
    var tmp = fcOrder[i]; fcOrder[i] = fcOrder[j]; fcOrder[j] = tmp;
  }
  fcIndex = 0;
  renderFlashcard();
});
renderFlashcard();

/* =========================================================
   RENDER — QUIZ
   ========================================================= */
var quizAnswers = {};
var quizArea = document.getElementById('quizArea');

function renderQuiz(){
  var html = QUIZ.map(function(item, qi){
    var opts = item.opts.map(function(opt, vi){
      return '<div class="q-opt" data-qi="'+qi+'" data-qv="'+vi+'">'+opt+'</div>';
    }).join('');
    return '<div class="q-block" id="qblock-'+qi+'">'+
      '<div class="q-text">'+(qi+1)+'. '+item.q+'</div>'+
      '<div class="q-opts">'+opts+'</div>'+
      '<div class="q-explain" id="qexplain-'+qi+'">'+item.explain+'</div>'+
      '</div>';
  }).join('');
  html += '<div style="text-align:center;margin-top:20px;"><button class="btn primary" id="quizFinish">Xem kết quả</button> <button class="btn" id="quizReset">Làm lại</button></div>';
  html += '<div id="quizResult"></div>';
  quizArea.innerHTML = html;

  quizArea.addEventListener('click', quizClickHandler);
  document.getElementById('quizFinish').addEventListener('click', showQuizScore);
  document.getElementById('quizReset').addEventListener('click', function(){
    quizAnswers = {};
    renderQuiz();
  });
}

function quizClickHandler(e){
  var opt = e.target.closest('.q-opt');
  if(!opt) return;
  var qi = parseInt(opt.dataset.qi, 10);
  var qv = parseInt(opt.dataset.qv, 10);
  quizAnswers[qi] = qv;
  var block = document.getElementById('qblock-'+qi);
  block.querySelectorAll('.q-opt').forEach(function(o){
    o.classList.remove('selected','correct','incorrect');
  });
  var correctIdx = QUIZ[qi].correct;
  block.querySelectorAll('.q-opt').forEach(function(o){
    var v = parseInt(o.dataset.qv,10);
    if(v === correctIdx) o.classList.add('correct');
    else if(v === qv) o.classList.add('incorrect');
  });
  document.getElementById('qexplain-'+qi).classList.add('show');
  updateQuizProgress();
}

function updateQuizProgress(){
  var answered = Object.keys(quizAnswers).length;
  var pct = Math.round(100*answered/QUIZ.length);
  document.getElementById('quizProgressFill').style.width = pct+'%';
}

function showQuizScore(){
  var correct = 0;
  QUIZ.forEach(function(item, qi){
    if(quizAnswers[qi] === item.correct) correct++;
  });
  var pct = Math.round(100*correct/QUIZ.length);
  document.getElementById('quizResult').innerHTML =
    '<div class="quiz-score"><div class="num">'+correct+'/'+QUIZ.length+'</div>'+
    '<div class="lbl">('+pct+'%) — '+ (pct>=80?'Nắm rất vững nội dung!':pct>=50?'Khá tốt, xem lại vài phần.':'Nên đọc lại các phần liên quan.') +'</div></div>';
}
renderQuiz();

/* =========================================================
   NOTES PANEL
   ========================================================= */
var notesFab = document.getElementById('notesFab');
var notesPanel = document.getElementById('notesPanel');
var notesBackdrop = document.getElementById('notesBackdrop');
var notesBody = document.getElementById('notesBody');
var notesTitle = document.getElementById('notesTitle');
var notesFoot = document.getElementById('notesFoot');
var currentNoteTab = 'nhapmon13';
var LS_PREFIX = 'shaikh_ch13_note_';

function isMobile(){ return window.matchMedia('(max-width:640px)').matches; }

function noteLabelFor(id){
  var s = SECTIONS.filter(function(x){return x.id===id;})[0];
  if(s) return s.n + '. ' + s.label;
  if(id === 'gloss') return 'Thuật ngữ';
  if(id === 'flashcards') return 'Thẻ ghi nhớ';
  if(id === 'quiz') return 'Quiz';
  return id;
}

function openNotesFor(id){
  currentNoteTab = id;
  notesTitle.textContent = 'Ghi chú — ' + noteLabelFor(id);
  var saved = localStorage.getItem(LS_PREFIX + id) || '';
  notesBody.innerHTML = saved;
  updateNotesFoot();
}
function updateNotesFoot(){
  var len = notesBody.innerText.trim().length;
  notesFoot.textContent = len + ' ký tự · lưu tự động';
}
function saveCurrentNote(){
  localStorage.setItem(LS_PREFIX + currentNoteTab, notesBody.innerHTML);
  updateNotesFoot();
}
function openNotesPanel(){
  notesPanel.classList.add('open');
  if(isMobile()){ notesBackdrop.classList.add('show'); }
}
function closeNotesPanel(){
  notesPanel.classList.remove('open');
  notesBackdrop.classList.remove('show');
}
notesFab.addEventListener('click', function(){
  if(notesPanel.classList.contains('open')){
    closeNotesPanel();
  } else {
    openNotesFor(currentNoteTab);
    openNotesPanel();
  }
});
document.getElementById('notesClose').addEventListener('click', closeNotesPanel);
notesBackdrop.addEventListener('click', closeNotesPanel);
notesBody.addEventListener('input', saveCurrentNote);
document.querySelectorAll('.notes-toolbar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    var cmd = btn.dataset.cmd;
    notesBody.focus();
    if(cmd.indexOf(':')>-1){
      var parts = cmd.split(':');
      document.execCommand(parts[0], false, parts[1]);
    } else {
      document.execCommand(cmd, false, null);
    }
    saveCurrentNote();
  });
});

activateTab(ALL_TAB_IDS[0]);
