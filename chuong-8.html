<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<title>Shaikh — Capitalism: Competition, Conflict, Crises — Chương 8</title>
<style>
:root{
  --bg:#f2ede0;
  --panel:#fffdf8;
  --panel-2:#eef1e8;
  --ink:#211d16;
  --ink-soft:#4c473b;
  --muted:#847b68;
  --line:#dcd0ac;
  --primary:#1f3b5c;
  --primary-dark:#152944;
  --primary-tint:#e1e8ef;
  --gold:#a67f2c;
  --gold-light:#d6b263;
  --green:#2f6b3f;
  --green-tint:#e3ede4;
  --red:#8a2f2f;
  --red-tint:#f0e2e2;
  --dark-bg:#141b22;
  --dark-panel:#1d2731;
  --dark-ink:#eef1e6;
  --dark-line:#324256;
  --shadow:0 6px 24px rgba(20,27,34,0.12);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1000px;margin:0 auto;padding:0 16px 80px;}

.hero{padding:32px 16px 20px;text-align:center;border-bottom:3px double var(--gold);margin-bottom:18px;background:radial-gradient(ellipse at top, rgba(166,127,44,0.08), transparent 60%);}
.hero .kicker{font-family:Georgia,serif;letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700;}
.hero h1{font-size:clamp(22px,4.6vw,34px);margin:8px 0 4px;color:var(--primary-dark);letter-spacing:.005em;line-height:1.25;}
.hero .subtitle{font-size:14.5px;color:var(--ink-soft);font-style:italic;}
.hero .meta{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hero .meta span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);}
.hero .meta a.meta-link{color:var(--primary);text-decoration:none;font-weight:600;}
.hero .meta a.meta-link:hover{background:var(--primary-tint);}


.tabbar-wrap{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:8px;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tabbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;}
.tabbar::-webkit-scrollbar{height:5px;}
.tabbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.tab-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
.tab-btn .n{color:var(--gold);font-weight:800;margin-right:5px;}
.tab-btn:hover{border-color:var(--gold);}
.tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow);}
.tab-btn.active .n{color:var(--gold-light);}

.panel{display:none;animation:fadein .25s ease;}
.panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);}
.card h2{margin:0 0 4px;font-size:21px;color:var(--primary-dark);}
.card .eng-title{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:16px;letter-spacing:.02em;}
.card h3{font-size:15.5px;color:var(--primary);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px;}
.card p{margin:0 0 12px;color:var(--ink);}
.card p:last-child{margin-bottom:0;}
.lede{font-size:16px;color:var(--ink-soft);border-left:3px solid var(--gold);padding-left:14px;margin:6px 0 18px;}

.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0;}
.concept{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.concept .term{font-weight:700;color:var(--primary-dark);font-size:13px;display:block;margin-bottom:4px;}
.concept .term .en{color:var(--gold);font-weight:600;font-size:11px;font-style:italic;}
.concept p{font-size:13px;margin:0;color:var(--ink-soft);}

.figure-note{background:var(--primary-tint);border:1px dashed var(--primary);border-radius:10px;padding:12px 15px;font-size:12.5px;color:var(--primary-dark);margin:14px 0;}
.figure-note b{color:var(--primary-dark);}

.debate-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0;}
.debate-box .dh{background:var(--primary);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.03em;}
.debate-box .db{padding:13px 15px;font-size:13px;color:var(--ink-soft);}
.debate-box .names{color:var(--gold);font-weight:700;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0;}
.stat-box{background:var(--primary-dark);color:#fff;border-radius:10px;padding:13px 14px;text-align:center;}
.stat-box .val{font-size:20px;font-weight:800;color:var(--gold-light);}
.stat-box .lbl{font-size:10.5px;color:#dbe4ee;margin-top:3px;line-height:1.3;}

.dark-panel{background:var(--dark-bg);color:var(--dark-ink);border-radius:12px;padding:20px;margin:16px 0;border:1px solid var(--dark-line);}
.dark-panel h4{margin:0 0 12px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;}
.flow{display:flex;flex-direction:column;gap:0;}
.flow-step{background:var(--dark-panel);border:1px solid var(--dark-line);border-radius:8px;padding:10px 14px;font-size:12.5px;position:relative;}
.flow-step b{color:var(--gold-light);}
.flow-arrow{text-align:center;color:var(--gold);font-size:16px;padding:2px 0;}
.flow-branch{display:flex;gap:10px;margin:2px 0;flex-wrap:wrap;}
.flow-branch>div{flex:1;min-width:150px;}

.chart-panel{background:var(--dark-bg);border:1px solid var(--dark-line);border-radius:12px;padding:18px 18px 14px;margin:16px 0;}
.chart-panel h4{margin:0 0 2px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;}
.chart-panel .chart-sub{font-size:11px;color:#9fb0c2;margin-bottom:10px;font-style:italic;}
.chart-panel svg{width:100%;height:auto;display:block;}

/* ===== Real/reference chart (photo, not illustrative SVG) ===== */
.chart-real{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:10px 0 18px;}
.chart-real-badge{display:inline-block;font-family:Georgia,serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);border-radius:4px;padding:3px 9px;margin-bottom:9px;}
.chart-real img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);}
.chart-real figcaption{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.55;font-style:italic;}

.chart-note{font-size:10.5px;color:#8496a8;margin-top:6px;}

.cmp-wrap{overflow-x:auto;margin:10px 0;}
table.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:12px;}
table.cmp th, table.cmp td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;}
table.cmp th{background:var(--primary);color:#fff;font-size:11.5px;position:sticky;top:0;}
table.cmp td.dim{font-weight:700;color:var(--primary-dark);background:var(--panel-2);width:150px;}
table.cmp tr:nth-child(even) td:not(.dim){background:var(--panel-2);}

.gloss-item{border-bottom:1px solid var(--line);padding:12px 0;}
.gloss-item:last-child{border-bottom:none;}
.gloss-term{font-weight:700;color:var(--primary-dark);font-size:14px;}
.gloss-term .en{color:var(--gold);font-weight:600;font-size:11.5px;font-style:italic;margin-left:6px;}
.gloss-def{font-size:13px;color:var(--ink-soft);margin-top:3px;}

.gloss-extra-row{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.gloss-extra-row .en{flex:1;color:var(--ink-soft);font-style:italic;}
.gloss-extra-row .vi{flex:1;color:var(--primary-dark);font-weight:600;}


.fc-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.fc-progress{font-size:13px;color:var(--muted);}
.fc-stage{display:flex;justify-content:center;margin:10px 0 20px;perspective:1400px;}
.flashcard{width:100%;max-width:560px;height:270px;position:relative;cursor:pointer;}
.flashcard .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flashcard.flipped .fc-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);}
.fc-front{background:var(--panel);}
.fc-front .fc-tag{position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;font-weight:700;}
.fc-front .fc-q{font-size:17px;color:var(--ink);font-weight:600;}
.fc-back{background:var(--primary);color:#fff;transform:rotateY(180deg);}
.fc-back .fc-a{font-size:14px;}
.fc-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;}
.fc-nav{display:flex;justify-content:center;gap:10px;margin-top:16px;}
.btn{border:1px solid var(--primary);background:var(--panel);color:var(--primary-dark);font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--primary);color:#fff;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-dark);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.quiz-progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--primary));transition:width .3s;}
.q-block{margin-bottom:14px;}
.q-text{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;}
.q-opts{display:flex;flex-direction:column;gap:8px;}
.q-opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer;transition:all .15s;}
.q-opt:hover{border-color:var(--gold);}
.q-opt.selected{border-color:var(--primary);background:var(--primary-tint);}
.q-opt.correct{border-color:var(--green);background:var(--green-tint);color:#1c4a28;font-weight:700;}
.q-opt.incorrect{border-color:var(--primary);background:#f3e6e6;color:#7a2020;font-weight:700;}
.q-explain{margin-top:10px;font-size:12.5px;color:var(--ink-soft);background:var(--panel-2);border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 8px 8px 0;display:none;}
.q-explain.show{display:block;}
.quiz-score{text-align:center;padding:30px 20px;}
.quiz-score .num{font-size:46px;font-weight:800;color:var(--primary);}
.quiz-score .lbl{font-size:14px;color:var(--muted);margin-bottom:18px;}

.notes-fab{position:fixed;right:22px;bottom:22px;z-index:50;background:var(--primary);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 8px 20px rgba(21,41,68,0.35);cursor:pointer;display:flex;align-items:center;gap:7px;}
.notes-backdrop{position:fixed;inset:0;background:rgba(15,18,22,0.45);z-index:60;display:none;}
.notes-backdrop.show{display:block;}
.notes-panel{position:fixed;top:0;right:0;height:100%;width:380px;max-width:88vw;background:var(--panel);z-index:70;box-shadow:-10px 0 30px rgba(0,0,0,0.2);transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;}
.notes-panel.open{transform:translateX(0);}
.notes-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.notes-head h4{margin:0;color:var(--primary-dark);font-size:14.5px;}
.notes-head .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.notes-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;}
.notes-toolbar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.notes-toolbar button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;width:30px;height:30px;cursor:pointer;font-family:Georgia,serif;font-size:14px;color:var(--ink);}
.notes-toolbar button:hover{border-color:var(--gold);}
.notes-body{flex:1;padding:16px 18px;overflow-y:auto;outline:none;font-size:14px;line-height:1.7;}
.notes-body:empty:before{content:"Ghi chú của bạn cho phần này... (tự động lưu)";color:var(--muted);font-style:italic;}
.notes-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);}

@media (max-width:640px){
  .hero{padding:22px 12px 14px;}
  .card{padding:16px 15px;}
  .flashcard{height:250px;}
  .notes-panel{width:100%;max-width:100%;}
  table.cmp{min-width:560px;}
}
@media print{
  .tabbar-wrap,.notes-fab,.notes-panel,.notes-backdrop,.fc-nav,.q-opts{display:none !important;}
  .panel{display:block !important;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
}
</style>
</head>
<body>

<script>
/* =========================================================
   MINI CHART HELPER
   ========================================================= */
function sparkPath(values, w, h, pad){
  var n = values.length;
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  var range = (max - min) || 1;
  var pts = values.map(function(v, i){
    var x = pad + (i/(n-1)) * (w - 2*pad);
    var y = pad + (1 - (v - min)/range) * (h - 2*pad);
    return [x,y];
  });
  var d = 'M ' + pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L ');
  var area = d + ' L ' + pts[pts.length-1][0].toFixed(1) + ',' + (h-pad) + ' L ' + pts[0][0].toFixed(1) + ',' + (h-pad) + ' Z';
  return {line:d, area:area, pts:pts};
}
function renderLineChart(containerId, series, opts){
  opts = opts || {};
  var w = opts.w || 400, h = opts.h || 120, pad = opts.pad || 8;
  var svg = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  series.forEach(function(s){
    var r = sparkPath(s.values, w, h, pad);
    if(s.fill !== false){
      svg += '<path d="'+r.area+'" fill="'+(s.color||'#a67f2c')+'" opacity="0.12"></path>';
    }
    svg += '<path d="'+r.line+'" fill="none" stroke="'+(s.color||'#a67f2c')+'" stroke-width="'+(s.width||2)+'" vector-effect="non-scaling-stroke"></path>';
  });
  svg += '</svg>';
  var el = document.getElementById(containerId);
  if(el) el.innerHTML = svg;
}
function renderScatter(containerId, points, opts){
  opts = opts || {};
  var w = opts.w || 400, h = opts.h || 220, pad = 26;
  var xs = points.map(function(p){return p[0];}), ys = points.map(function(p){return p[1];});
  var xmin=Math.min.apply(null,xs), xmax=Math.max.apply(null,xs);
  var ymin=0, ymax=Math.max.apply(null,ys)*1.15;
  var sx = function(x){ return pad + (x-xmin)/(xmax-xmin||1)*(w-2*pad); };
  var sy = function(y){ return h-pad - (y-ymin)/(ymax-ymin||1)*(h-2*pad); };
  var svg = '<svg viewBox="0 0 '+w+' '+h+'">';
  svg += '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#3a4a5c" stroke-width="1"/>';
  svg += '<line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(h-pad)+'" stroke="#3a4a5c" stroke-width="1"/>';
  points.forEach(function(p){
    svg += '<circle cx="'+sx(p[0]).toFixed(1)+'" cy="'+sy(p[1]).toFixed(1)+'" r="3.2" fill="'+(opts.color||'#d6b263')+'" opacity="0.8"/>';
  });
  svg += '</svg>';
  var el = document.getElementById(containerId);
  if(el) el.innerHTML = svg;
}

/* =========================================================
   DATA — SECTIONS (tabs 0-6)
   ========================================================= */
var SECTIONS = [
  {
    id:"codien8", n:"0", label:"Cổ điển: Smith-Marx",
    title:"Cạnh tranh trong Kinh tế học Cổ điển: Smith, Ricardo, Marx", eng:"I.1-2 — Classical Views; Marx",
    body:`
      <p class="lede">Chương 8 mở ra bằng chính lời tóm tắt của Shaikh: cả Smith, Ricardo VÀ Marx đều đồng ý rằng cạnh tranh có xu hướng bình quân hóa lương và tỷ suất lợi nhuận, khiến giá thị trường hấp dẫn quanh — nhưng vẫn khác — giá "tự nhiên" (giá cả sản xuất). Phân tích của Marx tinh vi nhất: ông nhấn mạnh sự hấp dẫn của giá thị trường quanh giá sản xuất là một "chuyển động vô chính phủ".</p>
      <h3>Adam Smith: cạnh tranh là "nguyên lý tổ chức chung"</h3>
      <blockquote style="margin:14px 0;padding:10px 16px;border-left:3px solid var(--gold);background:var(--panel-2);font-size:13.5px;font-style:italic;">"Toàn bộ những lợi thế và bất lợi của các nghề nghiệp khác nhau, trong cùng khu vực lân cận, phải hoặc hoàn toàn bằng nhau, hoặc liên tục có xu hướng trở nên bằng nhau... Đây ít nhất sẽ là trường hợp trong một xã hội nơi mọi thứ được để tự do vận hành theo lẽ tự nhiên." <span style="font-style:normal;color:var(--muted);">— Smith, 1776</span></blockquote>
      <p>Smith phân biệt rạch ròi <b>chi phí</b> (nguyên liệu + lương) và <b>lợi nhuận</b> (chênh lệch giữa giá và chi phí) — lợi nhuận thực tế được điều tiết hỗn loạn bởi lợi nhuận "tự nhiên" trong dài hạn, nhưng điều đó KHÔNG có nghĩa lợi nhuận nên bị coi là một loại chi phí (một sai lầm mà kinh tế học sau này mắc phải). Cách đọc thông thường về "hấp dẫn" ở Smith hiểu nhầm thành "ổn định tại một điểm" — nhưng Smith nói rõ giá tự nhiên bản thân LUÔN thay đổi theo công nghệ, nên giá thị trường "liên tục hấp dẫn quanh" chứ không bao giờ "an vị".</p>
      <h3>Ricardo: phân biệt điều kiện trung bình và điều kiện điều tiết</h3>
      <p>Ricardo đóng góp khái niệm nền tảng cho lý thuyết địa tô (và sau này là "tư bản điều tiết" ở chương 7): phân biệt giữa điều kiện sản xuất TRUNG BÌNH và điều kiện ĐIỀU TIẾT (đất tốt nhất còn khả dụng). Ông cũng nhấn mạnh: giá thị trường không "cách xa nhiều, hay lâu" so với giá tự nhiên — nhưng vẫn hoàn toàn nhất quán với những dao động đáng kể trong ngắn hạn.</p>
      <h3>Marx: người bán chủ động, "chiến tranh của tất cả chống lại tất cả"</h3>
      <div class="debate-box">
        <div class="dh">TRÍCH DẪN TRUNG TÂM CỦA MARX</div>
        <div class="db">"Cạnh tranh... không gì khác hơn là bản chất bên trong của tư bản, đặc tính cốt yếu của nó, xuất hiện và hiện thực hóa qua tương tác qua lại giữa nhiều tư bản với nhau." Những va chạm này mang bản chất đối kháng: cạnh tranh là <i>bellum omnium contra omnes</i> — "chiến tranh của tất cả chống lại tất cả". "Trận chiến cạnh tranh được chiến đấu bằng việc hạ giá thành hàng hóa."</div>
      </div>
      <p>Ba đóng góp cốt lõi của Marx: (1) hãng CHỦ ĐỘNG đặt giá (không thụ động nhận giá); (2) hãng chủ động CẮT GIÁ dựa trên cắt giảm chi phí; (3) kỹ thuật chi phí thấp hơn thường đòi hỏi CƯỜNG ĐỘ VỐN cao hơn — tiền đề trực tiếp cho lý thuyết xu hướng tỷ suất lợi nhuận giảm dần (nối chương 7): "Sự rẻ đi của hàng hóa phụ thuộc, ceteris paribus, vào năng suất lao động, và năng suất này lại phụ thuộc vào quy mô sản xuất. Do đó tư bản lớn hơn đánh bại tư bản nhỏ hơn."</p>
      <div class="figure-note"><b>Marx cũng dự báo trước hiện tượng "định giá theo tổng chi phí" (chương 7):</b> "Kinh nghiệm cho thấy... nếu một ngành công nghiệp mang lại lợi nhuận cao bất thường ở một thời điểm, nó sẽ mang lại rất ít lợi nhuận, hoặc thậm chí thua lỗ, ở thời điểm khác, sao cho trong một chu kỳ năm nhất định, lợi nhuận bình quân gần giống với các ngành khác. Và tư bản sớm học được cách tính đến kinh nghiệm này."</div>

      <p>Đây là lập luận logic sắc bén nhất của chương: lý thuyết cạnh tranh hoàn hảo giả định MỌI hãng giống hệt nhau VÀ có kiến thức hoàn hảo — nhưng hai giả định này lại MÂU THUẪN với nhau.</p>

      <div class="figure-note"><b>Hệ quả gây sốc:</b> nếu các hãng có kỳ vọng NHẤT QUÁN (coherent) thay vì phi lý, mỗi hãng phải nhận ra mình đối mặt đường cầu DỐC XUỐNG — điều kiện tối đa hóa lợi nhuận trở thành mr=mc (không phải p=mc), và vì mọi hãng giống hệt nhau, kết quả TỔNG sẽ là X thỏa mr(X)=mc(X) — <b>ĐÚNG BẰNG kết quả của một nhà độc quyền thuần túy!</b> "Lý thuyết Số lượng Cạnh tranh" hoàn toàn sụp đổ: kỳ vọng nhất quán khiến cạnh tranh hoàn hảo và độc quyền tuyệt đối cho ra CÙNG một kết quả.</div>

      <div class="concept-grid">
        <div class="concept"><span class="term">Hayek</span><p>Cạnh tranh là "quá trình hình thành ý kiến" lan tỏa thông tin — hoàn toàn khác trạng thái tĩnh. Tại bất kỳ thời điểm nào, chỉ có MỘT nhà sản xuất chi phí thấp nhất, người có thể bị "vượt mặt" bởi người khác, rồi người đó lại bị vượt mặt tiếp — một chuỗi sự kiện cạnh tranh liên tục không thể quy giản về trạng thái tĩnh.</p></div>
        <div class="concept"><span class="term">Von Mises</span><p>Mọi hệ thống xã hội đều có cạnh tranh dưới hình thức nào đó — trong thị trường, người bán phải vượt trội nhau bằng hàng tốt/rẻ hơn, người mua vượt trội nhau bằng giá cao hơn. Người tiêu dùng là "vua" tối thượng.</p></div>

    title:"Chủ nghĩa Tư bản Độc quyền Marxist và Cạnh tranh Không hoàn hảo", eng:"I.7-8 — Marxian Monopoly Capitalism; Rise of Imperfect Competition",
    body:`
      <p class="lede">Trường phái CNTB độc quyền Marxist (Hilferding, được Lenin "đóng dấu" chính thống hóa) lập luận: quy mô và cường độ vốn tăng lên qua thời gian khiến việc gia nhập/rút lui khó khăn hơn, cản trở di động tư bản cần thiết để bình quân hóa tỷ suất lợi nhuận — đến cuối thế kỷ 19, sự tập trung/tập trung hóa tư bản đã tạo ra một giai đoạn CNTB mới nơi "độc quyền" thay thế "cạnh tranh".</p>
      <div class="concept-grid">
        <div class="concept"><span class="term">Hilferding</span><p>Tư bản lớn dùng cartel, hợp nhất, sáp nhập để triệt tiêu cạnh tranh và nâng tỷ suất lợi nhuận — gắn chặt với ngân hàng lớn cấp vốn, tạo ra "Tư bản Tài chính" (Finance Capital).</p></div>
        <div class="concept"><span class="term">Lenin</span><p>Xây dựng lý thuyết về chủ nghĩa đế quốc dựa trên nhu cầu xuất khẩu tư bản gia tăng ở giai đoạn độc quyền — biến quan điểm Hilferding thành chính thống của phong trào Marxist.</p></div>
        <div class="concept"><span class="term">Sweezy, Baran, Mandel</span><p>Mở rộng lập luận sang thế kỷ 20 — Sweezy: "vô ích khi cố xây dựng một lý thuyết chính xác về giá độc quyền" vì quá nhiều yếu tố ngẫu nhiên can thiệp; sau đó chuyển sang dùng lý thuyết markup của Kalecki.</p></div>
      </div>
      <div class="figure-note"><b>Mâu thuẫn nội tại trong lập luận của Sweezy:</b> ông nói xuất khẩu tư bản từ khu vực độc quyền lợi nhuận cao sang khu vực cạnh tranh trong MỘT nước sẽ ĐẨY tỷ suất lợi nhuận khu vực sau XUỐNG — nhưng lại nói xuất khẩu tư bản từ nước lợi nhuận cao sang nước lợi nhuận thấp sẽ BÌNH QUÂN HÓA tỷ suất lợi nhuận GIỮA các nước. Hai lập luận này mâu thuẫn trực tiếp với nhau.</div>
      <p><b>Phê phán trung tâm của Shaikh:</b> toàn bộ trường phái CNTB độc quyền chia sẻ tiền đề rằng cạnh tranh SUY GIẢM khi hãng lớn hơn, đa dạng hơn, ít số lượng hơn — nhưng CHỈ trong lý thuyết cạnh tranh hoàn hảo mới có yêu cầu hãng phải "vô cực nhỏ" để được coi là cạnh tranh. Lý thuyết cạnh tranh THỰC không hề có yêu cầu này — quy mô lớn hơn chính là PHƯƠNG TIỆN nội tại để giảm chi phí trong trận chiến cạnh tranh (chương 7, phần V). Trường phái này phụ thuộc nặng nề vào khái niệm cạnh tranh thông thường làm "đối trọng" trong khi lại biết rất ít về chính điểm khởi đầu lý thuyết của mình — Marx.</p>
      <h3>Sự trỗi dậy của cạnh tranh không hoàn hảo: Sraffa 1926 → Chamberlin/Robinson</h3>
      <p>Bài báo 1926 của Sraffa là "phát súng" đầu tiên: ông chỉ ra hiệu suất giảm dần (chi phí tăng) không thể tồn tại trong dài hạn (mọi yếu tố cố định đều có thể nhân đôi), nhưng hiệu suất tăng dần (chi phí giảm không giới hạn) lại không tương thích với cân bằng tân cổ điển — điều kiện sản xuất dài hạn nhất quán DUY NHẤT là chi phí không đổi (mc=ac). Nhưng nếu vậy, quy mô sản xuất trở nên BẤT ĐỊNH. Sraffa kết luận: giới hạn thực sự nằm ở đường CẦU dốc xuống mà mỗi hãng đối mặt — buộc phải "từ bỏ con đường cạnh tranh tự do, quay sang hướng ngược lại: hướng tới độc quyền."</p>
      <div class="stat-row">
        <div class="stat-box"><div class="val">1927/1933</div><div class="lbl">Chamberlin (Cạnh tranh Độc quyền) và Robinson (Cạnh tranh Không hoàn hảo) công bố</div></div>
        <div class="stat-box"><div class="val">p=mc → mr=mc</div><div class="lbl">Thay đổi quy tắc tối đa hóa lợi nhuận trung tâm của toàn bộ trường phái</div></div>
      </div>
      <div class="figure-note"><b>Cuộc phản công tân cổ điển (từ Đại khủng hoảng 1929):</b> Stigler và Friedman dẫn đầu, phản đối cách tiếp cận "không hoàn hảo" vì thiếu tích hợp vào một lý thuyết vĩ mô cụ thể và xây dựng mô hình chắp vá theo từng trường hợp riêng lẻ. Kết quả: cạnh tranh hoàn hảo được PHỤC HỒI ngôi vương — trong hầu hết giáo trình hiện đại, cạnh tranh không hoàn hảo chỉ còn là "một lời thì thầm" bên lề (398 trang về cạnh tranh hoàn hảo so với 34 trang cho độc quyền/cạnh tranh không hoàn hảo trong một giáo trình vi mô phổ biến).</div>
    `,
    concepts:[
      ["CNTB Độc quyền (Hilferding-Lenin)","Monopoly capitalism theory","Quy mô/cường độ vốn tăng cản trở di động tư bản, tạo giai đoạn 'độc quyền' mới thay thế 'cạnh tranh' — Hilferding khởi xướng, Lenin chính thống hóa trong phong trào Marxist."],
      ["Mâu thuẫn nội tại của Sweezy","Sweezy's internal contradiction","Xuất khẩu tư bản trong nước được nói là ĐẨY tỷ suất lợi nhuận khu vực cạnh tranh XUỐNG, nhưng xuất khẩu tư bản giữa các nước lại được nói là BÌNH QUÂN HÓA tỷ suất lợi nhuận — hai lập luận mâu thuẫn nhau."],
      ["Phê phán trung tâm: quy mô lớn ≠ phi cạnh tranh","Core critique: large scale does not mean less competitive","Chỉ lý thuyết cạnh tranh hoàn hảo mới yêu cầu hãng 'vô cực nhỏ'; trong cạnh tranh thực, quy mô lớn là phương tiện nội tại để giảm chi phí trong cạnh tranh."],
      ["Sraffa 1926 — 'phát súng' đầu tiên","Sraffa's 1926 opening salvo","Chứng minh chi phí không đổi là điều kiện dài hạn nhất quán duy nhất trong khung tân cổ điển, dẫn tới kết luận phải 'quay sang hướng độc quyền' — khởi đầu trường phái cạnh tranh không hoàn hảo."],
      ["Cuộc phản công tân cổ điển","The neoclassical counterattack","Từ Đại khủng hoảng 1929, Stigler/Friedman dẫn đầu phản đối cạnh tranh không hoàn hảo — cuối cùng cạnh tranh hoàn hảo phục hồi vị thế thống trị trong giáo trình hiện đại."]

    id:"kaleckihau", n:"4", label:"Kalecki & Cổ điển HĐ",
    title:"Kalecki, Hậu-Keynesian, và Kinh tế học Cổ điển Hiện đại", eng:"I.9-10 — Kalecki and Post-Keynesian Views; Modern Classical Views",
    body:`
      <p class="lede">Kalecki quan sát: hãng đặt giá, giá bán khác nhau ngay cả với sản phẩm tương đối đồng nhất, và hãng chi phí thấp hơn tính giá thấp hơn — Shaikh chỉ ra CHÍNH những khuôn mẫu này cũng được suy ra từ khái niệm cạnh tranh thực cổ điển (chương 7)! Điểm ĐẶC TRƯNG riêng của Kalecki là: giá được đặt qua một <b>markup độc quyền ỔN ĐỊNH</b> trên chi phí, markup bị ràng buộc phần nào bởi đe dọa cạnh tranh giá từ đối thủ, và tỷ suất lợi nhuận dài hạn khác nhau ngay cả giữa các "người dẫn dắt giá".</p>
      <h3>Ba vấn đề của lý thuyết markup Kalecki</h3>
      <div class="debate-box">
        <div class="dh">PHÊ PHÁN KỸ THUẬT BA TẦNG</div>
        <div class="db">
        <b>(1)</b> Markup thực nghiệm luôn LỚN HƠN 1 (trừ giai đoạn lợi nhuận cực âm) — buộc lý thuyết phải thêm ràng buộc tùy tiện m&gt;1.<br>
        <b>(2)</b> Để lý thuyết có ý nghĩa, markup ĐỘC QUYỀN phải lớn hơn markup CẠNH TRANH (m &gt; m*) — nghĩa là chỉ phần CHÊNH LỆCH markup (m−m*) mới là bằng chứng độc quyền thực sự, không phải toàn bộ markup như Kalecki thường ngầm giả định.<br>
        <b>(3)</b> Tỷ suất lợi nhuận "cạnh tranh" liên quan (r*) phải là tỷ suất của TƯ BẢN ĐIỀU TIẾT ở mức sử dụng công suất chuẩn — không phải tỷ suất trung bình của mọi tư bản ở mức sử dụng thực tế quan sát được.</div>
      </div>
      <p>Vì lý thuyết Kalecki coi MỌI biên lợi nhuận dương là "markup độc quyền", nó sẽ kết luận sai lầm rằng ngay cả những hãng có biên lợi nhuận DƯỚI mức cạnh tranh cũng có "quyền lực độc quyền" nào đó. Văn liệu hậu-Keynesian (Kaldor, Sylos-Labini, Eichner, Lee...) sau này phải tách markup thành hai phần: "lợi nhuận thông thường" và "lợi nhuận do rào cản gia nhập" để khắc phục vấn đề này.</p>
      <h3>Ba lập trường của kinh tế học cổ điển hiện đại</h3>
      <div class="concept-grid">
        <div class="concept"><span class="term">Lập trường 1 — Giá gần bằng nhau</span><p>Sraffa, Steedman: thao tác trực tiếp bằng giá cả sản xuất, ngầm coi chúng "đủ gần" giá thị trường để bỏ qua khác biệt — phương pháp luận chính thống từ thời Walras.</p></div>
        <div class="concept"><span class="term">Lập trường 2 — Giá dao động đáng kể</span><p>Garegnani, Shaikh, Duménil-Lévy: giá cả sản xuất chỉ là ĐIỂM QUY CHIẾU, không phải thực thể thực tế — mọi quyết định kinh tế nên "vững chắc" (robust) trong phạm vi biến động bình thường, thay vì dựa vào phân tích biên mong manh.</p></div>
        <div class="concept"><span class="term">Lập trường 3 — Bỏ hẳn khái niệm cạnh tranh</span><p>Farjoun & Machover: dùng cơ học thống kê, coi giá/tỷ suất lợi nhuận là biến ngẫu nhiên — châm biếm "giả thuyết kinh tế học" về tỷ suất lợi nhuận bằng nhau tuyệt đối vi phạm định luật entropy vật lý (nhưng chính họ lại hiểu sai hoàn toàn cạnh tranh cổ điển mà họ đang châm biếm).</p></div>
      </div>
      <div class="figure-note"><b>Kết nối lại với chương 9 và 17:</b> Farjoun-Machover mắc kẹt trong tầm nhìn tân cổ điển về cạnh tranh (bằng nhau tuyệt đối) nên bác bỏ luôn khái niệm arbitrage giá/tỷ suất lợi nhuận. Từ góc nhìn cạnh tranh thực, toàn bộ lập luận của họ có thể tái cấu trúc thành độ lệch của giá/tỷ suất lợi nhuận so với tư bản điều tiết (người dẫn dắt giá) — cho ta CẢ lý thuyết về phân phối (độ phân tán) LẪN lý thuyết về xu hướng trung tâm.</div>

      ["Markup độc quyền của Kalecki","Kalecki's monopoly markup","Giá = markup ổn định trên chi phí chính, ràng buộc bởi đe dọa cạnh tranh và 'mức độ độc quyền' — nhưng có 3 vấn đề kỹ thuật khiến việc coi toàn bộ markup là bằng chứng độc quyền là sai lầm."],

      <h3>Nghiên cứu kinh điển của Bain (1951): mối tương quan yếu đến kinh ngạc</h3>
      <p>Bain xây dựng mẫu 42 ngành, 335 hãng (1936-1940), so sánh tỷ suất lợi nhuận trên vốn chủ sở hữu (ROE) với tỷ lệ tập trung 8-hãng (CR8) — giả thuyết trung tâm: ngành tập trung hơn có tỷ suất lợi nhuận cao hơn ĐÁNG KỂ trong dài hạn.</p>

      <h3>Đánh giá tổng thể: quan hệ tập trung-lợi nhuận yếu, không ổn định</h3>
      <p>Sau hàng thập kỷ nghiên cứu tiếp nối (Mann, Demsetz, Schmalensee, Scherer...), kết luận tổng hợp là: khác biệt về tỷ suất lợi nhuận kế toán "quá nhỏ để biện minh cho các tuyên bố về quyền lực độc quyền", và mối tương quan quan sát được giữa tập trung và lợi nhuận "yếu về mặt thống kê... không ổn định theo thời gian/không gian và biến mất trong nhiều nghiên cứu đa biến". Đồng thời, chênh lệch tỷ suất lợi nhuận DAI DẲNG vẫn tồn tại và KHÔNG được giải thích tốt bởi rủi ro — chính xác những gì Mueller (chương 7, VI.5) đã tìm thấy cho tỷ suất TRUNG BÌNH, trong khi tỷ suất GIA TĂNG lại bình quân hóa hỗn loạn đúng như lý thuyết cổ điển dự đoán.</p>

  {sec:"CNTB Độc quyền & KHH",q:"Mâu thuẫn nội tại trong lập luận của Sweezy về xuất khẩu tư bản là gì?",a:"Ông nói xuất khẩu tư bản TRONG nước đẩy tỷ suất lợi nhuận khu vực cạnh tranh XUỐNG, nhưng xuất khẩu tư bản GIỮA các nước lại BÌNH QUÂN HÓA tỷ suất lợi nhuận — hai lập luận mâu thuẫn nhau."},
  {sec:"CNTB Độc quyền & KHH",q:"Sraffa (1926) kết luận gì về điều kiện sản xuất dài hạn nhất quán duy nhất trong khung tân cổ điển?",a:"Chi phí không đổi (mc=ac) — vì hiệu suất giảm không thể tồn tại dài hạn và hiệu suất tăng không tương thích với cân bằng — dẫn ông tới kết luận phải 'quay sang hướng độc quyền'."},
  {sec:"Kalecki & Cổ điển HĐ",q:"Ba vấn đề kỹ thuật của lý thuyết markup độc quyền Kalecki là gì?",a:"(1) Markup thực nghiệm luôn >1; (2) chỉ CHÊNH LỆCH markup (m>m*) mới là bằng chứng độc quyền thực; (3) tỷ suất cạnh tranh liên quan phải là của tư bản điều tiết ở công suất chuẩn, không phải trung bình quan sát được."},
  {sec:"Kalecki & Cổ điển HĐ",q:"Ba lập trường của kinh tế học cổ điển hiện đại về quan hệ giá thị trường-giá sản xuất là gì?",a:"(1) Giá gần bằng nhau (Sraffa/Steedman); (2) giá dao động đáng kể, chỉ là điểm quy chiếu (Garegnani/Shaikh); (3) bỏ hẳn khái niệm cạnh tranh, dùng cơ học thống kê (Farjoun-Machover)."},

  {sec:"BC: Tập trung & TSLN",q:"Kết luận 'ngưỡng tập trung 70%' của Bain có bền vững không?",a:"Không — khi đưa lại 34 ngành ban đầu bị loại khỏi mẫu, khác biệt thống kê giữa nhóm tập trung cao/thấp biến mất hoàn toàn."},
  {sec:"BC: Biên LN & Cấu kết",q:"Vì sao biên lợi nhuận tương quan dương với tỷ lệ tập trung KHÔNG PHẢI là bằng chứng độc quyền, theo cạnh tranh thực?",a:"Vì đây là hệ quả tất yếu của cạnh tranh: chi phí thấp→biên lợi nhuận cao (trong ngành), cường độ vốn→biên lợi nhuận điều tiết cao (giữa ngành) — và cả hai đều tương quan tự nhiên với tập trung."},
  {sec:"BC: Biên LN & Cấu kết",q:"Mô phỏng Gisser-Sauer (2000) so sánh ba mô hình nào, và mô hình nào khớp với dữ liệu thực?",a:"Bertrand (cạnh tranh thuần), cấu kết độc quyền chung, và Cournot (người dẫn dắt giá cạnh tranh nhau) — chỉ mô hình Cournot khớp cả khoảng lẫn trung vị của dữ liệu thực nghiệm."},

  document.getElementById('fcProgress').textContent = 'Thẻ ' + (fcIndex+1) + ' / ' + FLASHCARDS.length;
  flashcardEl.classList.remove('flipped');
}
function flipFC(){ flashcardEl.classList.toggle('flipped'); }
document.getElementById('fcFlip').addEventListener('click', flipFC);
flashcardEl.addEventListener('click', flipFC);
document.getElementById('fcNext').addEventListener('click', function(){
  fcIndex = (fcIndex+1) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcPrev').addEventListener('click', function(){
  fcIndex = (fcIndex-1+FLASHCARDS.length) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcShuffle').addEventListener('click', function(){
  for(var i=fcOrder.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = fcOrder[i]; fcOrder[i]=fcOrder[j]; fcOrder[j]=tmp;
  }
  fcIndex = 0;
  renderFlashcard();
});
renderFlashcard();

/* =========================================================
   QUIZ RENDER
   ========================================================= */
var quizArea = document.getElementById('quizArea');
var quizAnswers = {};

function renderQuiz(){
  var html = QUIZ.map(function(item, qi){
    var opts = item.opts.map(function(opt, vi){
      return '<div class="q-opt" data-qi="'+qi+'" data-qv="'+vi+'">'+opt+'</div>';
    }).join('');
    return '<div class="q-block" id="qblock-'+qi+'">'+
      '<div class="q-text">'+(qi+1)+'. '+item.q+'</div>'+
      '<div class="q-opts">'+opts+'</div>'+
      '<div class="q-explain" id="qexplain-'+qi+'">'+item.explain+'</div>'+
      '</div>';
  }).join('');
  html += '<div style="text-align:center;margin-top:20px;"><button class="btn primary" id="quizFinish">Xem kết quả</button> <button class="btn" id="quizReset">Làm lại</button></div>';
  html += '<div id="quizResult"></div>';
  quizArea.innerHTML = html;

  quizArea.addEventListener('click', quizClickHandler);
  document.getElementById('quizFinish').addEventListener('click', showQuizScore);
  document.getElementById('quizReset').addEventListener('click', function(){
    quizAnswers = {};
    renderQuiz();
  });
}

function quizClickHandler(e){
  var opt = e.target.closest('.q-opt');
  if(!opt) return;
  var qi = parseInt(opt.dataset.qi, 10);
  var qv = parseInt(opt.dataset.qv, 10);
  quizAnswers[qi] = qv;
  var block = document.getElementById('qblock-'+qi);
  block.querySelectorAll('.q-opt').forEach(function(o){
    o.classList.remove('selected','correct','incorrect');
  });
  var correctIdx = QUIZ[qi].correct;
  block.querySelectorAll('.q-opt').forEach(function(o){
    var v = parseInt(o.dataset.qv,10);
    if(v === correctIdx) o.classList.add('correct');
    else if(v === qv) o.classList.add('incorrect');
  });
  document.getElementById('qexplain-'+qi).classList.add('show');
  updateQuizProgress();
}

function updateQuizProgress(){
  var answered = Object.keys(quizAnswers).length;
  var pct = Math.round(100*answered/QUIZ.length);
  document.getElementById('quizProgressFill').style.width = pct+'%';
}

function showQuizScore(){
  var correct = 0;
  QUIZ.forEach(function(item, qi){
    if(quizAnswers[qi] === item.correct) correct++;
  });
  var pct = Math.round(100*correct/QUIZ.length);
  document.getElementById('quizResult').innerHTML =
    '<div class="quiz-score"><div class="num">'+correct+'/'+QUIZ.length+'</div>'+
    '<div class="lbl">('+pct+'%) — '+ (pct>=80?'Nắm rất vững nội dung!':pct>=50?'Khá tốt, xem lại vài phần.':'Nên đọc lại các phần liên quan.') +'</div></div>';
}
renderQuiz();

/* =========================================================
   NOTES PANEL
   ========================================================= */
var notesFab = document.getElementById('notesFab');
var notesPanel = document.getElementById('notesPanel');
var notesBackdrop = document.getElementById('notesBackdrop');
var notesBody = document.getElementById('notesBody');
var notesTitle = document.getElementById('notesTitle');
var notesFoot = document.getElementById('notesFoot');
var currentNoteTab = 'codien8';
var LS_PREFIX = 'shaikh_ch8_note_';

function isMobile(){ return window.matchMedia('(max-width:640px)').matches; }

function noteLabelFor(id){
  var s = SECTIONS.filter(function(x){return x.id===id;})[0];
  if(s) return s.n + '. ' + s.label;
  if(id === 'gloss') return 'Thuật ngữ';
  if(id === 'flashcards') return 'Thẻ ghi nhớ';
  if(id === 'quiz') return 'Quiz';
  return id;
}

function openNotesFor(id){
  currentNoteTab = id;
  notesTitle.textContent = 'Ghi chú — ' + noteLabelFor(id);
  var saved = localStorage.getItem(LS_PREFIX + id) || '';
  notesBody.innerHTML = saved;
  updateNotesFoot();
}
function updateNotesFoot(){
  var len = notesBody.innerText.trim().length;
  notesFoot.textContent = len + ' ký tự · lưu tự động';
}
function saveCurrentNote(){
  localStorage.setItem(LS_PREFIX + currentNoteTab, notesBody.innerHTML);
  updateNotesFoot();
}
function openNotesPanel(){
  notesPanel.classList.add('open');
  if(isMobile()){ notesBackdrop.classList.add('show'); }
}
function closeNotesPanel(){
  notesPanel.classList.remove('open');
  notesBackdrop.classList.remove('show');
}
notesFab.addEventListener('click', function(){
  if(notesPanel.classList.contains('open')){
    closeNotesPanel();
  } else {
    openNotesFor(currentNoteTab);
    openNotesPanel();
  }
});
document.getElementById('notesClose').addEventListener('click', closeNotesPanel);
notesBackdrop.addEventListener('click', closeNotesPanel);
notesBody.addEventListener('input', saveCurrentNote);
document.querySelectorAll('.notes-toolbar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    var cmd = btn.dataset.cmd;
    notesBody.focus();
    if(cmd.indexOf(':')>-1){
      var parts = cmd.split(':');
      document.execCommand(parts[0], false, parts[1]);
    } else {
      document.execCommand(cmd, false, null);
    }
    saveCurrentNote();
  });
});

activateTab(ALL_TAB_IDS[0]);
</script>
