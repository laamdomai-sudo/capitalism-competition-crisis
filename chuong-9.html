<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">

<title>Shaikh — Capitalism: Competition, Conflict, Crises — Chương 9</title>
<style>
:root{
  --bg:#f2ede0;
  --panel:#fffdf8;
  --panel-2:#eef1e8;
  --ink:#211d16;
  --ink-soft:#4c473b;
  --muted:#847b68;
  --line:#dcd0ac;
  --primary:#1f3b5c;
  --primary-dark:#152944;
  --primary-tint:#e1e8ef;
  --gold:#a67f2c;
  --gold-light:#d6b263;
  --green:#2f6b3f;
  --green-tint:#e3ede4;
  --red:#8a2f2f;
  --red-tint:#f0e2e2;
  --dark-bg:#141b22;
  --dark-panel:#1d2731;
  --dark-ink:#eef1e6;
  --dark-line:#324256;
  --shadow:0 6px 24px rgba(20,27,34,0.12);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1000px;margin:0 auto;padding:0 16px 80px;}

.hero{padding:32px 16px 20px;text-align:center;border-bottom:3px double var(--gold);margin-bottom:18px;background:radial-gradient(ellipse at top, rgba(166,127,44,0.08), transparent 60%);}
.hero .kicker{font-family:Georgia,serif;letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700;}
.hero h1{font-size:clamp(22px,4.6vw,34px);margin:8px 0 4px;color:var(--primary-dark);letter-spacing:.005em;line-height:1.25;}
.hero .subtitle{font-size:14.5px;color:var(--ink-soft);font-style:italic;}
.hero .meta{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hero .meta span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);}
.hero .meta a.meta-link{color:var(--primary);text-decoration:none;font-weight:600;}
.hero .meta a.meta-link:hover{background:var(--primary-tint);}


.tabbar-wrap{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:8px;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tabbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;}
.tabbar::-webkit-scrollbar{height:5px;}
.tabbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.tab-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
.tab-btn .n{color:var(--gold);font-weight:800;margin-right:5px;}
.tab-btn:hover{border-color:var(--gold);}
.tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow);}
.tab-btn.active .n{color:var(--gold-light);}

.panel{display:none;animation:fadein .25s ease;}
.panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);}
.card h2{margin:0 0 4px;font-size:21px;color:var(--primary-dark);}
.card .eng-title{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:16px;letter-spacing:.02em;}
.card h3{font-size:15.5px;color:var(--primary);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px;}
.card p{margin:0 0 12px;color:var(--ink);}
.card p:last-child{margin-bottom:0;}
.lede{font-size:16px;color:var(--ink-soft);border-left:3px solid var(--gold);padding-left:14px;margin:6px 0 18px;}

.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0;}
.concept{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.concept .term{font-weight:700;color:var(--primary-dark);font-size:13px;display:block;margin-bottom:4px;}
.concept .term .en{color:var(--gold);font-weight:600;font-size:11px;font-style:italic;}
.concept p{font-size:13px;margin:0;color:var(--ink-soft);}

.figure-note{background:var(--primary-tint);border:1px dashed var(--primary);border-radius:10px;padding:12px 15px;font-size:12.5px;color:var(--primary-dark);margin:14px 0;}
.figure-note b{color:var(--primary-dark);}

.debate-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0;}
.debate-box .dh{background:var(--primary);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.03em;}
.debate-box .db{padding:13px 15px;font-size:13px;color:var(--ink-soft);}
.debate-box .names{color:var(--gold);font-weight:700;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0;}
.stat-box{background:var(--primary-dark);color:#fff;border-radius:10px;padding:13px 14px;text-align:center;}
.stat-box .val{font-size:20px;font-weight:800;color:var(--gold-light);}
.stat-box .lbl{font-size:10.5px;color:#dbe4ee;margin-top:3px;line-height:1.3;}

.dark-panel{background:var(--dark-bg);color:var(--dark-ink);border-radius:12px;padding:20px;margin:16px 0;border:1px solid var(--dark-line);}
.dark-panel h4{margin:0 0 12px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;}
.flow{display:flex;flex-direction:column;gap:0;}
.flow-step{background:var(--dark-panel);border:1px solid var(--dark-line);border-radius:8px;padding:10px 14px;font-size:12.5px;position:relative;}
.flow-step b{color:var(--gold-light);}
.flow-arrow{text-align:center;color:var(--gold);font-size:16px;padding:2px 0;}
.flow-branch{display:flex;gap:10px;margin:2px 0;flex-wrap:wrap;}
.flow-branch>div{flex:1;min-width:150px;}

.chart-panel{background:var(--dark-bg);border:1px solid var(--dark-line);border-radius:12px;padding:18px 18px 14px;margin:16px 0;}
.chart-panel h4{margin:0 0 2px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;}
.chart-panel .chart-sub{font-size:11px;color:#9fb0c2;margin-bottom:10px;font-style:italic;}
.chart-panel svg{width:100%;height:auto;display:block;}

/* ===== Real/reference chart (photo, not illustrative SVG) ===== */
.chart-real{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:10px 0 18px;}
.chart-real-badge{display:inline-block;font-family:Georgia,serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);border-radius:4px;padding:3px 9px;margin-bottom:9px;}
.chart-real img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);}
.chart-real figcaption{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.55;font-style:italic;}

.chart-note{font-size:10.5px;color:#8496a8;margin-top:6px;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dark-ink);}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:12px;height:3px;display:inline-block;border-radius:2px;}

.bar-chart{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-label{width:170px;font-size:11.5px;color:var(--dark-ink);flex-shrink:0;}
.bar-track{flex:1;background:#2a3644;border-radius:6px;overflow:hidden;height:22px;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;color:#241d10;font-weight:700;}

.gloss-item{border-bottom:1px solid var(--line);padding:12px 0;}
.gloss-item:last-child{border-bottom:none;}
.gloss-term{font-weight:700;color:var(--primary-dark);font-size:14px;}
.gloss-term .en{color:var(--gold);font-weight:600;font-size:11.5px;font-style:italic;margin-left:6px;}
.gloss-def{font-size:13px;color:var(--ink-soft);margin-top:3px;}

.gloss-extra-row{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.gloss-extra-row .en{flex:1;color:var(--ink-soft);font-style:italic;}
.gloss-extra-row .vi{flex:1;color:var(--primary-dark);font-weight:600;}


.fc-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.fc-progress{font-size:13px;color:var(--muted);}
.fc-stage{display:flex;justify-content:center;margin:10px 0 20px;perspective:1400px;}
.flashcard{width:100%;max-width:560px;height:270px;position:relative;cursor:pointer;}
.flashcard .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flashcard.flipped .fc-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);}
.fc-front{background:var(--panel);}
.fc-front .fc-tag{position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;font-weight:700;}
.fc-front .fc-q{font-size:17px;color:var(--ink);font-weight:600;}
.fc-back{background:var(--primary);color:#fff;transform:rotateY(180deg);}
.fc-back .fc-a{font-size:14px;}
.fc-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;}
.fc-nav{display:flex;justify-content:center;gap:10px;margin-top:16px;}
.btn{border:1px solid var(--primary);background:var(--panel);color:var(--primary-dark);font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--primary);color:#fff;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-dark);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.quiz-progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--primary));transition:width .3s;}
.q-block{margin-bottom:14px;}
.q-text{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;}
.q-opts{display:flex;flex-direction:column;gap:8px;}
.q-opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer;transition:all .15s;}
.q-opt:hover{border-color:var(--gold);}
.q-opt.selected{border-color:var(--primary);background:var(--primary-tint);}
.q-opt.correct{border-color:var(--green);background:var(--green-tint);color:#1c4a28;font-weight:700;}
.q-opt.incorrect{border-color:var(--primary);background:#f3e6e6;color:#7a2020;font-weight:700;}
.q-explain{margin-top:10px;font-size:12.5px;color:var(--ink-soft);background:var(--panel-2);border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 8px 8px 0;display:none;}
.q-explain.show{display:block;}
.quiz-score{text-align:center;padding:30px 20px;}
.quiz-score .num{font-size:46px;font-weight:800;color:var(--primary);}
.quiz-score .lbl{font-size:14px;color:var(--muted);margin-bottom:18px;}

.notes-fab{position:fixed;right:22px;bottom:22px;z-index:50;background:var(--primary);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 8px 20px rgba(21,41,68,0.35);cursor:pointer;display:flex;align-items:center;gap:7px;}
.notes-backdrop{position:fixed;inset:0;background:rgba(15,18,22,0.45);z-index:60;display:none;}
.notes-backdrop.show{display:block;}
.notes-panel{position:fixed;top:0;right:0;height:100%;width:380px;max-width:88vw;background:var(--panel);z-index:70;box-shadow:-10px 0 30px rgba(0,0,0,0.2);transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;}
.notes-panel.open{transform:translateX(0);}
.notes-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.notes-head h4{margin:0;color:var(--primary-dark);font-size:14.5px;}
.notes-head .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.notes-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;}
.notes-toolbar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.notes-toolbar button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;width:30px;height:30px;cursor:pointer;font-family:Georgia,serif;font-size:14px;color:var(--ink);}
.notes-toolbar button:hover{border-color:var(--gold);}
.notes-body{flex:1;padding:16px 18px;overflow-y:auto;outline:none;font-size:14px;line-height:1.7;}
.notes-body:empty:before{content:"Ghi chú của bạn cho phần này... (tự động lưu)";color:var(--muted);font-style:italic;}
.notes-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);}

@media (max-width:640px){
  .hero{padding:22px 12px 14px;}
  .card{padding:16px 15px;}
  .flashcard{height:250px;}
  .notes-panel{width:100%;max-width:100%;}
}
@media print{
  .tabbar-wrap,.notes-fab,.notes-panel,.notes-backdrop,.fc-nav,.q-opts{display:none !important;}
  .panel{display:block !important;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
}
</style>
</head>

<script>
/* =========================================================
   MINI CHART HELPER
   ========================================================= */
function sparkPath(values, w, h, pad){
  var n = values.length;
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  var range = (max - min) || 1;
  var pts = values.map(function(v, i){
    var x = pad + (i/(n-1)) * (w - 2*pad);
    var y = pad + (1 - (v - min)/range) * (h - 2*pad);
    return [x,y];
  });
  var d = 'M ' + pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L ');
  var area = d + ' L ' + pts[pts.length-1][0].toFixed(1) + ',' + (h-pad) + ' L ' + pts[0][0].toFixed(1) + ',' + (h-pad) + ' Z';
  return {line:d, area:area, pts:pts};
}
function renderLineChart(containerId, series, opts){
  opts = opts || {};
  var w = opts.w || 400, h = opts.h || 120, pad = opts.pad || 8;
  var svg = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  series.forEach(function(s){
    var r = sparkPath(s.values, w, h, pad);
    if(s.fill !== false){
      svg += '<path d="'+r.area+'" fill="'+(s.color||'#a67f2c')+'" opacity="0.12"></path>';
    }
    svg += '<path d="'+r.line+'" fill="none" stroke="'+(s.color||'#a67f2c')+'" stroke-width="'+(s.width||2)+'" vector-effect="non-scaling-stroke"></path>';
  });
  svg += '</svg>';
  var el = document.getElementById(containerId);
  if(el) el.innerHTML = svg;
}
function renderScatter(containerId, points, opts){
  opts = opts || {};
  var w = opts.w || 400, h = opts.h || 220, pad = 26;
  var xs = points.map(function(p){return p[0];}), ys = points.map(function(p){return p[1];});
  var xmin=Math.min.apply(null,xs), xmax=Math.max.apply(null,xs);
  var ymin=Math.min.apply(null,ys), ymax=Math.max.apply(null,ys);
  var sx = function(x){ return pad + (x-xmin)/(xmax-xmin||1)*(w-2*pad); };
  var sy = function(y){ return h-pad - (y-ymin)/(ymax-ymin||1)*(h-2*pad); };
  var svg = '<svg viewBox="0 0 '+w+' '+h+'">';
  svg += '<line x1="'+pad+'" y1="'+pad+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#5a6a7c" stroke-width="1" stroke-dasharray="3,3"/>';
  points.forEach(function(p){
    svg += '<circle cx="'+sx(p[0]).toFixed(1)+'" cy="'+sy(p[1]).toFixed(1)+'" r="3.2" fill="'+(opts.color||'#d6b263')+'" opacity="0.85"/>';
  });
  svg += '</svg>';
  var el = document.getElementById(containerId);
  if(el) el.innerHTML = svg;
}

/* =========================================================
   DATA — SECTIONS (tabs 0-6)
   ========================================================= */
var SECTIONS = [
  {
    id:"gtcodien", n:"0", label:"Hai Giả thuyết Cổ điển",
    title:"Hai Giả thuyết Cổ điển và Sản xuất Hàng hóa Giản đơn", eng:"I-II. Introduction; Simple Commodity Production",
    body:`
      <p class="lede">Lý thuyết cổ điển về giá tương đối là một lập luận có cấu trúc chặt chẽ cao độ. Giá thị trường bình quân của một ngành dao động quanh giá sản xuất điều tiết; tư bản điều tiết mới, với chi phí đơn vị thấp hơn, giành chỗ đứng trên thị trường bằng cách cắt giá (chương 7). Giá tương đối các ngành sau đó trôi dạt lên xuống chủ yếu theo sự trôi dạt tương ứng của chi phí tương đối các ngành.</p>
      <h3>Hai giả thuyết cổ điển cần kiểm chứng</h3>
      <div class="concept-grid">
        <div class="concept"><span class="term">Giả thuyết Cắt ngang (Ricardo)</span><p>Độ lệch có hệ thống giữa giá cả sản xuất và tổng thời gian lao động là TƯƠNG ĐỐI NHỎ — nổi tiếng với ước tính "khoảng 7%" của Ricardo.</p></div>
        <div class="concept"><span class="term">Giả thuyết Chuỗi thời gian (Smith-Ricardo-Marx)</span><p>Biến động THEO THỜI GIAN của giá cả sản xuất tương đối chủ yếu do biến động của tổng thời gian lao động tương ứng quyết định — không đòi hỏi giả thuyết cắt ngang phải đúng (độ lệch có thể lớn nhưng ổn định qua thời gian).</p></div>
      </div>
      <div class="figure-note"><b>Marx kiên quyết:</b> "Dù giá cả được điều tiết ra sao... quy luật giá trị vẫn chi phối biến động giá cả, với việc giảm/tăng thời gian lao động cần thiết khiến giá cả sản xuất giảm/tăng." Ông đồng ý với Ricardo về tầm quan trọng của biến động TƯƠNG ĐỐI, dù thận trọng hơn về ĐỘ LỚN tuyệt đối của độ lệch cắt ngang.</div>
      <h3>Sản xuất Hàng hóa Giản đơn: điểm khởi đầu phân tích, không phải giai đoạn lịch sử</h3>
      <p>Để hiểu VÌ SAO giá cả sản xuất lệch khỏi thời gian lao động, cổ điển bắt đầu từ một trường hợp giả định: NGƯỜI SẢN XUẤT TỰ LÀM CHỦ (không thuê lao động, không có lợi nhuận) mua nguyên liệu, bán sản phẩm, di chuyển giữa các nghề tìm thu nhập cao hơn. Cạnh tranh san bằng THU NHẬP THEO GIỜ giữa các nghề — và vì chi phí đầu vào cũng là giá của lao động gián tiếp, kết quả là: <b>giá cả tỷ lệ thuận với TỔNG thời gian lao động (trực tiếp + gián tiếp)</b> cần để sản xuất ra nó.</p>
      <div class="figure-note"><b>Điểm mấu chốt bị bỏ lỡ bởi nhiều người:</b> đây là một CÔNG CỤ PHÂN TÍCH (theo Marx), không phải một "trạng thái sơ khai" lịch sử có thật (như Smith từng lỡ gợi ý, khiến Engels sau này cố mở rộng nó thành một giai đoạn lịch sử thực). Mục đích: tách bạch các thuộc tính CHUNG của sản xuất hàng hóa khỏi các thuộc tính RIÊNG của sản xuất hàng hóa tư bản chủ nghĩa — cho thấy độ lệch giá-thời gian lao động không đến từ quan hệ tư bản, lợi nhuận dương, hay thậm chí bình quân hóa tỷ suất lợi nhuận TỰ THÂN, mà cụ thể từ SỰ KHÁC BIỆT tỷ lệ vốn-lao động tích hợp GIỮA các ngành khi tỷ suất lợi nhuận được bình quân hóa.</div>

    body:`
      <p class="lede">Đây là một trong những kết quả thanh lịch nhất của toàn cuốn sách — áp dụng cho MỌI loại giá (giá trực tiếp, giá sản xuất, hay giá thị trường thực tế), vì nó bắt nguồn thuần túy từ một ĐỒNG NHẤT THỨC kế toán, không phải một giả định lý thuyết cụ thể nào.</p>
      <div class="dark-panel">
        <h4>Từ đồng nhất thức kế toán tới Phương trình Nền tảng</h4>
        <div class="flow">
          <div class="flow-step">Giá = Chi phí lao động đơn vị + Lợi nhuận đơn vị + Chi phí đầu vào đơn vị (đồng nhất thức kế toán đơn giản)</div>
          <div class="flow-arrow">↓ chi phí đầu vào cũng có thể phân rã tiếp thành lao động+lợi nhuận+đầu vào của ĐẦU VÀO, lặp lại vô hạn (nhưng hội tụ)</div>
          <div class="flow-step">Sau khi "tích hợp theo chiều dọc" toàn bộ chuỗi: <b>Giá = Chi phí lao động TÍCH HỢP × (1 + Tỷ lệ Lợi nhuận/Lương TÍCH HỢP)</b></div>
          <div class="flow-arrow">↓ áp dụng cho giá tương đối giữa 2 ngành bất kỳ</div>
          <div class="flow-step" style="border-color:var(--gold);">Giá tương đối = (Chi phí lao động tích hợp tương đối) × (Tỷ lệ Lợi nhuận/Lương tích hợp tương đối) — chỉ HAI số hạng nhân với nhau, không hơn</div>
        </div>
      </div>
      <p>Số hạng thứ hai — tỷ lệ Lợi nhuận/Lương tích hợp tương đối — đóng vai trò như một "số hạng nhiễu" (χ) quanh tỷ lệ chi phí lao động. Đây chính là chìa khóa: vì tỷ lệ TÍCH HỢP của mỗi ngành là một BÌNH QUÂN GIA QUYỀN của tỷ lệ riêng ngành đó VÀ tỷ lệ của mọi ngành liên kết trực tiếp/gián tiếp với nó qua chuỗi đầu vào — các tỷ lệ TÍCH HỢP có xu hướng GIỐNG NHAU hơn nhiều so với các tỷ lệ TRỰC TIẾP riêng lẻ.</p>

      <div class="figure-note"><b>Hệ quả:</b> vì tỷ lệ lợi nhuận/lương thực tế các nước tiên tiến dao động khá hẹp (25-30%), và tỷ lệ TÍCH HỢP còn hẹp hơn nữa (do là bình quân), "số hạng nhiễu" χ có xu hướng RẤT GẦN 1 trong hầu hết trường hợp — đây chính là lý do lý thuyết cho phép dự đoán giá tương đối gần với chi phí lao động tương đối, ngay cả khi tỷ suất lợi nhuận đã được bình quân hóa dương.</div>

    concepts:[
      ["Phương trình Nền tảng của Giá","The Fundamental Equation of Price","p = chi phí lao động tích hợp × (1 + tỷ lệ lợi nhuận/lương tích hợp) — suy ra thuần túy từ đồng nhất thức kế toán, áp dụng cho MỌI loại giá."],
      ["Tích hợp theo chiều dọc","Vertical integration","Quá trình cộng gộp chi phí lao động/lợi nhuận trực tiếp VÀ mọi tầng gián tiếp qua chuỗi đầu vào — chuỗi phân rã hội tụ vì mỗi tầng tiếp theo chỉ là một phần nhỏ của tầng trước."],
      ["Số hạng nhiễu χ","The disturbance term χ","Tỷ lệ lợi nhuận/lương tích hợp tương đối giữa hai ngành — vì đây là bình quân gia quyền qua chuỗi liên kết, χ có xu hướng gần 1 hơn nhiều so với tỷ lệ trực tiếp riêng lẻ."],
      ["Tỷ lệ Lợi nhuận/Lương ổn định giữa các nước","Stable profit/wage ratios across countries","Dao động hẹp 25-30% ở các nước tiên tiến (1960-2011) — cơ sở thực nghiệm cho việc số hạng nhiễu χ gần 1, giải thích vì sao giá tương đối bám sát chi phí lao động tương đối."]

  {
    id:"dolương9", n:"2", label:"Đo lường Khoảng cách",
    title:"Đo lường Khoảng cách: Vì sao Hồi quy Thông thường Đánh lừa", eng:"IV. Measuring the Distance Between Relative Prices and their Regulators",
    body:`
      <p class="lede">Trước khi xem bằng chứng, cần một công cụ đo lường ĐÚNG ĐẮN. Shaikh chỉ ra: hồi quy thống kê thông thường — công cụ mặc định của phần lớn văn liệu — có một lỗ hổng nghiêm trọng khi so sánh giá cả và thời gian lao động theo dữ liệu cắt ngang.</p>
      <div class="debate-box">
        <div class="dh">THÍ NGHIỆM: KẾT QUẢ HỒI QUY ĐẢO NGƯỢC HOÀN TOÀN CHỈ VÌ ĐỔI ĐƠN VỊ</div>
        <div class="db">Với dữ liệu gốc, giá (p) và thời gian lao động tích hợp (v) tương quan rất mạnh (hệ số 0.977). Nhưng chỉ cần đổi đơn vị đo (chuẩn hóa mỗi ngành về v=1) — một phép biến đổi hoàn toàn TÙY Ý về mặt toán học — hệ số R² của hồi quy p theo v tụt xuống ĐÚNG BẰNG 0! Trong khi đó, hồi quy trên các TỔNG (giá×sản lượng theo thời gian lao động×sản lượng) không hề bị ảnh hưởng bởi phép đổi đơn vị này.</div>
      </div>
      <p>Nguyên nhân: giá và chi phí lao động tích hợp có ĐƠN VỊ khác nhau ($/đơn vị sản phẩm so với giờ/đơn vị sản phẩm), nên phép đổi đơn vị (vốn luôn được phép về mặt toán học) có thể làm biến mất hoặc tạo ra tương quan một cách hoàn toàn giả tạo. Đây là một cạm bẫy tinh vi mà rất nhiều nghiên cứu thực nghiệm về lý thuyết giá trị lao động đã mắc phải mà không hề hay biết.</p>
      <h3>Giải pháp: các thước đo "khoảng cách" bất biến với đơn vị và tỷ lệ</h3>
      <div class="concept-grid">
        <div class="concept"><span class="term">Độ lệch tuyệt đối bình quân gia quyền (δc)</span><p>Thước đo cổ điển của Shaikh: trung bình phần trăm chênh lệch giữa hai bộ giá, có gốc rễ trực tiếp từ truyền thống cổ điển — diễn giải trực quan nhất ("chênh lệch trung bình X%").</p></div>
        <div class="concept"><span class="term">Hệ số biến thiên (CV) & Khoảng cách Euclid (δe)</span><p>Hai thước đo thay thế dựa trên GÓC giữa hai vector giá — hoàn toàn không cần chuẩn hóa theo tổng, nên tự động bất biến với đơn vị/tỷ lệ. Thường cho kết quả cao hơn δc khoảng 1/3.</p></div>
      </div>
      <div class="figure-note"><b>Tại sao vấn đề này quan trọng:</b> chỉ khi dùng các thước đo bất biến (không phụ thuộc đơn vị đo lường tùy ý) thì kết quả so sánh giữa các lý thuyết giá mới thực sự CÓ Ý NGHĨA và có thể tái lặp được — nếu không, hai nhà nghiên cứu dùng cùng dữ liệu nhưng khác đơn vị đo có thể đi tới hai kết luận hoàn toàn trái ngược nhau về cùng một câu hỏi.</div>
    `,
    concepts:[
      ["Vấn đề đổi đơn vị trong hồi quy cắt ngang","The units-change problem in cross-sectional regression","Hồi quy thông thường giữa giá và thời gian lao động có thể cho R² từ gần 1 xuống đúng 0 chỉ bằng một phép đổi đơn vị hoàn toàn tùy ý — một cạm bẫy thống kê tinh vi."],
      ["Độ lệch tuyệt đối bình quân gia quyền (δc)","Classical scale-free distance measure","Thước đo của Shaikh: trung bình phần trăm chênh lệch giữa hai bộ giá, bất biến với đơn vị/tỷ lệ, gốc rễ trực tiếp từ truyền thống cổ điển."],
      ["Hệ số biến thiên & Khoảng cách Euclid","Coefficient of variation and Euclidean distance","Hai thước đo thay thế dựa trên góc giữa hai vector giá — không cần chuẩn hóa theo tổng, nhưng thường cho kết quả cao hơn δc khoảng 1/3."]
    ]
  },

      <h3>Kiểm định Schwartz-Puty: sản lượng biến động dữ dội, giá tương đối gần như đứng yên</h3>
      <p>Thay vì so sánh mức TUYỆT ĐỐI, nhà toán học Jacob Schwartz (1961) nghĩ ra một phép thử tao nhã: so sánh biến động sản lượng/lương với biến động GIÁ TƯƠNG ĐỐI qua các đỉnh-đáy của chu kỳ kinh doanh — giai đoạn ngắn (dưới 1 năm) nhưng đầy biến động, lý tưởng để kiểm tra độ nhạy của giá trước biến động cung-cầu thực sự.</p>

  {
    id:"sraffa9", n:"4", label:"Lý thuyết Sraffa",
    title:"Lý thuyết Giá Sản xuất của Sraffa và Tính Gần-Tuyến tính Thực nghiệm", eng:"VI-VIII. Prices of Production; Evidence on Their Paths",
    body:`
      <p class="lede">Vì giá thị trường hấp dẫn quanh giá cả sản xuất (điều tiết), trọng tâm chuyển sang phân tích giá cả sản xuất. Sraffa (1960) đưa ra cách xử lý cực kỳ thanh lịch: coi giá cả sản xuất là nghiệm của một hệ phương trình đồng thời, trong đó chọn một MỨC LƯƠNG THỰC cụ thể sẽ xác định luôn cả giá tương đối LẪN tỷ suất lợi nhuận.</p>
      <div class="figure-note"><b>Kết quả tổng quát hóa mệnh đề cổ điển:</b> Sraffa chứng minh — bất kể hàng hóa nào được chọn làm vật ngang giá (numeraire) — lương thực và tỷ suất lợi nhuận LUÔN di chuyển ngược chiều nhau: lương cao hơn tất yếu đi kèm tỷ suất lợi nhuận thấp hơn. Đây chính là "Đường cong Lương-Lợi nhuận" nổi tiếng.</p>
      <p><b>Chìa khóa cho biến động giá tương đối:</b> "chìa khóa cho biến động giá cả [sản xuất] sản xuất do thay đổi lương thực nằm ở sự KHÔNG BẰNG NHAU về tỷ lệ giữa lao động và tư liệu sản xuất được sử dụng trong các ngành khác nhau" (Sraffa, 1960). Nếu mọi ngành có cùng tỷ lệ vốn-lao động tích hợp, giá tương đối sẽ LUÔN bằng giá trị lao động tương đối, bất kể phân phối lương-lợi nhuận ra sao.</div>
      <h3>Bằng chứng thực nghiệm gây bất ngờ: đường đi gần như tuyến tính hoàn hảo</h3>
      <p>Lý thuyết cho phép giá cả sản xuất (và tỷ suất lợi nhuận tương ứng) di chuyển theo những đường CONG PHỨC TẠP khi phân phối thay đổi — thậm chí "tái chuyển đổi" kỹ thuật (nối chương 3-4). Nhưng khi Shaikh vẽ đường đi thực tế của tỷ lệ sản lượng/tư bản tích hợp cho 65 ngành Mỹ (1998) khi tỷ suất lợi nhuận thay đổi từ 0 đến mức tối đa lý thuyết:</p>
      <div class="stat-row">
        <div class="stat-box"><div class="val">61/65</div><div class="lbl">Số ngành có đường đi HOÀN TOÀN trơn tru, gần tuyến tính trên TOÀN BỘ khoảng biến thiên</div></div>
        <div class="stat-box"><div class="val">4/65</div><div class="lbl">Số ngành có biến động phức tạp hơn — nhưng CHỈ trong 1% cuối cùng của khoảng biến thiên</div></div>
        <div class="stat-box"><div class="val">±1%</div><div class="lbl">Biên độ của mọi hiện tượng 'tái chuyển đổi' quan sát được — cực kỳ nhỏ so với dự đoán lý thuyết tổng quát</div></div>
      </div>
      <div class="figure-note"><b>Ý nghĩa sâu xa:</b> "tái chuyển đổi" và "đảo ngược tư bản" (capital-reversal) — trung tâm của Tranh luận Vốn Cambridge (chương 3) — hoàn toàn KHẢ DĨ về mặt logic, nhưng bằng chứng thực nghiệm cho thấy chúng CỰC KỲ HIẾM trong thực tế: đường lương-lợi nhuận thực tế gần như tuyến tính hoàn hảo trên hầu như toàn bộ khoảng biến thiên — biến những phức tạp lý thuyết đáng sợ thành các trường hợp ngoại lệ hiếm gặp về mặt thực nghiệm.</div>
    `,
    concepts:[
      ["Đường cong Lương-Lợi nhuận (Sraffa)","Sraffa's wage-profit curve","Kết quả tổng quát: lương thực và tỷ suất lợi nhuận luôn di chuyển ngược chiều nhau, bất kể hàng hóa nào được chọn làm vật ngang giá."],
      ["Chìa khóa biến động giá: tỷ lệ vốn-lao động không đều","The key: unequal capital-labor proportions across industries","Giá tương đối chỉ thay đổi theo phân phối lương-lợi nhuận khi các ngành có tỷ lệ vốn-lao động tích hợp KHÁC NHAU — nếu bằng nhau, giá luôn bằng giá trị lao động."],
      ["Tính gần-tuyến tính thực nghiệm","Empirical near-linearity","61/65 ngành Mỹ có đường đi giá cả sản xuất hoàn toàn trơn tru/tuyến tính trên toàn khoảng biến thiên tỷ suất lợi nhuận — biến phức tạp lý thuyết thành ngoại lệ hiếm."],
      ["Tái chuyển đổi hiếm gặp trong thực nghiệm","Re-switching is empirically rare","Dù khả dĩ về logic (và trung tâm Tranh luận Vốn Cambridge), tái chuyển đổi chỉ xuất hiện ở 4/65 ngành, với biên độ chưa tới ±1% — một ngoại lệ hiếm, không phải quy luật."]

    body:`
      <p class="lede">"Tất cả bắt đầu từ Adam Smith không thể sánh được." Smith phân biệt cạnh tranh-do-thu-nhập (không lợi nhuận) với cạnh tranh-do-lợi-nhuận để thiết lập: ngay cả khi có lợi nhuận VÀ bình quân hóa tỷ suất lợi nhuận, giá cả cạnh tranh KHÔNG NHẤT THIẾT phải lệch khỏi tỷ lệ với thời gian lao động — chỉ khi có thêm sự khác biệt về tỷ lệ vốn-lao động mới cần điều chỉnh.</p>
      <div class="debate-box">
        <div class="dh">'THUYẾT CỘNG DỒN' CỦA SMITH — MỘT 'LỜI VU KHỐNG' LỊCH SỬ</div>
        <div class="db">Smith từng nói giá có thể được "phân giải" thành tổng ba nguồn thu nhập giai cấp (lương, lợi nhuận, địa tô) — nhưng ông KHÔNG hề nói giá được XÁC ĐỊNH bằng cách cộng ba khoản này lại. Diễn giải sai lệch này bị gán ghép cho ông ở thế kỷ 19, trở thành "Thuyết Cộng dồn" (Adding-Up Theory) — mà theo nhà sử học kinh tế Maurice Dobb, đây thực chất là một "lời vu khống" (libel) đối với Smith.</div>
      </div>
      <h3>Ricardo: một chương, súc tích và tao nhã</h3>
      <p>Điều Ricardo trình bày chỉ trong MỘT chương, Marx phải viết thành BA TẬP! Dù vậy, các bước lập luận cốt lõi về "độ lớn giá trị" khá tương đồng: Ricardo là người đầu tiên minh họa cách tính thời gian lao động tích hợp qua các ví dụ số liệu tinh tế, chứng minh giá cả sản xuất tương đối lệch khỏi thời gian lao động tương đối CHỈ do khác biệt tỷ lệ vốn-lao động và thời gian chu chuyển — và lương thực tăng luôn kéo theo tỷ suất lợi nhuận giảm.</p>
      <h3>Marx: 1.340 trang để đi từ Tập 1 tới Tập 3</h3>
      <div class="figure-note"><b>Một sự thật thú vị thường bị bỏ qua:</b> Marx phải giải thích NGUỒN GỐC lợi nhuận (Tập 1) trước khi có thể trình bày cách bình quân hóa tỷ suất lợi nhuận tạo ra sự khác biệt hệ thống giữa giá cả sản xuất và giá trị lao động (Tập 3) — một hành trình dài <b>1.340 trang</b>. Không ngạc nhiên khi ngay cả các học giả cẩn trọng cũng từng lầm tưởng Marx giả định "cấu tạo hữu cơ tư bản đồng nhất ở mọi ngành" chỉ để né tránh "Vấn đề Chuyển hóa" nổi tiếng — thực ra ông đã có lời giải hoàn chỉnh trước khi viết những dòng đầu Tập 1.</div>
      <p>Marx ca ngợi Smith hết lời trong <i>Lý thuyết về Giá trị Thặng dư</i>: "Adam Smith hoàn toàn đúng khi lấy hàng hóa và trao đổi hàng hóa làm điểm khởi đầu" — và công nhận Smith đã "phát hiện ra giá trị thặng dư" dù không gọi đúng tên nó. Điểm mấu chốt Marx nhấn mạnh (và tiếp nối trực tiếp chương 6): lợi nhuận công nghiệp hoàn toàn tương thích với việc bán hàng hóa ĐÚNG giá trị lao động của chúng — nó không đến từ "bán cao hơn giá trị", không phải LỢI NHUẬN TỪ CHUYỂN NHƯỢNG.</p>

/* =========================================================
   FLASHCARDS RENDER
   ========================================================= */
var fcOrder = FLASHCARDS.map(function(_,i){return i;});
var fcIndex = 0;
document.getElementById('fcProgress').textContent = 'Thẻ 1 / ' + FLASHCARDS.length;
var flashcardEl = document.getElementById('flashcard');

function renderFlashcard(){
  var card = FLASHCARDS[fcOrder[fcIndex]];
  document.getElementById('fcTag').textContent = card.sec;
  document.getElementById('fcQ').textContent = card.q;
  document.getElementById('fcA').textContent = card.a;
  document.getElementById('fcProgress').textContent = 'Thẻ ' + (fcIndex+1) + ' / ' + FLASHCARDS.length;
  flashcardEl.classList.remove('flipped');
}
function flipFC(){ flashcardEl.classList.toggle('flipped'); }
document.getElementById('fcFlip').addEventListener('click', flipFC);
flashcardEl.addEventListener('click', flipFC);
document.getElementById('fcNext').addEventListener('click', function(){
  fcIndex = (fcIndex+1) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcPrev').addEventListener('click', function(){
  fcIndex = (fcIndex-1+FLASHCARDS.length) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcShuffle').addEventListener('click', function(){
  for(var i=fcOrder.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = fcOrder[i]; fcOrder[i]=fcOrder[j]; fcOrder[j]=tmp;
  }
  fcIndex = 0;
  renderFlashcard();
});
renderFlashcard();

/* =========================================================
   QUIZ RENDER
   ========================================================= */
var quizArea = document.getElementById('quizArea');
var quizAnswers = {};

function renderQuiz(){
  var html = QUIZ.map(function(item, qi){
    var opts = item.opts.map(function(opt, vi){
      return '<div class="q-opt" data-qi="'+qi+'" data-qv="'+vi+'">'+opt+'</div>';
    }).join('');
    return '<div class="q-block" id="qblock-'+qi+'">'+
      '<div class="q-text">'+(qi+1)+'. '+item.q+'</div>'+
      '<div class="q-opts">'+opts+'</div>'+
      '<div class="q-explain" id="qexplain-'+qi+'">'+item.explain+'</div>'+
      '</div>';
  }).join('');
  html += '<div style="text-align:center;margin-top:20px;"><button class="btn primary" id="quizFinish">Xem kết quả</button> <button class="btn" id="quizReset">Làm lại</button></div>';
  html += '<div id="quizResult"></div>';
  quizArea.innerHTML = html;

  quizArea.addEventListener('click', quizClickHandler);
  document.getElementById('quizFinish').addEventListener('click', showQuizScore);
  document.getElementById('quizReset').addEventListener('click', function(){
    quizAnswers = {};
    renderQuiz();
  });
}

function quizClickHandler(e){
  var opt = e.target.closest('.q-opt');
  if(!opt) return;
  var qi = parseInt(opt.dataset.qi, 10);
  var qv = parseInt(opt.dataset.qv, 10);
  quizAnswers[qi] = qv;
  var block = document.getElementById('qblock-'+qi);
  block.querySelectorAll('.q-opt').forEach(function(o){
    o.classList.remove('selected','correct','incorrect');
  });
  var correctIdx = QUIZ[qi].correct;
  block.querySelectorAll('.q-opt').forEach(function(o){
    var v = parseInt(o.dataset.qv,10);
    if(v === correctIdx) o.classList.add('correct');
    else if(v === qv) o.classList.add('incorrect');
  });
  document.getElementById('qexplain-'+qi).classList.add('show');
  updateQuizProgress();
}

function updateQuizProgress(){
  var answered = Object.keys(quizAnswers).length;
  var pct = Math.round(100*answered/QUIZ.length);
  document.getElementById('quizProgressFill').style.width = pct+'%';
}

function showQuizScore(){
  var correct = 0;
  QUIZ.forEach(function(item, qi){
    if(quizAnswers[qi] === item.correct) correct++;
  });
  var pct = Math.round(100*correct/QUIZ.length);
  document.getElementById('quizResult').innerHTML =
    '<div class="quiz-score"><div class="num">'+correct+'/'+QUIZ.length+'</div>'+
    '<div class="lbl">('+pct+'%) — '+ (pct>=80?'Nắm rất vững nội dung!':pct>=50?'Khá tốt, xem lại vài phần.':'Nên đọc lại các phần liên quan.') +'</div></div>';
}
renderQuiz();

/* =========================================================
   NOTES PANEL
   ========================================================= */
var notesFab = document.getElementById('notesFab');
var notesPanel = document.getElementById('notesPanel');
var notesBackdrop = document.getElementById('notesBackdrop');
var notesBody = document.getElementById('notesBody');
var notesTitle = document.getElementById('notesTitle');
var notesFoot = document.getElementById('notesFoot');
var currentNoteTab = 'gtcodien';
var LS_PREFIX = 'shaikh_ch9_note_';

function isMobile(){ return window.matchMedia('(max-width:640px)').matches; }

function noteLabelFor(id){
  var s = SECTIONS.filter(function(x){return x.id===id;})[0];
  if(s) return s.n + '. ' + s.label;
  if(id === 'gloss') return 'Thuật ngữ';
  if(id === 'flashcards') return 'Thẻ ghi nhớ';
  if(id === 'quiz') return 'Quiz';
  return id;
}

function openNotesFor(id){
  currentNoteTab = id;
  notesTitle.textContent = 'Ghi chú — ' + noteLabelFor(id);
  var saved = localStorage.getItem(LS_PREFIX + id) || '';
  notesBody.innerHTML = saved;
  updateNotesFoot();
}
function updateNotesFoot(){
  var len = notesBody.innerText.trim().length;
  notesFoot.textContent = len + ' ký tự · lưu tự động';
}
function saveCurrentNote(){
  localStorage.setItem(LS_PREFIX + currentNoteTab, notesBody.innerHTML);
  updateNotesFoot();
}
function openNotesPanel(){
  notesPanel.classList.add('open');
  if(isMobile()){ notesBackdrop.classList.add('show'); }
}
function closeNotesPanel(){
  notesPanel.classList.remove('open');
  notesBackdrop.classList.remove('show');
}
notesFab.addEventListener('click', function(){
  if(notesPanel.classList.contains('open')){
    closeNotesPanel();
  } else {
    openNotesFor(currentNoteTab);
    openNotesPanel();
  }
});
document.getElementById('notesClose').addEventListener('click', closeNotesPanel);
notesBackdrop.addEventListener('click', closeNotesPanel);
notesBody.addEventListener('input', saveCurrentNote);
document.querySelectorAll('.notes-toolbar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    var cmd = btn.dataset.cmd;
    notesBody.focus();
    if(cmd.indexOf(':')>-1){
      var parts = cmd.split(':');
      document.execCommand(parts[0], false, parts[1]);
    } else {
      document.execCommand(cmd, false, null);
    }
    saveCurrentNote();
  });
});

activateTab(ALL_TAB_IDS[0]);
</script>
