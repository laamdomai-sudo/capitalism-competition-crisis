<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>Shaikh — Capitalism: Competition, Conflict, Crises — Chương 7</title>
<style>
:root{
  --bg:#f2ede0;
  --panel:#fffdf8;
  --panel-2:#eef1e8;
  --ink:#211d16;
  --ink-soft:#4c473b;
  --muted:#847b68;
  --line:#dcd0ac;
  --primary:#1f3b5c;
  --primary-dark:#152944;
  --primary-tint:#e1e8ef;
  --gold:#a67f2c;
  --gold-light:#d6b263;
  --green:#2f6b3f;
  --green-tint:#e3ede4;
  --red:#8a2f2f;
  --red-tint:#f0e2e2;
  --dark-bg:#141b22;
  --dark-panel:#1d2731;
  --dark-ink:#eef1e6;
  --dark-line:#324256;
  --shadow:0 6px 24px rgba(20,27,34,0.12);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1000px;margin:0 auto;padding:0 16px 80px;}

.hero{padding:32px 16px 20px;text-align:center;border-bottom:3px double var(--gold);margin-bottom:18px;background:radial-gradient(ellipse at top, rgba(166,127,44,0.08), transparent 60%);}
.hero .kicker{font-family:Georgia,serif;letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700;}
.hero h1{font-size:clamp(22px,4.6vw,34px);margin:8px 0 4px;color:var(--primary-dark);letter-spacing:.005em;line-height:1.25;}
.hero .subtitle{font-size:14.5px;color:var(--ink-soft);font-style:italic;}
.hero .meta{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hero .meta span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);}
.hero .meta a.meta-link{color:var(--primary);text-decoration:none;font-weight:600;}
.hero .meta a.meta-link:hover{background:var(--primary-tint);}


.tabbar-wrap{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:8px;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tabbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;}
.tabbar::-webkit-scrollbar{height:5px;}
.tabbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.tab-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
.tab-btn .n{color:var(--gold);font-weight:800;margin-right:5px;}
.tab-btn:hover{border-color:var(--gold);}
.tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow);}
.tab-btn.active .n{color:var(--gold-light);}

.panel{display:none;animation:fadein .25s ease;}
.panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);}
.card h2{margin:0 0 4px;font-size:21px;color:var(--primary-dark);}
.card .eng-title{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:16px;letter-spacing:.02em;}
.card h3{font-size:15.5px;color:var(--primary);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px;}
.card p{margin:0 0 12px;color:var(--ink);}
.card p:last-child{margin-bottom:0;}
.lede{font-size:16px;color:var(--ink-soft);border-left:3px solid var(--gold);padding-left:14px;margin:6px 0 18px;}

.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0;}
.concept{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.concept .term{font-weight:700;color:var(--primary-dark);font-size:13px;display:block;margin-bottom:4px;}
.concept .term .en{color:var(--gold);font-weight:600;font-size:11px;font-style:italic;}
.concept p{font-size:13px;margin:0;color:var(--ink-soft);}

.figure-note{background:var(--primary-tint);border:1px dashed var(--primary);border-radius:10px;padding:12px 15px;font-size:12.5px;color:var(--primary-dark);margin:14px 0;}
.figure-note b{color:var(--primary-dark);}

.debate-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0;}
.debate-box .dh{background:var(--primary);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.03em;}
.debate-box .db{padding:13px 15px;font-size:13px;color:var(--ink-soft);}
.debate-box .names{color:var(--gold);font-weight:700;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0;}
.stat-box{background:var(--primary-dark);color:#fff;border-radius:10px;padding:13px 14px;text-align:center;}
.stat-box .val{font-size:20px;font-weight:800;color:var(--gold-light);}
.stat-box .lbl{font-size:10.5px;color:#dbe4ee;margin-top:3px;line-height:1.3;}

.dark-panel{background:var(--dark-bg);color:var(--dark-ink);border-radius:12px;padding:20px;margin:16px 0;border:1px solid var(--dark-line);}
.dark-panel h4{margin:0 0 12px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;}
.flow{display:flex;flex-direction:column;gap:0;}
.flow-step{background:var(--dark-panel);border:1px solid var(--dark-line);border-radius:8px;padding:10px 14px;font-size:12.5px;position:relative;}
.flow-step b{color:var(--gold-light);}
.flow-arrow{text-align:center;color:var(--gold);font-size:16px;padding:2px 0;}
.flow-branch{display:flex;gap:10px;margin:2px 0;flex-wrap:wrap;}
.flow-branch>div{flex:1;min-width:150px;}

.chart-panel{background:var(--dark-bg);border:1px solid var(--dark-line);border-radius:12px;padding:18px 18px 14px;margin:16px 0;}
.chart-panel h4{margin:0 0 2px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;}
.chart-panel .chart-sub{font-size:11px;color:#9fb0c2;margin-bottom:10px;font-style:italic;}
.chart-panel svg{width:100%;height:auto;display:block;}

/* ===== Real/reference chart (photo, not illustrative SVG) ===== */
.chart-real{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:10px 0 18px;}
.chart-real-badge{display:inline-block;font-family:Georgia,serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);border-radius:4px;padding:3px 9px;margin-bottom:9px;}
.chart-real img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);}
.chart-real figcaption{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.55;font-style:italic;}

.chart-note{font-size:10.5px;color:#8496a8;margin-top:6px;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dark-ink);}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:12px;height:3px;display:inline-block;border-radius:2px;}
.chart-grid2{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:680px){.chart-grid2{grid-template-columns:1fr 1fr;}}

.txn-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px;}
.txn-table th,.txn-table td{border:1px solid var(--line);padding:6px 8px;text-align:right;}
.txn-table th{background:var(--primary);color:#fff;font-weight:700;font-size:11px;text-align:center;}
.txn-table td:first-child,.txn-table th:first-child{text-align:left;}
.txn-table tr:nth-child(even) td{background:var(--panel-2);}

.gloss-item{border-bottom:1px solid var(--line);padding:12px 0;}
.gloss-item:last-child{border-bottom:none;}
.gloss-term{font-weight:700;color:var(--primary-dark);font-size:14px;}
.gloss-term .en{color:var(--gold);font-weight:600;font-size:11.5px;font-style:italic;margin-left:6px;}
.gloss-def{font-size:13px;color:var(--ink-soft);margin-top:3px;}

.gloss-extra-row{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.gloss-extra-row .en{flex:1;color:var(--ink-soft);font-style:italic;}
.gloss-extra-row .vi{flex:1;color:var(--primary-dark);font-weight:600;}


.fc-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.fc-progress{font-size:13px;color:var(--muted);}
.fc-stage{display:flex;justify-content:center;margin:10px 0 20px;perspective:1400px;}
.flashcard{width:100%;max-width:560px;height:270px;position:relative;cursor:pointer;}
.flashcard .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flashcard.flipped .fc-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);}
.fc-front{background:var(--panel);}
.fc-front .fc-tag{position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;font-weight:700;}
.fc-front .fc-q{font-size:17px;color:var(--ink);font-weight:600;}
.fc-back{background:var(--primary);color:#fff;transform:rotateY(180deg);}
.fc-back .fc-a{font-size:14px;}
.fc-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;}
.fc-nav{display:flex;justify-content:center;gap:10px;margin-top:16px;}
.btn{border:1px solid var(--primary);background:var(--panel);color:var(--primary-dark);font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--primary);color:#fff;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-dark);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.quiz-progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--primary));transition:width .3s;}
.q-block{margin-bottom:14px;}
.q-text{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;}
.q-opts{display:flex;flex-direction:column;gap:8px;}
.q-opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer;transition:all .15s;}
.q-opt:hover{border-color:var(--gold);}
.q-opt.selected{border-color:var(--primary);background:var(--primary-tint);}
.q-opt.correct{border-color:var(--green);background:var(--green-tint);color:#1c4a28;font-weight:700;}
.q-opt.incorrect{border-color:var(--primary);background:#f3e6e6;color:#7a2020;font-weight:700;}
.q-explain{margin-top:10px;font-size:12.5px;color:var(--ink-soft);background:var(--panel-2);border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 8px 8px 0;display:none;}
.q-explain.show{display:block;}
.quiz-score{text-align:center;padding:30px 20px;}
.quiz-score .num{font-size:46px;font-weight:800;color:var(--primary);}
.quiz-score .lbl{font-size:14px;color:var(--muted);margin-bottom:18px;}

.notes-fab{position:fixed;right:22px;bottom:22px;z-index:50;background:var(--primary);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 8px 20px rgba(21,41,68,0.35);cursor:pointer;display:flex;align-items:center;gap:7px;}
.notes-backdrop{position:fixed;inset:0;background:rgba(15,18,22,0.45);z-index:60;display:none;}
.notes-backdrop.show{display:block;}
.notes-panel{position:fixed;top:0;right:0;height:100%;width:380px;max-width:88vw;background:var(--panel);z-index:70;box-shadow:-10px 0 30px rgba(0,0,0,0.2);transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;}
.notes-panel.open{transform:translateX(0);}
.notes-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.notes-head h4{margin:0;color:var(--primary-dark);font-size:14.5px;}
.notes-head .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.notes-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;}
.notes-toolbar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.notes-toolbar button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;width:30px;height:30px;cursor:pointer;font-family:Georgia,serif;font-size:14px;color:var(--ink);}
.notes-toolbar button:hover{border-color:var(--gold);}
.notes-body{flex:1;padding:16px 18px;overflow-y:auto;outline:none;font-size:14px;line-height:1.7;}
.notes-body:empty:before{content:"Ghi chú của bạn cho phần này... (tự động lưu)";color:var(--muted);font-style:italic;}
.notes-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);}

@media (max-width:640px){
  .hero{padding:22px 12px 14px;}
  .card{padding:16px 15px;}
  .flashcard{height:250px;}
  .notes-panel{width:100%;max-width:100%;}
  .txn-table{font-size:10.5px;}
  .txn-table th,.txn-table td{padding:4px 5px;}
}
@media print{
  .tabbar-wrap,.notes-fab,.notes-panel,.notes-backdrop,.fc-nav,.q-opts{display:none !important;}
  .panel{display:block !important;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
}
</style>

<script>
/* =========================================================
   MINI CHART HELPER
   ========================================================= */
function sparkPath(values, w, h, pad){
  var n = values.length;
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  var range = (max - min) || 1;
  var pts = values.map(function(v, i){
    var x = pad + (i/(n-1)) * (w - 2*pad);
    var y = pad + (1 - (v - min)/range) * (h - 2*pad);
    return [x,y];
  });
  var d = 'M ' + pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L ');
  var area = d + ' L ' + pts[pts.length-1][0].toFixed(1) + ',' + (h-pad) + ' L ' + pts[0][0].toFixed(1) + ',' + (h-pad) + ' Z';
  return {line:d, area:area, pts:pts};
}
function renderLineChart(containerId, series, opts){
  opts = opts || {};
  var w = opts.w || 400, h = opts.h || 120, pad = opts.pad || 8;
  var svg = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  series.forEach(function(s){
    var r = sparkPath(s.values, w, h, pad);
    if(s.fill !== false){
      svg += '<path d="'+r.area+'" fill="'+(s.color||'#a67f2c')+'" opacity="0.12"></path>';
    }
    svg += '<path d="'+r.line+'" fill="none" stroke="'+(s.color||'#a67f2c')+'" stroke-width="'+(s.width||2)+'" vector-effect="non-scaling-stroke"></path>';
  });
  svg += '</svg>';
  var el = document.getElementById(containerId);
  if(el) el.innerHTML = svg;
}

/* =========================================================
   DATA — SECTIONS (tabs 0-6)
   ========================================================= */
var SECTIONS = [
  {
    id:"chientranh", n:"0", label:"Cạnh tranh = Chiến tranh",
    title:"Cạnh tranh Thực: 'Khác Cạnh tranh Hoàn hảo như Chiến tranh khác Ba lê'", eng:"I. Introduction",
    body:`
      <p class="lede">"Tư bản là một hình thái xã hội đặc thù của của cải, được thúc đẩy bởi động cơ lợi nhuận. Đi kèm động cơ này là một lực bành trướng tương ứng, biến tư bản thành nhiều tư bản hơn, lợi nhuận thành nhiều lợi nhuận hơn. Mỗi tư bản cá thể vận hành dưới mệnh lệnh này, va chạm với những tư bản khác cũng đang làm điều tương tự — đôi khi thành công, đôi khi chỉ vừa đủ sống sót, đôi khi thất bại hoàn toàn. Đây chính là <b>cạnh tranh thực</b> — mang bản chất đối kháng và vận hành hỗn loạn. Nó khác cái gọi là 'cạnh tranh hoàn hảo' <b>y hệt như chiến tranh khác với ba lê.</b>"</p>
      <p>Cạnh tranh đối đầu người bán với người bán, người bán với người mua, người mua với người mua. Nó đối đầu tư bản với tư bản, tư bản với lao động, lao động với lao động. Nó vận hành không chỉ trên giá cả và lợi nhuận, mà cả trên tiền lương và địa tô. <b>Lợi nhuận là phần dôi ra của giá so với chi phí hoạt động</b> — và không tư bản nào được đảm bảo bất kỳ lợi nhuận nào, càng không phải tỷ suất "bình thường". Mọi tư bản đều đối mặt thua lỗ ở thời điểm nào đó, và luôn có một số lượng nhất định "chết đuối trong mực đỏ" mỗi kỳ.</p>
      <div class="figure-note"><b>Hệ quả phương pháp luận quan trọng:</b> hoàn toàn KHÔNG chính đáng khi tính "lợi nhuận bình thường" vào chi phí hoạt động (như tân cổ điển vẫn làm) — cũng không chính đáng khi tính lãi suất vào chi phí hoạt động. Lãi suất chỉ đóng vai trò như một MỐC SO SÁNH để đánh giá lợi nhuận có "đủ" hay không, không phải yếu tố QUYẾT ĐỊNH lợi nhuận.</div>
      <h3>Hai khuôn mẫu đặc trưng của cạnh tranh thực</h3>
      <div class="concept-grid">
        <div class="concept"><span class="term">1. Bình quân hóa giá</span><p>Giá do các người bán khác nhau đặt ra được bình quân hóa TƯƠNG ĐỐI khi mỗi bên cố giành lợi thế trước bên kia.</p></div>
        <div class="concept"><span class="term">2. Bình quân hóa tỷ suất lợi nhuận</span><p>Tỷ suất lợi nhuận trên các khoản đầu tư MỚI cũng được bình quân hóa tương đối qua những giai đoạn dài hơn.</p></div>
      </div>
      <p>Cả hai quá trình đều tạo ra những dao động BẤT TẬN quanh các trung tâm hấp dẫn LUÔN DI ĐỘNG — đây là khái niệm cổ điển về <b>điều tiết hỗn loạn</b>, hoàn toàn khác quan niệm thông thường về cân bằng như "trạng thái nghỉ". Cung cầu vẫn đóng vai trò trong câu chuyện, nhưng KHÔNG mang tính quyết định vì cả hai đều có thể thay đổi để đáp ứng cơ hội lợi nhuận.</p>
      <div class="debate-box">
        <div class="dh">CẠNH TRANH NHƯ MỘT HÌNH THỨC CHIẾN TRANH</div>
        <div class="db">Chiến thuật, chiến lược và triển vọng tăng trưởng là mối quan tâm trung tâm của hãng cạnh tranh. Lợi nhuận liên quan phải là lợi nhuận CÓ THỂ BẢO VỆ ĐƯỢC trong trung hạn — hoàn toàn khác khái niệm "lợi nhuận tối đa ngắn hạn" mà lý thuyết tân cổ điển nhấn mạnh. Trong trận chiến cạnh tranh thực, sự di động của tư bản là việc di chuyển từ chiến trường này sang chiến trường khác, phát triển/áp dụng công nghệ là cuộc chạy đua vũ trang, và cuộc chiến giành tăng trưởng lợi nhuận/thị phần chính là trận chiến tự thân.</div>
      </div>
      <p>Bình quân hóa giá (do cạnh tranh giữa người bán) và bình quân hóa tỷ suất lợi nhuận (do cạnh tranh giữa nhà đầu tư) LUÔN tạo ra những kết quả NGOÀI Ý MUỐN — người mua hướng tới giá thấp nhất buộc người bán khác điều chỉnh giá; nhà đầu tư đổ xô tới tỷ suất lợi nhuận cao hơn làm tăng tốc cung tương đối cầu ở ngành đó, kéo giá/lợi nhuận xuống. Cuộc đua tới sự giàu có đóng lại chính những khoảng cách đã tạo ra động cơ ban đầu, đồng thời mở ra những khoảng cách mới nuôi dưỡng các đợt arbitrage tiếp theo. Đây chính là những <b>thuộc tính nổi lên</b> đặc trưng của bình quân hóa hỗn loạn.</p>

    title:"Cạnh tranh Trong một Ngành và Giữa các Ngành", eng:"II-III. Real Competition Within and Between Industries",
    body:`
      <p class="lede">Các hãng trong một ngành chiến đấu để thu hút khách hàng. Giá cả là vũ khí, quảng cáo là tuyên truyền, phòng thương mại địa phương là nơi thờ phụng, và lợi nhuận là vị thần tối cao. Vì giá cả cuối cùng bị giới hạn bởi chi phí, cắt giảm chi phí trở thành mối quan tâm trung tâm — qua giảm lương, tăng độ dài/cường độ ngày làm việc, và trên hết là thay đổi kỹ thuật.</p>
      <h3>Luật 'Giá Tương quan' — không phải Luật 'Một Giá'</h3>
      <div class="debate-box">
        <div class="dh">LCP (LAW OF CORRELATED PRICES) vs LOP (LAW OF ONE PRICE)</div>
        <div class="db">Tân cổ điển giả định "Luật Một Giá": mọi giá trong một ngành PHẢI bằng nhau tuyệt đối nhờ "cạnh tranh hoàn hảo". Shaikh đề xuất <b>Luật Giá Tương quan (LCP)</b>: các hãng buộc phải giữ giá của mình trong một khoảng cách "trong tầm với" của nhau (đã điều chỉnh theo chi phí vận chuyển, thuế địa phương) — KHÔNG đồng nhất tuyệt đối, nhưng LIÊN KẾT chặt chẽ qua sự khuếch tán của khách hàng về phía giá thấp hơn.</div>
      </div>
      <h3>Kết quả gây ngạc nhiên: bình quân hóa GIÁ lại PHÂN HÓA tỷ suất lợi nhuận</h3>
      <p>Vì thay đổi kỹ thuật diễn ra liên tục, các tư bản (nhà máy/thiết bị) trong cùng một ngành LUÔN khác nhau về cơ cấu chi phí, dù lương và điều kiện làm việc như nhau. Khi giá được bình quân hóa (cạnh tranh buộc mọi người bán giữ giá gần nhau), các nhà máy chi phí THẤP HƠN sẽ có biên lợi nhuận CAO HƠN trên mỗi đơn vị — nghĩa là <b>chính quá trình bình quân hóa giá lại PHÂN HÓA tỷ suất lợi nhuận</b> giữa các tư bản trong cùng ngành.</p>
      <div class="figure-note"><b>Minh họa số liệu (rút gọn từ Bảng 7.1 gốc):</b> bốn phương pháp sản xuất A, B, C, D có chi phí đơn vị giảm dần (82→76) nhưng cường độ vốn tăng dần — ở cùng một mức giá bán $100, tỷ suất lợi nhuận không tăng đơn điệu theo chi phí thấp: phương pháp D (chi phí thấp NHẤT) lại có tỷ suất lợi nhuận (14.86%) THẤP HƠN phương pháp C (16.00%) — vì cường độ vốn của D tăng nhanh hơn mức giảm chi phí.</div>
      <h3>Giữa các ngành: di động tư bản bình quân hóa tỷ suất lợi nhuận</h3>
      <p>Cạnh tranh trong ngành không cho biết MỨC tỷ suất lợi nhuận bình quân của cả ngành — điều đó phụ thuộc nguyên lý lớn thứ hai: sự DI ĐỘNG CỦA TƯ BẢN giữa các ngành. Nhà đầu tư hướng tới tỷ suất lợi nhuận cao hơn — đầu tư mới tăng tốc vào ngành có tỷ suất lợi nhuận cao (tương đối với cầu), làm cung vượt cầu, kéo giá/lợi nhuận xuống; ngược lại ở ngành tỷ suất thấp. Đây chính là cơ chế cổ điển bình quân hóa tỷ suất lợi nhuận trên đầu tư MỚI — không phải trên tỷ suất lợi nhuận bình quân của TOÀN BỘ vốn đã tích lũy (gồm cả thiết bị cũ và mới).</p>
      <div class="figure-note"><b>Nghịch lý biểu kiến được giải quyết:</b> cạnh tranh TRONG ngành phân hóa tỷ suất lợi nhuận CÁ THỂ (vì bình quân hóa giá); cạnh tranh GIỮA các ngành bình quân hóa tỷ suất lợi nhuận của MỘT TẬP HỢP tư bản cụ thể (các "tư bản điều tiết") giữa các ngành. Hai xu hướng không mâu thuẫn — chúng vận hành ở hai cấp độ khác nhau.</div>

      ["Luật Giá Tương quan (LCP)","Law of Correlated Prices","Đề xuất của Shaikh thay cho 'Luật Một Giá' tân cổ điển: giá các hãng trong ngành được LIÊN KẾT chặt (trong tầm với nhau, điều chỉnh theo chi phí vận chuyển/thuế) chứ không đồng nhất tuyệt đối."],
      ["Bình quân hóa giá PHÂN HÓA tỷ suất lợi nhuận","Price equalization DISequalizes profit rates","Kết quả gây ngạc nhiên nhưng tất yếu của cạnh tranh trong ngành: khi giá bị ép về gần nhau, các nhà máy chi phí thấp hơn hưởng biên lợi nhuận cao hơn — phân tán tỷ suất lợi nhuận cá thể."],

      ["Di động tư bản bình quân hóa GIỮA ngành","Capital mobility equalizes rates BETWEEN industries","Nguyên lý lớn thứ hai của cạnh tranh: nhà đầu tư hướng dòng vốn mới tới ngành có tỷ suất lợi nhuận cao hơn, làm cung tăng nhanh hơn cầu, kéo tỷ suất lợi nhuận trở lại — chỉ áp dụng cho đầu tư MỚI, không phải toàn bộ vốn tích lũy."]

  {
    id:"dieutiet7", n:"2", label:"Tư bản Điều tiết",
    title:"Tư bản Điều tiết: Ba Trường hợp — và 'Những cuộc Vượt qua', không phải Bằng nhau", eng:"IV-V. Regulating Capitals; General Phenomena",
    body:`
      <p class="lede">Tại bất kỳ thời điểm nào, trong bất kỳ ngành nào, luôn tồn tại một tập hợp tư bản đại diện cho <b>điều kiện sản xuất tái tạo được tốt nhất</b> (best generally reproducible condition) — Shaikh gọi đây là <b>tư bản điều tiết</b> (regulating capital). Vì đầu tư mới phải có khả năng SAO CHÉP LẠI được các điều kiện này, tỷ suất lợi nhuận của các tư bản điều tiết chính là tiêu điểm mà đầu tư mới nhắm tới — và do đó, chính chúng mới là đối tượng thực sự của bình quân hóa hỗn loạn giữa các ngành.</p>
      <h3>Ba hình thái của điều kiện điều tiết</h3>
      <div class="dark-panel">
        <h4>Điều kiện sản xuất nào 'điều tiết' giá cả ngành?</h4>
        <div class="flow">
          <div class="flow-branch">
            <div class="flow-step"><b>Trường hợp A — Điều kiện trung bình</b><br>Chỉ có một, hoặc vài phương pháp sản xuất tương đương cùng tồn tại — điều kiện trung bình CŨNG chính là điều kiện điều tiết. Phổ biến trong công nghiệp chế tạo hiện đại.</div>
            <div class="flow-step"><b>Trường hợp B — Điều kiện chi phí CAO NHẤT điều tiết</b><br>Nông nghiệp/khai khoáng: mỏ/đất tốt nhất và tốt nhì đã khai thác hết công suất — "biên giới canh tác" (margin of cultivation, chi phí cao nhất còn cần thiết để đáp ứng cầu) mới là điều kiện điều tiết. Đất/mỏ tốt hơn hưởng <b>địa tô kinh tế</b> (economic rent) vì điều kiện của chúng không tái tạo được.</div>
            <div class="flow-step"><b>Trường hợp C — Điều kiện chi phí THẤP NHẤT điều tiết</b><br>Khi các phương pháp chi phí cao hơn là công nghệ CŨ không còn cạnh tranh nổi (dù vẫn có thể tái tạo về mặt kỹ thuật) — phương pháp mới nhất, chi phí thấp nhất trở thành điều tiết.</div>
          </div>
        </div>
      </div>
      <p>Tư bản điều tiết đồng thời là <b>người dẫn dắt giá</b> (price-leader) trong ngành — giá của chúng trở thành chuẩn mực cho giá thị trường. Các tư bản KHÔNG điều tiết trở thành người theo giá (price-follower); lợi nhuận của chúng là phần DƯ (residual), có thể cao hơn (như đất B1/B2 hưởng địa tô) hay thấp hơn (như nhà máy công nghệ cũ C1/C2) tư bản điều tiết — nhưng luôn là phần dư phụ thuộc vào chi phí RIÊNG của chúng.</p>
      <h3>'Những cuộc vượt qua', không phải sự bằng nhau</h3>
      <div class="figure-note"><b>Điểm mấu chốt thường bị bỏ lỡ:</b> quá trình bình quân hóa tỷ suất lợi nhuận điều tiết mang tính HỖN LOẠN và KHÔNG BAO GIỜ NGỪNG — vận hành qua "chu kỳ năm được mùa/mất mùa". Vì vậy ngay cả CÁC TỶ SUẤT LỢI NHUẬN ĐIỀU TIẾT cũng khác nhau ở bất kỳ năm cụ thể nào — điều cần xem xét không phải là SỰ BẰNG NHAU của chúng, mà là những cuộc <b>"VƯỢT QUA NHAU"</b> (crossings) liên tục theo thời gian.</div>
      <p>Hệ quả: tỷ suất lợi nhuận TRUNG BÌNH thường KHÔNG bằng nhau giữa các ngành (và cũng không nhất thiết bằng nhau giữa các quốc gia) — điều này chỉ xảy ra trong trường hợp đặc biệt tầm thường khi mọi tư bản trong một ngành hoàn toàn giống hệt nhau (không phân biệt được tư bản cá thể, tư bản trung bình, và tư bản điều tiết). Đây chính xác là giả định NGẦM của lý thuyết chuẩn — nhưng lại là ngoại lệ, không phải quy luật, trong thực tế.</p>

    title:"Bằng chứng: Hành vi Doanh nghiệp Thực tế", eng:"VI.1 — Evidence on the Behavior of the Firm",
    body:`
      <p class="lede">Thập niên 1930s, Nhóm Nghiên cứu Kinh tế Oxford (OERG — gồm cả Roy Harrod và P.W.S. Andrews) khảo sát có hệ thống thực tiễn kinh doanh thực tế — kết quả gây "sốc" cho nhiều nhà kinh tế học hàn lâm.</p>
      <div class="debate-box">
        <div class="dh">HALL VÀ HITCH (1939): ĐỊNH GIÁ THEO 'TỔNG CHI PHÍ'</div>
        <div class="db">Đại đa số doanh nhân được khảo sát nói họ đặt giá dựa trên "tổng chi phí" (full cost — chi phí trực tiếp + phân bổ chi phí gián tiếp + khoản cộng thêm quy ước cho lợi nhuận, thường 10%) — đây là mức giá họ tin là "đúng đắn", mức "nên" tính. Các hãng riêng lẻ có chi phí hoạt động khác nhau nhưng bị cạnh tranh buộc phải giữ giá gần với người dẫn dắt giá — biên lợi nhuận của người theo giá chỉ đơn thuần là mức giữ cho giá bán của họ khớp với mức chung.</div>
      </div>
      <p>Cả hai phe lý thuyết (cạnh tranh hoàn hảo LẪN cạnh tranh không hoàn hảo) đều bác bỏ phát hiện của OERG, coi đó chỉ là "nghi thức định giá" (pricing rituals) không thực chất — tương đương với việc buộc tội các hãng "không hề quan tâm tới lợi nhuận tối đa".</p>
      <h3>Andrews và Brunner: bảo vệ bằng chứng thực tế</h3>
      <p>Andrews và Brunner khẳng định: phát hiện của OERG mô tả CHÍNH XÁC hành vi của các hãng cạnh tranh, theo đuổi lợi nhuận thực sự. Doanh nghiệp coi mình đang trong một cuộc đấu tranh cạnh tranh — họ hiểu rằng cạnh tranh từ đối thủ hiện tại buộc họ bán ở mức giá gần chung, VÀ chịu áp lực từ nguy cơ "đối thủ mới xâm nhập" nếu giá quá cao. Họ liên tục tìm cách tạo/áp dụng điều kiện sản xuất chi phí thấp hơn để mở rộng dư địa cạnh tranh.</p>
      <h3>Harrod: mâu thuẫn tự thân — và chẩn đoán 'tâm thần phân liệt'</h3>
      <div class="figure-note"><b>Nghịch lý Harrod tự phát hiện (nhưng không theo tới cùng):</b> lý thuyết "cạnh tranh độc quyền" truyền thống nói hãng nên định giá ở điểm mr=mc để tối đa hóa lợi nhuận — điểm này CAO HƠN điểm chi phí bình quân tối thiểu (p*_min). Nhưng chính Harrod chỉ ra: bất kỳ nhà kinh doanh nào trông cậy vào việc duy trì mức giá "cao hơn tối thiểu" đó — trong khi biết rõ áp lực cạnh tranh sẽ bào mòn "lợi nhuận vượt trội" ấy về lâu dài — "chắc chắn là dấu hiệu của bệnh tâm thần phân liệt". Logic của chính Harrod dẫn tới kết luận: chỉ điểm giá TỐI THIỂU bền vững (p*_min) mới thực sự "có thể bảo vệ được" trong dài hạn khi có tự do gia nhập/rút lui — nhưng ông không đẩy lập luận này đến kết luận cạnh tranh THỰC.</div>
      <p>Harrod vẫn giữ hai yếu tố tân cổ điển: (1) tính "lợi nhuận thông thường" vào chi phí, và (2) giữ quy tắc mr=mc thay vì thừa nhận hành vi cắt giá chủ động (price-cutting) — nên bỏ lỡ luôn sự phân biệt người dẫn dắt giá/người theo giá vốn là trung tâm của cạnh tranh thực.</p>
    `,
    concepts:[
      ["Nhóm Nghiên cứu Kinh tế Oxford (OERG)","Oxford Economists Research Group","Nhóm khảo sát thực tiễn kinh doanh thập niên 1930s (gồm Harrod, Andrews) — phát hiện định giá 'tổng chi phí' gây sốc giới hàn lâm, bị cả hai phe lý thuyết chính thống bác bỏ."],
      ["Định giá 'Tổng chi phí'","Full-cost pricing (Hall & Hitch)","Đa số doanh nhân đặt giá = chi phí trực tiếp + phân bổ chi phí gián tiếp + khoản cộng thêm quy ước cho lợi nhuận — đọc đúng cách, đây chính là bằng chứng của cạnh tranh thực, không phải 'nghi thức' phi lý tính."],
      ["'Dấu hiệu tâm thần phân liệt' (Harrod)","'A sign of schizophrenia' (Harrod)","Chính Harrod thừa nhận: trông cậy giữ giá cao hơn mức tối thiểu bền vững trong khi biết cạnh tranh sẽ bào mòn lợi nhuận vượt trội là phi lý — logic này ngầm chỉ ra kết luận cạnh tranh thực mà ông không theo tới cùng."],

    title:"Bằng chứng: Chi phí, Quy mô Nhà máy và Lợi nhuận", eng:"VI.2-4 — Salter's Evidence; Choice of Technique; Firm-Level Evidence",
    body:`
      <p class="lede">Nghiên cứu kinh điển của Salter (1969) xác lập: LUÔN tồn tại một PHỔ kỹ thuật trong bất kỳ ngành nào, vì phương pháp mới liên tục ra đời trong khi phương pháp cũ liên tục bị loại bỏ. "Đầu tư gộp là phương tiện của kỹ thuật mới" — và "các nhà máy đang tồn tại tại bất kỳ thời điểm nào, về bản chất, là một biên niên sử hóa thạch của công nghệ trải dài suốt giai đoạn xây dựng của chúng."</p>
      <div class="stat-row">
        <div class="stat-box"><div class="val">35-66%</div><div class="lbl">Chênh lệch năng suất giữa nhà máy đường/xi măng Mỹ mới nhất và cũ nhất, đầu TK20</div></div>
        <div class="stat-box"><div class="val">15h → &lt;1h</div><div class="lbl">Giờ công cần để làm một đôi giày kiểu Goodyear, ngành giày Mỹ 1850→1936</div></div>
        <div class="stat-box"><div class="val">77%</div><div class="lbl">Tỷ lệ biến động giá tương đối Anh 1924-1950 giải thích được bởi chênh lệch năng suất lao động</div></div>
      </div>
      <div class="figure-note"><b>Không hề có 'trạng thái cân bằng dài hạn' theo nghĩa truyền thống:</b> vì luôn tồn tại một phổ kỹ thuật (không phải một kỹ thuật duy nhất), "cân bằng dài hạn không bao giờ thực sự đạt được" như một trạng thái tĩnh — dù vẫn cần phân biệt quyết định DÀI HẠN (kỹ thuật, đầu tư) với quyết định NGẮN HẠN (mức sử dụng công suất).</div>
      <h3>Chọn kỹ thuật: khi nào lợi thế chi phí THẤP HƠN vẫn thắng dù tỷ suất lợi nhuận ban đầu thấp hơn?</h3>
      <p>Xét hai phương pháp cạnh tranh với C (tư bản điều tiết hiện tại): <b>D1</b> có chi phí thấp hơn VÀ tỷ suất lợi nhuận cao hơn C ở giá hiện hành — cả lý thuyết tân cổ điển LẪN cạnh tranh thực đều đồng ý D1 sẽ thay thế C (dù khác nhau về CON ĐƯỜNG dẫn tới kết quả đó). Nhưng <b>D2</b> có chi phí THẤP HƠN cả D1, nhưng cường độ vốn cao hơn khiến tỷ suất lợi nhuận của nó ở giá hiện hành lại THẤP HƠN C.</p>
      <div class="dark-panel">
        <h4>D2: hai lý thuyết cho ra hai KẾT QUẢ khác nhau, không chỉ khác con đường</h4>
        <div class="flow">
          <div class="flow-step"><b>Theo lý thuyết tân cổ điển/Sraffa (tiêu chí Okishio)</b>: D2 sẽ KHÔNG BAO GIỜ được chọn — vì ở giá hiện hành, C vẫn có tỷ suất lợi nhuận cao hơn, nên C tiếp tục là điều tiết mãi mãi</div>
          <div class="flow-arrow">↓ NHƯNG</div>
          <div class="flow-step"><b>Theo lý thuyết cạnh tranh thực (price-cutting)</b>: hãng dùng D2 chủ động HẠ GIÁ (vì có chi phí thấp nhất) — luôn tồn tại một mức giá (ví dụ $84) mà ở đó D2 có tỷ suất lợi nhuận CAO HƠN cả C lẫn D1 — buộc thị trường phải "nghe được thông điệp: tương lai đã đến"</div>
          <div class="flow-arrow">↓</div>
          <div class="flow-step" style="border-color:var(--gold);">D2 CUỐI CÙNG cũng trở thành tư bản điều tiết mới — điều mà tiêu chí Okishio (dựa trên tỷ suất lợi nhuận tại giá HIỆN HÀNH) không bao giờ dự đoán được</div>
        </div>
      </div>
      <div class="figure-note"><b>Hàm ý sâu xa cho tranh luận Okishio (nối lại chương 2):</b> vì tiêu chí lựa chọn kỹ thuật thực sự là CHI PHÍ THẤP NHẤT (không phải tỷ suất lợi nhuận cao nhất tại giá hiện hành), tỷ suất lợi nhuận CHUNG hoàn toàn có thể GIẢM ngay cả khi lương thực tế không đổi — bác bỏ trực tiếp "Định lý Okishio" vốn dựa trên giả định ngầm về cạnh tranh hoàn hảo (price-taking).</div>
      <h3>Bằng chứng cấp độ hãng: quy mô lớn hơn → tỷ suất lợi nhuận thấp hơn?</h3>
      <p>"Hầu hết các nghiên cứu... đều thấy tỷ suất lợi nhuận GIẢM theo quy mô hãng" (Dhawan, 2001) — một phát hiện hoàn toàn phù hợp với lý thuyết cạnh tranh thực (hãng chi phí thấp/quy mô lớn có thể chấp nhận tỷ suất lợi nhuận thấp hơn tạm thời để giành thị phần) nhưng lại NGƯỢC với kỳ vọng đơn giản của lý thuyết "quy mô kinh tế mang lại lợi nhuận cao hơn". Nghiên cứu của Foster và cộng sự (17.669 quan sát cấp cơ sở) khẳng định: doanh nghiệp NĂNG SUẤT CAO hơn thường đặt giá THẤP hơn để giành thị phần — khiến doanh thu/lao động của họ đôi khi còn THẤP hơn hãng kém năng suất mới gia nhập.</p>

    title:"Bằng chứng: Bình quân hóa Tỷ suất Lợi nhuận Điều tiết", eng:"VI.5 — Empirical Evidence on Equalization of Regulating Rates of Profit",
    body:`
      <p class="lede">Đây là phần bằng chứng thực nghiệm trung tâm của toàn bộ lý thuyết cạnh tranh thực. Trước khi xem số liệu, cần thấy rõ các trường phái lý thuyết khác nhau tới mức nào trong kỳ vọng của họ về việc "bình quân hóa" nghĩa là gì.</p>
      <div class="debate-box">
        <div class="dh">BỐN KỲ VỌNG LÝ THUYẾT HOÀN TOÀN KHÁC NHAU</div>
        <div class="db">
        <b>Tân cổ điển:</b> tự do gia nhập/rút lui buộc MỌI hãng trong ngành dùng CÙNG một phương pháp — nên tỷ suất lợi nhuận bằng nhau ở MỌI cấp độ (hãng, ngành, toàn nền kinh tế).<br><br>
        <b>Sraffa:</b> giả định 3 điều: mọi tỷ suất lợi nhuận bằng nhau tuyệt đối; chỉ một điều kiện sản xuất tồn tại mỗi ngành; giá trị vốn các thế hệ cũ được định sao cho tỷ suất lợi nhuận luôn bằng thế hệ mới nhất.<br><br>
        <b>Áo (Mueller):</b> cạnh tranh là QUÁ TRÌNH (không phải trạng thái) — nhưng giả thuyết KHÔNG (null hypothesis) vẫn là "MỌI tỷ suất lợi nhuận hội tụ về MỘT mức cạnh tranh duy nhất" — nên chênh lệch tồn tại lâu dài bị coi ngay là bằng chứng "phi cạnh tranh".<br><br>
        <b>Cổ điển/Cạnh tranh thực (Shaikh):</b> tỷ suất lợi nhuận LUÔN khác nhau ở bất kỳ thời điểm nào — CHỈ tỷ suất lợi nhuận của các tư bản ĐIỀU TIẾT mới được kỳ vọng bình quân hóa hỗn loạn qua thời gian đủ dài.</div>
      </div>
      <h3>Bằng chứng OECD 1970-1990: Trung bình PHÂN TÁN, Gia tăng CẮT NHAU</h3>
      <div class="chart-panel">
        <h4>Minh họa: Tỷ suất lợi nhuận TRUNG BÌNH vs GIA TĂNG, 8 ngành chế tạo thế giới, 1970-1990</h4>
        <div class="chart-sub">Trung bình (trên) tụ quanh một mức nhưng một số vẫn phân tán bền vững · Gia tăng (dưới) liên tục cắt nhau</div>
        <div id="chart-avgincr7"></div>
        <div class="chart-legend"><span><i style="background:#d6b263"></i>Tỷ suất trung bình (8 ngành)</span><span><i style="background:#7a93ad"></i>Tỷ suất gia tăng (8 ngành)</span></div>
      </div>
      <p>Sử dụng Cơ sở Dữ liệu Ngành Quốc tế OECD (ISDB 1994), Christodoulopoulos (1995) tính tỷ suất lợi nhuận trung bình và gia tăng cho 8 ngành chế tạo (Thực phẩm, Dệt may, Giấy, Hóa chất, Khoáng sản, Kim loại, Máy móc, Khác) trên 8 nước (Mỹ, Nhật, Canada, Đức, Pháp, Ý, Bỉ, Na Uy) giai đoạn 1970-1990. Kết quả: tỷ suất TRUNG BÌNH phần lớn tụ quanh một mức chung nhưng một số ngành vẫn PHÂN TÁN BỀN VỮNG phía trên/dưới; tỷ suất GIA TĂNG lại "cắt nhau qua lại chính xác theo cách lý thuyết cổ điển về bình quân hóa tỷ suất lợi nhuận dự đoán". Dữ liệu Mỹ riêng lẻ 1960-1989 (không làm mượt) cho kết quả tương tự.</p>
      <h3>Những hiệu chỉnh số liệu quan trọng (nối chương 6)</h3>
      <div class="stat-row">
        <div class="stat-box"><div class="val">90.5% → 20.7%</div><div class="lbl">Tỷ suất lợi nhuận ngành Xây dựng Mỹ, trước/sau loại trừ thu nhập lương-tương-đương của chủ hộ kinh doanh cá thể</div></div>
        <div class="stat-box"><div class="val">55.5% / 76%</div><div class="lbl">Tỷ trọng thặng dư/vốn "quy gán" (chủ nhà tự cho mình thuê nhà) trong tổng ngành Bất động sản, 1988-2005</div></div>
        <div class="stat-box"><div class="val">41.8% → 17.7%</div><div class="lbl">Tỷ suất lợi nhuận ngành Ngân hàng-Tài chính, trước/sau điều chỉnh dự trữ bình thường</div></div>

/* =========================================================
   FLASHCARDS RENDER
   ========================================================= */
var fcOrder = FLASHCARDS.map(function(_,i){return i;});
var fcIndex = 0;
document.getElementById('fcProgress').textContent = 'Thẻ 1 / ' + FLASHCARDS.length;
var flashcardEl = document.getElementById('flashcard');

function renderFlashcard(){
  var card = FLASHCARDS[fcOrder[fcIndex]];
  document.getElementById('fcTag').textContent = card.sec;
  document.getElementById('fcQ').textContent = card.q;
  document.getElementById('fcA').textContent = card.a;
  document.getElementById('fcProgress').textContent = 'Thẻ ' + (fcIndex+1) + ' / ' + FLASHCARDS.length;
  flashcardEl.classList.remove('flipped');
}
function flipFC(){ flashcardEl.classList.toggle('flipped'); }
document.getElementById('fcFlip').addEventListener('click', flipFC);
flashcardEl.addEventListener('click', flipFC);
document.getElementById('fcNext').addEventListener('click', function(){
  fcIndex = (fcIndex+1) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcPrev').addEventListener('click', function(){
  fcIndex = (fcIndex-1+FLASHCARDS.length) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcShuffle').addEventListener('click', function(){
  for(var i=fcOrder.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = fcOrder[i]; fcOrder[i]=fcOrder[j]; fcOrder[j]=tmp;
  }
  fcIndex = 0;
  renderFlashcard();
});
renderFlashcard();

/* =========================================================
   QUIZ RENDER
   ========================================================= */
var quizArea = document.getElementById('quizArea');
var quizAnswers = {};

function renderQuiz(){
  var html = QUIZ.map(function(item, qi){
    var opts = item.opts.map(function(opt, vi){
      return '<div class="q-opt" data-qi="'+qi+'" data-qv="'+vi+'">'+opt+'</div>';
    }).join('');
    return '<div class="q-block" id="qblock-'+qi+'">'+
      '<div class="q-text">'+(qi+1)+'. '+item.q+'</div>'+
      '<div class="q-opts">'+opts+'</div>'+
      '<div class="q-explain" id="qexplain-'+qi+'">'+item.explain+'</div>'+
      '</div>';
  }).join('');
  html += '<div style="text-align:center;margin-top:20px;"><button class="btn primary" id="quizFinish">Xem kết quả</button> <button class="btn" id="quizReset">Làm lại</button></div>';
  html += '<div id="quizResult"></div>';
  quizArea.innerHTML = html;

  quizArea.addEventListener('click', quizClickHandler);
  document.getElementById('quizFinish').addEventListener('click', showQuizScore);
  document.getElementById('quizReset').addEventListener('click', function(){
    quizAnswers = {};
    renderQuiz();
  });
}

function quizClickHandler(e){
  var opt = e.target.closest('.q-opt');
  if(!opt) return;
  var qi = parseInt(opt.dataset.qi, 10);
  var qv = parseInt(opt.dataset.qv, 10);
  quizAnswers[qi] = qv;
  var block = document.getElementById('qblock-'+qi);
  block.querySelectorAll('.q-opt').forEach(function(o){
    o.classList.remove('selected','correct','incorrect');
  });
  var correctIdx = QUIZ[qi].correct;
  block.querySelectorAll('.q-opt').forEach(function(o){
    var v = parseInt(o.dataset.qv,10);
    if(v === correctIdx) o.classList.add('correct');
    else if(v === qv) o.classList.add('incorrect');
  });
  document.getElementById('qexplain-'+qi).classList.add('show');
  updateQuizProgress();
}

function updateQuizProgress(){
  var answered = Object.keys(quizAnswers).length;
  var pct = Math.round(100*answered/QUIZ.length);
  document.getElementById('quizProgressFill').style.width = pct+'%';
}

function showQuizScore(){
  var correct = 0;
  QUIZ.forEach(function(item, qi){
    if(quizAnswers[qi] === item.correct) correct++;
  });
  var pct = Math.round(100*correct/QUIZ.length);
  document.getElementById('quizResult').innerHTML =
    '<div class="quiz-score"><div class="num">'+correct+'/'+QUIZ.length+'</div>'+
    '<div class="lbl">('+pct+'%) — '+ (pct>=80?'Nắm rất vững nội dung!':pct>=50?'Khá tốt, xem lại vài phần.':'Nên đọc lại các phần liên quan.') +'</div></div>';
}
renderQuiz();

/* =========================================================
   NOTES PANEL
   ========================================================= */
var notesFab = document.getElementById('notesFab');
var notesPanel = document.getElementById('notesPanel');
var notesBackdrop = document.getElementById('notesBackdrop');
var notesBody = document.getElementById('notesBody');
var notesTitle = document.getElementById('notesTitle');
var notesFoot = document.getElementById('notesFoot');
var currentNoteTab = 'chientranh';
var LS_PREFIX = 'shaikh_ch7_note_';

function isMobile(){ return window.matchMedia('(max-width:640px)').matches; }

function noteLabelFor(id){
  var s = SECTIONS.filter(function(x){return x.id===id;})[0];
  if(s) return s.n + '. ' + s.label;
  if(id === 'gloss') return 'Thuật ngữ';
  if(id === 'flashcards') return 'Thẻ ghi nhớ';
  if(id === 'quiz') return 'Quiz';
  return id;
}

function openNotesFor(id){
  currentNoteTab = id;
  notesTitle.textContent = 'Ghi chú — ' + noteLabelFor(id);
  var saved = localStorage.getItem(LS_PREFIX + id) || '';
  notesBody.innerHTML = saved;
  updateNotesFoot();
}
function updateNotesFoot(){
  var len = notesBody.innerText.trim().length;
  notesFoot.textContent = len + ' ký tự · lưu tự động';
}
function saveCurrentNote(){
  localStorage.setItem(LS_PREFIX + currentNoteTab, notesBody.innerHTML);
  updateNotesFoot();
}
function openNotesPanel(){
  notesPanel.classList.add('open');
  if(isMobile()){ notesBackdrop.classList.add('show'); }
}
function closeNotesPanel(){
  notesPanel.classList.remove('open');
  notesBackdrop.classList.remove('show');
}
notesFab.addEventListener('click', function(){
  if(notesPanel.classList.contains('open')){
    closeNotesPanel();
  } else {
    openNotesFor(currentNoteTab);
    openNotesPanel();
  }
});
document.getElementById('notesClose').addEventListener('click', closeNotesPanel);
notesBackdrop.addEventListener('click', closeNotesPanel);
notesBody.addEventListener('input', saveCurrentNote);
document.querySelectorAll('.notes-toolbar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    var cmd = btn.dataset.cmd;
    notesBody.focus();
    if(cmd.indexOf(':')>-1){
      var parts = cmd.split(':');
      document.execCommand(parts[0], false, parts[1]);
    } else {
      document.execCommand(cmd, false, null);
    }
    saveCurrentNote();
  });
});

activateTab(ALL_TAB_IDS[0]);
</script>
