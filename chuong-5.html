<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<title>Shaikh — Capitalism: Competition, Conflict, Crises — Chương 5</title>
<style>
:root{
  --bg:#f2ede0;
  --panel:#fffdf8;
  --panel-2:#eef1e8;
  --ink:#211d16;
  --ink-soft:#4c473b;
  --muted:#847b68;
  --line:#dcd0ac;
  --primary:#1f3b5c;
  --primary-dark:#152944;
  --primary-tint:#e1e8ef;
  --gold:#a67f2c;
  --gold-light:#d6b263;
  --green:#2f6b3f;
  --green-tint:#e3ede4;
  --red:#8a2f2f;
  --red-tint:#f0e2e2;
  --dark-bg:#141b22;
  --dark-panel:#1d2731;
  --dark-ink:#eef1e6;
  --dark-line:#324256;
  --shadow:0 6px 24px rgba(20,27,34,0.12);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1000px;margin:0 auto;padding:0 16px 80px;}

.hero{padding:32px 16px 20px;text-align:center;border-bottom:3px double var(--gold);margin-bottom:18px;background:radial-gradient(ellipse at top, rgba(166,127,44,0.08), transparent 60%);}
.hero .kicker{font-family:Georgia,serif;letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700;}
.hero h1{font-size:clamp(22px,4.6vw,34px);margin:8px 0 4px;color:var(--primary-dark);letter-spacing:.005em;line-height:1.25;}
.hero .subtitle{font-size:14.5px;color:var(--ink-soft);font-style:italic;}
.hero .meta{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hero .meta span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);}
.hero .meta a.meta-link{color:var(--primary);text-decoration:none;font-weight:600;}
.hero .meta a.meta-link:hover{background:var(--primary-tint);}


.tabbar-wrap{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:8px;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tabbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;}
.tabbar::-webkit-scrollbar{height:5px;}
.tabbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.tab-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
.tab-btn .n{color:var(--gold);font-weight:800;margin-right:5px;}
.tab-btn:hover{border-color:var(--gold);}
.tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow);}
.tab-btn.active .n{color:var(--gold-light);}

.panel{display:none;animation:fadein .25s ease;}
.panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);}
.card h2{margin:0 0 4px;font-size:21px;color:var(--primary-dark);}
.card .eng-title{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:16px;letter-spacing:.02em;}
.card h3{font-size:15.5px;color:var(--primary);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px;}
.card p{margin:0 0 12px;color:var(--ink);}
.card p:last-child{margin-bottom:0;}
.lede{font-size:16px;color:var(--ink-soft);border-left:3px solid var(--gold);padding-left:14px;margin:6px 0 18px;}

.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0;}
.concept{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.concept .term{font-weight:700;color:var(--primary-dark);font-size:13px;display:block;margin-bottom:4px;}
.concept .term .en{color:var(--gold);font-weight:600;font-size:11px;font-style:italic;}
.concept p{font-size:13px;margin:0;color:var(--ink-soft);}

.figure-note{background:var(--primary-tint);border:1px dashed var(--primary);border-radius:10px;padding:12px 15px;font-size:12.5px;color:var(--primary-dark);margin:14px 0;}
.figure-note b{color:var(--primary-dark);}

.debate-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0;}
.debate-box .dh{background:var(--primary);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.03em;}
.debate-box .db{padding:13px 15px;font-size:13px;color:var(--ink-soft);}
.debate-box .names{color:var(--gold);font-weight:700;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0;}
.stat-box{background:var(--primary-dark);color:#fff;border-radius:10px;padding:13px 14px;text-align:center;}
.stat-box .val{font-size:20px;font-weight:800;color:var(--gold-light);}
.stat-box .lbl{font-size:10.5px;color:#dbe4ee;margin-top:3px;line-height:1.3;}

.dark-panel{background:var(--dark-bg);color:var(--dark-ink);border-radius:12px;padding:20px;margin:16px 0;border:1px solid var(--dark-line);}
.dark-panel h4{margin:0 0 12px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;}
.flow{display:flex;flex-direction:column;gap:0;}
.flow-step{background:var(--dark-panel);border:1px solid var(--dark-line);border-radius:8px;padding:10px 14px;font-size:12.5px;position:relative;}
.flow-step b{color:var(--gold-light);}
.flow-arrow{text-align:center;color:var(--gold);font-size:16px;padding:2px 0;}
.flow-branch{display:flex;gap:10px;margin:2px 0;flex-wrap:wrap;}
.flow-branch>div{flex:1;min-width:130px;}

.chart-panel{background:var(--dark-bg);border:1px solid var(--dark-line);border-radius:12px;padding:18px 18px 14px;margin:16px 0;}
.chart-panel h4{margin:0 0 2px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;}
.chart-panel .chart-sub{font-size:11px;color:#9fb0c2;margin-bottom:10px;font-style:italic;}
.chart-panel svg{width:100%;height:auto;display:block;}

/* ===== Real/reference chart (photo, not illustrative SVG) ===== */
.chart-real{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:10px 0 18px;}
.chart-real-badge{display:inline-block;font-family:Georgia,serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);border-radius:4px;padding:3px 9px;margin-bottom:9px;}
.chart-real img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);}
.chart-real figcaption{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.55;font-style:italic;}

.chart-note{font-size:10.5px;color:#8496a8;margin-top:6px;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dark-ink);}
.chart-legend span{display:inline-flex;align-items:center;gap:5px;}
.chart-legend i{width:12px;height:3px;display:inline-block;border-radius:2px;}

.gloss-item{border-bottom:1px solid var(--line);padding:12px 0;}
.gloss-item:last-child{border-bottom:none;}
.gloss-term{font-weight:700;color:var(--primary-dark);font-size:14px;}
.gloss-term .en{color:var(--gold);font-weight:600;font-size:11.5px;font-style:italic;margin-left:6px;}
.gloss-def{font-size:13px;color:var(--ink-soft);margin-top:3px;}

.gloss-extra-row{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.gloss-extra-row .en{flex:1;color:var(--ink-soft);font-style:italic;}
.gloss-extra-row .vi{flex:1;color:var(--primary-dark);font-weight:600;}


.fc-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.fc-progress{font-size:13px;color:var(--muted);}
.fc-stage{display:flex;justify-content:center;margin:10px 0 20px;perspective:1400px;}
.flashcard{width:100%;max-width:560px;height:270px;position:relative;cursor:pointer;}
.flashcard .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flashcard.flipped .fc-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);}
.fc-front{background:var(--panel);}
.fc-front .fc-tag{position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;font-weight:700;}
.fc-front .fc-q{font-size:17px;color:var(--ink);font-weight:600;}
.fc-back{background:var(--primary);color:#fff;transform:rotateY(180deg);}
.fc-back .fc-a{font-size:14px;}
.fc-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;}
.fc-nav{display:flex;justify-content:center;gap:10px;margin-top:16px;}
.btn{border:1px solid var(--primary);background:var(--panel);color:var(--primary-dark);font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--primary);color:#fff;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-dark);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.quiz-progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--primary));transition:width .3s;}
.q-block{margin-bottom:14px;}
.q-text{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;}
.q-opts{display:flex;flex-direction:column;gap:8px;}
.q-opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer;transition:all .15s;}
.q-opt:hover{border-color:var(--gold);}
.q-opt.selected{border-color:var(--primary);background:var(--primary-tint);}
.q-opt.correct{border-color:var(--green);background:var(--green-tint);color:#1c4a28;font-weight:700;}
.q-opt.incorrect{border-color:var(--primary);background:#f3e6e6;color:#7a2020;font-weight:700;}
.q-explain{margin-top:10px;font-size:12.5px;color:var(--ink-soft);background:var(--panel-2);border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 8px 8px 0;display:none;}
.q-explain.show{display:block;}
.quiz-score{text-align:center;padding:30px 20px;}
.quiz-score .num{font-size:46px;font-weight:800;color:var(--primary);}
.quiz-score .lbl{font-size:14px;color:var(--muted);margin-bottom:18px;}

.notes-fab{position:fixed;right:22px;bottom:22px;z-index:50;background:var(--primary);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 8px 20px rgba(21,41,68,0.35);cursor:pointer;display:flex;align-items:center;gap:7px;}
.notes-backdrop{position:fixed;inset:0;background:rgba(15,18,22,0.45);z-index:60;display:none;}
.notes-backdrop.show{display:block;}
.notes-panel{position:fixed;top:0;right:0;height:100%;width:380px;max-width:88vw;background:var(--panel);z-index:70;box-shadow:-10px 0 30px rgba(0,0,0,0.2);transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;}
.notes-panel.open{transform:translateX(0);}
.notes-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.notes-head h4{margin:0;color:var(--primary-dark);font-size:14.5px;}
.notes-head .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.notes-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;}
.notes-toolbar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.notes-toolbar button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;width:30px;height:30px;cursor:pointer;font-family:Georgia,serif;font-size:14px;color:var(--ink);}
.notes-toolbar button:hover{border-color:var(--gold);}
.notes-body{flex:1;padding:16px 18px;overflow-y:auto;outline:none;font-size:14px;line-height:1.7;}
.notes-body:empty:before{content:"Ghi chú của bạn cho phần này... (tự động lưu)";color:var(--muted);font-style:italic;}
.notes-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);}

@media (max-width:640px){
  .hero{padding:22px 12px 14px;}
  .card{padding:16px 15px;}
  .flashcard{height:250px;}
  .notes-panel{width:100%;max-width:100%;}
}
@media print{
  .tabbar-wrap,.notes-fab,.notes-panel,.notes-backdrop,.fc-nav,.q-opts{display:none !important;}
  .panel{display:block !important;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
}
</style>
</head>

<script>
/* =========================================================
   MINI CHART HELPER
   ========================================================= */
function sparkPath(values, w, h, pad){
  var n = values.length;
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  var range = (max - min) || 1;
  var pts = values.map(function(v, i){
    var x = pad + (i/(n-1)) * (w - 2*pad);
    var y = pad + (1 - (v - min)/range) * (h - 2*pad);
    return [x,y];
  });
  var d = 'M ' + pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L ');
  var area = d + ' L ' + pts[pts.length-1][0].toFixed(1) + ',' + (h-pad) + ' L ' + pts[0][0].toFixed(1) + ',' + (h-pad) + ' Z';
  return {line:d, area:area, pts:pts};
}
function renderLineChart(containerId, series, opts){
  opts = opts || {};
  var w = opts.w || 400, h = opts.h || 120, pad = opts.pad || 8;
  var svg = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  series.forEach(function(s){
    var r = sparkPath(s.values, w, h, pad);
    if(s.fill !== false){
      svg += '<path d="'+r.area+'" fill="'+(s.color||'#a67f2c')+'" opacity="0.12"></path>';
    }
    svg += '<path d="'+r.line+'" fill="none" stroke="'+(s.color||'#a67f2c')+'" stroke-width="'+(s.width||2)+'" vector-effect="non-scaling-stroke"></path>';
  });
  svg += '</svg>';
  var el = document.getElementById(containerId);
  if(el) el.innerHTML = svg;
}

/* =========================================================
   DATA — SECTIONS (tabs 0-6)
   ========================================================= */
var SECTIONS = [
  {
    id:"traodoi", n:"0", label:"Trao đổi & Nợ",
    title:"Trao đổi, Nghĩa vụ Thanh toán, và Nợ", eng:"I. Introduction",
    body:`
      <p class="lede">Sản xuất cần thời gian nên phải đi trước phân phối sản phẩm — và trao đổi chỉ là MỘT trong nhiều hình thức phân phối khả dĩ. CNTB có ba đặc trưng: sản xuất do vô số thực thể cá nhân tiến hành không hề quan tâm trực tiếp tới việc chúng có khớp với nhu cầu xã hội hay không; phân phối được thực hiện qua trao đổi; và động cơ lợi nhuận chi phối tất cả. Trao đổi chính là "đấu trường" nơi sản xuất cá thể hóa buộc phải đối mặt với những kỳ vọng của chính nó — sai lệch là chuyện bình thường, và trật tự hỗn loạn chi phối quá trình này chỉ đạt được TRONG VÀ QUA chính sự hỗn loạn đó.</p>
      <div class="figure-note"><b>Phê phán trực diện:</b> Shaikh cho rằng nhiệm vụ cốt lõi của kinh tế học tân cổ điển là hướng ánh nhìn của chúng ta khỏi sự ồn ào của thị trường thực, tới một trạng thái "thiên đường" nơi mọi kế hoạch sản xuất cá nhân khớp hoàn hảo với nhu cầu xã hội — huyễn tưởng này được gọi là "cân bằng tổng quát" (general equilibrium).</div>
      <h3>Ba khái niệm dễ bị nhầm lẫn: Quà tặng, Nghĩa vụ Thanh toán, Nợ</h3>
      <div class="concept-grid">
        <div class="concept"><span class="term">Quà tặng đích thực</span><p>Cho đi mà không đòi lại gì. Nhưng có những hình thức "tặng qua lại" (như tục potlatch — thứ hạng xã hội được xác định bằng việc cho đi/hủy hoại của cải nhiều đến đâu trước mặt người khác) thực chất là một dạng cạnh tranh khác với trao đổi.</p></div>
        <div class="concept"><span class="term">Nghĩa vụ thanh toán</span><p>Xuất hiện TRƯỚC cả trao đổi: tiền cưới, tiền chuộc máu (100 con bò ở Ấn Độ cổ đại), địa tô nộp cho địa chủ, thuế nộp cho nhà nước — thường mang tính MỘT CHIỀU, bị cưỡng ép, không đòi hỏi hoàn trả tương xứng.</p></div>
        <div class="concept"><span class="term">Nghĩa vụ nợ</span><p>Phát sinh từ chính khả năng trao đổi "cho trước, nhận sau" — có tính chất HOÀN LƯU (reflux), quay về điểm xuất phát. Nợ không nhất thiết đi kèm lãi suất — về lịch sử/logic, có thể trả lại đúng số hạt giống đã vay bằng hạt giống mới thu hoạch.</p></div>
      </div>
      <h3>Từ hàng đổi hàng đến tiền: "ngữ pháp của trao đổi"</h3>
      <p>Hàng đổi hàng (barter) là hình thức trao đổi sớm nhất — vẫn tồn tại đến ngày nay (trại tù binh Đức không có tiền; các thỏa thuận song phương DC-9 đổi giăm bông Nam Tư; cừu New Zealand đổi dầu Iran; và cả các trang web trao đổi trực tuyến hiện đại). Nhưng hàng đổi hàng có vấn đề tổ hợp học nghiêm trọng: chỉ 10 mặt hàng đã tạo ra 45 tỷ giá trao đổi riêng biệt, 1.000 mặt hàng tạo ra gần nửa triệu tỷ giá!</p>
      <div class="figure-note"><b>Tiền là "ngữ pháp của trao đổi":</b> nó nảy sinh TỰ NHIÊN khi trao đổi mở rộng phạm vi và trở nên đều đặn — biến vô số tỷ giá song phương thành MỘT bảng giá duy nhất so với một vật ngang giá chung được xã hội lựa chọn. Giống ngữ pháp, tiền dần được nhà nước hệ thống hóa và kiểm soát — nhưng cũng như ngữ pháp, nhà nước là kẻ đến SAU trong lịch sử hình thành của nó, không phải người phát minh ra nó.</div>
      <p><b>Giá cả</b> hoàn toàn khác một tỷ giá trao đổi đơn thuần — nó là biểu hiện bằng TIỀN của giá trị định lượng một hàng hóa. Dưới hàng đổi hàng, giá trị của lúa mì được biểu hiện qua vô số hàng hóa vật chất khác nhau (thịt, muối, da, công cụ...). Chỉ khi một hàng hóa cụ thể (như muối) được xã hội chọn làm điểm quy chiếu chung, muối mới trở thành "tiền cục bộ" và mọi hàng hóa khác có "giá tính bằng muối".</p>

      <h3>Vì sao vỏ sò cowrie 'thắng thế' — và bài học về lạm phát</h3>
      <p>Vỏ sò cowrie thỏa mãn mọi thuộc tính lý tưởng của tiền: dễ mang theo, bền, dễ nhận diện, đếm được, và KHÔNG THỂ làm giả. Ở Bờ Biển Vàng, trả công bằng bụi vàng tạo ra quá nhiều cơ hội gian lận đến mức người bản địa thích dùng cowrie "không thể pha tạp" hơn. Nhưng khi thương nhân Hamburg nhập khẩu cowrie ồ ạt hàng nghìn tấn vào châu Phi, sức mua của chúng "tụt xuống thấp đến mức không còn dùng được trong thương mại" — và khi Nhật chiếm New Guinea 1942, họ phân phát cowrie tự do đến mức "gây nguy hiểm cho ổn định kinh tế-tài chính" khu vực.</p>
      <div class="figure-note"><b>Bài học kinh tế học quan trọng:</b> đừng vội coi đây là "Lý thuyết Số lượng Tiền tệ" (Quantity Theory) kiểu Cowry đơn thuần — vì cung tiền tăng thường mua được LƯỢNG HÀNG HÓA LỚN HƠN, không chỉ một lượng cố định ở giá cao hơn. Sản lượng hàng hóa hiếm khi đứng yên trước cầu hiệu quả tăng lên (bàn kỹ ở phần IV).</div>
      <h3>Đồng xu: 'lời mời gọi gian lận'</h3>
      <p>Vỏ sò cowrie không phải đồng xu. Một đồng xu là một MIẾNG TIỀN mang dấu ấn bảo chứng — cần thiết chính vì tiền có thể bị pha tạp/làm giả. Những đồng xu đầu tiên do THƯƠNG NHÂN phát hành, không phải nhà nước. Chỉ về sau nhà nước mới tiếp quản chức năng đúc tiền — và với nó, cả khoản lợi từ việc tạo tiền (seigniorage).</p>

        <div class="db">Đồng penny Anh (d.) ban đầu chứa 1/240 pound bạc (240d. = £1). Các quân vương liên tục giảm hàm lượng bạc trong khi vẫn gọi nó là "penny" — cho phép họ đúc nhiều đồng xu hơn từ cùng lượng bạc, mua nhiều hàng hơn hoặc trả nợ nhiều hơn. Khi giá cả sau đó tăng theo, dân chúng mới "vỡ lẽ". Đây chính là <span class="names">Quy luật Gresham</span>: "tiền xấu đuổi tiền tốt" — theo Galbraith, "có lẽ là quy luật kinh tế duy nhất chưa từng bị thách thức... vì chưa từng có ngoại lệ nghiêm trọng nào."</div>

      <h3>Từ biên lai gửi vàng tới tiền giấy lưu hành</h3>
      <p>Thợ kim hoàn London đầu thế kỷ 17 phát hành biên lai xác nhận một khoản tiền được gửi giữ — ban đầu chỉ trả cho ĐÍCH DANH người gửi, CHƯA phải "token tiền". Nhưng người gửi bắt đầu dùng biên lai để thanh toán trực tiếp. Đến 1670, biên lai thêm cụm "hoặc người cầm giữ" (or bearer) — biến nó thành phương tiện thanh toán cho BẤT KỲ ai đang cầm nó. Năm 1704, thực tiễn này được luật hóa. Từ đây, biên lai gửi tiền đã trở thành TOKEN TIỀN thực thụ.</p>

  {
    id:"phapdinh", n:"2", label:"Tiền Pháp định & NH",
    title:"Tiền Pháp định, Ngân hàng và Tín dụng", eng:"II.4-5 — Fiat Money, Banks, Credit",
    body:`
      <p class="lede">Xu hướng lịch sử: nhà nước phát hành đồng xu mệnh giá nhỏ có hàm lượng kim loại THẤP HƠN mệnh giá danh nghĩa (token có thể chuyển đổi — convertible), nhằm tiết kiệm kim loại quý trong khi vẫn giữ được lòng tin nhờ cam kết đổi lại theo tỷ giá cố định. Nhưng khả năng hấp dẫn hơn — và thường được nhà nước dùng trong lúc túng quẫn — là ép LƯU HÀNH những token HOÀN TOÀN KHÔNG chuyển đổi được: <b>tiền pháp định</b> (fiat money).</p>
      <div class="dark-panel">
        <h4>Ba nấc thang: từ xu hao mòn đến tiền pháp định thuần túy</h4>
        <div class="flow">
          <div class="flow-step"><b>Xu hao mòn / token chuyển đổi</b>: giá trị nội tại thấp hơn mệnh giá, nhưng có thể đổi lại theo tỷ giá cố định tại "cửa sổ đổi tiền" của nhà nước</div>
          <div class="flow-arrow">↓</div>
          <div class="flow-step"><b>Token không chuyển đổi</b>: nhà nước không cam kết đổi lại — tỷ giá token/bạc trở nên THẢ NỔI, xác định trên thị trường kim loại quý</div>
          <div class="flow-arrow">↓</div>
          <div class="flow-step"><b>Tiền pháp định thuần túy</b>: vừa bị ép lưu hành vừa hoàn toàn không chuyển đổi — chỉ "chuyển đổi" được vào hàng hóa-tiền qua thị trường mở, không qua bất kỳ cam kết chính thức nào</div>
        </div>
      </div>
      <h3>Thí nghiệm Massachusetts 1690 — tiền giấy đầu tiên của thực dân Mỹ</h3>
      <p>Người Mỹ thực dân phản đối đánh thuế — phát hành tiền giấy là giải pháp thay thế tiện lợi. Ban đầu, giấy bạc lưu hành đúng mệnh giá vàng/bạc suốt 20 năm. Nhưng ngày càng nhiều tờ được phát hành, lời hứa đổi lại bằng kim loại cứng liên tục bị trì hoãn — một mô hình sẽ lặp lại vô số lần trong lịch sử tài khóa nhà nước.</p>
      <h3>"Loans create deposits" — cơ chế ngân hàng tạo tiền</h3>
      <p>Ngân hàng dự trữ 100% (guardian banks) ban đầu chỉ giữ hộ tiền. Nhưng thợ kim hoàn sớm nhận ra: nhu cầu rút tiền của một số khách hàng thường được BÙ TRỪ bởi tiền gửi mới của khách khác — nên họ có thể cho vay một phần tiền gửi mà vẫn đáp ứng được nhu cầu rút tiền bình thường. Đây là bước chuyển từ ngân hàng dự trữ 100% sang ngân hàng tín dụng dự trữ PHÂN ĐOẠN (fractional reserve).</p>
      <div class="figure-note"><b>Trích Galbraith:</b> "Quá trình các ngân hàng tạo ra tiền đơn giản đến mức khiến tâm trí phải chối bỏ. Khi có điều gì quan trọng đến vậy liên quan, một bí ẩn sâu xa hơn dường như mới xứng đáng." Bản chất: một khoản vay MỚI tạo ra một khoản TIỀN GỬI mới tương ứng — "các khoản vay tạo ra tiền gửi", không cần "chuyển hóa" vàng thành xu vất vả như trước — chỉ cần chữ ký, cái bắt tay.</div>
      <h3>Liên hệ ngược tới Chương 3: "ngắn hạn" thực sự dài bao lâu?</h3>
      <p>Lý thuyết vĩ mô chuẩn giả định cung-cầu tiền cân bằng trong một "ngắn hạn" nào đó — nhưng độ dài chính xác của giai đoạn này hiếm khi được bàn rõ, mà ngầm định nghĩa theo TẦN SUẤT dữ liệu sẵn có (khi chỉ có số liệu năm → ngầm giả định cân bằng trong 12 tháng; khi có số liệu quý → ngầm giả định cân bằng trong 3 tháng, dù mô hình không hề thay đổi!). Shaikh nhắc lại kết luận từ chương 3: khoảng thời gian phù hợp cho bình quân hóa hỗn loạn của cung-cầu tổng hợp là <b>3-5 năm</b> (36-60 tháng) — dài hơn nhiều so với giả định ngầm phổ biến.</p>
    `,
    concepts:[
      ["Token chuyển đổi vs không chuyển đổi","Convertible vs inconvertible tokens","Token chuyển đổi: nhà nước cam kết đổi theo tỷ giá cố định. Token không chuyển đổi: tỷ giá với kim loại quý thả nổi theo thị trường — 'không chuyển đổi' chỉ có nghĩa là thiếu cửa sổ đổi chính thức, không có nghĩa hoàn toàn tách biệt khỏi hàng hóa-tiền."],
      ["Tiền pháp định","Fiat money","Tiền vừa bị ép lưu hành vừa hoàn toàn không có cam kết chuyển đổi chính thức nào — 'tinh chế và triển khai ý tưởng này mất nhiều thế kỷ' (Sargent & Velde)."],
      ["'Các khoản vay tạo ra tiền gửi'","'Loans create deposits'","Cơ chế cốt lõi của ngân hàng dự trữ phân đoạn hiện đại: một khoản vay mới lập tức tạo ra một khoản tiền gửi mới tương ứng, làm tăng tổng phương tiện lưu thông."],
      ["Ngắn hạn thực sự dài bao lâu?","How long is the 'short run', really?","Phê phán phương pháp luận: các mô hình vĩ mô ngầm định nghĩa 'ngắn hạn' theo tần suất dữ liệu sẵn có (năm/quý) chứ không dựa trên bằng chứng — Shaikh đề xuất 3-5 năm dựa trên chương 3."]
    ]

  {
    id:"bachucnang", n:"3", label:"Ba Chức năng Tiền",
    title:"Ba Chức năng Thiết yếu của Tiền — và Vàng như Nơi Trú ẩn", eng:"II.6 — Essential Functions of Money",
    body:`
      <p class="lede">Lịch sử dài và rối rắm của tiền cho thấy nó thực hiện BA chức năng tách biệt — thiếu bất kỳ chức năng nào, một vật không còn là tiền theo đúng nghĩa.</p>
      <div class="concept-grid">
        <div class="concept"><span class="term">1. Phương tiện Định giá<span class="en">Medium of pricing</span></span><p>Biểu hiện giá trị định lượng của hàng hóa. Mang tính DỰ KIẾN — không cần tiền thực tế xuất hiện (có thể định giá toàn bộ đất đai Nhật Bản là 20 nghìn tỷ USD mà không cần in ra một đồng nào).</p></div>
        <div class="concept"><span class="term">2. Phương tiện Lưu thông<span class="en">Medium of circulation</span></span><p>Khi đóng vai trò này, tiền phải THỰC SỰ hiện diện. Nhưng KHÔNG có tương ứng 1-1 giữa lượng tiền và giá trị hàng hóa lưu thông — còn phụ thuộc tỷ lệ mua bán trực tiếp và thanh toán bù trừ nợ.</p></div>
        <div class="concept"><span class="term">3. Phương tiện An toàn<span class="en">Medium of safety</span></span><p>Tiền phải có khả năng BƯỚC RA khỏi lưu thông — một khoảng dừng tạm thời, chuyển sang thanh khoản để phòng ngừa bất ổn. Đây là chức năng khiến vàng luôn trở lại làm "nơi trú ẩn cuối cùng" mỗi khi khủng hoảng.</p></div>
      </div>
      <div class="figure-note"><b>Tiền pháp định KHÔNG hề 'không thể chuyển đổi' theo nghĩa sâu xa:</b> chức năng cốt lõi của tiền LUÔN là có thể chuyển đổi thành hàng hóa — nếu thất bại ở điều này, nó không còn là tiền nữa. Đồng đô la Liên minh miền Nam (Confederate dollar) từng là tiền thật, nay chỉ còn là một món đồ sưu tầm.</div>
      <h3>Vàng: 'nơi trú ẩn cuối cùng' — bằng chứng lịch sử sống động</h3>
      <div class="stat-row">
        <div class="stat-box"><div class="val">70%</div><div class="lbl">Tỷ lệ vàng khai thác 1931-36 được cá nhân/ngân hàng tư nhân tích trữ giữa Đại khủng hoảng</div></div>
        <div class="stat-box"><div class="val">47×</div><div class="lbl">Giá vàng tính bằng USD tăng gần 47 lần, 1933-2009 (4.568%)</div></div>

      <p>1931: Anh tuyên bố đồng bảng không chuyển đổi được, nhưng thị trường vàng London vẫn hoạt động bình thường — người dân châu Âu ngày càng nghi ngờ tiền giấy nên đổ xô tích trữ vàng. 1975: tướng Nguyễn Văn Thiệu được cho là đã chạy khỏi miền Nam Việt Nam với "toàn bộ dự trữ vàng quốc gia nhét trong vali" — Shaikh bình luận khô khan: "trong hành động cuối cùng này, ông đã thể hiện sự tinh thông lý thuyết đáng kể."</p>

    body:`
      <p class="lede">Kinh tế học cổ điển phân biệt lý thuyết GIÁ TƯƠNG ĐỐI (chi phối dài hạn bởi bình quân hóa tỷ suất lợi nhuận) với lý thuyết MỨC GIÁ CHUNG. Về mức giá chung, có hai phe lớn trong truyền thống cổ điển.</p>
      <div class="debate-box">
        <div class="dh">HAI PHE: LÝ THUYẾT SỐ LƯỢNG vs NỘI SINH TIỀN TỆ</div>
        <div class="db">
        <b>Lý thuyết Số lượng Tiền (Hume-Ricardo, "Currency School"):</b> mức giá chung do LƯỢNG TIỀN quyết định — p = (M/XR)·V. Friedman tóm gọn: "lạm phát ở đâu và lúc nào cũng là hiện tượng tiền tệ."<br><br>
        <b>Trường phái Ngân hàng (Banking School) và Marx (giống Keynesian hiện đại):</b> đảo ngược quan hệ nhân quả — chính MỨC GIÁ quyết định LƯỢNG TIỀN cần thiết để lưu thông, vì cung tiền phần lớn nội sinh (ngân hàng tạo tín dụng theo nhu cầu kinh doanh thực tế).</div>

      <h3>Điểm mấu chốt trong lý thuyết Marx: 1939/40, không phải 1971</h3>
      <p>Marx giới hạn phân tích của mình vào giai đoạn lịch sử dài trong đó một hàng hóa-tiền (vàng) là phương tiện định giá HIỆU LỰC — bao trùm cả xu vàng, token chuyển đổi, VÀ nhiều token không chuyển đổi/tiền pháp định miễn chúng còn neo theo vàng dù gián tiếp (ví dụ: siêu lạm phát Đức 1920s, giá vẫn được định theo vàng dù tiền lưu hành là giấy).</p>
      <div class="figure-note"><b>Phát hiện quan trọng của Shaikh:</b> vàng MẤT vai trò phương tiện định giá hiệu lực vào cuối Đại khủng hoảng — <b>1939/40</b> — chứ KHÔNG phải năm 1971 (khi Nixon chính thức chấm dứt chuyển đổi đô la-vàng) như thường lầm tưởng. Anh từ bỏ bản vị vàng 1931, Mỹ về thực chất năm 1933 — nhưng nạn tích trữ vàng lan rộng khắp châu Âu suốt Đại khủng hoảng có nghĩa vàng vẫn ngầm định hình giá cả cho tới khi Đại khủng hoảng thực sự kết thúc.</div>
      <h3>Công thức trung tâm của Marx: Mức giá = Giá tương đối × Giá vàng</h3>
      <div class="dark-panel">
        <h4>Phân rã mức giá quốc gia theo Marx</h4>

          <div class="flow-step"><b>Mức giá quốc gia (p)</b> = <b>Giá tương đối của hàng hóa so với vàng (p′)</b> × <b>Giá tiền tệ của vàng (p<sub>vàng</sub>)</b></div>

      <p>Cả Trường phái Ngân hàng lẫn Marx đều cho rằng lượng tiền phản ứng theo cầu — nhưng điều này KHÔNG có nghĩa cung và cầu tiền luôn bằng nhau tức thời: Marx lập luận rõ tăng cung tiền có thể làm thay đổi mức SẢN LƯỢNG, từ đó thay đổi luôn cầu tiền — giống hệt logic hiệu quả cầu hiện đại.</p>

    body:`
      <p class="lede">Kiểm chứng công thức Marx bằng 220 năm dữ liệu giá bán buôn Anh và Mỹ — tách mức giá quan sát được (p) thành hai thành phần: giá tương đối hàng hóa so với vàng (p′) và giá tiền tệ của vàng (p<sub>vàng</sub>).</p>
      <div class="chart-panel">
        <h4>Minh họa: Chỉ số giá Anh-Mỹ, 1790–2010 (thang log)</h4>
        <div class="chart-sub">Trước 1940: sóng lên-xuống, KHÔNG xu hướng ròng · Sau 1940: tăng liên tục</div>
        <div id="chart-priceindex"></div>
        <div class="chart-note">Đến 1940, chỉ số giá Anh gần bằng đúng mức năm 1720 — 220 năm không hề có xu hướng ròng.</div>
      </div>
      <p>Kết quả thực nghiệm khớp chính xác với lý thuyết: <b>p′ (giá tương đối so với vàng)</b> biến động khá ÔN HÒA suốt 1790-2009 — nhất quán với giả thuyết nó được chi phối bởi các yếu tố cấu trúc thay đổi chậm (lương tương đối...), dù vẫn phản ánh những cú sốc lớn (Đại suy thoái 1870s, hai Thế chiến, Đại khủng hoảng 1930s, Đại trì trệ-lạm phát 1970s). Ngược lại, <b>giá tiền tệ của vàng (p<sub>vàng</sub>)</b> lại thể hiện những BƯỚC NGOẶT SẮC NÉT đúng vào các mốc chế độ tiền tệ thay đổi — hoàn toàn khác cách vận động của p′.</p>
      <div class="stat-row">
        <div class="stat-box"><div class="val">58×</div><div class="lbl">Mức giá Anh 2010 so với gốc trước chiến tranh 1939</div></div>
        <div class="stat-box"><div class="val">14×</div><div class="lbl">Mức giá Mỹ 2010 so với gốc trước chiến tranh 1940</div></div>
        <div class="stat-box"><div class="val">1934</div><div class="lbl">Năm giá vàng USD nhảy vọt sau khi Mỹ rời bản vị vàng (1933)</div></div>
      </div>
      <div class="figure-note"><b>Món quà bất ngờ của phương pháp này — một chỉ báo sóng dài đơn giản:</b> khi biểu diễn giá hàng hóa theo vàng (p′), khuôn mẫu "sóng dài" kiểu Kondratieff hiện rõ suốt TOÀN BỘ 220 năm — kể cả giai đoạn hậu chiến khi giá danh nghĩa (p) đã "nuốt chửng" mọi dao động sóng bằng xu hướng tăng liên tục. Các cuộc khủng hoảng kinh tế lớn luôn rơi đúng vào GIỮA pha đi xuống của sóng dài — và trên cơ sở này, khủng hoảng toàn cầu 2007-2008 đã đến "đúng lịch trình". Chủ đề này được khai triển đầy đủ ở chương 16.</div>
      <p>Đây chính là sợi dây nối liền chương 5 với "sóng vàng" đã giới thiệu ở chương 2 — không phải sự trùng hợp, mà là hệ quả TẤT YẾU của việc phân rã mức giá theo đúng logic lý thuyết cổ điển: một khi tách được phần "nhiễu tiền tệ" (do chế độ bản vị thay đổi) ra khỏi phần "tín hiệu cấu trúc" (giá tương đối thực), khuôn mẫu chu kỳ dài tiềm ẩn mới lộ diện rõ ràng.</p>

  {
    id:"giahiendai", n:"6", label:"Giá dưới Tiền Hiện đại",
    title:"Hướng tới Lý thuyết Giá dưới Tiền Hiện đại", eng:"IV. Toward a Classical Theory of the Price Level Under Modern Money",
    body:`
      <p class="lede">Ngay cả khi giá vàng bị "neo cứng" bởi chế độ tiền tệ (token chuyển đổi), CẠNH TRANH vẫn kỷ luật hóa mức giá chung — chỉ là quá trình điều chỉnh diễn ra qua một con đường gián tiếp hơn.</p>
      <h3>Thí nghiệm tư duy: vàng và sắt</h3>
      <p>Giả sử tỷ suất lợi nhuận trong ngành vàng và sắt ban đầu bằng nhau. Một cú sốc giá "chung" khiến giá sắt tăng — đẩy tỷ suất lợi nhuận ngành sắt lên, đồng thời (vì sắt là đầu vào của khai thác vàng) đẩy CHI PHÍ khai thác vàng lên, làm GIẢM tỷ suất lợi nhuận ngành vàng. Nhưng giá vàng bị neo cố định! Áp lực này chỉ có thể được giải tỏa qua việc CUNG vàng tăng — và khi cung vàng dư thừa tràn vào cầu hàng hóa thường (đại diện bởi sắt), giá sắt bị đẩy lên cao hơn nữa... cho tới khi tỷ suất lợi nhuận ở CẢ HAI ngành được (hỗn loạn) bình quân hóa trở lại.</p>
      <div class="figure-note"><b>Kết luận cốt lõi:</b> ngay cả khi giá vàng bị neo cố định về mặt danh nghĩa, chính CẠNH TRANH — không phải lượng cung tiền — mới là thứ kỷ luật hóa cấu trúc giá tương đối VÀ mức giá tuyệt đối cuối cùng. Thay đổi cung tiền có thể ảnh hưởng đến CON ĐƯỜNG điều chỉnh, nhưng không quyết định KẾT QUẢ cuối cùng — đây chính là điểm khác biệt cốt lõi giữa lý thuyết của Marx và mọi phiên bản của Lý thuyết Số lượng Tiền tệ.</div>
      <h3>Token không chuyển đổi: logic tương tự, chỉ khác điểm neo</h3>
      <p>Với token không chuyển đổi (vàng vẫn là phương tiện định giá gián tiếp), giá vàng có thể thả nổi. Nếu giá vàng tự nó tăng (đồng nghĩa hàm lượng vàng của mỗi đơn vị token giảm), giá tiền của mọi hàng hóa khác cũng tăng theo TỶ LỆ TƯƠNG ỨNG — nhưng giá TÍNH BẰNG VÀNG của chúng không đổi. Cơ chế nhân quả về căn bản GIỐNG hệt trường hợp token chuyển đổi.</p>
      <h3>Câu hỏi cháy bỏng cuối cùng: điều gì xảy ra khi KHÔNG còn hàng hóa-tiền nào cả?</h3>
      <div class="dark-panel">

});
document.getElementById('fcPrev').addEventListener('click', function(){
  fcIndex = (fcIndex-1+FLASHCARDS.length) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcShuffle').addEventListener('click', function(){
  for(var i=fcOrder.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = fcOrder[i]; fcOrder[i]=fcOrder[j]; fcOrder[j]=tmp;
  }
  fcIndex = 0;
  renderFlashcard();
});
renderFlashcard();

/* =========================================================
   QUIZ RENDER
   ========================================================= */
var quizArea = document.getElementById('quizArea');
var quizAnswers = {};

function renderQuiz(){
  var html = QUIZ.map(function(item, qi){
    var opts = item.opts.map(function(opt, vi){
      return '<div class="q-opt" data-qi="'+qi+'" data-qv="'+vi+'">'+opt+'</div>';
    }).join('');
    return '<div class="q-block" id="qblock-'+qi+'">'+
      '<div class="q-text">'+(qi+1)+'. '+item.q+'</div>'+
      '<div class="q-opts">'+opts+'</div>'+
      '<div class="q-explain" id="qexplain-'+qi+'">'+item.explain+'</div>'+
      '</div>';
  }).join('');
  html += '<div style="text-align:center;margin-top:20px;"><button class="btn primary" id="quizFinish">Xem kết quả</button> <button class="btn" id="quizReset">Làm lại</button></div>';
  html += '<div id="quizResult"></div>';
  quizArea.innerHTML = html;

  quizArea.addEventListener('click', quizClickHandler);
  document.getElementById('quizFinish').addEventListener('click', showQuizScore);
  document.getElementById('quizReset').addEventListener('click', function(){
    quizAnswers = {};
    renderQuiz();
  });
}

function quizClickHandler(e){
  var opt = e.target.closest('.q-opt');
  if(!opt) return;
  var qi = parseInt(opt.dataset.qi, 10);
  var qv = parseInt(opt.dataset.qv, 10);
  quizAnswers[qi] = qv;
  var block = document.getElementById('qblock-'+qi);
  block.querySelectorAll('.q-opt').forEach(function(o){
    o.classList.remove('selected','correct','incorrect');
  });
  var correctIdx = QUIZ[qi].correct;
  block.querySelectorAll('.q-opt').forEach(function(o){
    var v = parseInt(o.dataset.qv,10);
    if(v === correctIdx) o.classList.add('correct');
    else if(v === qv) o.classList.add('incorrect');
  });
  document.getElementById('qexplain-'+qi).classList.add('show');
  updateQuizProgress();
}

function updateQuizProgress(){
  var answered = Object.keys(quizAnswers).length;
  var pct = Math.round(100*answered/QUIZ.length);
  document.getElementById('quizProgressFill').style.width = pct+'%';
}

function showQuizScore(){
  var correct = 0;
  QUIZ.forEach(function(item, qi){
    if(quizAnswers[qi] === item.correct) correct++;
  });
  var pct = Math.round(100*correct/QUIZ.length);
  document.getElementById('quizResult').innerHTML =
    '<div class="quiz-score"><div class="num">'+correct+'/'+QUIZ.length+'</div>'+
    '<div class="lbl">('+pct+'%) — '+ (pct>=80?'Nắm rất vững nội dung!':pct>=50?'Khá tốt, xem lại vài phần.':'Nên đọc lại các phần liên quan.') +'</div></div>';
}
renderQuiz();

/* =========================================================
   NOTES PANEL
   ========================================================= */
var notesFab = document.getElementById('notesFab');
var notesPanel = document.getElementById('notesPanel');
var notesBackdrop = document.getElementById('notesBackdrop');
var notesBody = document.getElementById('notesBody');
var notesTitle = document.getElementById('notesTitle');
var notesFoot = document.getElementById('notesFoot');
var currentNoteTab = 'traodoi';
var LS_PREFIX = 'shaikh_ch5_note_';

function isMobile(){ return window.matchMedia('(max-width:640px)').matches; }

function noteLabelFor(id){
  var s = SECTIONS.filter(function(x){return x.id===id;})[0];
  if(s) return s.n + '. ' + s.label;
  if(id === 'gloss') return 'Thuật ngữ';
  if(id === 'flashcards') return 'Thẻ ghi nhớ';
  if(id === 'quiz') return 'Quiz';
  return id;
}

function openNotesFor(id){
  currentNoteTab = id;
  notesTitle.textContent = 'Ghi chú — ' + noteLabelFor(id);
  var saved = localStorage.getItem(LS_PREFIX + id) || '';
  notesBody.innerHTML = saved;
  updateNotesFoot();
}
function updateNotesFoot(){
  var len = notesBody.innerText.trim().length;
  notesFoot.textContent = len + ' ký tự · lưu tự động';
}
function saveCurrentNote(){
  localStorage.setItem(LS_PREFIX + currentNoteTab, notesBody.innerHTML);
  updateNotesFoot();
}
function openNotesPanel(){
  notesPanel.classList.add('open');
  if(isMobile()){ notesBackdrop.classList.add('show'); }
}
function closeNotesPanel(){
  notesPanel.classList.remove('open');
  notesBackdrop.classList.remove('show');
}
notesFab.addEventListener('click', function(){
  if(notesPanel.classList.contains('open')){
    closeNotesPanel();
  } else {
    openNotesFor(currentNoteTab);
    openNotesPanel();
  }
});
document.getElementById('notesClose').addEventListener('click', closeNotesPanel);
notesBackdrop.addEventListener('click', closeNotesPanel);
notesBody.addEventListener('input', saveCurrentNote);
document.querySelectorAll('.notes-toolbar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    var cmd = btn.dataset.cmd;
    notesBody.focus();
    if(cmd.indexOf(':')>-1){
      var parts = cmd.split(':');
      document.execCommand(parts[0], false, parts[1]);
    } else {
      document.execCommand(cmd, false, null);
    }
    saveCurrentNote();
  });
});

activateTab(ALL_TAB_IDS[0]);
</script>
