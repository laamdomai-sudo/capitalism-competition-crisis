<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<title>Shaikh — Capitalism: Competition, Conflict, Crises — Chương 1</title>
<style>
:root{
  --bg:#f2ede0;
  --panel:#fffdf8;
  --panel-2:#eef1e8;
  --ink:#211d16;
  --ink-soft:#4c473b;
  --muted:#847b68;
  --line:#dcd0ac;
  --primary:#1f3b5c;
  --primary-dark:#152944;
  --primary-tint:#e1e8ef;
  --gold:#a67f2c;
  --gold-light:#d6b263;
  --green:#2f6b3f;
  --green-tint:#e3ede4;
  --dark-bg:#141b22;
  --dark-panel:#1d2731;
  --dark-ink:#eef1e6;
  --dark-line:#324256;
  --shadow:0 6px 24px rgba(20,27,34,0.12);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1000px;margin:0 auto;padding:0 16px 80px;}

/* ===== Header ===== */
.hero{
  padding:32px 16px 20px;
  text-align:center;
  border-bottom:3px double var(--gold);
  margin-bottom:18px;
  background:radial-gradient(ellipse at top, rgba(166,127,44,0.08), transparent 60%);
}
.hero .kicker{
  font-family:Georgia,serif;
  letter-spacing:.2em;
  text-transform:uppercase;
  font-size:11px;
  color:var(--gold);
  font-weight:700;
}
.hero h1{
  font-size:clamp(22px,4.6vw,34px);
  margin:8px 0 4px;
  color:var(--primary-dark);
  letter-spacing:.005em;
  line-height:1.25;
}
.hero .subtitle{font-size:14.5px;color:var(--ink-soft);font-style:italic;}
.hero .meta{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.hero .meta span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);}
.hero .meta a.meta-link{color:var(--primary);text-decoration:none;font-weight:600;}
.hero .meta a.meta-link:hover{background:var(--primary-tint);}


/* ===== Tabs ===== */
.tabbar-wrap{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:8px;padding-bottom:10px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.tabbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;}
.tabbar::-webkit-scrollbar{height:5px;}
.tabbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.tab-btn{
  flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);
  font-family:inherit;font-size:12px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer;
  white-space:nowrap;transition:all .15s ease;
}
.tab-btn .n{color:var(--gold);font-weight:800;margin-right:5px;}
.tab-btn:hover{border-color:var(--gold);}
.tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--shadow);}
.tab-btn.active .n{color:var(--gold-light);}

/* ===== Panels ===== */
.panel{display:none;animation:fadein .25s ease;}
.panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);
}
.card h2{margin:0 0 4px;font-size:21px;color:var(--primary-dark);}
.card .eng-title{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:16px;letter-spacing:.02em;}
.card h3{font-size:15.5px;color:var(--primary);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px;}
.card p{margin:0 0 12px;color:var(--ink);}
.card p:last-child{margin-bottom:0;}
.lede{font-size:16px;color:var(--ink-soft);border-left:3px solid var(--gold);padding-left:14px;margin:6px 0 18px;}

.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0;}
.concept{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.concept .term{font-weight:700;color:var(--primary-dark);font-size:13px;display:block;margin-bottom:4px;}
.concept .term .en{color:var(--gold);font-weight:600;font-size:11px;font-style:italic;}
.concept p{font-size:13px;margin:0;color:var(--ink-soft);}

.figure-note{background:var(--primary-tint);border:1px dashed var(--primary);border-radius:10px;padding:12px 15px;font-size:12.5px;color:var(--primary-dark);margin:14px 0;}
.figure-note b{color:var(--primary-dark);}

blockquote.src{margin:14px 0;padding:10px 16px;border-left:3px solid var(--gold);background:var(--panel-2);font-size:13px;color:var(--ink-soft);font-style:italic;border-radius:0 8px 8px 0;}

.debate-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0;}
.debate-box .dh{background:var(--primary);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.03em;}
.debate-box .db{padding:13px 15px;font-size:13px;color:var(--ink-soft);}
.debate-box .names{color:var(--gold);font-weight:700;}

/* three-way comparison inline in debate box */
.tri-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px;}
@media(min-width:680px){.tri-grid{grid-template-columns:1fr 1fr 1fr;}}
.tri-col{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);}
.tri-col h5{margin:0 0 6px;font-size:12px;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.04em;}
.tri-col p{font-size:12.5px;margin:0;color:var(--ink-soft);}

/* dark diagram panel */
.dark-panel{background:var(--dark-bg);color:var(--dark-ink);border-radius:12px;padding:20px;margin:16px 0;border:1px solid var(--dark-line);}
.dark-panel h4{margin:0 0 12px;color:var(--gold-light);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;}
.flow{display:flex;flex-direction:column;gap:0;}
.flow-step{background:var(--dark-panel);border:1px solid var(--dark-line);border-radius:8px;padding:10px 14px;font-size:12.5px;position:relative;}
.flow-step b{color:var(--gold-light);}
.flow-arrow{text-align:center;color:var(--gold);font-size:16px;padding:2px 0;}
.flow-branch{display:flex;gap:10px;margin:2px 0;flex-wrap:wrap;}
.flow-branch>div{flex:1;min-width:140px;}

.ring-chart{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.ring-row{display:flex;align-items:center;gap:10px;}
.ring-label{width:170px;font-size:11.5px;color:var(--dark-ink);flex-shrink:0;}
.ring-track{flex:1;background:#2a3644;border-radius:6px;overflow:hidden;height:18px;}
.ring-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:10px;color:#241d10;font-weight:700;}

/* ===== Book map / accordion ===== */
.part-intro{font-size:13.5px;color:var(--ink-soft);margin-bottom:16px;}
.chap-card{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);}
.chap-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;}
.chap-num{
  flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
}
.chap-titles{flex:1;min-width:0;}
.chap-titles .vt{font-weight:700;color:var(--primary-dark);font-size:14.5px;}
.chap-titles .et{font-size:11px;color:var(--muted);font-style:italic;}
.chap-toggle{flex-shrink:0;color:var(--gold);font-size:20px;transition:transform .2s;}
.chap-card.open .chap-toggle{transform:rotate(45deg);}
.chap-body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 16px;}
.chap-card.open .chap-body{padding:0 16px 16px;}
.chap-body p{font-size:13.5px;color:var(--ink);margin:0 0 10px;}
.chap-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11px;color:var(--ink-soft);}
.part-actions{display:flex;gap:8px;margin-bottom:14px;}

/* ===== Glossary ===== */
.gloss-item{border-bottom:1px solid var(--line);padding:12px 0;}
.gloss-item:last-child{border-bottom:none;}
.gloss-term{font-weight:700;color:var(--primary-dark);font-size:14px;}
.gloss-term .en{color:var(--gold);font-weight:600;font-size:11.5px;font-style:italic;margin-left:6px;}
.gloss-def{font-size:13px;color:var(--ink-soft);margin-top:3px;}

.gloss-extra-row{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.gloss-extra-row .en{flex:1;color:var(--ink-soft);font-style:italic;}
.gloss-extra-row .vi{flex:1;color:var(--primary-dark);font-weight:600;}


/* ===== Real/reference chart (photo, not illustrative SVG) ===== */
.chart-real{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:10px 0 18px;}
.chart-real-badge{display:inline-block;font-family:Georgia,serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);border-radius:4px;padding:3px 9px;margin-bottom:9px;}
.chart-real img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);}
.chart-real figcaption{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.55;font-style:italic;}


/* ===== Comparison table ===== */
.cmp-wrap{overflow-x:auto;margin:10px 0;}
table.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px;}
table.cmp th, table.cmp td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;}
table.cmp th{background:var(--primary);color:#fff;font-size:12px;position:sticky;top:0;}
table.cmp td.dim{font-weight:700;color:var(--primary-dark);background:var(--panel-2);width:150px;}
table.cmp tr:nth-child(even) td:not(.dim){background:var(--panel-2);}

/* ===== Flashcards ===== */
.fc-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.fc-progress{font-size:13px;color:var(--muted);}
.fc-stage{display:flex;justify-content:center;margin:10px 0 20px;perspective:1400px;}
.flashcard{width:100%;max-width:560px;height:270px;position:relative;cursor:pointer;}
.flashcard .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flashcard.flipped .fc-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);}
.fc-front{background:var(--panel);}
.fc-front .fc-tag{position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;font-weight:700;}
.fc-front .fc-q{font-size:17px;color:var(--ink);font-weight:600;}
.fc-back{background:var(--primary);color:#fff;transform:rotateY(180deg);}
.fc-back .fc-a{font-size:14px;}
.fc-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;}
.fc-nav{display:flex;justify-content:center;gap:10px;margin-top:16px;}
.btn{border:1px solid var(--primary);background:var(--panel);color:var(--primary-dark);font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--primary);color:#fff;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-dark);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.small{font-size:11.5px;padding:6px 12px;}

/* ===== Quiz ===== */
.quiz-progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--primary));transition:width .3s;}
.q-block{margin-bottom:14px;}
.q-text{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;}
.q-opts{display:flex;flex-direction:column;gap:8px;}
.q-opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer;transition:all .15s;}
.q-opt:hover{border-color:var(--gold);}
.q-opt.selected{border-color:var(--primary);background:var(--primary-tint);}
.q-opt.correct{border-color:var(--green);background:var(--green-tint);color:#1c4a28;font-weight:700;}
.q-opt.incorrect{border-color:var(--primary);background:#f3e6e6;color:#7a2020;font-weight:700;}
.q-explain{margin-top:10px;font-size:12.5px;color:var(--ink-soft);background:var(--panel-2);border-left:3px solid var(--gold);padding:9px 13px;border-radius:0 8px 8px 0;display:none;}
.q-explain.show{display:block;}
.quiz-score{text-align:center;padding:30px 20px;}
.quiz-score .num{font-size:46px;font-weight:800;color:var(--primary);}
.quiz-score .lbl{font-size:14px;color:var(--muted);margin-bottom:18px;}

/* ===== Notes panel ===== */
.notes-fab{position:fixed;right:22px;bottom:22px;z-index:50;background:var(--primary);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-family:inherit;font-weight:700;font-size:13px;box-shadow:0 8px 20px rgba(21,41,68,0.35);cursor:pointer;display:flex;align-items:center;gap:7px;}
.notes-backdrop{position:fixed;inset:0;background:rgba(15,18,22,0.45);z-index:60;display:none;}
.notes-backdrop.show{display:block;}
.notes-panel{position:fixed;top:0;right:0;height:100%;width:380px;max-width:88vw;background:var(--panel);z-index:70;box-shadow:-10px 0 30px rgba(0,0,0,0.2);transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;}
.notes-panel.open{transform:translateX(0);}
.notes-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.notes-head h4{margin:0;color:var(--primary-dark);font-size:14.5px;}
.notes-head .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.notes-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px;}
.notes-toolbar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.notes-toolbar button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;width:30px;height:30px;cursor:pointer;font-family:Georgia,serif;font-size:14px;color:var(--ink);}
.notes-toolbar button:hover{border-color:var(--gold);}
.notes-body{flex:1;padding:16px 18px;overflow-y:auto;outline:none;font-size:14px;line-height:1.7;}
.notes-body:empty:before{content:"Ghi chú của bạn cho phần này... (tự động lưu)";color:var(--muted);font-style:italic;}
.notes-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);}

@media (max-width:640px){
  .hero{padding:22px 12px 14px;}
  .card{padding:16px 15px;}
  .flashcard{height:250px;}
  .notes-panel{width:100%;max-width:100%;}
  table.cmp{min-width:560px;}
}
@media print{
  .tabbar-wrap,.notes-fab,.notes-panel,.notes-backdrop,.fc-nav,.q-opts,.part-actions{display:none !important;}
  .panel{display:block !important;}
  .chap-body{max-height:none !important;padding:0 16px 16px !important;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
}
</style>
</head>
<body>
<div class="app">

  <div class="hero">
    <div class="kicker">Anwar Shaikh · Đọc sách có hệ thống</div>
    <h1>Capitalism: Competition, Conflict, Crises</h1>
    <div class="subtitle">Chương 1 — Introduction (Oxford University Press, 2016)</div>
    <div class="meta">
      <span>2 phần lớn</span>
      <span>Bản đồ 17 chương</span>
      <span>~53 trang gốc</span>
    <a class="meta-link" href="tomtat-1.html" target="_blank" rel="noopener">📄 Ghi chú gốc (docx)</a>
    </div>
  </div>

  <div class="tabbar-wrap">
    <div class="tabbar" id="tabbar"></div>
  </div>

  <div id="panels"></div>

</div>

<button class="notes-fab" id="notesFab">📝 Ghi chú</button>
<div class="notes-backdrop" id="notesBackdrop"></div>
<div class="notes-panel" id="notesPanel">
  <div class="notes-head">
    <div>
      <h4 id="notesTitle">Ghi chú</h4>
      <div class="sub" id="notesSub">Tự động lưu vào trình duyệt</div>
    </div>
    <button class="notes-close" id="notesClose">&times;</button>
  </div>
  <div class="notes-toolbar">
    <button data-cmd="bold" title="Đậm"><b>B</b></button>
    <button data-cmd="italic" title="Nghiêng"><i>I</i></button>
    <button data-cmd="underline" title="Gạch chân"><u>U</u></button>
    <button data-cmd="insertUnorderedList" title="Danh sách">≡</button>
    <button data-cmd="formatBlock:&lt;h4&gt;" title="Tiêu đề">H</button>
    <button data-cmd="removeFormat" title="Xóa định dạng">⨯</button>
  </div>
  <div class="notes-body" contenteditable="true" id="notesBody"></div>
  <div class="notes-foot" id="notesFoot">0 ký tự</div>
</div>

<script>
/* =========================================================
   DATA — SECTIONS (tab 0-1)
   ========================================================= */
var SECTIONS = [
  {
    id:"boicanh",
    n:"0",
    label:"Bối cảnh",
    title:"Trật tự và Hỗn loạn — hai câu trả lời cũ",
    eng:"Order and disorder — the neoclassical and Keynesian responses",
    body:`
      <p class="lede">Chương mở đầu của Shaikh xuất phát từ một nghịch lý mà bất kỳ ai quan sát chủ nghĩa tư bản cũng nhận ra: nhìn từ xa, hệ thống có vẻ trật tự — tăng trưởng bền bỉ, năng suất và mức sống không ngừng đi lên. Nhưng nhìn gần, mọi thứ lại hỗn loạn — thông tin sai lệch, thất nghiệp, khủng hoảng, bất bình đẳng giữa các vùng và các thời kỳ.</p>
      <p>Câu hỏi trung tâm mở đầu toàn bộ cuốn sách: <b>làm sao xử lý hai khía cạnh, đều có thật như nhau, này?</b> Shaikh cho rằng có hai câu trả lời thống trị nền kinh tế học hiện đại, và cả hai — theo ông — đều sai theo cùng một kiểu.</p>
      <h3>Câu trả lời tân cổ điển</h3>
      <p>Kinh tế học tân cổ điển (chính thống hiện nay) nắm lấy khía cạnh trật tự và đẩy khía cạnh hỗn loạn ra ngoại vi lý thuyết. Trật tự được tái hiện thành tính tối ưu tuyệt đối của thị trường — "bàn tay vô hình" luôn đúng — chiếu ngược lại thành các "tác nhân đại diện" siêu duy lý. Trong hình thức lý tưởng này, hệ thống cân bằng mọi mức giá, mọi mức lương, mọi tỷ suất lợi nhuận, sử dụng đầy đủ mọi nguồn lực — không sai sót, không bất ổn, không khủng hoảng. Chỉ sau khi điều này được xác lập làm khuôn mẫu thống trị, sự hỗn loạn mới được cho phép len vào — như một nhượng bộ miễn cưỡng trước cái thực tại "đáng tiếc là không hoàn hảo".</p>
      <h3>Câu trả lời Keynesian / hậu-Keynesian</h3>
      <p>Kinh tế học dị giáo (heterodox), đặc biệt là trường phái hậu-Keynesian, đi theo hướng ngược lại: nhấn mạnh sự kém hiệu quả, bất bình đẳng, mất cân bằng do chính hệ thống sinh ra. Cạnh tranh hoàn hảo được thay bằng cạnh tranh không hoàn hảo; đầy đủ việc làm tự động được thay bằng thất nghiệp dai dẳng. Kết quả thị trường giờ đây phụ thuộc vào lịch sử, văn hóa, chính trị, may rủi, và trên hết là <b>quyền lực</b> — quyền lực độc quyền, quyền lực giai cấp, quyền lực nhà nước. Vì vậy luôn cần có sự can thiệp kinh tế-xã hội để lấp khoảng trống giữa cái thực tế và cái mong muốn.</p>
      <div class="debate-box">
        <div class="dh">ĐIỀU TRỚ TRÊU: CẢ HAI ĐỀU LÀ "THUYẾT KHÔNG HOÀN HẢO"</div>
        <div class="db">Tân cổ điển xuất phát từ nền tảng hoàn hảo rồi thêm "sự không hoàn hảo" như những điều chỉnh vá víu. Kinh tế học dị giáo chấp nhận tầm nhìn hoàn hảo ấy là phù hợp với một giai đoạn CNTB trước đây, nhưng cho rằng ngày nay "sự không hoàn hảo" mới là cái ngự trị. Trong cả hai trường hợp, cách tiếp cận này vẫn bảo vệ và duy trì chính nền tảng lý thuyết ban đầu — vốn vẫn là điểm xuất phát và điểm quy chiếu bắt buộc cho một danh sách ngày càng dài các "độ lệch so với thực tế". Suy cho cùng, làm sao lý thuyết gốc có thể sai được, nếu luôn có một cái cớ riêng cho mỗi kết quả rắc rối?</div>
      </div>
      <p>Cuốn sách này — Shaikh tuyên bố ngay từ đầu — đi theo một con đường khác hẳn.</p>

  {
    id:"cachtiepcan",
    n:"1",
    label:"Cách tiếp cận của Shaikh",
    title:"Lý thuyết về cái Thực — điều tiết hỗn loạn",
    eng:"The real, not the perfect or the imperfect — turbulent regulation",
    body:`
      <p class="lede">Shaikh nêu bốn điểm khác biệt cốt lõi của cuốn sách so với cả hai truyền thống trên, rồi phát triển khái niệm trung tâm xuyên suốt toàn bộ tác phẩm: <b>điều tiết hỗn loạn</b> (turbulent regulation).</p>
      <h3>Bốn điểm khác biệt</h3>
      <div class="concept-grid">
        <div class="concept"><span class="term">1. Đối tượng nghiên cứu khác</span><p>Tân cổ điển nghiên cứu một CNTB lý tưởng hóa; kinh tế học dị giáo đo khoảng cách giữa lý tưởng đó và thực tế. Cả hai chân đều "off-balance" — một chân trong cái lý tưởng, một chân trong cái thực. Đối tượng của Shaikh không phải cái hoàn hảo, cũng không phải cái không hoàn hảo, mà là <b>cái thực</b> (the real) — luôn đối chiếu với bằng chứng thực nghiệm.</p></div>
        <div class="concept"><span class="term">2. Trật tự là "giới hạn di động"</span><p>Các khuôn mẫu trật tự mà CNTB tạo ra không phải "đường ray thép" cố định, cũng không phải thuần túy ngẫu nhiên — mà là những giới hạn di động, có độ dốc (gradient) xác định cái gì dễ/khó tại mỗi thời điểm, bắt nguồn từ động cơ trục lợi (gain-seeking) — cấu trúc mang tính thứ bậc sâu sắc, trong đó động cơ lợi nhuận mạnh hơn hẳn các lực khác.</p></div>
        <div class="concept"><span class="term">3. Trật tự sinh ra QUA hỗn loạn</span><p>Trật tự hệ thống được tạo ra trong-và-qua hỗn loạn liên tục — hỗn loạn chính là cơ chế nội tại của trật tự. Tách rời hai điều này, hay chỉ nhấn một bên, là đánh mất sự thống nhất nội tại vốn tạo nên các khuôn mẫu sâu của hệ thống.</p></div>
        <div class="concept"><span class="term">4. Cần cơ chế cụ thể</span><p>Mục tiêu trung tâm của cuốn sách: chứng minh một tập hợp nhỏ các nguyên lý vận hành có thể giải thích một phạm vi rất rộng hiện tượng, khiến kết quả thực tế "hấp dẫn" (gravitate) quanh những trung tâm hấp dẫn luôn di động — đây chính là <b>điều tiết hỗn loạn</b>.</p></div>
      </div>
      <h3>Hai tập hợp xu hướng hấp dẫn (gravitational tendencies)</h3>
      <p>Điều tiết hỗn loạn và "sự tái xuất hiện khuôn mẫu" (pattern recurrence) áp dụng cho hai nhóm hiện tượng lớn xuyên suốt cuốn sách:</p>
      <div class="dark-panel">
        <h4>Sơ đồ hai tầng điều tiết hỗn loạn</h4>
        <div class="flow">
          <div class="flow-step"><b>Nhóm 1 — Giá cả tương đối &amp; tỷ suất</b>: giá hàng hóa, tỷ suất lợi nhuận, tiền lương, lãi suất, giá cổ phiếu, tỷ giá hối đoái</div>
          <div class="flow-arrow">↓ hai khía cạnh song song</div>
          <div class="flow-branch">
            <div class="flow-step">Xu hướng <b>bình quân hóa</b>: cuộc tìm kiếm lợi thế tiền tệ không ngừng nghỉ, hệ quả ngoài ý muốn là thu hẹp chính những chênh lệch đã tạo ra động cơ đó</div>
            <div class="flow-step">Xu hướng <b>định hình</b>: quyết định con đường mà các xu hướng bình quân hóa xoay quanh (ví dụ: lương/lợi nhuận bình quân phụ thuộc năng suất, quyền lực, cường độ vốn)</div>
          </div>
          <div class="flow-arrow">↓</div>
          <div class="flow-step"><b>Nhóm 2 — Vĩ mô hỗn loạn</b>: quá trình bành trướng đặc trưng, sóng tăng trưởng và suy giảm, thất nghiệp dai dẳng, các đợt suy thoái định kỳ kể cả khủng hoảng toàn cầu 2007</div>
          <div class="flow-arrow">↓</div>
          <div class="flow-step">Cả hai nhóm đều được điều tiết bởi <b>động cơ lợi nhuận</b> — nhân tố chi phối đầu tư, tăng trưởng, việc làm, chu kỳ kinh doanh, và cả lạm phát</div>
        </div>
      </div>
      <h3>Vì sao động cơ lợi nhuận là trung tâm</h3>
      <p>Tính trung tâm của động cơ lợi nhuận kéo theo nhiều hệ quả: (1) lý thuyết lợi nhuận và lương trở nên đặc biệt quan trọng; (2) khả năng sinh lời chi phối hành vi hãng trong lý thuyết cạnh tranh thực, kể cả định giá cạnh tranh và thay đổi kỹ thuật (nội sinh); (3) khả năng sinh lời kỳ vọng điều tiết CẢ đầu tư lẫn tăng trưởng — hàm ý một kiểu tương tác cung-cầu không phải tân cổ điển, không phải Keynesian, không phải Kaleckian hay Harrodian, mà thuần túy <b>cổ điển</b>: lợi nhuận điều tiết cả cung lẫn cầu. Sức mua mới tạo ra (Keynes đúng) có thể đẩy sản lượng/việc làm lên, nhưng đồng thời có thể làm GIẢM tốc độ tăng trưởng — sản lượng ngắn hạn cao hơn nhưng sản lượng dài hạn lại thấp hơn.</p>
      <div class="figure-note"><b>"Dữ liệu không bao giờ ngây thơ":</b> Shaikh nhấn mạnh lý thuyết luôn can thiệp vào cách dữ liệu được biểu diễn, không chỉ cách diễn giải — ví dụ định nghĩa "có việc làm" chính thức (chỉ cần làm việc 1 giờ có lương/tuần) che giấu bức tranh thực về thất nghiệp một phần và người lao động nản chí.</div>
      <h3>Gốc rễ trí tuệ</h3>
      <p>Nguyên lý điều tiết hỗn loạn bắt nguồn từ phương pháp của Smith, Ricardo và đặc biệt là Marx — với ông, "quy luật vận động" là các nguyên lý điều tiết tự thể hiện qua nhiều xu hướng đối trọng khác nhau. Việc nhấn mạnh tăng trưởng như một quá trình nội tại cũng bắt nguồn từ truyền thống cổ điển/Marxian cũng như từ Harrod và Robinson. Khái niệm thất nghiệp dai dẳng truy về lý thuyết "đội quân dự bị lao động" của Marx, câu đố Harrod về tỷ lệ tăng trưởng đảm bảo (warranted) và tự nhiên (natural), và tổng hợp toán học xuất sắc của Goodwin dưới dạng chu kỳ mồi-thú (predator-prey).</p>

        p:["Định nghĩa tư bản không qua tính chất vật lý mà qua QUÁ TRÌNH nó vận hành: chu kỳ M–C–M′ (tiền → hàng hóa → nhiều tiền hơn) khác hẳn chu kỳ C–M–C (bán sức lao động để sống) của người làm công. Một chiếc xe có thể là của cải cá nhân với người này nhưng là tư bản với đại lý xe đang chờ bán.",
          "Theo James Steuart, có HAI nguồn lợi nhuận tổng: chuyển giao của cải ('mua rẻ bán đắt' — nền tảng của tư bản thương nghiệp) và sản xuất của cải mới dưới dạng sản phẩm thặng dư (nền tảng của tư bản công nghiệp). Lợi nhuận công nghiệp dương chỉ khi độ dài ngày làm việc vượt quá thời gian tái sản xuất mức sống công nhân — tức khi có lao động thặng dư; đây là kết quả XÃ HỘI, không phải thuần túy 'kỹ thuật'.",
          "'Vấn đề chuyển hóa' hóa ra tồn tại trong MỌI trường phái giá cả — tân cổ điển, Sraffa lẫn Marx — không chỉ riêng Marx như thường bị phê phán. Bằng chứng thực nghiệm: tỷ suất lợi nhuận tối đa doanh nghiệp giảm đều từ 1947; tỷ trọng lợi nhuận hoạt động ròng khá ổn định, giảm nhẹ thời 'kỷ nguyên vàng' của lao động (1947-1982) rồi tăng nhẹ khi các chính sách tân tự do xói mòn tỷ trọng lương."],
        chips:["M-C-M′ vs C-M-C","lợi nhuận từ chuyển giao vs sản xuất","vấn đề chuyển hóa (mọi trường phái)","tỷ suất lợi nhuận tối đa giảm dần"]}
    ]
  },
  {
    id:"phan2", n:"3", label:"Phần II", tabTitle:"Bản đồ — Phần II: Cạnh tranh Thực",
    tabEng:"Part II: Real Competition (chapters 7–11)",
    intro:"Năm chương xây dựng lý thuyết cạnh tranh thực — nền tảng lý thuyết trung tâm của toàn cuốn sách — rồi áp dụng vào giá tương đối, tài chính, và thương mại quốc tế.",
    chapters:[
      {num:7, vt:"Lý thuyết Cạnh tranh Thực", en:"Theory of Real Competition",
        p:["Trình bày nền tảng lý thuyết trung tâm của toàn cuốn sách. Động cơ lợi nhuận vốn có tính bành trướng: nhà đầu tư cố thu hồi nhiều tiền hơn số bỏ ra, và nếu thành công, lặp lại ở quy mô lớn hơn — va chạm với những người khác đang làm điều tương tự. Đây là cạnh tranh thực, mang tính đối kháng và hỗn loạn trong vận hành — khác cạnh tranh 'hoàn hảo' như <b>chiến tranh khác với ba-lê</b>.",
          "Cạnh tranh trong ngành buộc người sản xuất đặt giá đủ thấp để tồn tại, đồng thời cắt giảm chi phí (lương, độ dài/cường độ lao động, và trên hết là thay đổi kỹ thuật) để có thể cắt giá cạnh tranh. Giá của các người bán trong cùng ngành được bình quân hóa qua sự di động của khách hàng; tỷ suất lợi nhuận đầu tư mới giữa các ngành được bình quân hóa qua sự di động của tư bản — cả hai là THUỘC TÍNH NỔI LÊN, không ai chủ đích tạo ra.",
          "Khái niệm 'tư bản điều tiết' (regulating capital — hãng có chi phí thấp nhất định giá dẫn dắt ngành) là trung tâm. Bằng chứng thực nghiệm đồ sộ (OERG, Andrews, Geroski, Salter, Mueller, Tsoulfidis...) cho thấy: tỷ suất lợi nhuận TRUNG BÌNH vẫn phân tán giữa các ngành, nhưng tỷ suất lợi nhuận GIA TĂNG (trên đầu tư mới) bình quân hóa rất mạnh — đúng như giả thuyết cổ điển dự đoán, trái với cả tân cổ điển lẫn lý thuyết độc quyền."],
        chips:["cạnh tranh = chiến tranh, không phải ba-lê","tư bản điều tiết","tỷ suất lợi nhuận gia tăng bình quân hóa","chọn kỹ thuật theo chi phí thấp nhất"]},
      {num:8, vt:"Các Lý thuyết Cạnh tranh khác & Bằng chứng", en:"Alternative Theories of Competition; Empirical Evidence",
        p:["Khảo sát toàn bộ phổ lý thuyết cạnh tranh: Smith/Ricardo/Marx (cổ điển — giá thị trường hấp dẫn quanh giá tự nhiên một cách 'vô chính phủ'), chuyển dịch hậu-cổ-điển sang cạnh tranh hoàn hảo (Jevons, Walras), phê phán Schumpeter và trường phái Áo, lý thuyết độc quyền/độc quyền nhóm (Hilferding, Lenin, Sweezy, Baran, Kalecki), và kinh tế học cổ điển hiện đại.",
          "Phê phán then chốt: lý thuyết cạnh tranh hoàn hảo BẤT NHẤT NỘI TẠI vì đòi hỏi kỳ vọng phi lý — nếu mọi hãng giống hệt nhau, bất kỳ tín hiệu nào khiến một hãng tăng sản lượng cũng khiến TẤT CẢ làm vậy, khiến giá sụp đổ; vậy mà lý thuyết vẫn giả định mỗi hãng riêng lẻ tin có thể bán bất kỳ số lượng nào ở mức giá cho trước. Điều này có nghĩa lý thuyết kỳ vọng duy lý KHÔNG THỂ đặt nền trên cạnh tranh hoàn hảo.",
          "Phần bằng chứng thực nghiệm bác bỏ giả thuyết 'cấu trúc-hiệu suất' (structure-performance): tỷ lệ tập trung ngành KHÔNG tương quan với tỷ suất lợi nhuận cao hơn; độ cứng giá KHÔNG tương quan với mức độ tập trung — bác bỏ cả lý thuyết độc quyền lẫn cạnh tranh hoàn hảo bằng cùng một bộ dữ liệu."],
        chips:["bất nhất nội tại của cạnh tranh hoàn hảo","cấu trúc-hiệu suất (bác bỏ)","độ cứng giá","Kalecki & markup độc quyền"]},
      {num:9, vt:"Cạnh tranh và Giá Tương đối Liên ngành", en:"Competition and Inter-Industrial Relative Prices",
        p:["Trình bày lý thuyết cổ điển về giá cả sản xuất — sinh ra từ ba quá trình bình quân hóa hỗn loạn: giá bán giữa người bán, thu nhập lao động giữa người lao động, tỷ suất lợi nhuận giữa các tư bản điều tiết. Giới thiệu khái niệm 'thời gian lao động tích hợp' (integrated labour time): lao động cần để sản xuất một hàng hóa CỘNG lao động cần cho mọi đầu vào của nó, và đầu vào của đầu vào...",
          "Kết quả thực nghiệm gây bất ngờ: khoảng cách giữa giá thị trường, giá trực tiếp (tỷ lệ với thời gian lao động tích hợp — tức giá trị lao động của Marx) và giá cả sản xuất chỉ vào khoảng 13-15% — RẤT NHỎ. Đường lương-lợi nhuận thực nghiệm gần như tuyến tính, ủng hộ mạnh mẽ lý thuyết giá cổ điển và dung hòa được cách đọc của Marx với Sraffa.",
          "Kết luận gây tranh cãi nhưng dựa trên dữ liệu: sự khác biệt giữa các dạng giá (thị trường/giá trị lao động/giá sản xuất) đủ nhỏ để 'triệt tiêu' ở cấp độ tổng — các tỷ lệ tổng về cơ bản giống nhau dù dùng dạng giá nào, đúng như chính Sraffa từng ghi nhận."],
        chips:["giá cả sản xuất","thời gian lao động tích hợp","khoảng cách giá chỉ ~13-15%","đường lương-lợi nhuận gần tuyến tính"]},
      {num:10, vt:"Lý thuyết Tài chính", en:"Theory of Finance",
        p:["Mở rộng lập luận cổ điển sang tài chính: lãi suất là 'giá cung ứng tài chính', và cạnh tranh khiến tỷ suất lợi nhuận của các tư bản tài chính điều tiết hấp dẫn quanh tỷ suất lợi nhuận chung — y hệt bất kỳ giá cạnh tranh nào khác. Đầu tư được thúc đẩy bởi CHÊNH LỆCH giữa tỷ suất lợi nhuận và lãi suất (cả Marx và Keynes đều nhấn mạnh điều này).",
          "Cách tiếp cận này giải thích trực tiếp 'nghịch lý Gibson' (lãi suất danh nghĩa và mức giá tương quan DƯƠNG — trái ngược giả thuyết Fisher), và hóa giải một mâu thuẫn biểu kiến trong lập luận của Marx (ông phản đối 'lãi suất tự nhiên' nhưng vẫn nói tư bản tài chính phải tham gia bình quân hóa tỷ suất lợi nhuận — cả hai đều đúng).",
          "Giải thích 'câu đố phần bù vốn cổ phần' (equity premium puzzle): tỷ suất sinh lời trái phiếu thấp hơn cổ phiếu vì tỷ suất trái phiếu ngang lãi suất ngân hàng (thấp hơn tỷ suất lợi nhuận chung), còn tỷ suất cổ phiếu ngang tỷ suất lợi nhuận. Phê phán Giả thuyết Thị trường Hiệu quả (EMH) của Shiller: 'biến động thái quá' mà Shiller cáo buộc chỉ là ảo giác vì ông lấy một tỷ suất SINH LỜI KỲ VỌNG CỐ ĐỊNH làm chuẩn so sánh — trong khi tỷ suất lợi nhuận gia tăng thực tế vốn biến động mạnh và bám sát tỷ suất cổ phiếu."],
        chips:["nghịch lý Gibson","câu đố phần bù cổ phần","phê phán EMH (Shiller)","đường cong lợi suất dốc lên"]},
      {num:11, vt:"Cạnh tranh Quốc tế", en:"International Trade and Competition",
        p:["Khép lại Phần II bằng ứng dụng lý thuyết cạnh tranh thực vào thương mại quốc tế. Lý thuyết lợi thế so sánh của Ricardo được chứng minh là KHÔNG đứng vững trong bối cảnh cạnh tranh thực: chi phí tương đối có thể không phản ứng đủ với thay đổi tỷ giá thực để lật đổ lợi thế chi phí tuyệt đối ban đầu — hãng có chi phí thấp hơn tuyệt đối có thể thống trị CẢ HAI ngành mãi mãi.",
          "Thay bằng lý thuyết lợi thế TUYỆT ĐỐI: tư bản điều tiết quốc tế trong mỗi ngành là hãng có chi phí lao động đơn vị thực tích hợp thấp nhất. Marx và Harrod đều chỉ ra điểm yếu chí mạng trong logic Ricardo: ông đánh đồng cán cân thương mại với cán cân thanh toán, coi dòng vốn tài chính hoàn toàn tách biệt khỏi dòng thương mại hàng hóa — điều phi lịch sử và phi lý thuyết.",
          "Tỷ giá thực gắn với chi phí lao động đơn vị tương đối tích hợp và tỷ lệ hàng ngoại thương/phi ngoại thương — KHÔNG tự động điều chỉnh để cân bằng thương mại như lý thuyết Ngang giá Sức mua (PPP) giả định. Bằng chứng 15 nước lớn giai đoạn 1960-2009 cho thấy PPP không hề đứng vững, trong khi thâm hụt/thặng dư thương mại kéo dài lại là CHUẨN MỰC, không phải ngoại lệ."],
        chips:["lợi thế tuyệt đối vs so sánh","PPP (bác bỏ)","cán cân thương mại ≠ cán cân thanh toán","chi phí lao động đơn vị thực"]}
    ]

  {
    id:"phan3", n:"4", label:"Phần III", tabTitle:"Bản đồ — Phần III: Vĩ mô Hỗn loạn",
    tabEng:"Part III: Turbulent Macro-Dynamics (chapters 12–17)",
    intro:"Sáu chương cuối tổng hợp cạnh tranh thực với lý thuyết cầu hiệu quả, xây dựng lý thuyết cổ điển về thất nghiệp, lạm phát, và khủng hoảng — rồi khép lại bằng chương tổng kết bàn về bất bình đẳng và ý nghĩa cho phát triển toàn cầu.",
    chapters:[
      {num:12, vt:"Sự trỗi dậy của Kinh tế học Vĩ mô Hiện đại", en:"The Rise of Modern Macroeconomics",
        p:["Theo dõi hành trình từ cuộc đoạn tuyệt của Keynes với chính thống đương thời cho tới sự 'thu hồi' của kinh tế học tân-Walrasian. Keynes nhắm vào hai tuyên bố tân cổ điển: lương thực tế sẽ tự điều chỉnh để khôi phục đầy đủ việc làm; lãi suất thực sẽ tự động tạo đủ cầu. Ông thay bằng lý thuyết ưa thích thanh khoản và số nhân đầu tư.",
          "Lập luận của Keynes nhanh chóng bị 'nhốt' trong khung IS-LM tĩnh của Hicks — loại bỏ tỷ suất lợi nhuận kỳ vọng biến động, biến đầu tư thành hàm thụ động của lãi suất. Từ đây, Monetarism (Friedman) → New Classical (Lucas, kỳ vọng duy lý) → Lý thuyết Chu kỳ Kinh doanh Thực (RBCT) → New Keynesian nối tiếp nhau sụp đổ trước bằng chứng thực nghiệm, đặc biệt khi đường cong Phillips tan rã thập niên 1970 (lạm phát VÀ thất nghiệp cùng tăng).",
          "Phần cuối phân tích truyền thống 'không hoàn hảo' (Kalecki, hậu-Keynesian: Davidson, Godley-Taylor, Lavoie) — với 5 niềm tin chung: cầu dẫn dắt sản lượng, tiền nội sinh, dư thừa công suất/thất nghiệp là chuẩn mực, nhà nước có thể đạt đầy đủ việc làm. Shaikh chỉ ra các giả định thiếu nhất quán dòng-chảy-tồn-lượng (stock-flow) trong truyền thống này."],
        chips:["IS-LM (Hicks)","kỳ vọng duy lý (Lucas)","đường cong Phillips sụp đổ","5 niềm tin hậu-Keynesian"]},
      {num:13, vt:"Động lực học Vĩ mô Cổ điển", en:"Classical Macro-Dynamics",
        p:["Xây dựng cách tiếp cận cổ điển cho kinh tế vĩ mô hiện đại, đặt nền trên cạnh tranh thực. Ý tưởng trung tâm: tốc độ tích lũy tư bản được thúc đẩy bởi tỷ suất lợi nhuận RÒNG kỳ vọng (= tỷ suất lợi nhuận kỳ vọng trừ lãi suất) — giống Keynes và Kalecki, nhưng khác ở chỗ tỷ suất kỳ vọng gắn chặt với tỷ suất THỰC TẾ theo kiểu 'phản thân' (reflexivity) của Soros.",
          "Phát hiện mấu chốt: giả định chuẩn rằng tỷ lệ tiết kiệm ĐỘC LẬP với đầu tư là KHÔNG nhất quán về dòng-chảy-tồn-lượng — vì tiết kiệm doanh nghiệp và đầu tư doanh nghiệp do CÙNG một thực thể thực hiện. Giải pháp cổ điển: tỷ lệ tiết kiệm phản ứng với khoảng cách tài trợ giữa đầu tư và tiết kiệm hiện có — điều này giải quyết được nghịch lý 'lưỡi dao' (knife-edge) nổi tiếng của Harrod: con đường 'đảm bảo' (warranted) trở nên hoàn toàn ỔN ĐỊNH.",
          "Hệ quả sâu xa: trong mô hình cổ điển, một cú tăng tạm thời của tỷ suất lợi nhuận ròng kỳ vọng sẽ nâng VĨNH VIỄN mức sản lượng và việc làm (chứ không chỉ tạm thời như số nhân Keynes tĩnh) — đây là 'số nhân cổ điển', tương đương nhưng mạnh hơn số nhân Keynesian."],
        chips:["tỷ suất lợi nhuận ròng kỳ vọng","phản thân (reflexivity)","tiết kiệm không độc lập với đầu tư","giải nghịch lý lưỡi dao Harrod"]},
      {num:14, vt:"Thất nghiệp, Lương, Lợi nhuận và Tăng trưởng", en:"Unemployment, Wages, Profitability, and Growth",
        p:["Rút ra liên kết cốt lõi: cạnh tranh dưới lương thực LINH HOẠT vẫn tạo ra một tỷ lệ thất nghiệp KHÔNG TỰ NGUYỆN bền vững — trái ngược hoàn toàn tân cổ điển (lương linh hoạt ắt dẫn đầy đủ việc làm) và khác cả hậu-Keynesian (cạnh tranh CÓ THỂ hoặc KHÔNG THỂ gây thất nghiệp). Goodwin đã hình thức hóa trực giác này của Marx thành mô hình 'đội quân dự bị lao động'.",

  {sec:"Phần I",q:"Theo James Steuart (chương 6), hai nguồn gốc của lợi nhuận tổng là gì?",a:"(1) Chuyển giao của cải ('mua rẻ bán đắt' — nền tảng tư bản thương nghiệp); (2) sản xuất của cải mới dưới dạng sản phẩm thặng dư (nền tảng tư bản công nghiệp)."},
  {sec:"Phần I",q:"'Vấn đề chuyển hóa' theo Shaikh tồn tại ở đâu?",a:"Trong MỌI trường phái lý thuyết giá — tân cổ điển, Sraffa, VÀ Marx — không chỉ riêng lý thuyết Marx như thường bị phê phán."},
  {sec:"Phần II",q:"Vì sao Shaikh ví cạnh tranh thực như 'chiến tranh' còn cạnh tranh hoàn hảo như 'ba lê'?",a:"Cạnh tranh thực mang tính đối kháng, chủ động đặt giá và cắt chi phí để tồn tại/thắng thế; cạnh tranh hoàn hảo giả định các hãng thụ động, hài hòa, chỉ nhận giá cho trước."},
  {sec:"Phần II",q:"Bằng chứng thực nghiệm ở chương 7 cho thấy điều gì về bình quân hóa tỷ suất lợi nhuận?",a:"Tỷ suất lợi nhuận TRUNG BÌNH vẫn phân tán giữa các ngành, nhưng tỷ suất lợi nhuận GIA TĂNG (trên đầu tư mới) bình quân hóa rất mạnh — đúng như giả thuyết cổ điển."},
  {sec:"Phần II",q:"Vì sao lý thuyết cạnh tranh hoàn hảo bị coi là bất nhất nội tại?",a:"Vì nó đòi hỏi kỳ vọng phi lý: nếu mọi hãng giống hệt, tín hiệu khiến một hãng tăng sản lượng sẽ khiến TẤT CẢ làm vậy và giá sụp đổ — nhưng lý thuyết vẫn giả định mỗi hãng tin có thể bán bất kỳ lượng nào ở giá cho trước."},
  {sec:"Phần II",q:"Khoảng cách thực nghiệm giữa giá thị trường, giá trực tiếp và giá cả sản xuất là bao nhiêu?",a:"Chỉ khoảng 13-15% — rất nhỏ, cho thấy các dạng giá khác nhau 'triệt tiêu' ở cấp độ tổng, ủng hộ mạnh lý thuyết giá cổ điển."},
  {sec:"Phần II",q:"Lý thuyết cổ điển giải thích 'nghịch lý Gibson' như thế nào?",a:"Lãi suất dài hạn cạnh tranh phụ thuộc vào tỷ suất lợi nhuận chung VÀ mức giá chung (ảnh hưởng chi phí hoạt động ngân hàng) — nên lãi suất danh nghĩa và mức giá tương quan dương một cách tự nhiên."},
  {sec:"Phần II",q:"Shaikh thay lý thuyết lợi thế so sánh Ricardo bằng lý thuyết gì?",a:"Lý thuyết lợi thế TUYỆT ĐỐI: tư bản điều tiết quốc tế có chi phí lao động đơn vị thực tích hợp thấp nhất sẽ thống trị thị trường, có thể ở CẢ hai ngành cùng lúc."},

  {sec:"Phần III",q:"Vì sao giả định 'tiết kiệm độc lập với đầu tư' bị coi là không nhất quán dòng-chảy-tồn-lượng?",a:"Vì tiết kiệm doanh nghiệp và đầu tư doanh nghiệp do CÙNG một thực thể (doanh nghiệp) thực hiện — không thể tách rời như hai quyết định độc lập."},

  {sec:"Phần III",q:"'Chỉ số tăng trưởng-sử dụng' (growth-utilization index) đóng vai trò gì trong lý thuyết lạm phát cổ điển?",a:"Là tỷ lệ tích lũy thực tế/tỷ suất lợi nhuận tối đa khả dĩ — đóng vai trò 'đồng hồ đo áp lực' lạm phát, tương tự vai trò tỷ lệ thất nghiệp trong lý thuyết chuẩn (NAIRU)."},
  {sec:"Phần III",q:"5 mệnh đề cốt lõi của neo-Chartalism (MMT) mà Shaikh phê phán gồm những gì?",a:"(1) Thất nghiệp giữ ở mức mong muốn bất kỳ; (2) lương tư nhân neo theo lương ELR; (3) giá cả do markup trên lương danh nghĩa; (4) nhà nước neo toàn bộ phổ lãi suất; (5) nhà nước ấn định tỷ giá tùy ý."},
  {sec:"Phần III",q:"Theo Shaikh, khủng hoảng 2007 có gì đặc biệt so với các khủng hoảng trước (1820s, 1870s, 1930s, 1970s)?",a:"Không có gì đặc biệt về bản chất — nó 'đúng lịch trình', nổ ra giữa pha suy thoái dài của sóng dài Kondratieff, do chính logic lợi nhuận đẩy hệ thống lặp lại khuôn mẫu này."},
  {sec:"Phần III",q:"So sánh phản ứng của Iceland và Ireland trước khủng hoảng 2007-08?",a:"Iceland để ngân hàng vỡ nợ, phá giá mạnh đồng tiền, phục hồi tương đối tốt; Ireland gánh nợ ngân hàng vào nhà nước, áp đặt cắt giảm lên dân chúng, thất nghiệp và nghèo đói tăng vọt."},
  {sec:"Phần III",q:"Shaikh phê phán thước đo tỷ suất lợi nhuận của Piketty (r>g) như thế nào?",a:"Mẫu số (tư bản) gồm cả đất đai, bất động sản, tài sản tài chính ròng, nhưng tử số (lợi nhuận) lại loại trừ tô, lãi, lãi vốn tương ứng — khiến tỷ suất lợi nhuận của ông tăng trong suy thoái và giảm trong bùng nổ, trái ngược trực giác."},
  {sec:"Phần III",q:"Theo lý thuyết EPTC, thu nhập lao động và thu nhập tài sản theo các dạng phân phối nào?",a:"Thu nhập lao động theo phân phối MŨ (Gini ≈ 0.50); thu nhập tài sản theo phân phối LŨY THỪA (Pareto)."},

  {q:"Bằng chứng thực nghiệm ở chương 7 về bình quân hóa tỷ suất lợi nhuận cho thấy gì?",opts:["Cả tỷ suất trung bình lẫn tỷ suất gia tăng đều bình quân hóa mạnh","Tỷ suất trung bình bình quân hóa mạnh, tỷ suất gia tăng thì không","Tỷ suất trung bình vẫn phân tán, nhưng tỷ suất GIA TĂNG (trên đầu tư mới) bình quân hóa rất mạnh","Không có bằng chứng thực nghiệm nào được đưa ra"],correct:2,explain:"Đây là phát hiện thực nghiệm cốt lõi ủng hộ giả thuyết cổ điển: đo trên đầu tư mới (incremental) mới thấy rõ xu hướng bình quân hóa."},
  {q:"Vì sao lý thuyết cạnh tranh hoàn hảo bị Shaikh cho là bất nhất nội tại với kỳ vọng duy lý?",opts:["Vì các hãng không có đủ vốn","Vì nếu mọi hãng giống hệt, một tín hiệu khiến một hãng tăng sản lượng sẽ khiến TẤT CẢ làm vậy và giá sụp đổ — mâu thuẫn với giả định hãng có thể bán bất kỳ lượng nào ở giá cho trước","Vì kỳ vọng duy lý chỉ áp dụng cho thị trường tài chính","Vì cạnh tranh hoàn hảo không tồn tại trong thực tế"],correct:1,explain:"Đây là lập luận logic chặt chẽ: giả định 'hãng nhận giá, bán được bất kỳ lượng nào' mâu thuẫn với việc mọi hãng đều phản ứng giống hệt trước cùng tín hiệu thị trường."},
  {q:"Khoảng cách giữa giá thị trường, giá trực tiếp (giá trị lao động), và giá cả sản xuất trong bằng chứng thực nghiệm của Shaikh là bao nhiêu?",opts:["Khoảng 50-60%","Khoảng 30-40%","Chỉ khoảng 13-15%","Gần như bằng 0%"],correct:2,explain:"Một phát hiện thực nghiệm gây bất ngờ, ủng hộ mạnh lý thuyết giá cổ điển và cho thấy các dạng giá khác nhau 'triệt tiêu' ở cấp độ tổng."},
  {q:"Lý thuyết cổ điển giải thích 'nghịch lý Gibson' (lãi suất danh nghĩa và mức giá tương quan dương) như thế nào?",opts:["Đây thực ra không phải là một nghịch lý có thật","Lãi suất dài hạn cạnh tranh phụ thuộc vào cả tỷ suất lợi nhuận chung LẪN mức giá chung ảnh hưởng chi phí ngân hàng","Do ngân hàng trung ương luôn tăng lãi suất theo lạm phát","Do vàng luôn tăng giá theo thời gian"],correct:1,explain:"Vì lãi suất cạnh tranh gắn với cả tỷ suất lợi nhuận VÀ mức giá (ảnh hưởng chi phí hoạt động ngân hàng), nên tương quan dương với mức giá là điều tự nhiên, không phải nghịch lý."},
  {q:"Shaikh phê phán Shiller về 'biến động thái quá' (excess volatility) của thị trường chứng khoán như thế nào?",opts:["Đồng ý hoàn toàn với Shiller","Cho rằng Shiller đã dùng một tỷ suất sinh lời kỳ vọng CỐ ĐỊNH (từ EMH) làm chuẩn so sánh, trong khi tỷ suất lợi nhuận gia tăng thực tế vốn biến động mạnh và bám sát tỷ suất cổ phiếu","Cho rằng thị trường chứng khoán hoàn toàn ngẫu nhiên","Không đề cập gì đến Shiller"],correct:1,explain:"Sự 'biến động thái quá' chỉ là ảo giác khi so với chuẩn EMH giả định lợi suất không đổi; so với tỷ suất lợi nhuận gia tăng thực tế (vốn biến động), mức tương quan lại rất cao."},

  {q:"So sánh Iceland và Ireland sau khủng hoảng 2007-08, Shaikh ghi nhận điều gì?",opts:["Cả hai đều phản ứng giống hệt nhau và có kết quả như nhau","Iceland để ngân hàng vỡ nợ và phá giá mạnh, phục hồi tương đối tốt hơn; Ireland gánh nợ ngân hàng vào nhà nước và áp cắt giảm lên dân chúng, thất nghiệp/nghèo đói tăng vọt","Ireland phục hồi tốt hơn Iceland","Cả hai đều không bị ảnh hưởng bởi khủng hoảng"],correct:1,explain:"Sự khác biệt trong lựa chọn chính sách (ai gánh chịu tổn thất tài chính) dẫn tới kết cục xã hội rất khác nhau giữa hai nước."},

/* =========================================================
   RENDER — TABS
   ========================================================= */
var tabbar = document.getElementById('tabbar');
var panelsWrap = document.getElementById('panels');
var ALL_TAB_IDS = [];

function addTabButton(id, numLabel, shortLabel){
  var btn = document.createElement('button');
  btn.className = 'tab-btn';
  btn.dataset.target = id;
  btn.innerHTML = '<span class="n">'+numLabel+'</span>'+shortLabel;
  btn.addEventListener('click', function(){ activateTab(id); });
  tabbar.appendChild(btn);
  ALL_TAB_IDS.push(id);
}

/* Section tabs (0-1) */
SECTIONS.forEach(function(s){ addTabButton(s.id, s.n, s.label); });

/* Part tabs (2-4) */
PARTS.forEach(function(p){ addTabButton(p.id, p.n, p.label); });

/* Glossary, Comparison, Flashcards, Quiz tabs */
addTabButton('gloss', '5', 'Thuật ngữ');
addTabButton('cmp', '6', 'So sánh');
addTabButton('flashcards', '✚', 'Thẻ ghi nhớ');
addTabButton('quiz', '?', 'Quiz');

/* Render section panels */
SECTIONS.forEach(function(s, idx){
  var panel = document.createElement('div');
  panel.className = 'panel';
  panel.id = 'panel-'+s.id;
  var conceptsHtml = '';
  if(s.concepts && s.concepts.length){
    conceptsHtml = '<h3>Khái niệm chính</h3><div class="concept-grid">' + s.concepts.map(function(c){
      return '<div class="concept"><span class="term">'+c[0]+'</span><p>'+c[1]+'</p></div>';
    }).join('') + '</div>';
  }
  panel.innerHTML = '<div class="card"><h2>'+s.n+'. '+s.title+'</h2><div class="eng-title">'+s.eng+'</div>'+s.body+conceptsHtml+'</div>';
  panelsWrap.appendChild(panel);
});

/* Render Part (book map) panels */
PARTS.forEach(function(part){
  var panel = document.createElement('div');
  panel.className = 'panel';
  panel.id = 'panel-'+part.id;
  var html = '<div class="card">';
  html += '<h2>'+part.n+'. '+part.tabTitle+'</h2>';
  html += '<div class="eng-title">'+part.tabEng+'</div>';
  html += '<p class="part-intro">'+part.intro+'</p>';
  html += '<div class="part-actions"><button class="btn small" data-expand="'+part.id+'">Mở tất cả</button> <button class="btn small" data-collapse="'+part.id+'">Thu gọn tất cả</button></div>';
  html += '<div class="chap-list" data-part="'+part.id+'">';
  part.chapters.forEach(function(ch){
    html += '<div class="chap-card" data-chapnum="'+ch.num+'">';
    html += '<div class="chap-head"><div class="chap-num">'+ch.num+'</div><div class="chap-titles"><div class="vt">'+ch.vt+'</div><div class="et">'+ch.en+'</div></div><div class="chap-toggle">+</div></div>';
    html += '<div class="chap-body">';
    ch.p.forEach(function(para){ html += '<p>'+para+'</p>'; });
    html += '<div class="chap-chips">' + ch.chips.map(function(c){ return '<span class="chip">'+c+'</span>'; }).join('') + '</div>';
    html += '</div></div>';
  });
  html += '</div></div>';
  panel.innerHTML = html;
  panelsWrap.appendChild(panel);
});

/* Render Glossary panel */
var glossPanel = document.createElement('div');
glossPanel.className = 'panel';
glossPanel.id = 'panel-gloss';
glossPanel.innerHTML = '<div class="card"><h2>5. Thuật ngữ chính</h2><div class="eng-title">Key terms — '+GLOSSARY.length+' khái niệm cốt lõi của chương 1</div><div id="glossList"></div></div>'+'<div class="card" style="margin-top:16px"><h2>Bảng thuật ngữ mở rộng</h2><div class="eng-title">Extended terminology — '+EXTRA_TERMS.length+' thuật ngữ song ngữ Anh–Việt bổ sung</div><div id="glossExtra"></div></div>';
panelsWrap.appendChild(glossPanel);

/* Render Comparison panel */
var cmpPanel = document.createElement('div');
cmpPanel.className = 'panel';
cmpPanel.id = 'panel-cmp';
var cmpHtml = '<div class="card"><h2>6. So sánh ba trường phái</h2><div class="eng-title">Neoclassical vs. Post-Keynesian vs. Classical Real Competition</div>';
cmpHtml += '<div class="cmp-wrap"><table class="cmp"><thead><tr><th>Tiêu chí</th><th>'+COMPARISON.cols.join('</th><th>')+'</th></tr></thead><tbody>';
COMPARISON.rows.forEach(function(row){
  cmpHtml += '<tr><td class="dim">'+row[0]+'</td><td>'+row[1]+'</td><td>'+row[2]+'</td><td>'+row[3]+'</td></tr>';
});
cmpHtml += '</tbody></table></div></div>';
cmpPanel.innerHTML = cmpHtml;
panelsWrap.appendChild(cmpPanel);

      </div>
    </div>
    <div class="fc-hint">Nhấn vào thẻ để xem đáp án</div>
    <div class="fc-nav">
      <button class="btn" id="fcPrev">← Trước</button>
      <button class="btn primary" id="fcFlip">Lật thẻ</button>
      <button class="btn" id="fcNext">Sau →</button>
    </div>
  </div>
`;
panelsWrap.appendChild(fcPanel);

/* Render Quiz panel */
var quizPanel = document.createElement('div');
quizPanel.className = 'panel';
quizPanel.id = 'panel-quiz';
quizPanel.innerHTML = `
  <div class="card">
    <h2>Quiz kiểm tra</h2>
    <div class="eng-title">${QUIZ.length} câu hỏi tổng hợp toàn bộ chương 1</div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quizProgressFill" style="width:0%"></div></div>
    <div id="quizArea"></div>
  </div>
`;
panelsWrap.appendChild(quizPanel);

/* Activate first tab by default */
function activateTab(id){
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.target === id);
  });
  document.querySelectorAll('.panel').forEach(function(p){
    p.classList.toggle('active', p.id === 'panel-'+id);
  });
  window.scrollTo({top:0,behavior:'instant' in window ? 'instant':'auto'});
  openNotesFor(id);
}

/* =========================================================
   GLOSSARY RENDER
   ========================================================= */
var glossList = document.getElementById('glossList');
glossList.innerHTML = GLOSSARY.map(function(g){
  return '<div class="gloss-item"><div class="gloss-term">'+g[0]+'<span class="en">'+g[1]+'</span></div><div class="gloss-def">'+g[2]+'</div></div>';
}).join('');

var glossExtra = document.getElementById('glossExtra');
glossExtra.innerHTML = EXTRA_TERMS.map(function(g){
  return '<div class="gloss-extra-row"><span class="en">'+g[0]+'</span><span class="vi">'+g[1]+'</span></div>';
}).join('');

/* =========================================================
   ACCORDION LOGIC (book map chapter cards)
   ========================================================= */
document.querySelectorAll('.chap-head').forEach(function(head){
  head.addEventListener('click', function(){
    var card = head.closest('.chap-card');
    var body = card.querySelector('.chap-body');
    var isOpen = card.classList.contains('open');
    if(isOpen){
      card.classList.remove('open');
      body.style.maxHeight = null;
    } else {
      card.classList.add('open');
      body.style.maxHeight = body.scrollHeight + 'px';
    }
  });
});
document.querySelectorAll('[data-expand]').forEach(function(btn){
  btn.addEventListener('click', function(){
    var partId = btn.dataset.expand;
    document.querySelectorAll('.chap-list[data-part="'+partId+'"] .chap-card').forEach(function(card){
      card.classList.add('open');
      var body = card.querySelector('.chap-body');
      body.style.maxHeight = body.scrollHeight + 'px';
    });
  });
});
document.querySelectorAll('[data-collapse]').forEach(function(btn){
  btn.addEventListener('click', function(){
    var partId = btn.dataset.collapse;
    document.querySelectorAll('.chap-list[data-part="'+partId+'"] .chap-card').forEach(function(card){
      card.classList.remove('open');
      var body = card.querySelector('.chap-body');
      body.style.maxHeight = null;
    });
  });
});

/* =========================================================
   FLASHCARDS LOGIC
   ========================================================= */
var fcOrder = FLASHCARDS.map(function(_,i){return i;});
var fcIndex = 0;
var flashcardEl = document.getElementById('flashcard');

function renderFlashcard(){
  var card = FLASHCARDS[fcOrder[fcIndex]];
  document.getElementById('fcTag').textContent = card.sec;
  document.getElementById('fcQ').textContent = card.q;
  document.getElementById('fcA').textContent = card.a;
  document.getElementById('fcProgress').textContent = 'Thẻ ' + (fcIndex+1) + ' / ' + FLASHCARDS.length;
  flashcardEl.classList.remove('flipped');
}
function flipFC(){ flashcardEl.classList.toggle('flipped'); }
document.getElementById('fcFlip').addEventListener('click', flipFC);
flashcardEl.addEventListener('click', flipFC);
document.getElementById('fcNext').addEventListener('click', function(){
  fcIndex = (fcIndex+1) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcPrev').addEventListener('click', function(){
  fcIndex = (fcIndex-1+FLASHCARDS.length) % FLASHCARDS.length;
  renderFlashcard();
});
document.getElementById('fcShuffle').addEventListener('click', function(){
  for(var i=fcOrder.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = fcOrder[i]; fcOrder[i]=fcOrder[j]; fcOrder[j]=tmp;
  }
  fcIndex = 0;
  renderFlashcard();
});
renderFlashcard();

/* =========================================================
   QUIZ LOGIC
   ========================================================= */
var quizArea = document.getElementById('quizArea');
var quizAnswers = {};

function renderQuiz(){
  var html = QUIZ.map(function(item, qi){
    var opts = item.opts.map(function(opt, vi){
      return '<div class="q-opt" data-qi="'+qi+'" data-qv="'+vi+'">'+opt+'</div>';
    }).join('');
    return '<div class="q-block" id="qblock-'+qi+'">'+
      '<div class="q-text">'+(qi+1)+'. '+item.q+'</div>'+
      '<div class="q-opts">'+opts+'</div>'+
      '<div class="q-explain" id="qexplain-'+qi+'">'+item.explain+'</div>'+
      '</div>';
  }).join('');
  html += '<div style="text-align:center;margin-top:20px;"><button class="btn primary" id="quizFinish">Xem kết quả</button> <button class="btn" id="quizReset">Làm lại</button></div>';
  html += '<div id="quizResult"></div>';
  quizArea.innerHTML = html;

  quizArea.addEventListener('click', quizClickHandler);
  document.getElementById('quizFinish').addEventListener('click', showQuizScore);
  document.getElementById('quizReset').addEventListener('click', function(){
    quizAnswers = {};
    renderQuiz();
  });
}

function quizClickHandler(e){
  var opt = e.target.closest('.q-opt');
  if(!opt) return;
  var qi = parseInt(opt.dataset.qi, 10);
  var qv = parseInt(opt.dataset.qv, 10);
  quizAnswers[qi] = qv;
  var block = document.getElementById('qblock-'+qi);
  block.querySelectorAll('.q-opt').forEach(function(o){
    o.classList.remove('selected','correct','incorrect');
  });
  var correctIdx = QUIZ[qi].correct;
  block.querySelectorAll('.q-opt').forEach(function(o){
    var v = parseInt(o.dataset.qv,10);
    if(v === correctIdx) o.classList.add('correct');
    else if(v === qv) o.classList.add('incorrect');
  });
  document.getElementById('qexplain-'+qi).classList.add('show');
  updateQuizProgress();
}

function updateQuizProgress(){
  var answered = Object.keys(quizAnswers).length;
  var pct = Math.round(100*answered/QUIZ.length);
  document.getElementById('quizProgressFill').style.width = pct+'%';
}

function showQuizScore(){
  var correct = 0;
  QUIZ.forEach(function(item, qi){
    if(quizAnswers[qi] === item.correct) correct++;
  });
  var pct = Math.round(100*correct/QUIZ.length);
  document.getElementById('quizResult').innerHTML =
    '<div class="quiz-score"><div class="num">'+correct+'/'+QUIZ.length+'</div>'+
    '<div class="lbl">('+pct+'%) — '+ (pct>=80?'Nắm rất vững nội dung!':pct>=50?'Khá tốt, xem lại vài phần.':'Nên đọc lại các phần liên quan.') +'</div></div>';
}
renderQuiz();

/* =========================================================
   NOTES PANEL (per-tab, contenteditable, localStorage)
   ========================================================= */
var notesFab = document.getElementById('notesFab');
var notesPanel = document.getElementById('notesPanel');
var notesBackdrop = document.getElementById('notesBackdrop');
var notesBody = document.getElementById('notesBody');
var notesTitle = document.getElementById('notesTitle');
var notesFoot = document.getElementById('notesFoot');
var currentNoteTab = ALL_TAB_IDS[0];
var LS_PREFIX = 'shaikh_ch1_note_';

function isMobile(){ return window.matchMedia('(max-width:640px)').matches; }

function noteLabelFor(id){
  var s = SECTIONS.filter(function(x){return x.id===id;})[0];
  if(s) return s.n + '. ' + s.label;
  var p = PARTS.filter(function(x){return x.id===id;})[0];
  if(p) return p.n + '. ' + p.label;
  if(id === 'gloss') return 'Thuật ngữ';
  if(id === 'cmp') return 'So sánh trường phái';
  if(id === 'flashcards') return 'Thẻ ghi nhớ';
  if(id === 'quiz') return 'Quiz';
  return id;
}

function openNotesFor(id){
  currentNoteTab = id;
  notesTitle.textContent = 'Ghi chú — ' + noteLabelFor(id);
  var saved = localStorage.getItem(LS_PREFIX + id) || '';
  notesBody.innerHTML = saved;
  updateNotesFoot();
}
function updateNotesFoot(){
  var len = notesBody.innerText.trim().length;
  notesFoot.textContent = len + ' ký tự · lưu tự động';
}
function saveCurrentNote(){
  localStorage.setItem(LS_PREFIX + currentNoteTab, notesBody.innerHTML);
  updateNotesFoot();
}
function openNotesPanel(){
  notesPanel.classList.add('open');
  if(isMobile()){ notesBackdrop.classList.add('show'); }
}
function closeNotesPanel(){
  notesPanel.classList.remove('open');
  notesBackdrop.classList.remove('show');
}
notesFab.addEventListener('click', function(){
  if(notesPanel.classList.contains('open')){
    closeNotesPanel();
  } else {
    openNotesFor(currentNoteTab);
    openNotesPanel();
  }
});
document.getElementById('notesClose').addEventListener('click', closeNotesPanel);
notesBackdrop.addEventListener('click', closeNotesPanel);
notesBody.addEventListener('input', saveCurrentNote);
document.querySelectorAll('.notes-toolbar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    var cmd = btn.dataset.cmd;
    notesBody.focus();
    if(cmd.indexOf(':')>-1){
      var parts = cmd.split(':');
      document.execCommand(parts[0], false, parts[1]);
    } else {
      document.execCommand(cmd, false, null);
    }
    saveCurrentNote();
  });
});
activateTab(ALL_TAB_IDS[0]);
</script>
